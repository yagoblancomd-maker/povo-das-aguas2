<script>
window.PDA_MODULES.PAINEL = (()=>{
  const {
    el,card,table,button,call,go,alive,can
  }=App;

  function cpfDisplay_(value){
    const d=String(value||'')
      .replace(/\D/g,'');

    return d.length===11
      ?d.replace(
          /(\d{3})(\d{3})(\d{3})(\d{2})/,
          '$1.$2.$3-$4'
        )
      :String(value||'');
  }

  return async function(ctx){
    const root=ctx.root;

    root.append(
      el(
        'h2',
        'Painel'
      )
    );

    const d=
      await call(
        'painel'
      );

    if(!alive(ctx))return;

    const stats=
      el(
        'div',
        undefined,
        'stats'
      );

    [
      ['pessoas','Pessoas cadastradas'],
      ['documentos','Documentos vigentes'],
      ['aConferir','Documentos a conferir'],
      ['iniciais','Iniciais geradas'],
      ['relatorios','Relatórios Defeso 2025']
    ].forEach(([key,label])=>{
      const box=
        el(
          'div',
          undefined,
          'stat'
        );

      box.append(
        el(
          'strong',
          String(d[key]||0)
        ),
        el(
          'span',
          label
        )
      );

      stats.append(box);
    });

    root.append(stats);

    const list=
      card(
        'Cadastros'
      );

    list.append(
      el(
        'p',
        'Visão geral das pessoas cadastradas no sistema.',
        'hint'
      )
    );

    table(
      list,
      [
        {
          key:'nome',
          label:'Pessoa'
        },
        {
          label:'CPF',
          value:r=>
            cpfDisplay_(
              r.cpf
            )
        },
        {
          key:'cidade',
          label:'Município'
        },
        {
          key:'jurisdicao',
          label:'Jurisdição'
        },
        {
          key:'documentos',
          label:'Documentos'
        }
      ],
      d.registros||[],
      r=>[
        button(
          'Abrir cadastro',
          ()=>{
            App.state.selection=r.id;
            return go(
              'ACOMP',
              r.id
            );
          }
        )
      ]
    );

    root.append(list);

    if(can('cadastro')){
      const actions=
        el(
          'div',
          undefined,
          'actions'
        );

      actions.append(
        button(
          'Novo Cadastro',
          ()=>go('PESS')
        )
      );

      root.append(actions);
    }
  };
})();
</script>
