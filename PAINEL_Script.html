<script>
window.PDA_MODULES.PAINEL = (()=>{
  const {
    el,button,call,go,alive
  }=App;

  const ICONS={
    cadastro:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"></circle><path d="M3.7 18.5c.7-3.3 2.6-5 5.3-5s4.6 1.7 5.3 5"></path><path d="M18 8v6"></path><path d="M15 11h6"></path></svg>',
    consulta:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.8"></circle><path d="M15 15l5 5"></path></svg>',
    defeso:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h9l3 3V20H6z"></path><path d="M15 3.5V7h3"></path><path d="M8.8 11h6.4"></path><path d="M8.8 14h6.4"></path><path d="M8.8 17h4.2"></path></svg>',
    distribuicao:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="19" cy="6" r="2"></circle><circle cx="19" cy="18" r="2"></circle><path d="M7 11l10-4"></path><path d="M7 13l10 4"></path></svg>',
    tarefas:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v16H6z"></path><path d="M9 8h6"></path><path d="M9 12h6"></path><path d="M9 16h3"></path><path d="M4 7H3v10h1"></path></svg>',
    processo:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10l4 4v12H5z"></path><path d="M15 4v5h4"></path><path d="M8 12h8"></path><path d="M8 15h8"></path><path d="M8 18h5"></path></svg>',
    minuta:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10l4 4v12H5z"></path><path d="M15 4v5h4"></path><path d="M8 13l2 2 5-5"></path></svg>',
    admin:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v2"></path><path d="M12 19v2"></path><path d="M3 12h2"></path><path d="M19 12h2"></path><path d="M5.6 5.6L7 7"></path><path d="M17 17l1.4 1.4"></path><path d="M18.4 5.6L17 7"></path><path d="M7 17l-1.4 1.4"></path></svg>',
    fish:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12c3-4 7-6 11-4l4-3v5l3 2-3 2v5l-4-3c-4 2-8 0-11-4z"></path><circle cx="14.2" cy="10.2" r=".8" fill="currentColor" stroke="none"></circle></svg>',
    money:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4z"></path><circle cx="12" cy="12" r="3"></circle><path d="M7 9H5"></path><path d="M19 15h-2"></path></svg>',
    cases:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v13H4z"></path><path d="M8 7V4h8v3"></path><path d="M4 12h16"></path></svg>',
    people:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"></circle><path d="M3.5 19c.7-3.6 2.6-5.4 5.5-5.4s4.8 1.8 5.5 5.4"></path><circle cx="17.5" cy="9" r="2.2"></circle><path d="M15.5 14.2c2.8-.5 4.6 1 5 4"></path></svg>',
    pending:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 7v6"></path><path d="M12 16.5h.01"></path></svg>'
  };

  function money_(value){
    return Number(value||0).toLocaleString(
      'pt-BR',
      {
        style:'currency',
        currency:'BRL'
      }
    );
  }

  function number_(value){
    return Number(value||0).toLocaleString(
      'pt-BR'
    );
  }

  function dateTime_(value){
    const d=new Date(value);

    if(Number.isNaN(d.getTime())){
      return '—';
    }

    return d.toLocaleString(
      'pt-BR',
      {
        day:'2-digit',
        month:'2-digit',
        year:'numeric',
        hour:'2-digit',
        minute:'2-digit'
      }
    );
  }

  function cpf_(value){
    const d=String(value||'')
      .replace(/\D/g,'');

    return d.length===11
      ?d.replace(
          /(\d{3})(\d{3})(\d{3})(\d{2})/,
          '$1.$2.$3-$4'
        )
      :String(value||'');
  }

  function firstName_(name){
    return (
      String(name||'')
        .trim()
        .split(/\s+/)[0]||
      'usuário'
    );
  }

  function actionCard_(item){
    const b=
      el(
        'button',
        undefined,
        'home-action-card '+(item.primary?'primary':'')
      );

    b.type='button';
    b.onclick=()=>go(item.code);

    const icon=
      el(
        'span',
        undefined,
        'home-action-icon'
      );

    icon.innerHTML=
      ICONS[item.icon]||
      ICONS.consulta;

    const copy=
      el(
        'span',
        undefined,
        'home-action-copy'
      );

    copy.append(
      el(
        'strong',
        item.title
      ),
      el(
        'small',
        item.description
      )
    );

    const arrow=
      el(
        'span',
        '→',
        'home-action-arrow'
      );

    b.append(
      icon,
      copy,
      arrow
    );

    return b;
  }

  function metricCard_(value,label,description,icon,kind=''){
    const box=
      el(
        'article',
        undefined,
        'home-metric '+kind
      );

    const iconBox=
      el(
        'span',
        undefined,
        'home-metric-icon'
      );

    iconBox.innerHTML=
      ICONS[icon]||
      ICONS.fish;

    const copy=
      el(
        'div',
        undefined,
        'home-metric-copy'
      );

    copy.append(
      el(
        'strong',
        value
      ),
      el(
        'span',
        label
      ),
      el(
        'small',
        description
      )
    );

    box.append(
      iconBox,
      copy
    );

    return box;
  }

  function fishingArt_(){
    const art=
      el(
        'div',
        undefined,
        'home-fishing-art'
      );

    art.innerHTML=
      '<svg viewBox="0 0 1200 430" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'+
      '<g class="water-lines">'+
      '<path d="M-40 315 C90 278 180 355 330 315 S580 280 720 320 S980 360 1240 308"></path>'+
      '<path d="M-60 347 C110 310 215 387 380 347 S670 312 830 350 S1060 390 1260 340"></path>'+
      '<path d="M-30 382 C130 350 250 414 425 380 S720 345 900 385 S1110 415 1250 378"></path>'+
      '</g>'+
      '<g class="boat-scene">'+
      '<path class="boat" d="M720 285h250l-34 42H758z"></path>'+
      '<path class="boat-edge" d="M735 286h221"></path>'+
      '<path class="mast" d="M825 286V138"></path>'+
      '<path class="net-line" d="M826 167c55 18 91 53 119 105"></path>'+
      '<path class="net-line" d="M826 178c-40 28-63 58-73 99"></path>'+
      '<path class="net" d="M752 277c35-7 70-5 104 5"></path>'+
      '<circle class="person-head" cx="870" cy="232" r="13"></circle>'+
      '<path class="person" d="M870 245l-10 41m10-31 28 16m-35-7-24 22"></path>'+
      '<path class="rod" d="M895 260l72-78"></path>'+
      '<path class="line" d="M968 182c22 38 18 73 0 104"></path>'+
      '</g>'+
      '<g class="birds">'+
      '<path d="M190 116q18-18 36 0q18-18 36 0"></path>'+
      '<path d="M350 82q12-12 24 0q12-12 24 0"></path>'+
      '</g>'+
      '</svg>';

    return art;
  }

  return async function(ctx){
    const root=ctx.root;
    const boot=
      App.state.boot||
      {};

    const user=
      boot.usuario||
      {};

    const d=
      await call(
        'painel'
      );

    if(!alive(ctx))return;

    const hero=
      el(
        'section',
        undefined,
        'home-hero'
      );

    hero.append(
      fishingArt_()
    );

    const heroContent=
      el(
        'div',
        undefined,
        'home-hero-content'
      );

    const eyebrow=
      el(
        'span',
        'PROJETO POVO DAS ÁGUAS',
        'home-eyebrow'
      );

    const title=
      el(
        'h2',
        'Bem-vindo, '+firstName_(user.nome)+'.'
      );

    const subtitle=
      el(
        'p',
        'Um só lugar para cadastrar, consultar, organizar documentos e acompanhar as ações do Seguro-Defeso 2025.'
      );

    const meta=
      el(
        'div',
        undefined,
        'home-hero-meta'
      );

    const today=
      new Intl.DateTimeFormat(
        'pt-BR',
        {
          weekday:'long',
          day:'2-digit',
          month:'long',
          year:'numeric'
        }
      ).format(
        new Date()
      );

    meta.append(
      el(
        'span',
        user.funcao||'Usuário do sistema'
      ),
      el(
        'span',
        boot.perfil||''
      ),
      el(
        'span',
        today.charAt(0).toUpperCase()+today.slice(1)
      )
    );

    heroContent.append(
      eyebrow,
      title,
      subtitle,
      meta
    );

    hero.append(
      heroContent
    );

    root.append(hero);

    const headline=
      el(
        'section',
        undefined,
        'home-headline-metrics'
      );

    headline.append(
      metricCard_(
        number_(d.acoesTramitacao),
        'Ações em tramitação',
        'Processos registrados no sistema.',
        'cases',
        'featured'
      ),
      metricCard_(
        money_(d.valorCausas),
        'Valor total das causas',
        'Soma das causas cadastradas com base nas parcelas do Seguro-Defeso 2025.',
        'money',
        'featured'
      ),
      metricCard_(
        number_(d.pessoas),
        'Pessoas cadastradas',
        'Cadastros atualmente existentes.',
        'people'
      ),
      metricCard_(
        number_(d.aConferir),
        'Documentos a conferir',
        'Documentos vigentes ainda sem conferência.',
        'pending'
      )
    );

    root.append(headline);

    const secondary=
      el(
        'div',
        undefined,
        'home-secondary-metrics'
      );

    const secondaryItems=[
      [
        number_(d.iniciais),
        'Petições iniciais geradas'
      ],
      [
        number_(d.relatorios),
        'Relatórios Defeso 2025'
      ],
      [
        number_(d.documentos),
        'Documentos vigentes'
      ]
    ];

    if(
      boot.modulos&&
      boot.modulos.TAREFAS
    ){
      secondaryItems.unshift(
        [
          number_(d.minhasTarefas),
          'Minhas tarefas pendentes'
        ]
      );
    }

    secondaryItems.forEach(([value,label])=>{
      const item=
        el(
          'div',
          undefined,
          'home-secondary-metric'
        );

      item.append(
        el(
          'strong',
          value
        ),
        el(
          'span',
          label
        )
      );

      secondary.append(item);
    });

    root.append(secondary);

    const sectionTitle=
      el(
        'div',
        undefined,
        'home-section-title'
      );

    sectionTitle.append(
      el(
        'div',
        undefined,
        'home-section-title-copy'
      )
    );

    sectionTitle.firstChild.append(
      el(
        'h3',
        'O que você precisa fazer?'
      ),
      el(
        'p',
        'Acesse diretamente as ferramentas disponíveis para o seu perfil.',
        'hint'
      )
    );

    root.append(sectionTitle);

    const actions=
      el(
        'section',
        undefined,
        'home-action-grid'
      );

    const available=
      boot.modulos||
      {};

    [
      {
        code:'PESS',
        title:'Novo Cadastro',
        description:'Cadastrar uma nova pessoa e organizar a documentação inicial.',
        icon:'cadastro',
        primary:true
      },
      {
        code:'ACOMP',
        title:'Consultar Cadastros',
        description:'Localizar pessoas, abrir fichas, documentos e conferências.',
        icon:'consulta',
        primary:true
      },
      {
        code:'DEFESO',
        title:'Consultar Defeso 2025',
        description:'Consultar rapidamente um CPF na base oficial.',
        icon:'defeso',
        primary:true
      },
      {
        code:'TAREFAS',
        title:'Minhas tarefas',
        description:'Ver as distribuições processuais atribuídas diretamente a você.',
        icon:'tarefas',
        primary:true
      },
      {
        code:'DIST',
        title:'Atribuir tarefas',
        description:'Distribuir a fila de trabalho entre os usuários responsáveis.',
        icon:'distribuicao'
      },
      {
        code:'PROC',
        title:'Processos',
        description:'Consultar os processos judiciais registrados.',
        icon:'processo'
      },
      {
        code:'MIN',
        title:'Minutas',
        description:'Gerar e consultar petições vinculadas aos cadastros.',
        icon:'minuta'
      },
      {
        code:'ADM',
        title:'Administração',
        description:'Usuários, permissões, APIs e configurações do sistema.',
        icon:'admin'
      }
    ]
      .filter(item=>
        !!available[item.code]
      )
      .forEach(item=>
        actions.append(
          actionCard_(item)
        )
      );

    root.append(actions);

    const lower=
      el(
        'section',
        undefined,
        'home-lower-grid'
      );

    const recent=
      el(
        'article',
        undefined,
        'home-panel'
      );

    const recentHead=
      el(
        'div',
        undefined,
        'home-panel-head'
      );

    recentHead.append(
      el(
        'div'
      ),
      button(
        'Ver cadastros',
        ()=>go('ACOMP'),
        true
      )
    );

    recentHead.firstChild.append(
      el(
        'h3',
        'Cadastros recentes'
      ),
      el(
        'p',
        'Últimas pessoas incluídas no sistema.',
        'hint'
      )
    );

    recent.append(recentHead);

    const recentList=
      el(
        'div',
        undefined,
        'home-recent-list'
      );

    if(
      !d.ultimosCadastros||
      !d.ultimosCadastros.length
    ){
      recentList.append(
        el(
          'p',
          'Nenhum cadastro disponível.',
          'hint'
        )
      );
    }else{
      d.ultimosCadastros.forEach(p=>{
        const item=
          el(
            'button',
            undefined,
            'home-recent-person'
          );

        item.type='button';
        item.onclick=()=>{
          App.state.selection=p.id;
          return go(
            'ACOMP',
            p.id
          );
        };

        const initials=
          String(p.nome||'?')
            .trim()
            .split(/\s+/)
            .slice(0,2)
            .map(v=>v.charAt(0))
            .join('')
            .toUpperCase();

        const avatar=
          el(
            'span',
            initials,
            'home-avatar'
          );

        const copy=
          el(
            'span',
            undefined,
            'home-recent-copy'
          );

        copy.append(
          el(
            'strong',
            p.nome
          ),
          el(
            'small',
            cpf_(p.cpf)+
            (
              p.cidade
                ?' · '+p.cidade
                :''
            )
          )
        );

        item.append(
          avatar,
          copy,
          el(
            'span',
            '→',
            'home-recent-arrow'
          )
        );

        recentList.append(item);
      });
    }

    recent.append(recentList);

    const activity=
      el(
        'article',
        undefined,
        'home-panel'
      );

    const activityHead=
      el(
        'div',
        undefined,
        'home-panel-head'
      );

    activityHead.append(
      el(
        'div'
      )
    );

    activityHead.firstChild.append(
      el(
        'h3',
        'Atividade recente'
      ),
      el(
        'p',
        'Últimas alterações registradas no sistema.',
        'hint'
      )
    );

    activity.append(activityHead);

    const timeline=
      el(
        'div',
        undefined,
        'home-timeline'
      );

    if(
      !d.atividades||
      !d.atividades.length
    ){
      timeline.append(
        el(
          'p',
          'Nenhuma atividade registrada.',
          'hint'
        )
      );
    }else{
      d.atividades.forEach(item=>{
        const row=
          el(
            'div',
            undefined,
            'home-timeline-item'
          );

        row.append(
          el(
            'span',
            undefined,
            'home-timeline-dot'
          )
        );

        const copy=
          el(
            'div'
          );

        copy.append(
          el(
            'strong',
            item.descricao
          ),
          el(
            'small',
            dateTime_(item.data)+
            (
              item.usuario
                ?' · '+item.usuario
                :''
            )
          )
        );

        row.append(copy);
        timeline.append(row);
      });
    }

    activity.append(timeline);

    lower.append(
      recent,
      activity
    );

    root.append(lower);

    const jurisdictionEntries=
      Object.entries(
        d.jurisdicoes||{}
      )
        .sort((a,b)=>
          b[1]-a[1]
        );

    if(jurisdictionEntries.length){
      const territory=
        el(
          'section',
          undefined,
          'home-territory'
        );

      const territoryHead=
        el(
          'div',
          undefined,
          'home-panel-head'
        );

      territoryHead.append(
        el(
          'div'
        ),
        el(
          'span',
          'Atualizado em '+dateTime_(d.atualizadoEm),
          'home-updated'
        )
      );

      territoryHead.firstChild.append(
        el(
          'h3',
          'Abrangência dos cadastros'
        ),
        el(
          'p',
          'Distribuição das pessoas por jurisdição.',
          'hint'
        )
      );

      territory.append(
        territoryHead
      );

      const bars=
        el(
          'div',
          undefined,
          'home-territory-bars'
        );

      const max=
        Math.max(
          ...jurisdictionEntries.map(
            item=>Number(item[1]||0)
          ),
          1
        );

      jurisdictionEntries.forEach(([name,value])=>{
        const row=
          el(
            'div',
            undefined,
            'home-territory-row'
          );

        const label=
          el(
            'div',
            undefined,
            'home-territory-label'
          );

        label.append(
          el(
            'span',
            name
          ),
          el(
            'strong',
            number_(value)
          )
        );

        const track=
          el(
            'div',
            undefined,
            'home-territory-track'
          );

        const fill=
          el(
            'span',
            undefined,
            'home-territory-fill'
          );

        fill.style.width=
          Math.max(
            5,
            Math.round(
              Number(value||0)/
              max*
              100
            )
          )+'%';

        track.append(fill);

        row.append(
          label,
          track
        );

        bars.append(row);
      });

      territory.append(bars);
      root.append(territory);
    }
  };
})();
</script>
