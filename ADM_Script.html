<script>
window.PDA_MODULES.ADM = (()=>{
  const {
    el,card,details,form,link,button,call,go,alive,status
  }=App;

  function readFile_(file){
    return new Promise((resolve,reject)=>{
      const reader=new FileReader();

      reader.onload=()=>{
        const value=String(reader.result||'');
        const parts=value.split(',');

        if(parts.length<2){
          reject(new Error('Não foi possível ler o arquivo.'));
          return;
        }

        resolve(parts[1]);
      };

      reader.onerror=()=>reject(reader.error||new Error('Erro ao ler o arquivo.'));
      reader.readAsDataURL(file);
    });
  }

  return async function(ctx){
    const root=ctx.root;

    root.append(el('h2','Administração'));

    const d=await call('admin');

    if(!alive(ctx)){
      return;
    }

    root.append(el(
      'p',
      'Defina as políticas pendentes e mantenha o modelo oficial da minuta. O modelo é enviado em DOCX e convertido automaticamente para Google Docs.',
      'hint'
    ));

    const model=card('Modelo de minuta');
    root.append(model);

    if(d.modelo&&d.modelo.configurado){
      model.append(el(
        'p',
        'Modelo ativo: '+d.modelo.nome,
        'badge'
      ));

      model.append(
        link(
          d.modelo.url,
          'Abrir modelo ativo'
        )
      );

    }else{
      model.append(el(
        'p',
        d.modelo&&d.modelo.mensagem
          ?d.modelo.mensagem
          :'Nenhum modelo ativo.',
        'warn'
      ));
    }

    model.append(el(
      'p',
      'Envie o arquivo .docx da petição-modelo. O sistema converte o arquivo, normaliza os placeholders conhecidos, valida os campos obrigatórios e ativa o novo modelo. Não é necessário informar ID do Drive.',
      'hint'
    ));

    const modelInput=el('input');
    modelInput.type='file';
    modelInput.accept=
      '.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document';
    modelInput.setAttribute(
      'aria-label',
      'Arquivo DOCX do modelo de minuta'
    );

    model.append(modelInput);

    const modelActions=
      el(
        'div',
        undefined,
        'actions'
      );

    modelActions.append(
      button(
        'Enviar e ativar modelo',
        async()=>{
          const file=
            modelInput.files&&
            modelInput.files[0];

          if(!file){
            throw new Error(
              'Selecione o arquivo DOCX do modelo.'
            );
          }

          if(
            file.size>
            10*1024*1024
          ){
            throw new Error(
              'O modelo DOCX deve ter no máximo 10 MB.'
            );
          }

          const base64=
            await readFile_(file);

          const result=
            await call(
              'modeloUpload',
              {
                nome:file.name,
                mime:
                  file.type||
                  'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
                base64
              },
              true
            );

          App.state.boot=
            await call('bootstrap');

          await go('ADM');

          status(
            result.mensagem||
            'Modelo ativado.'
          );
        }
      )
    );

    model.append(
      modelActions
    );

    const portal=card('API do Portal da Transparência');
    root.append(portal);

    portal.append(
      el(
        'p',
        d.portalTransparencia&&d.portalTransparencia.configurada
          ?'Chave da API configurada.'
          :'Chave da API ainda não configurada.',
        d.portalTransparencia&&d.portalTransparencia.configurada
          ?'badge'
          :'warn'
      )
    );

    portal.append(
      el(
        'p',
        'A chave é usada somente no servidor para consultar a API oficial do Portal da Transparência. Ela não é devolvida ao navegador nem exibida depois de salva.',
        'hint'
      )
    );

    form(
      portal,
      [
        {
          key:'chave',
          label:'Chave da API',
          type:'password',
          required:true,
          placeholder:'Cole aqui a chave fornecida pelo Portal da Transparência'
        }
      ],
      {},
      async q=>{
        const result=await call(
          'portalApiKeySalvar',
          q,
          true
        );

        App.state.boot=
          await call('bootstrap');

        await go('ADM');
        status(result.mensagem||'Chave da API salva.');
      },
      d.portalTransparencia&&d.portalTransparencia.configurada
        ?'Substituir chave da API'
        :'Salvar chave da API'
    );

    const deepseek=card('API DeepSeek — leitura automática de documentos');
    root.append(deepseek);

    deepseek.append(
      el(
        'p',
        d.deepseek&&d.deepseek.configurada
          ?'Chave da API DeepSeek configurada. Modelo ativo: '+d.deepseek.modelo+'.'
          :'Chave da API DeepSeek ainda não configurada.',
        d.deepseek&&d.deepseek.configurada
          ?'badge'
          :'warn'
      )
    );

    deepseek.append(
      el(
        'p',
        'A chave é usada somente no servidor para a importação assistida de dados do documento de identidade e do comprovante de residência. Ela não é enviada ao navegador nem exibida depois de salva. A funcionalidade usa o modelo '+((d.deepseek&&d.deepseek.modelo)||'deepseek-flash')+'.',
        'hint'
      )
    );

    form(
      deepseek,
      [
        {
          key:'chave',
          label:'DEEPSEEK_API_KEY',
          type:'password',
          required:true,
          placeholder:'Cole aqui sua chave da API DeepSeek'
        }
      ],
      {},
      async q=>{
        const result=await call(
          'deepseekApiKeySalvar',
          q,
          true
        );

        App.state.boot=
          await call('bootstrap');

        await go('ADM');

        status(
          result.mensagem||
          'Chave da API DeepSeek salva.'
        );
      },
      d.deepseek&&d.deepseek.configurada
        ?'Substituir chave DeepSeek'
        :'Salvar chave DeepSeek'
    );

    const labels={
      rascunhos:
        'Salvar dados pessoais incompletos',
      vencimentoFuturo:
        'Faturas com vencimento futuro',
      anexoOrientacao:
        'Identificação e orientação do anexo exigido',
      entidades:
        'Colônias e entidades',
      municipios:
        'Municípios',
      demandas:
        'Tipos de demanda',
      categorias:
        'Categorias obrigatórias',
      situacoes:
        'Situações dos atendimentos'
    };

    d.configuracoes
      .filter(c=>labels[c.chave])
      .forEach(c=>{
        const box=
          details(
            root,
            labels[c.chave]
          );

        let value=
          JSON.parse(
            c.valor
          );

        const array=
          Array.isArray(
            value
          );

        const f={
          key:'valor',
          label:
            array
              ?'Um valor por linha'
              :labels[c.chave],
          type:
            array||
            c.chave==='anexoOrientacao'
              ?'textarea'
              :'text'
        };

        if(
          c.chave==='rascunhos'
        ){
          f.options=[
            'PENDENTE',
            'PERMITIR',
            'PROIBIR'
          ];
        }

        if(
          c.chave==='vencimentoFuturo'
        ){
          f.options=[
            'PENDENTE',
            'ACEITAR',
            'RECUSAR'
          ];
        }

        form(
          box,
          [f],
          {
            chave:c.chave,
            versao:c.versao,
            valor:
              array
                ?value.join('\n')
                :value
          },
          async q=>{
            if(array){
              q.valor=
                q.valor
                  .split('\n')
                  .map(s=>s.trim())
                  .filter(Boolean);
            }

            await call(
              'configSalvar',
              q,
              true
            );

            App.state.boot=
              await call('bootstrap');

            await go('ADM');
          }
        );
      });

    const users=
      card(
        'Usuários e permissões'
      );

    users.classList.add(
      'adm-users-card'
    );

    root.append(
      users
    );

    users.append(
      el(
        'p',
        'Cadastre a pessoa responsável pelo acesso, informe sua função no projeto, a conta Google usada para entrar no sistema, escolha um perfil-base e, se necessário, personalize permissões específicas. O perfil sugere um conjunto padrão; as permissões marcadas definem o acesso efetivo daquele usuário.',
        'hint'
      )
    );

    const profileGuide=
      el(
        'div',
        undefined,
        'adm-profile-guide'
      );

    d.perfis.forEach(perfil=>{
      const info=
        d.perfisDetalhes[perfil]||{
          descricao:'',
          permissoes:[]
        };

      const box=
        el(
          'div',
          undefined,
          'adm-profile-card'
        );

      box.append(
        el(
          'strong',
          perfil
        ),
        el(
          'span',
          info.descricao||
          '',
          'hint'
        ),
        el(
          'small',
          'Padrão: '+
          info.permissoes
            .map(key=>{
              const permission=
                d.permissoes.find(
                  item=>item.key===key
                );

              return permission
                ?permission.label
                :key;
            })
            .join(', '),
          'adm-profile-defaults'
        )
      );

      profileGuide.append(
        box
      );
    });

    users.append(
      profileGuide
    );

    const permissionFields=
      d.permissoes.map(permission=>({
        key:'perm_'+permission.key,
        label:
          permission.label+
          ' — '+
          permission.descricao,
        type:'checkbox'
      }));

    const userFields=[
      {
        key:'nome',
        label:'Nome completo',
        required:true,
        placeholder:'Nome da pessoa'
      },
      {
        key:'funcao',
        label:'Função no projeto',
        required:true,
        placeholder:'Ex.: residente, professor, advogado, coordenação'
      },
      {
        key:'email',
        label:'Usuário Google',
        type:'email',
        required:true,
        placeholder:'nome@gmail.com'
      },
      {
        key:'perfil',
        label:'Perfil-base',
        options:d.perfis.map(perfil=>({
          value:perfil,
          label:
            perfil+
            ' — '+
            (
              d.perfisDetalhes[perfil]&&
              d.perfisDetalhes[perfil].descricao
                ?d.perfisDetalhes[perfil].descricao
                :''
            )
        })),
        required:true
      },
      {
        key:'ativo',
        label:'Acesso ativo',
        type:'checkbox'
      },
      ...permissionFields
    ];

    const buildUserForm_=(parent,user,isNew=false)=>{
      const profile=
        user.perfil||
        'CONSULTA';

      const defaults=
        (
          d.perfisDetalhes[profile]&&
          d.perfisDetalhes[profile].permissoes
        )||
        ['consulta'];

      const effective=
        Array.isArray(user.permissoesEfetivas)
          ?user.permissoesEfetivas
          :defaults;

      const data=
        Object.assign(
          {},
          user,
          {
            perfil:profile,
            ativo:
              user.ativo===undefined
                ?true
                :(
                  user.ativo===true||
                  user.ativo==='true'
                )
          }
        );

      d.permissoes.forEach(permission=>{
        data['perm_'+permission.key]=
          effective.includes(
            permission.key
          );
      });

      const wrapper=
        el(
          'div',
          undefined,
          'adm-user-editor'
        );

      parent.append(
        wrapper
      );

      wrapper.append(
        el(
          'p',
          'Consulta é a permissão mínima obrigatória. Ao trocar o perfil-base, o sistema atualiza as permissões para o padrão desse perfil; depois você pode marcar ou desmarcar permissões específicas.',
          'adm-permission-help'
        )
      );

      const userForm=
        form(
          wrapper,
          userFields,
          data,
          async q=>{
            const permissions=
              d.permissoes
                .filter(permission=>
                  !!q[
                    'perm_'+
                    permission.key
                  ]
                )
                .map(permission=>
                  permission.key
                );

            d.permissoes.forEach(permission=>{
              delete q[
                'perm_'+
                permission.key
              ];
            });

            q.permissoes=
              permissions;

            await call(
              'usuarioSalvar',
              q,
              true
            );

            App.state.boot=
              await call(
                'bootstrap'
              );

            await go(
              'ADM'
            );

            status(
              isNew
                ?'Usuário autorizado com sucesso.'
                :'Usuário e permissões atualizados.'
            );
          },
          isNew
            ?'Autorizar usuário'
            :'Salvar usuário e permissões'
        );

      userForm.classList.add(
        'adm-user-form'
      );

      const emailInput=
        userForm.elements.namedItem(
          'email'
        );

      if(
        emailInput&&
        !isNew
      ){
        emailInput.readOnly=true;
        emailInput.title=
          'O usuário Google identifica o registro. Para trocar o e-mail, desative este usuário e cadastre outro.';
      }

      const consulta=
        userForm.elements.namedItem(
          'perm_consulta'
        );

      if(consulta){
        consulta.checked=true;
        consulta.disabled=true;
        consulta.title=
          'Consulta é obrigatória para qualquer usuário ativo.';
      }

      const perfilSelect=
        userForm.elements.namedItem(
          'perfil'
        );

      const profileInfo=
        el(
          'div',
          undefined,
          'adm-selected-profile'
        );

      wrapper.insertBefore(
        profileInfo,
        userForm
      );

      const syncProfileInfo_=()=>{
        const selected=
          perfilSelect
            ?perfilSelect.value
            :profile;

        const info=
          d.perfisDetalhes[selected]||{
            descricao:'',
            permissoes:[]
          };

        profileInfo.textContent=
          selected+
          ': '+
          info.descricao;
      };

      const applyProfileDefaults_=()=>{
        const selected=
          perfilSelect.value;

        const defaultsNow=
          (
            d.perfisDetalhes[selected]&&
            d.perfisDetalhes[selected].permissoes
          )||
          ['consulta'];

        d.permissoes.forEach(permission=>{
          const control=
            userForm.elements.namedItem(
              'perm_'+
              permission.key
            );

          if(!control)return;

          control.checked=
            defaultsNow.includes(
              permission.key
            );
        });

        if(consulta){
          consulta.checked=true;
        }

        syncProfileInfo_();
      };

      if(perfilSelect){
        perfilSelect.addEventListener(
          'change',
          applyProfileDefaults_
        );
      }

      syncProfileInfo_();

      return userForm;
    };

    const userList=
      el(
        'div',
        undefined,
        'adm-user-list'
      );

    users.append(
      userList
    );

    d.usuarios.forEach(u=>{
      const custom=
        JSON.stringify(
          (u.permissoesEfetivas||[]).slice().sort()
        )!==
        JSON.stringify(
          (
            d.perfisDetalhes[u.perfil]
              ?d.perfisDetalhes[u.perfil].permissoes
              :[]
          ).slice().sort()
        );

      const title=[
        u.nome||u.email,
        u.funcao||'função não informada',
        u.perfil,
        u.ativo==='true'
          ?'ATIVO'
          :'INATIVO'
      ].join(' · ');

      const box=
        details(
          userList,
          title
        );

      box.classList.add(
        'adm-user-box'
      );

      if(custom){
        box.append(
          el(
            'p',
            'Permissões personalizadas em relação ao perfil-base.',
            'badge'
          )
        );
      }

      buildUserForm_(
        box,
        u,
        false
      );
    });

    const add=
      details(
        users,
        'Cadastrar e autorizar novo usuário'
      );

    add.classList.add(
      'adm-user-box',
      'adm-user-add'
    );

    add.append(
      el(
        'p',
        'Informe quem é a pessoa, qual função exerce e qual conta Google ela utilizará. Depois escolha o perfil-base e ajuste as permissões somente quando houver uma necessidade específica.',
        'hint'
      )
    );

    buildUserForm_(
      add,
      {
        nome:'',
        funcao:'',
        email:'',
        perfil:'CONSULTA',
        ativo:true,
        permissoesEfetivas:
          d.perfisDetalhes.CONSULTA
            ?d.perfisDetalhes.CONSULTA.permissoes
            :['consulta']
      },
      true
    );
  };
})();
</script>
