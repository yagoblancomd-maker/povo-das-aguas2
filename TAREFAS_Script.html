<script>
window.PDA_MODULES.TAREFAS = (()=>{
  const {
    el,button,call,link,alive,status
  }=App;

  const MAX_FILE_BYTES=5*1024*1024;

  function money_(value){
    return Number(value||0).toLocaleString(
      'pt-BR',
      {style:'currency',currency:'BRL'}
    );
  }

  function cpf_(value){
    const d=String(value||'').replace(/\D/g,'');
    return d.length===11
      ?d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4')
      :String(value||'');
  }

  function processMask_(value){
    const d=String(value||'').replace(/\D/g,'').slice(0,20);
    let out=d.slice(0,7);
    if(d.length>7)out+='-'+d.slice(7,9);
    if(d.length>9)out+='.'+d.slice(9,13);
    if(d.length>13)out+='.'+d.slice(13,14);
    if(d.length>14)out+='.'+d.slice(14,16);
    if(d.length>16)out+='.'+d.slice(16,20);
    return out;
  }

  function date_(value){
    const text=String(value||'').trim();
    if(!text)return '—';
    const m=text.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return m?m[3]+'/'+m[2]+'/'+m[1]:text;
  }

  function dateTime_(value){
    const text=String(value||'').trim();
    if(!text)return '';
    const d=new Date(text);
    return Number.isNaN(d.getTime())
      ?text
      :d.toLocaleString('pt-BR');
  }

  function priority_(value){
    return ({
      BAIXA:'Baixa',
      NORMAL:'Normal',
      ALTA:'Alta',
      URGENTE:'Urgente'
    })[String(value||'NORMAL').toUpperCase()]||'Normal';
  }

  function bytes_(value){
    const n=Number(value||0);
    if(!n)return '';
    if(n<1024)return n+' B';
    if(n<1024*1024)return (n/1024).toFixed(1)+' KB';
    return (n/(1024*1024)).toFixed(1)+' MB';
  }

  function validatePdfFiles_(files){
    const list=Array.from(files||[]);

    list.forEach(file=>{
      const name=String(file&&file.name||'');
      const mime=String(file&&file.type||'').toLowerCase();

      if(
        !file||
        !/\.pdf$/i.test(name)||
        (
          mime&&
          mime!=='application/pdf'
        )
      ){
        throw new Error(
          'Somente arquivos PDF podem ser anexados.'
        );
      }

      if(file.size>MAX_FILE_BYTES){
        throw new Error(
          'Cada PDF deve ter no máximo 5 MB: '+name
        );
      }
    });

    return list;
  }

  function fileBase64_(file){
    return new Promise((resolve,reject)=>{
      try{
        validatePdfFiles_([file]);
      }catch(e){
        reject(e);
        return;
      }

      const reader=new FileReader();

      reader.onerror=()=>reject(
        new Error('Não foi possível ler o PDF '+file.name+'.')
      );

      reader.onload=()=>{
        const value=String(reader.result||'');
        const comma=value.indexOf(',');
        resolve(comma>=0?value.slice(comma+1):value);
      };

      reader.readAsDataURL(file);
    });
  }

  async function uploadFiles_(taskId,files){
    const list=Array.from(files||[]);

    for(let i=0;i<list.length;i++){
      const file=list[i];

      status(
        'Anexando PDF '+(i+1)+' de '+list.length+'…'
      );

      await call(
        'tarefaGeralAnexoAdicionar',
        {
          id:taskId,
          nome:file.name,
          mime:'application/pdf',
          base64:await fileBase64_(file)
        },
        true
      );
    }
  }

  async function openPdf_(taskId,attachment){
    return App.openFileViewer(
      ()=>call(
        'tarefaGeralAnexoConteudo',
        {
          id:taskId,
          anexoId:attachment.id
        }
      ),
      {
        nome:attachment.nome||'Anexo da tarefa'
      }
    );
  }

  function distributionCard_(task,onOpen){
    const card=el(
      'article',
      undefined,
      'task-card'+
      (task.situacao==='CONCLUIDA'?' done':'')+
      (task.vencimentoEstado==='VENCIDA'?' overdue':'')+
      (task.vencimentoEstado==='ATE_24H'?' due-24':'')+
      (task.vencimentoEstado==='ATE_96H'?' due-96':'')
    );

    if(task.tags&&task.tags[0]&&task.tags[0].cor){
      card.style.setProperty('--task-accent',task.tags[0].cor);
    }

    const top=el('div',undefined,'task-card-top');

    top.append(
      el('strong',task.pessoa),
      el(
        'span',
        task.situacao==='CONCLUIDA'?'CONCLUÍDA':'PARA DISTRIBUIR',
        'task-status'+(task.situacao==='CONCLUIDA'?' done':'')
      )
    );

    const meta=el('div',undefined,'task-card-meta');

    [
      ['CPF',cpf_(task.cpf)],
      ['Jurisdição',task.jurisdicao||'—'],
      ['Valor da causa',money_(task.valorCausa)],
      ['Município',task.cidade||'—']
    ].forEach(([label,value])=>{
      const item=el('span',label);
      item.append(el('b',value));
      meta.append(item);
    });

    const tags=el('div',undefined,'task-tags');

    (task.tags||[]).forEach(tag=>{
      const chip=el('span',tag.nome||tag,'task-tag');
      if(tag.cor){
        chip.style.setProperty('--task-tag-color',tag.cor);
      }
      tags.append(chip);
    });

    const actions=el('div',undefined,'actions');

    if(task.pessoaId){
      actions.append(
        button(
          'Ver cadastro',
          ()=>App.openPersonDrawer(task.pessoaId),
          true
        )
      );
    }

    actions.append(
      button(
        task.situacao==='CONCLUIDA'?'Ver distribuição':'Abrir tarefa',
        ()=>onOpen(task)
      )
    );

    card.append(top,meta,tags,actions);
    return card;
  }

  function generalCard_(task,onOpen){
    const done=task.situacao==='CONCLUIDA';

    const card=el(
      'article',
      undefined,
      'task-card task-general-card'+
      (done?' done':'')+
      (task.vencimentoEstado==='VENCIDA'?' overdue':'')+
      (task.vencimentoEstado==='ATE_24H'?' due-24':'')+
      (task.vencimentoEstado==='ATE_96H'?' due-96':'')
    );

    if(task.tags&&task.tags[0]&&task.tags[0].cor){
      card.style.setProperty('--task-accent',task.tags[0].cor);
    }

    const top=el('div',undefined,'task-card-top');

    top.append(
      el('strong',task.titulo),
      el(
        'span',
        done?'CONCLUÍDA':priority_(task.prioridade).toUpperCase(),
        'task-status task-priority '+String(task.prioridade||'NORMAL').toLowerCase()
      )
    );

    const description=el(
      'p',
      task.descricao||'Sem informações adicionais.',
      'task-general-description'
    );

    const meta=el('div',undefined,'task-card-meta');

    [
      ['Criada por',task.criadoPorNome||task.criadoPor||'—'],
      ['Prazo',date_(task.prazo)],
      ['Mensagens',String(task.mensagens||0)],
      ['PDFs',String(task.anexos||0)]
    ].forEach(([label,value])=>{
      const item=el('span',label);
      item.append(el('b',value));
      meta.append(item);
    });

    const tags=el('div',undefined,'task-tags');

    (task.tags||[]).forEach(tag=>{
      const chip=el('span',tag.nome||tag,'task-tag');
      if(tag.cor){
        chip.style.setProperty('--task-tag-color',tag.cor);
      }
      tags.append(chip);
    });

    const actions=el('div',undefined,'actions');

    if(task.pessoaId){
      actions.append(
        button(
          'Ver cadastro',
          ()=>App.openPersonDrawer(task.pessoaId),
          true
        )
      );
    }

    actions.append(
      button(
        done?'Abrir histórico':'Abrir / responder',
        ()=>onOpen(task)
      )
    );

    card.append(top,description,meta,tags,actions);
    return card;
  }

  function detailItem_(label,value){
    const item=el('div',undefined,'task-detail-item');
    item.append(el('span',label),el('strong',value||'—'));
    return item;
  }

  function openProcessDialog_(root,detail,parentDialog,refresh){
    const existing=root.querySelector('.task-process-dialog');
    if(existing)existing.remove();

    const dialog=el('dialog',undefined,'task-process-dialog');
    const shell=el('div',undefined,'task-process-shell');
    const head=el('div',undefined,'task-process-head');
    const copy=el('div');

    copy.append(
      el('h3','Informar processo do TRF4'),
      el('p',detail.pessoa.nome)
    );

    head.append(
      copy,
      button('Fechar',()=>dialog.close(),true)
    );

    const body=el('div',undefined,'task-process-body');

    body.append(
      el(
        'p',
        'A distribuição somente será concluída depois que o número processual for confirmado. O processo ficará vinculado permanentemente a este cadastro.',
        'hint'
      )
    );

    const field=el('label',undefined,'field');
    field.append(el('span','Número do processo no TRF4'));

    const input=el('input');
    input.type='text';
    input.placeholder='5001234-56.2026.4.04.7100';
    input.maxLength=25;
    input.inputMode='numeric';
    input.autocomplete='off';

    input.addEventListener(
      'input',
      ()=>input.value=processMask_(input.value)
    );

    field.append(input);
    body.append(
      field,
      el(
        'small',
        'Formato esperado: NNNNNNN-DD.AAAA.4.04.JJJJ',
        'hint'
      )
    );

    const actions=el('div',undefined,'actions task-process-actions');

    actions.append(
      button('Cancelar',()=>dialog.close(),true),
      button(
        'Confirmar e concluir',
        async()=>{
          const numero=String(input.value||'').trim();

          if(!numero){
            throw new Error(
              'Informe o número do processo no TRF4.'
            );
          }

          const result=await call(
            'tarefaDistribuicaoConcluir',
            {
              id:detail.tarefa.id,
              numeroProcesso:numero
            },
            true
          );

          status(result.mensagem||'Distribuição concluída.');
          dialog.close();
          if(parentDialog.open)parentDialog.close();
          await Promise.resolve(
            refresh({
              kind:'complete',
              id:detail.tarefa.id
            })
          );
        }
      )
    );

    body.append(actions);
    shell.append(head,body);
    dialog.append(shell);
    root.append(dialog);

    dialog.addEventListener(
      'close',
      ()=>dialog.remove(),
      {once:true}
    );

    dialog.showModal();
    requestAnimationFrame(()=>input.focus());
  }

  function openDistributionDialog_(root,detail,refresh){
    const existing=root.querySelector('.task-dialog');
    if(existing)existing.remove();

    const dialog=el('dialog',undefined,'task-dialog');
    const shell=el('div',undefined,'task-dialog-shell');
    const head=el('div',undefined,'task-dialog-head');
    const headCopy=el('div');

    headCopy.append(
      el('h3',detail.pessoa.nome),
      el('p','Tarefa de distribuição processual')
    );

    head.append(
      headCopy,
      button('Fechar',()=>dialog.close(),true)
    );

    const body=el('div',undefined,'task-dialog-body');
    const banner=el('div',undefined,'task-distribution-banner');

    [
      ['Jurisdição para distribuição',detail.pessoa.jurisdicao],
      ['Valor da causa',money_(detail.pessoa.valorCausa)],
      [
        'Parcelas não recebidas',
        String(detail.pessoa.parcelasNaoRecebidas||'—')
      ]
    ].forEach(([label,value])=>{
      const item=el('div');
      item.append(el('span',label),el('strong',value));
      banner.append(item);
    });

    body.append(banner);

    const grid=el('div',undefined,'task-detail-grid');

    [
      ['Nome',detail.pessoa.nome],
      ['CPF',cpf_(detail.pessoa.cpf)],
      ['Nascimento',detail.pessoa.nascimento],
      ['Telefone',detail.pessoa.telefone],
      ['E-mail',detail.pessoa.email],
      ['Endereço',detail.pessoa.endereco],
      ['Município/UF',(detail.pessoa.cidade||'')+'/'+(detail.pessoa.uf||'')],
      ['Entidade',detail.pessoa.entidade]
    ].forEach(([label,value])=>
      grid.append(detailItem_(label,value))
    );

    body.append(grid);

    const lawyers=el('section',undefined,'task-dialog-section');
    lawyers.append(el('h4','Advogados para a distribuição'));

    const lawyerGrid=el('div',undefined,'task-lawyers');

    (detail.advogados||[]).forEach(item=>
      lawyerGrid.append(el('div',item,'task-lawyer'))
    );

    lawyers.append(lawyerGrid);
    body.append(lawyers);

    const docs=el('section',undefined,'task-dialog-section');
    const docsHead=el('div',undefined,'task-docs-head');

    docsHead.append(el('h4','Documentos da pessoa'));

    if(detail.documentos&&detail.documentos.length){
      const downloadAll=button(
        'Baixar todos os documentos',
        async()=>{
          const downloadTab=window.open('','_blank');

          if(downloadTab){
            downloadTab.document.title='Preparando documentos…';
            downloadTab.document.body.innerHTML=
              '<div style="font:14px system-ui;padding:24px;color:#173f51">Preparando o arquivo ZIP dos documentos…</div>';
          }

          try{
            const result=await call(
              'tarefaDocumentosZipGerar',
              {id:detail.tarefa.id},
              true
            );

            status(
              result.mensagem||
              'Documentos preparados para download.'
            );

            if(downloadTab){
              downloadTab.location.replace(result.downloadUrl);
            }else{
              const a=document.createElement('a');
              a.href=result.downloadUrl;
              a.target='_blank';
              a.rel='noopener noreferrer';
              document.body.append(a);
              a.click();
              a.remove();
            }
          }catch(e){
            if(downloadTab&&!downloadTab.closed)downloadTab.close();
            throw e;
          }
        },
        true
      );

      downloadAll.classList.add('task-download-all');
      docsHead.append(downloadAll);
    }

    docs.append(docsHead);

    const docGrid=el('div',undefined,'task-docs');

    (detail.documentos||[]).forEach(doc=>{
      const row=el('div',undefined,'task-doc');
      const copy=el('div');

      copy.append(
        el('strong',doc.label),
        el('small',doc.nome)
      );

      row.append(
        copy,
        link(doc.url,'Abrir')
      );

      docGrid.append(row);
    });

    if(!detail.documentos||!detail.documentos.length){
      docGrid.append(
        el('p','Nenhum documento vigente localizado.','warn')
      );
    }

    docs.append(docGrid);
    body.append(docs);

    if(detail.processo&&detail.processo.numero){
      const completed=el('div',undefined,'task-complete-box');

      completed.append(
        el('h4','Distribuição concluída'),
        el(
          'p',
          'Processo TRF4: '+detail.processo.numero,
          'badge'
        )
      );

      body.append(completed);
    }else if(detail.tarefa.situacao!=='CONCLUIDA'){
      const actions=el('div',undefined,'task-dialog-actions');

      actions.append(
        button(
          'Concluir distribuição',
          ()=>openProcessDialog_(
            root,
            detail,
            dialog,
            refresh
          )
        )
      );

      body.append(actions);
    }

    shell.append(head,body);
    dialog.append(shell);
    root.append(dialog);
    dialog.showModal();
  }

  function renderGeneralMessages_(container,detail){
    container.replaceChildren();

    if(!detail.mensagens||!detail.mensagens.length){
      container.append(
        el('div','Nenhuma mensagem nesta tarefa.','task-chat-empty')
      );
      return;
    }

    detail.mensagens.forEach(message=>{
      const item=el('div',undefined,'task-chat-message');
      const head=el('div',undefined,'task-chat-message-head');

      head.append(
        el('strong',message.autorNome||message.autor||'Usuário'),
        el('span',dateTime_(message.criadoEm))
      );

      item.append(
        head,
        el('p',message.mensagem)
      );

      container.append(item);
    });

    container.scrollTop=container.scrollHeight;
  }

  function renderGeneralAttachments_(container,detail){
    container.replaceChildren();

    if(!detail.anexos||!detail.anexos.length){
      container.append(
        el('div','Nenhum PDF anexado.','task-chat-empty')
      );
      return;
    }

    detail.anexos.forEach(attachment=>{
      const row=el('div',undefined,'task-general-file');
      const copy=el('div');

      copy.append(
        el('strong',attachment.nome),
        el(
          'small',
          [
            bytes_(attachment.bytes),
            attachment.enviadoPorNome||attachment.enviadoPor,
            dateTime_(attachment.criadoEm)
          ].filter(Boolean).join(' · ')
        )
      );

      row.append(
        copy,
        button(
          'Abrir PDF',
          ()=>openPdf_(detail.tarefa.id,attachment),
          true
        )
      );

      container.append(row);
    });
  }

  async function openGeneralDialog_(root,task,refresh){
    let detail=await call(
      'tarefaGeralDetalhe',
      {id:task.id}
    );

    const existing=root.querySelector('.task-general-dialog');
    if(existing)existing.remove();

    const dialog=el('dialog',undefined,'task-general-dialog');
    const shell=el('div',undefined,'task-general-dialog-shell');
    const head=el('div',undefined,'task-general-dialog-head');
    const headCopy=el('div');

    headCopy.append(
      el('h3',detail.tarefa.titulo),
      el(
        'p',
        'Criada por '+(
          detail.tarefa.criadoPorNome||
          detail.tarefa.criadoPor||
          '—'
        )
      )
    );

    head.append(
      headCopy,
      button('Fechar',()=>dialog.close(),true)
    );

    const body=el('div',undefined,'task-general-dialog-body');
    const overview=el('div',undefined,'task-general-overview');

    const renderOverview=()=>{
      overview.replaceChildren();

      [
        ['Responsável',detail.tarefa.responsavelNome||detail.tarefa.responsavel],
        ['Prioridade',priority_(detail.tarefa.prioridade)],
        ['Prazo',date_(detail.tarefa.prazo)],
        ['Situação',detail.tarefa.situacao==='CONCLUIDA'?'Concluída':'Em andamento']
      ].forEach(([label,value])=>{
        const item=el('div');
        item.append(el('span',label),el('strong',value||'—'));
        overview.append(item);
      });
    };

    renderOverview();

    body.append(
      overview,
      el(
        'div',
        detail.tarefa.descricao||'Sem informações adicionais.',
        'task-general-text'
      )
    );

    const files=el('section',undefined,'task-general-panel');
    const filesHead=el('div',undefined,'task-general-panel-head');
    const fileGrid=el('div',undefined,'task-general-files');

    filesHead.append(el('h4','PDFs da tarefa'));

    const input=el('input');
    input.type='file';
    input.accept='application/pdf,.pdf';
    input.multiple=true;

    const add=button(
      'Adicionar PDF',
      ()=>input.click(),
      true
    );

    input.addEventListener('change',async()=>{
      if(!input.files||!input.files.length)return;

      await uploadFiles_(
        detail.tarefa.id,
        input.files
      );

      detail=await call(
        'tarefaGeralDetalhe',
        {id:detail.tarefa.id}
      );

      renderGeneralAttachments_(fileGrid,detail);
      input.value='';
      status('PDF(s) anexado(s).');

      await Promise.resolve(
        refresh({
          kind:'update',
          id:detail.tarefa.id,
          patch:{
            anexos:(detail.anexos||[]).length
          }
        })
      );
    });

    filesHead.append(add,input);
    files.append(filesHead,fileGrid);
    renderGeneralAttachments_(fileGrid,detail);
    body.append(files);

    const chat=el('section',undefined,'task-general-panel');
    chat.append(el('h4','Diálogo da tarefa'));

    const messages=el('div',undefined,'task-chat');
    renderGeneralMessages_(messages,detail);

    const composer=el('div',undefined,'task-chat-compose');
    const textarea=el('textarea');
    textarea.rows=3;
    textarea.maxLength=3000;
    textarea.placeholder='Escreva uma mensagem para quem criou a tarefa…';

    composer.append(
      textarea,
      button(
        'Enviar mensagem',
        async()=>{
          const message=String(textarea.value||'').trim();

          if(!message){
            throw new Error('Digite uma mensagem.');
          }

          await call(
            'tarefaGeralMensagemEnviar',
            {
              id:detail.tarefa.id,
              mensagem:message
            },
            true
          );

          detail=await call(
            'tarefaGeralDetalhe',
            {id:detail.tarefa.id}
          );

          renderGeneralMessages_(messages,detail);
          renderOverview();
          textarea.value='';
          status('Mensagem enviada.');

          await Promise.resolve(
            refresh({
              kind:'update',
              id:detail.tarefa.id,
              patch:{
                mensagens:(detail.mensagens||[]).length
              }
            })
          );
        }
      )
    );

    chat.append(messages,composer);
    body.append(chat);

    if(
      detail.tarefa.situacao!=='CONCLUIDA'&&
      detail.permissoes&&
      detail.permissoes.concluir
    ){
      const actions=el('div',undefined,'task-general-dialog-actions');

      actions.append(
        button(
          'Marcar como concluída',
          async()=>{
            await call(
              'tarefaGeralConcluir',
              {id:detail.tarefa.id},
              true
            );

            status('Tarefa concluída.');
            dialog.close();
            await Promise.resolve(
              refresh({
                kind:'complete',
                id:detail.tarefa.id
              })
            );
          }
        )
      );

      body.append(actions);
    }

    shell.append(head,body);
    dialog.append(shell);
    root.append(dialog);

    dialog.addEventListener(
      'close',
      ()=>dialog.remove(),
      {once:true}
    );

    dialog.showModal();
  }

  return async function(ctx){
    const root=ctx.root;
    const content=el('div',undefined,'tasks-live-content');
    root.append(content);

    let mode='open';
    let openData=null;
    let historyData=null;
    const FILTER_KEY='PDA_MY_TASK_FILTERS_V2';
    const filters={
      busca:'',
      tipo:'',
      tag:'',
      prazo:''
    };

    try{
      Object.assign(
        filters,
        JSON.parse(
          sessionStorage.getItem(FILTER_KEY)||
          '{}'
        )
      );
    }catch(e){}

    const saveFilters_=()=>{
      try{
        sessionStorage.setItem(
          FILTER_KEY,
          JSON.stringify(filters)
        );
      }catch(e){}
    };

    const taskMatches_=task=>{
      if(filters.tipo&&task.tipo!==filters.tipo)return false;
      if(filters.tag&&!(task.tags||[]).some(tag=>String(tag.nome||tag).toUpperCase()===filters.tag))return false;

      if(filters.prazo){
        if(filters.prazo==='ATE_96H'&&!['ATE_96H','ATE_24H','VENCIDA'].includes(task.vencimentoEstado))return false;
        if(filters.prazo==='ATE_24H'&&!['ATE_24H','VENCIDA'].includes(task.vencimentoEstado))return false;
        if(filters.prazo==='VENCIDA'&&task.vencimentoEstado!=='VENCIDA')return false;
      }

      const q=filters.busca.trim().toLowerCase();
      if(q){
        const hay=[
          task.titulo,task.descricao,task.pessoa,task.cpf,
          task.responsavelNome,task.criadoPorNome,task.jurisdicao,
          ...(task.tags||[]).map(tag=>tag.nome||tag)
        ].join(' ').toLowerCase();
        if(!hay.includes(q))return false;
      }

      return true;
    };

    function applyTaskChange_(change){
      if(!change)return;

      const data=
        mode==='history'
          ?historyData
          :openData;

      if(!data||!Array.isArray(data.tarefas))return;

      if(change.kind==='complete'){
        data.tarefas=
          data.tarefas.filter(task=>task.id!==change.id);

        if(mode==='open'){
          data.total=Math.max(0,Number(data.total||0)-1);
        }
      }else if(change.kind==='update'){
        const task=data.tarefas.find(item=>item.id===change.id);
        if(task)Object.assign(task,change.patch||{});
      }

      paint_(data);
    }

    const openTask_=async task=>{
      if(task.tipo==='DISTRIBUICAO_PROCESSO'){
        const detail=await call(
          'tarefaDistribuicaoDetalhe',
          {id:task.id}
        );
        if(!alive(ctx))return;
        openDistributionDialog_(root,detail,applyTaskChange_);
        return;
      }

      openGeneralDialog_(root,task,applyTaskChange_);
    };

    const filterBar_=data=>{
      const bar=el('div',undefined,'tasks-filterbar');

      const search=el('input');
      search.type='search';
      search.placeholder='Buscar por tarefa, cadastro, CPF ou tag';
      search.value=filters.busca;

      const type=el('select');
      [
        ['','Todos os tipos'],
        ['TAREFA_GERAL','Tarefas internas'],
        ['DISTRIBUICAO_PROCESSO','Distribuições processuais']
      ].forEach(([value,label])=>{
        const option=el('option',label);
        option.value=value;
        type.append(option);
      });
      type.value=filters.tipo;

      const tag=el('select');
      const allTag=el('option','Todas as tags');
      allTag.value='';
      tag.append(allTag);
      (data.tags||[]).forEach(item=>{
        const option=el('option',item.nome);
        option.value=String(item.nome||'').toUpperCase();
        tag.append(option);
      });
      tag.value=filters.tag;

      const due=el('select');
      [
        ['','Todos os prazos'],
        ['ATE_96H','Prazo inferior a 96h'],
        ['ATE_24H','Prazo inferior a 24h'],
        ['VENCIDA','Vencidas']
      ].forEach(([value,label])=>{
        const option=el('option',label);
        option.value=value;
        due.append(option);
      });
      due.value=filters.prazo;

      const apply=()=>{
        filters.busca=search.value;
        filters.tipo=type.value;
        filters.tag=tag.value;
        filters.prazo=due.value;
        saveFilters_();
        paint_(data);
      };

      search.addEventListener('input',apply);
      type.addEventListener('change',apply);
      tag.addEventListener('change',apply);
      due.addEventListener('change',apply);

      [search,type,tag,due].forEach(node=>bar.append(node));
      return bar;
    };

    const paint_=data=>{
      content.replaceChildren();

      const tasks=(data.tarefas||[]).filter(taskMatches_);
      const urgent=(data.tarefas||[]).filter(task=>
        ['ATE_96H','ATE_24H','VENCIDA'].includes(task.vencimentoEstado)
      ).length;

      const head=el('div',undefined,'tasks-head');
      const copy=el('div');

      copy.append(
        el('h2',mode==='history'?'Histórico de tarefas':'Minhas tarefas'),
        el(
          'p',
          mode==='history'
            ?'As tarefas concluídas são consultadas somente quando você abre este histórico.'
            :'Prioridade para tarefas vencidas ou com prazo inferior a 96 horas.',
          'hint'
        )
      );

      const actions=el('div',undefined,'tasks-head-actions');

      if(mode==='open'){
        const history=button(
          'Histórico',
          async()=>{
            mode='history';
            if(!historyData){
              content.setAttribute('aria-busy','true');
              historyData=await call('tarefasMinhasHistorico',{limit:100,offset:0});
            }
            paint_(historyData);
          },
          true
        );
        history.classList.add('tasks-history-button');
        actions.append(history);
      }else{
        actions.append(
          button(
            'Voltar às abertas',
            ()=>{
              mode='open';
              paint_(openData);
            },
            true
          )
        );
      }

      const summary=el('div',undefined,'tasks-summary');
      summary.append(
        el('span',undefined,'tasks-summary-item'),
        el('span',undefined,'tasks-summary-item urgent')
      );
      summary.children[0].append(el('strong',String((data.tarefas||[]).length)),document.createTextNode(mode==='history'?' concluídas':' abertas'));
      summary.children[1].append(el('strong',String(mode==='history'?0:urgent)),document.createTextNode(' com atenção <96h'));

      head.append(copy,summary,actions);
      content.append(head,filterBar_(data));

      const section=el('section',undefined,'tasks-section');
      const sectionHead=el('div',undefined,'tasks-section-head');
      sectionHead.append(
        el('h3',mode==='history'?'Concluídas':'Abertas'),
        el('span',tasks.length+' resultado(s)','hint')
      );

      const grid=el('div',undefined,'tasks-grid');

      if(!tasks.length){
        grid.append(
          el('div',mode==='history'
            ?'Nenhuma tarefa concluída encontrada com esses filtros.'
            :'Nenhuma tarefa aberta encontrada com esses filtros.','task-empty')
        );
      }else{
        tasks.forEach(task=>{
          const card=task.tipo==='DISTRIBUICAO_PROCESSO'
            ?distributionCard_(task,openTask_)
            :generalCard_(task,openTask_);
          grid.append(card);
        });
      }

      section.append(sectionHead,grid);
      content.append(section);

      if(mode==='history'&&data.hasMore){
        const more=button(
          'Carregar mais concluídas',
          async()=>{
            more.disabled=true;
            more.textContent='Carregando…';

            try{
              const next=await call(
                'tarefasMinhasHistorico',
                {
                  limit:100,
                  offset:(data.tarefas||[]).length
                }
              );

              historyData=Object.assign({},data,{
                tarefas:[
                  ...(data.tarefas||[]),
                  ...(next.tarefas||[])
                ],
                hasMore:next.hasMore,
                total:next.total,
                offset:0,
                limit:(data.tarefas||[]).length+(next.tarefas||[]).length
              });

              paint_(historyData);
            }catch(e){
              more.disabled=false;
              more.textContent='Carregar mais concluídas';
              throw e;
            }
          },
          true
        );

        more.classList.add('tasks-history-more');
        content.append(more);
      }

      content.removeAttribute('aria-busy');
    };

    const render=async()=>{
      content.setAttribute('aria-busy','true');

      if(mode==='history'){
        historyData=await call('tarefasMinhasHistorico',{limit:100,offset:0});
        if(!alive(ctx))return;
        paint_(historyData);
      }else{
        openData=await call('tarefasMinhasAbertas',{});
        if(!alive(ctx))return;
        paint_(openData);
      }
    };

    await render();
  };
})();
</script>
