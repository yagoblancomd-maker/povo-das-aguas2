<script>
window.PDA_MODULES.TAREFAS = (()=>{
  const {
    el,button,call,link,alive,status
  }=App;

  const MAX_FILE_BYTES=5*1024*1024;

  function money_(value){
    return Number(value||0).toLocaleString(
      'pt-BR',
      {style:'currency',currency:'BRL'}
    );
  }

  function cpf_(value){
    const d=String(value||'').replace(/\D/g,'');
    return d.length===11
      ?d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4')
      :String(value||'');
  }

  function processMask_(value){
    const d=String(value||'').replace(/\D/g,'').slice(0,20);
    let out=d.slice(0,7);
    if(d.length>7)out+='-'+d.slice(7,9);
    if(d.length>9)out+='.'+d.slice(9,13);
    if(d.length>13)out+='.'+d.slice(13,14);
    if(d.length>14)out+='.'+d.slice(14,16);
    if(d.length>16)out+='.'+d.slice(16,20);
    return out;
  }

  function date_(value){
    const text=String(value||'').trim();
    if(!text)return '—';
    const m=text.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return m?m[3]+'/'+m[2]+'/'+m[1]:text;
  }

  function dateTime_(value){
    const text=String(value||'').trim();
    if(!text)return '';
    const d=new Date(text);
    return Number.isNaN(d.getTime())
      ?text
      :d.toLocaleString('pt-BR');
  }

  function priority_(value){
    return ({
      BAIXA:'Baixa',
      NORMAL:'Normal',
      ALTA:'Alta',
      URGENTE:'Urgente'
    })[String(value||'NORMAL').toUpperCase()]||'Normal';
  }

  function bytes_(value){
    const n=Number(value||0);
    if(!n)return '';
    if(n<1024)return n+' B';
    if(n<1024*1024)return (n/1024).toFixed(1)+' KB';
    return (n/(1024*1024)).toFixed(1)+' MB';
  }

  function validatePdfFiles_(files){
    const list=Array.from(files||[]);

    list.forEach(file=>{
      const name=String(file&&file.name||'');
      const mime=String(file&&file.type||'').toLowerCase();

      if(
        !file||
        !/\.pdf$/i.test(name)||
        (
          mime&&
          mime!=='application/pdf'
        )
      ){
        throw new Error(
          'Somente arquivos PDF podem ser anexados.'
        );
      }

      if(file.size>MAX_FILE_BYTES){
        throw new Error(
          'Cada PDF deve ter no máximo 5 MB: '+name
        );
      }
    });

    return list;
  }

  function fileBase64_(file){
    return new Promise((resolve,reject)=>{
      try{
        validatePdfFiles_([file]);
      }catch(e){
        reject(e);
        return;
      }

      const reader=new FileReader();

      reader.onerror=()=>reject(
        new Error('Não foi possível ler o PDF '+file.name+'.')
      );

      reader.onload=()=>{
        const value=String(reader.result||'');
        const comma=value.indexOf(',');
        resolve(comma>=0?value.slice(comma+1):value);
      };

      reader.readAsDataURL(file);
    });
  }

  async function uploadFiles_(taskId,files){
    const list=Array.from(files||[]);

    for(let i=0;i<list.length;i++){
      const file=list[i];

      status(
        'Anexando PDF '+(i+1)+' de '+list.length+'…'
      );

      await call(
        'tarefaGeralAnexoAdicionar',
        {
          id:taskId,
          nome:file.name,
          mime:'application/pdf',
          base64:await fileBase64_(file)
        },
        true
      );
    }
  }

  async function openPdf_(taskId,attachment){
    const tab=window.open('','_blank');

    if(tab){
      tab.document.title='Abrindo PDF…';
      tab.document.body.innerHTML=
        '<div style="font:14px system-ui;padding:24px;color:#173f51">Carregando PDF…</div>';
    }

    try{
      const result=await call(
        'tarefaGeralAnexoConteudo',
        {
          id:taskId,
          anexoId:attachment.id
        }
      );

      const raw=atob(result.base64);
      const bytes=new Uint8Array(raw.length);

      for(let i=0;i<raw.length;i++){
        bytes[i]=raw.charCodeAt(i);
      }

      const url=URL.createObjectURL(
        new Blob([bytes],{type:result.mime||'application/pdf'})
      );

      if(tab){
        tab.location.replace(url);
      }else{
        const a=document.createElement('a');
        a.href=url;
        a.target='_blank';
        a.rel='noopener';
        document.body.append(a);
        a.click();
        a.remove();
      }

      setTimeout(()=>URL.revokeObjectURL(url),60000);
    }catch(e){
      if(tab&&!tab.closed)tab.close();
      throw e;
    }
  }

  function distributionCard_(task,onOpen){
    const card=el(
      'article',
      undefined,
      'task-card'+(task.situacao==='CONCLUIDA'?' done':'')
    );

    const top=el('div',undefined,'task-card-top');

    top.append(
      el('strong',task.pessoa),
      el(
        'span',
        task.situacao==='CONCLUIDA'?'CONCLUÍDA':'PARA DISTRIBUIR',
        'task-status'+(task.situacao==='CONCLUIDA'?' done':'')
      )
    );

    const meta=el('div',undefined,'task-card-meta');

    [
      ['CPF',cpf_(task.cpf)],
      ['Jurisdição',task.jurisdicao||'—'],
      ['Valor da causa',money_(task.valorCausa)],
      ['Município',task.cidade||'—']
    ].forEach(([label,value])=>{
      const item=el('span',label);
      item.append(el('b',value));
      meta.append(item);
    });

    const actions=el('div',undefined,'actions');

    actions.append(
      button(
        task.situacao==='CONCLUIDA'?'Ver distribuição':'Abrir tarefa',
        ()=>onOpen(task)
      )
    );

    card.append(top,meta,actions);
    return card;
  }

  function generalCard_(task,onOpen){
    const done=task.situacao==='CONCLUIDA';

    const card=el(
      'article',
      undefined,
      'task-card task-general-card'+(done?' done':'')
    );

    const top=el('div',undefined,'task-card-top');

    top.append(
      el('strong',task.titulo),
      el(
        'span',
        done?'CONCLUÍDA':priority_(task.prioridade).toUpperCase(),
        'task-status task-priority '+String(task.prioridade||'NORMAL').toLowerCase()
      )
    );

    const description=el(
      'p',
      task.descricao||'Sem informações adicionais.',
      'task-general-description'
    );

    const meta=el('div',undefined,'task-card-meta');

    [
      ['Criada por',task.criadoPorNome||task.criadoPor||'—'],
      ['Prazo',date_(task.prazo)],
      ['Mensagens',String(task.mensagens||0)],
      ['PDFs',String(task.anexos||0)]
    ].forEach(([label,value])=>{
      const item=el('span',label);
      item.append(el('b',value));
      meta.append(item);
    });

    const actions=el('div',undefined,'actions');

    actions.append(
      button(
        done?'Abrir histórico':'Abrir / responder',
        ()=>onOpen(task)
      )
    );

    card.append(top,description,meta,actions);
    return card;
  }

  function detailItem_(label,value){
    const item=el('div',undefined,'task-detail-item');
    item.append(el('span',label),el('strong',value||'—'));
    return item;
  }

  function openProcessDialog_(root,detail,parentDialog,refresh){
    const existing=root.querySelector('.task-process-dialog');
    if(existing)existing.remove();

    const dialog=el('dialog',undefined,'task-process-dialog');
    const shell=el('div',undefined,'task-process-shell');
    const head=el('div',undefined,'task-process-head');
    const copy=el('div');

    copy.append(
      el('h3','Informar processo do TRF4'),
      el('p',detail.pessoa.nome)
    );

    head.append(
      copy,
      button('Fechar',()=>dialog.close(),true)
    );

    const body=el('div',undefined,'task-process-body');

    body.append(
      el(
        'p',
        'A distribuição somente será concluída depois que o número processual for confirmado. O processo ficará vinculado permanentemente a este cadastro.',
        'hint'
      )
    );

    const field=el('label',undefined,'field');
    field.append(el('span','Número do processo no TRF4'));

    const input=el('input');
    input.type='text';
    input.placeholder='5001234-56.2026.4.04.7100';
    input.maxLength=25;
    input.inputMode='numeric';
    input.autocomplete='off';

    input.addEventListener(
      'input',
      ()=>input.value=processMask_(input.value)
    );

    field.append(input);
    body.append(
      field,
      el(
        'small',
        'Formato esperado: NNNNNNN-DD.AAAA.4.04.JJJJ',
        'hint'
      )
    );

    const actions=el('div',undefined,'actions task-process-actions');

    actions.append(
      button('Cancelar',()=>dialog.close(),true),
      button(
        'Confirmar e concluir',
        async()=>{
          const numero=String(input.value||'').trim();

          if(!numero){
            throw new Error(
              'Informe o número do processo no TRF4.'
            );
          }

          const result=await call(
            'tarefaDistribuicaoConcluir',
            {
              id:detail.tarefa.id,
              numeroProcesso:numero
            },
            true
          );

          status(result.mensagem||'Distribuição concluída.');
          dialog.close();
          if(parentDialog.open)parentDialog.close();
          await refresh();
        }
      )
    );

    body.append(actions);
    shell.append(head,body);
    dialog.append(shell);
    root.append(dialog);

    dialog.addEventListener(
      'close',
      ()=>dialog.remove(),
      {once:true}
    );

    dialog.showModal();
    requestAnimationFrame(()=>input.focus());
  }

  function openDistributionDialog_(root,detail,refresh){
    const existing=root.querySelector('.task-dialog');
    if(existing)existing.remove();

    const dialog=el('dialog',undefined,'task-dialog');
    const shell=el('div',undefined,'task-dialog-shell');
    const head=el('div',undefined,'task-dialog-head');
    const headCopy=el('div');

    headCopy.append(
      el('h3',detail.pessoa.nome),
      el('p','Tarefa de distribuição processual')
    );

    head.append(
      headCopy,
      button('Fechar',()=>dialog.close(),true)
    );

    const body=el('div',undefined,'task-dialog-body');
    const banner=el('div',undefined,'task-distribution-banner');

    [
      ['Jurisdição para distribuição',detail.pessoa.jurisdicao],
      ['Valor da causa',money_(detail.pessoa.valorCausa)],
      [
        'Parcelas não recebidas',
        String(detail.pessoa.parcelasNaoRecebidas||'—')
      ]
    ].forEach(([label,value])=>{
      const item=el('div');
      item.append(el('span',label),el('strong',value));
      banner.append(item);
    });

    body.append(banner);

    const grid=el('div',undefined,'task-detail-grid');

    [
      ['Nome',detail.pessoa.nome],
      ['CPF',cpf_(detail.pessoa.cpf)],
      ['Nascimento',detail.pessoa.nascimento],
      ['Telefone',detail.pessoa.telefone],
      ['E-mail',detail.pessoa.email],
      ['Endereço',detail.pessoa.endereco],
      ['Município/UF',(detail.pessoa.cidade||'')+'/'+(detail.pessoa.uf||'')],
      ['Entidade',detail.pessoa.entidade]
    ].forEach(([label,value])=>
      grid.append(detailItem_(label,value))
    );

    body.append(grid);

    const lawyers=el('section',undefined,'task-dialog-section');
    lawyers.append(el('h4','Advogados para a distribuição'));

    const lawyerGrid=el('div',undefined,'task-lawyers');

    (detail.advogados||[]).forEach(item=>
      lawyerGrid.append(el('div',item,'task-lawyer'))
    );

    lawyers.append(lawyerGrid);
    body.append(lawyers);

    const docs=el('section',undefined,'task-dialog-section');
    const docsHead=el('div',undefined,'task-docs-head');

    docsHead.append(el('h4','Documentos da pessoa'));

    if(detail.documentos&&detail.documentos.length){
      const downloadAll=button(
        'Baixar todos os documentos',
        async()=>{
          const downloadTab=window.open('','_blank');

          if(downloadTab){
            downloadTab.document.title='Preparando documentos…';
            downloadTab.document.body.innerHTML=
              '<div style="font:14px system-ui;padding:24px;color:#173f51">Preparando o arquivo ZIP dos documentos…</div>';
          }

          try{
            const result=await call(
              'tarefaDocumentosZipGerar',
              {id:detail.tarefa.id},
              true
            );

            status(
              result.mensagem||
              'Documentos preparados para download.'
            );

            if(downloadTab){
              downloadTab.location.replace(result.downloadUrl);
            }else{
              const a=document.createElement('a');
              a.href=result.downloadUrl;
              a.target='_blank';
              a.rel='noopener noreferrer';
              document.body.append(a);
              a.click();
              a.remove();
            }
          }catch(e){
            if(downloadTab&&!downloadTab.closed)downloadTab.close();
            throw e;
          }
        },
        true
      );

      downloadAll.classList.add('task-download-all');
      docsHead.append(downloadAll);
    }

    docs.append(docsHead);

    const docGrid=el('div',undefined,'task-docs');

    (detail.documentos||[]).forEach(doc=>{
      const row=el('div',undefined,'task-doc');
      const copy=el('div');

      copy.append(
        el('strong',doc.label),
        el('small',doc.nome)
      );

      row.append(
        copy,
        link(doc.url,'Abrir')
      );

      docGrid.append(row);
    });

    if(!detail.documentos||!detail.documentos.length){
      docGrid.append(
        el('p','Nenhum documento vigente localizado.','warn')
      );
    }

    docs.append(docGrid);
    body.append(docs);

    if(detail.processo&&detail.processo.numero){
      const completed=el('div',undefined,'task-complete-box');

      completed.append(
        el('h4','Distribuição concluída'),
        el(
          'p',
          'Processo TRF4: '+detail.processo.numero,
          'badge'
        )
      );

      body.append(completed);
    }else if(detail.tarefa.situacao!=='CONCLUIDA'){
      const actions=el('div',undefined,'task-dialog-actions');

      actions.append(
        button(
          'Concluir distribuição',
          ()=>openProcessDialog_(
            root,
            detail,
            dialog,
            refresh
          )
        )
      );

      body.append(actions);
    }

    shell.append(head,body);
    dialog.append(shell);
    root.append(dialog);
    dialog.showModal();
  }

  function renderGeneralMessages_(container,detail){
    container.replaceChildren();

    if(!detail.mensagens||!detail.mensagens.length){
      container.append(
        el('div','Nenhuma mensagem nesta tarefa.','task-chat-empty')
      );
      return;
    }

    detail.mensagens.forEach(message=>{
      const item=el('div',undefined,'task-chat-message');
      const head=el('div',undefined,'task-chat-message-head');

      head.append(
        el('strong',message.autorNome||message.autor||'Usuário'),
        el('span',dateTime_(message.criadoEm))
      );

      item.append(
        head,
        el('p',message.mensagem)
      );

      container.append(item);
    });

    container.scrollTop=container.scrollHeight;
  }

  function renderGeneralAttachments_(container,detail){
    container.replaceChildren();

    if(!detail.anexos||!detail.anexos.length){
      container.append(
        el('div','Nenhum PDF anexado.','task-chat-empty')
      );
      return;
    }

    detail.anexos.forEach(attachment=>{
      const row=el('div',undefined,'task-general-file');
      const copy=el('div');

      copy.append(
        el('strong',attachment.nome),
        el(
          'small',
          [
            bytes_(attachment.bytes),
            attachment.enviadoPorNome||attachment.enviadoPor,
            dateTime_(attachment.criadoEm)
          ].filter(Boolean).join(' · ')
        )
      );

      row.append(
        copy,
        button(
          'Abrir PDF',
          ()=>openPdf_(detail.tarefa.id,attachment),
          true
        )
      );

      container.append(row);
    });
  }

  async function openGeneralDialog_(root,task,refresh){
    const detail=await call(
      'tarefaGeralDetalhe',
      {id:task.id}
    );

    const existing=root.querySelector('.task-general-dialog');
    if(existing)existing.remove();

    const dialog=el('dialog',undefined,'task-general-dialog');
    const shell=el('div',undefined,'task-general-dialog-shell');
    const head=el('div',undefined,'task-general-dialog-head');
    const headCopy=el('div');

    headCopy.append(
      el('h3',detail.tarefa.titulo),
      el(
        'p',
        'Criada por '+(
          detail.tarefa.criadoPorNome||
          detail.tarefa.criadoPor||
          '—'
        )
      )
    );

    head.append(
      headCopy,
      button('Fechar',()=>dialog.close(),true)
    );

    const body=el('div',undefined,'task-general-dialog-body');
    const overview=el('div',undefined,'task-general-overview');

    [
      ['Responsável',detail.tarefa.responsavelNome||detail.tarefa.responsavel],
      ['Prioridade',priority_(detail.tarefa.prioridade)],
      ['Prazo',date_(detail.tarefa.prazo)],
      ['Situação',detail.tarefa.situacao==='CONCLUIDA'?'Concluída':'Em andamento']
    ].forEach(([label,value])=>{
      const item=el('div');
      item.append(el('span',label),el('strong',value||'—'));
      overview.append(item);
    });

    body.append(
      overview,
      el(
        'div',
        detail.tarefa.descricao||'Sem informações adicionais.',
        'task-general-text'
      )
    );

    const files=el('section',undefined,'task-general-panel');
    const filesHead=el('div',undefined,'task-general-panel-head');
    const fileGrid=el('div',undefined,'task-general-files');

    filesHead.append(el('h4','PDFs da tarefa'));

    const input=el('input');
    input.type='file';
    input.accept='application/pdf,.pdf';
    input.multiple=true;

    const add=button(
      'Adicionar PDF',
      ()=>input.click(),
      true
    );

    input.addEventListener('change',async()=>{
      if(!input.files||!input.files.length)return;

      await uploadFiles_(
        detail.tarefa.id,
        input.files
      );

      status('PDF(s) anexado(s).');
      dialog.close();
      await refresh();
      await openGeneralDialog_(root,detail.tarefa,refresh);
    });

    filesHead.append(add,input);
    files.append(filesHead,fileGrid);
    renderGeneralAttachments_(fileGrid,detail);
    body.append(files);

    const chat=el('section',undefined,'task-general-panel');
    chat.append(el('h4','Diálogo da tarefa'));

    const messages=el('div',undefined,'task-chat');
    renderGeneralMessages_(messages,detail);

    const composer=el('div',undefined,'task-chat-compose');
    const textarea=el('textarea');
    textarea.rows=3;
    textarea.maxLength=3000;
    textarea.placeholder='Escreva uma mensagem para quem criou a tarefa…';

    composer.append(
      textarea,
      button(
        'Enviar mensagem',
        async()=>{
          const message=String(textarea.value||'').trim();

          if(!message){
            throw new Error('Digite uma mensagem.');
          }

          await call(
            'tarefaGeralMensagemEnviar',
            {
              id:detail.tarefa.id,
              mensagem:message
            },
            true
          );

          status('Mensagem enviada.');
          dialog.close();
          await refresh();
          await openGeneralDialog_(root,detail.tarefa,refresh);
        }
      )
    );

    chat.append(messages,composer);
    body.append(chat);

    if(
      detail.tarefa.situacao!=='CONCLUIDA'&&
      detail.permissoes&&
      detail.permissoes.concluir
    ){
      const actions=el('div',undefined,'task-general-dialog-actions');

      actions.append(
        button(
          'Marcar como concluída',
          async()=>{
            await call(
              'tarefaGeralConcluir',
              {id:detail.tarefa.id},
              true
            );

            status('Tarefa concluída.');
            dialog.close();
            await refresh();
          }
        )
      );

      body.append(actions);
    }

    shell.append(head,body);
    dialog.append(shell);
    root.append(dialog);

    dialog.addEventListener(
      'close',
      ()=>dialog.remove(),
      {once:true}
    );

    dialog.showModal();
  }

  return async function(ctx){
    const root=ctx.root;

    const render=async()=>{
      root.replaceChildren();

      const data=await call('tarefasMinhas');
      if(!alive(ctx))return;

      const distributionPending=(data.pendentes||[]);
      const distributionDone=(data.concluidas||[]);
      const generalPending=(data.geraisPendentes||[]);
      const generalDone=(data.geraisConcluidas||[]);

      const head=el('div',undefined,'tasks-head');
      const copy=el('div');

      copy.append(
        el('h2','Minhas tarefas'),
        el(
          'p',
          'Tarefas atribuídas especificamente a você, incluindo atividades internas e distribuições processuais.',
          'hint'
        )
      );

      const summary=el('div',undefined,'tasks-summary');

      [
        [
          generalPending.length+distributionPending.length,
          ' pendentes'
        ],
        [
          generalDone.length+distributionDone.length,
          ' concluídas'
        ]
      ].forEach(([value,label])=>{
        const item=el('span');
        item.append(
          el('strong',String(value)),
          document.createTextNode(label)
        );
        summary.append(item);
      });

      head.append(copy,summary);
      root.append(head);

      const openDistribution=async task=>{
        const detail=await call(
          'tarefaDistribuicaoDetalhe',
          {id:task.id}
        );

        if(!alive(ctx))return;
        openDistributionDialog_(root,detail,render);
      };

      const internal=el('section',undefined,'tasks-section');
      const internalHead=el('div',undefined,'tasks-section-head');

      internalHead.append(
        el('h3','Tarefas internas'),
        el(
          'span',
          generalPending.length+' pendente(s)',
          'hint'
        )
      );

      const internalGrid=el('div',undefined,'tasks-grid');

      if(!generalPending.length){
        internalGrid.append(
          el(
            'div',
            'Você não possui tarefas internas pendentes.',
            'task-empty'
          )
        );
      }else{
        generalPending.forEach(task=>
          internalGrid.append(
            generalCard_(
              task,
              item=>openGeneralDialog_(root,item,render)
            )
          )
        );
      }

      internal.append(internalHead,internalGrid);
      root.append(internal);

      const distribution=el('section',undefined,'tasks-section');
      const distributionHead=el('div',undefined,'tasks-section-head');

      distributionHead.append(
        el('h3','Distribuições processuais'),
        el(
          'span',
          distributionPending.length+' pendente(s)',
          'hint'
        )
      );

      const distributionGrid=el('div',undefined,'tasks-grid');

      if(!distributionPending.length){
        distributionGrid.append(
          el(
            'div',
            'Você não possui nenhuma distribuição pendente.',
            'task-empty'
          )
        );
      }else{
        distributionPending.forEach(task=>
          distributionGrid.append(
            distributionCard_(task,openDistribution)
          )
        );
      }

      distribution.append(
        distributionHead,
        distributionGrid
      );

      root.append(distribution);

      if(generalDone.length||distributionDone.length){
        const doneSection=el('section',undefined,'tasks-section');
        const doneHead=el('div',undefined,'tasks-section-head');

        doneHead.append(el('h3','Concluídas'));

        const doneGrid=el('div',undefined,'tasks-grid');

        generalDone.slice(0,12).forEach(task=>
          doneGrid.append(
            generalCard_(
              task,
              item=>openGeneralDialog_(root,item,render)
            )
          )
        );

        distributionDone.slice(0,12).forEach(task=>
          doneGrid.append(
            distributionCard_(task,openDistribution)
          )
        );

        doneSection.append(doneHead,doneGrid);
        root.append(doneSection);
      }
    };

    await render();
  };
})();
</script>
