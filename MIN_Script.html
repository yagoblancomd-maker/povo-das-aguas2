<script>
window.PDA_MODULES.MIN = (()=>{
  const {
    el,card,table,link,button,call,go,alive,searchUI,status
  }=App;

  return async function(ctx){
    const root=ctx.root;

    root.append(
      el(
        'h2',
        'Minutas'
      )
    );

    root.append(
      el(
        'p',
        'As minutas são vinculadas diretamente ao cadastro da pessoa. Não existe etapa de atendimento intermediária.',
        'hint'
      )
    );

    if(!App.state.selection){
      await searchUI(
        root,
        p=>go(
          'MIN',
          p.id
        )
      );
      return;
    }

    const data=
      await call(
        'ficha',
        {
          pessoaId:App.state.selection
        }
      );

    if(!alive(ctx))return;

    const p=data.pessoa;

    root.append(
      el(
        'h3',
        p.nome
      )
    );

    const topActions=
      el(
        'div',
        undefined,
        'actions'
      );

    topActions.append(
      button(
        'Selecionar outra pessoa',
        ()=>{
          App.state.selection=null;
          return go('MIN');
        },
        true
      )
    );

    root.append(topActions);

    const box=
      card(
        'Petição inicial — Seguro-Defeso 2025'
      );

    const iniciais=
      (data.documentosPessoa||[])
        .filter(d=>
          d.vigente==='true'&&
          d.categoria==='INICIAL_SEGURO_DEFESO_2025'
        );

    box.append(
      el(
        'p',
        iniciais.length
          ?'Existe uma petição inicial vigente vinculada a esta pessoa.'
          :'Ainda não há petição inicial vigente vinculada a esta pessoa.',
        iniciais.length
          ?'badge'
          :'warn'
      )
    );

    const generate=
      button(
        iniciais.length
          ?'Gerar nova versão da inicial'
          :'Gerar petição inicial',
        async()=>{
          await call(
            'minutaInicialGerar',
            {
              pessoaId:p.id
            },
            true
          );

          status(
            'Petição inicial gerada e adicionada aos documentos da pessoa.'
          );

          await go(
            'MIN',
            p.id
          );
        }
      );

    box.append(generate);

    if(iniciais.length){
      table(
        box,
        [
          {
            key:'nome',
            label:'Arquivo'
          },
          {
            label:'Situação',
            value:d=>
              d.conferido==='true'
                ?'Vigente · Conferido'
                :'Vigente'
          }
        ],
        iniciais,
        d=>[
          link(
            d.url,
            'Abrir PDF'
          )
        ]
      );
    }

    root.append(box);
  };
})();
</script>
