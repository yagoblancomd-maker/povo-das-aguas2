<style>
.home-root{
  width:100%;
  margin:0 auto;
  padding-bottom:18px
}
.home-hero{
  position:relative;
  min-height:0;
  overflow:visible;
  margin:0 0 30px;
  padding:6px 0 28px;
  border:0;
  border-bottom:1px solid var(--pda-line);
  border-radius:0;
  color:var(--pda-ink);
  background:transparent;
  box-shadow:none
}
.home-hero::after,
.home-fishing-art{display:none}
.home-hero-content{
  position:relative;
  display:block;
  width:min(760px,100%);
  min-height:0;
  padding:0
}
.home-eyebrow{
  display:block;
  width:auto;
  margin:0 0 12px;
  padding:0;
  border:0;
  border-radius:0;
  color:var(--pda-sea);
  background:transparent;
  font-size:9px;
  font-weight:800;
  letter-spacing:.13em
}
.home-hero h2{
  margin:0;
  color:var(--pda-ink);
  font-family:var(--pda-display);
  font-size:38px;
  font-weight:400;
  line-height:1.04;
  letter-spacing:-.035em
}
.home-hero-content>p{
  max-width:680px;
  margin:12px 0 14px;
  color:var(--pda-muted);
  font-size:13px;
  line-height:1.55
}
.home-hero-meta{
  display:flex;
  flex-wrap:wrap;
  gap:0;
  color:#6f7b75;
  font-size:9.5px;
  font-weight:600
}
.home-hero-meta span{
  padding:0;
  border:0;
  border-radius:0;
  color:inherit;
  background:transparent
}
.home-hero-meta span+span::before{
  content:"·";
  margin:0 9px;
  color:var(--pda-clay)
}
.home-headline-metrics{
  display:grid;
  grid-template-columns:1.05fr 1.35fr .9fr .9fr;
  gap:0;
  margin:0 0 16px;
  border-top:1px solid var(--pda-line);
  border-bottom:1px solid var(--pda-line)
}
.home-metric{
  display:grid;
  grid-template-columns:minmax(0,1fr);
  gap:0;
  min-width:0;
  min-height:92px;
  align-items:center;
  padding:14px 16px;
  border:0!important;
  border-right:1px solid var(--pda-line)!important;
  border-radius:0!important;
  background:transparent!important;
  box-shadow:none!important;
  transition:none
}
.home-metric:last-child{border-right:0!important}
.home-metric:hover{
  transform:none;
  border-color:var(--pda-line);
  box-shadow:none
}
.home-metric.featured{
  border-color:var(--pda-line);
  background:transparent!important
}
.home-metric-icon{display:none}
.home-metric-copy strong{
  display:block;
  overflow:hidden;
  margin-bottom:4px;
  color:var(--pda-ink);
  font-family:var(--pda-display);
  font-size:25px;
  font-weight:400;
  line-height:1;
  letter-spacing:-.03em;
  text-overflow:ellipsis;
  white-space:nowrap
}
.home-metric-copy>span{
  display:block;
  color:#405753;
  font-size:9.5px;
  font-weight:800;
  letter-spacing:.02em
}
.home-metric-copy small{
  display:block;
  max-width:230px;
  margin-top:4px;
  color:#7a837e;
  font-size:8.5px;
  line-height:1.3
}
.home-secondary-metrics{
  display:flex;
  flex-wrap:wrap;
  gap:0;
  margin:0 0 34px;
  color:#53645f
}
.home-secondary-metric{
  display:flex;
  align-items:baseline;
  gap:5px;
  padding:4px 14px 4px 0;
  border:0;
  border-radius:0;
  background:transparent
}
.home-secondary-metric+.home-secondary-metric{
  padding-left:14px;
  border-left:1px solid var(--pda-line)
}
.home-secondary-metric strong{
  color:var(--pda-sea);
  font-family:var(--pda-display);
  font-size:17px;
  font-weight:400
}
.home-secondary-metric span{
  color:#60716b;
  font-size:9px;
  font-weight:600
}
.home-section-title{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:10px;
  margin:0 0 8px
}
.home-section-title h3,
.home-panel-head h3{
  margin:0;
  color:var(--pda-ink);
  font-size:12px;
  font-weight:800
}
.home-section-title p,
.home-panel-head p{
  margin:3px 0 0
}
.home-action-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:0 28px;
  margin:0 0 36px;
  border-top:1px solid var(--pda-line)
}
.home-action-card{
  position:relative;
  display:grid;
  grid-template-columns:30px minmax(0,1fr) 20px;
  min-height:68px;
  align-items:center;
  gap:10px;
  padding:11px 0;
  border:0!important;
  border-bottom:1px solid var(--pda-line)!important;
  border-radius:0!important;
  color:var(--pda-ink)!important;
  text-align:left;
  background:transparent!important;
  box-shadow:none!important;
  transition:color .12s ease,background .12s ease!important
}
.home-action-card:hover{
  transform:none!important;
  color:var(--pda-sea)!important;
  border-color:var(--pda-line)!important;
  background:#eeeae1!important;
  box-shadow:none!important
}
.home-action-card.primary{
  color:var(--pda-ink)!important;
  border-color:var(--pda-line)!important;
  background:transparent!important
}
.home-action-icon{
  display:grid;
  place-items:center;
  width:28px;
  height:28px;
  border-radius:50%;
  color:var(--pda-sea);
  background:transparent
}
.home-action-card.primary .home-action-icon{
  color:var(--pda-sea);
  border:0;
  background:transparent
}
.home-action-icon svg{
  width:18px;
  height:18px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.7
}
.home-action-copy{
  display:flex;
  min-width:0;
  flex-direction:column;
  gap:2px
}
.home-action-copy strong{
  color:inherit;
  font-size:10.5px
}
.home-action-copy small,
.home-action-card.primary .home-action-copy small{
  color:#77817c;
  font-size:8.7px;
  font-weight:400;
  line-height:1.35
}
.home-action-arrow{
  justify-self:end;
  color:#8b948f;
  font-size:15px;
  transition:transform .12s ease
}
.home-action-card:hover .home-action-arrow{transform:translateX(2px)}
.home-lower-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:28px;
  margin-bottom:28px
}
.home-panel,
.home-territory{
  padding:0!important;
  border:0!important;
  border-top:1px solid var(--pda-line)!important;
  border-radius:0!important;
  background:transparent!important;
  box-shadow:none!important
}
.home-panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  min-height:52px;
  margin:0;
  padding:11px 0
}
.home-panel-head button{
  min-height:28px;
  padding:5px 8px;
  font-size:8.5px
}
.home-recent-list{
  display:grid;
  gap:0
}
.home-recent-person{
  display:grid;
  grid-template-columns:30px minmax(0,1fr) 18px;
  align-items:center;
  gap:8px;
  width:100%;
  min-height:46px;
  padding:6px 0;
  border:0!important;
  border-top:1px solid #e1dcd2!important;
  border-radius:0!important;
  color:var(--pda-ink)!important;
  text-align:left;
  background:transparent!important;
  box-shadow:none!important
}
.home-recent-person:hover{
  transform:none!important;
  color:var(--pda-sea)!important;
  background:#eeeae1!important;
  box-shadow:none!important
}
.home-avatar{
  display:grid;
  place-items:center;
  width:28px;
  height:28px;
  border-radius:50%;
  color:var(--pda-sea);
  background:#e0e8e5;
  font-size:8px;
  font-weight:800
}
.home-recent-copy{
  display:flex;
  min-width:0;
  flex-direction:column
}
.home-recent-copy strong{
  overflow:hidden;
  color:inherit;
  font-size:9.5px;
  text-overflow:ellipsis;
  white-space:nowrap
}
.home-recent-copy small{
  overflow:hidden;
  margin-top:1px;
  color:#78837e;
  font-size:8.2px;
  text-overflow:ellipsis;
  white-space:nowrap
}
.home-recent-arrow{color:#919a95}
.home-timeline{
  display:grid;
  gap:0
}
.home-timeline-item{
  position:relative;
  display:grid;
  grid-template-columns:10px minmax(0,1fr);
  gap:8px;
  min-height:44px;
  padding:7px 0;
  border-top:1px solid #e1dcd2
}
.home-timeline-item:not(:last-child)::after{display:none}
.home-timeline-dot{
  width:6px;
  height:6px;
  margin-top:5px;
  border:0;
  border-radius:50%;
  background:var(--pda-clay)
}
.home-timeline-item strong{
  display:block;
  color:#405753;
  font-size:9.2px;
  line-height:1.3
}
.home-timeline-item small{
  display:block;
  margin-top:2px;
  color:#818984;
  font-size:8px
}
.home-territory{
  margin-bottom:2px
}
.home-updated{
  color:#818984;
  font-size:8px
}
.home-territory-bars{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px 22px;
  padding:10px 0 0
}
.home-territory-label{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-bottom:5px;
  color:#596c66;
  font-size:8.5px
}
.home-territory-label strong{color:var(--pda-sea)}
.home-territory-track{
  height:3px;
  overflow:hidden;
  border-radius:0;
  background:#ddd8ce
}
.home-territory-fill{
  display:block;
  height:100%;
  border-radius:0;
  background:var(--pda-sea)
}
@media(max-width:980px){
  .home-headline-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .home-metric:nth-child(2){border-right:0!important}
  .home-metric:nth-child(-n+2){border-bottom:1px solid var(--pda-line)!important}
  .home-action-grid{grid-template-columns:1fr}
  .home-lower-grid{grid-template-columns:1fr}
  .home-territory-bars{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:560px){
  .home-hero{padding-bottom:22px}
  .home-hero h2{font-size:31px}
  .home-headline-metrics{grid-template-columns:1fr}
  .home-metric{
    min-height:76px;
    border-right:0!important;
    border-bottom:1px solid var(--pda-line)!important
  }
  .home-metric:last-child{border-bottom:0!important}
  .home-secondary-metrics{
    display:grid;
    grid-template-columns:1fr 1fr
  }
  .home-secondary-metric,
  .home-secondary-metric+.home-secondary-metric{
    padding:4px 8px 4px 0;
    border-left:0
  }
  .home-territory-bars{grid-template-columns:1fr}
}
</style>
