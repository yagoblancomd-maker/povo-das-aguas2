<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07171e">
  <title>Povo das Águas</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="auth" class="auth-shell">
    <div class="auth-brand">
      <div class="brand-mark"><span>≋</span></div>
      <div>
        <div class="eyebrow">CIDIJUS · EMAJ · FURG</div>
        <h1>Povo <em>das Águas</em></h1>
        <p>Sistema de atendimento, documentação e acompanhamento processual.</p>
      </div>
    </div>
    <section class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" data-auth-tab="login">Entrar</button>
        <button class="auth-tab" data-auth-tab="register">Criar acesso</button>
      </div>
      <form id="loginForm" class="auth-form">
        <label>E-mail<input name="email" type="email" autocomplete="username" required></label>
        <label>Senha<input name="senha" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">Entrar</button>
      </form>
      <form id="registerForm" class="auth-form hidden">
        <label>Nome completo<input name="nome" required maxlength="140"></label>
        <label>E-mail<input name="email" type="email" required></label>
        <label>Função
          <select name="funcao" required>
            <option value="">Selecione</option>
            <option>Professor</option><option>Residente</option><option>Colaborador</option><option>Aluno</option>
          </select>
        </label>
        <label>Senha<input name="senha" type="password" required maxlength="200"></label>
        <button class="primary" type="submit">Criar meu acesso</button>
      </form>
      <p id="authMessage" class="message" role="status"></p>
    </section>
  </div>

  <div id="app" class="app-shell hidden">
    <aside class="sidebar">
      <div class="side-brand">
        <div class="brand-mark small"><span>≋</span></div>
        <div><strong>Povo das Águas</strong><small>Google Cloud</small></div>
      </div>
      <nav id="nav"></nav>
      <div class="side-bottom">
        <div class="user-chip">
          <div class="avatar" id="avatar">P</div>
          <div><strong id="sideUser">Usuário</strong><small id="sideRole"></small></div>
        </div>
        <button id="logout" class="ghost">Sair</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow">POVO DAS ÁGUAS</div>
          <h2 id="pageTitle">Início</h2>
        </div>
        <div class="status"><span></span><b>Cloud</b><small>PostgreSQL</small></div>
      </header>
      <div id="notice" class="notice hidden"></div>
      <section id="content" class="content"><div class="loading">Carregando…</div></section>
    </main>
  </div>

  <dialog id="dialog"><div id="dialogBody"></div><button class="ghost dialog-close" onclick="this.closest('dialog').close()">Fechar</button></dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
