<style>
:root{
  --navy:#0f3046;
  --navy-2:#17445d;
  --teal:#087987;
  --teal-dark:#05636f;
  --aqua:#dceff0;
  --water:#edf6f7;
  --sand:#f7f4ec;
  --bg:#eef4f6;
  --surface:rgba(255,255,255,.94);
  --surface-soft:rgba(255,255,255,.78);
  --line:#c8d8df;
  --line-strong:#a9c0ca;
  --muted:#5b707b;
  --danger:#a63a32;
  --success:#20705c;
  --shadow:0 8px 28px rgba(15,48,70,.08);
  --shadow-soft:0 3px 12px rgba(15,48,70,.06);
  --radius:10px
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  color:var(--navy);
  font:14px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 9% 14%,rgba(8,121,135,.07),transparent 20%),
    radial-gradient(circle at 88% 18%,rgba(15,48,70,.055),transparent 23%),
    linear-gradient(180deg,#f7fafb 0%,var(--bg) 52%,#edf4f5 100%);
}
body::before{
  content:"";
  position:fixed;
  inset:94px 0 0;
  pointer-events:none;
  z-index:-1;
  opacity:.48;
  background:
    radial-gradient(ellipse at 16% 92%,transparent 0 48%,rgba(8,121,135,.055) 49% 50%,transparent 51% 100%),
    radial-gradient(ellipse at 62% 96%,transparent 0 51%,rgba(15,48,70,.04) 52% 53%,transparent 54% 100%);
  background-size:520px 170px,680px 210px;
}
header{
  display:flex;
  gap:14px;
  align-items:center;
  min-height:82px;
  padding:11px max(24px,calc((100vw - 1480px)/2));
  color:#fff;
  background:
    radial-gradient(circle at 18% -80%,rgba(125,212,218,.28),transparent 42%),
    linear-gradient(118deg,var(--navy) 0%,#10374e 55%,#0b5361 100%);
  box-shadow:0 4px 16px rgba(15,48,70,.16);
}
header img{
  width:54px;
  height:54px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.7);
  box-shadow:0 2px 10px rgba(0,0,0,.14)
}
header h1{
  margin:0 0 1px;
  font-size:22px;
  line-height:1.15;
  letter-spacing:-.02em
}
header p{
  margin:1px 0;
  font-size:11px;
  opacity:.88
}
nav{
  position:sticky;
  top:0;
  z-index:40;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:4px;
  padding:7px 18px;
  border-bottom:1px solid rgba(169,192,202,.75);
  background:rgba(255,255,255,.93);
  backdrop-filter:blur(12px);
  box-shadow:0 3px 12px rgba(15,48,70,.045)
}
button,.button{
  border:1px solid transparent;
  border-radius:8px;
  padding:8px 13px;
  color:#fff;
  background:linear-gradient(180deg,#0a8492,var(--teal-dark));
  box-shadow:0 2px 7px rgba(8,121,135,.16);
  font:600 13px/1.2 inherit;
  cursor:pointer;
  transition:transform .14s ease,box-shadow .14s ease,background .14s ease,border-color .14s ease
}
button:hover,.button:hover{
  transform:translateY(-1px);
  box-shadow:0 5px 13px rgba(8,121,135,.22)
}
button.secondary{
  color:var(--navy);
  background:#edf4f6;
  border-color:var(--line);
  box-shadow:none
}
button.danger{
  color:#fff;
  background:linear-gradient(180deg,#b64a42,#96342d)
}
button:disabled{
  opacity:.48;
  cursor:not-allowed;
  transform:none;
  box-shadow:none
}
button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
summary:focus-visible{
  outline:3px solid #ddb13d;
  outline-offset:2px
}
nav button{
  min-width:auto;
  padding:7px 12px;
  color:var(--navy);
  background:transparent;
  border-color:transparent;
  border-radius:7px;
  box-shadow:none;
  font-size:12.5px
}
nav button:hover{
  color:var(--teal-dark);
  background:#e9f3f4;
  box-shadow:none;
  transform:none
}
nav button[aria-current=page]{
  color:#fff;
  background:linear-gradient(180deg,#0b7b88,#075f6b);
  box-shadow:0 2px 8px rgba(8,121,135,.18)
}
.nav-group{
  position:relative;
  margin:0;
  padding:0;
  border:0;
  border-radius:7px;
  background:transparent;
  box-shadow:none
}
.nav-group>.nav-group-summary{
  display:flex;
  min-height:31px;
  align-items:center;
  gap:6px;
  margin:0!important;
  padding:7px 12px;
  border-radius:7px;
  color:var(--navy);
  background:transparent;
  cursor:pointer;
  font-size:12.5px;
  font-weight:500;
  list-style:none;
  transition:background .14s ease,color .14s ease
}
.nav-group>.nav-group-summary::-webkit-details-marker{
  display:none
}
.nav-group>.nav-group-summary::after{
  content:"▾";
  margin-left:2px;
  color:#6f8791;
  font-size:9px
}
.nav-group:hover>.nav-group-summary,
.nav-group[open]>.nav-group-summary{
  color:var(--teal-dark);
  background:#e9f3f4
}
.nav-group.active>.nav-group-summary{
  color:#fff;
  background:linear-gradient(180deg,#0b7b88,#075f6b);
  box-shadow:0 2px 8px rgba(8,121,135,.18)
}
.nav-group.active>.nav-group-summary::after{
  color:rgba(255,255,255,.9)
}
.nav-submenu{
  position:absolute;
  z-index:120;
  top:calc(100% + 5px);
  left:0;
  min-width:190px;
  padding:6px;
  border:1px solid #c7d9df;
  border-radius:9px;
  background:rgba(255,255,255,.98);
  box-shadow:0 12px 30px rgba(15,48,70,.18);
  backdrop-filter:blur(12px)
}
.nav-submenu .nav-submenu-item{
  display:block;
  width:100%;
  margin:0;
  padding:8px 10px;
  text-align:left;
  white-space:nowrap
}
.nav-submenu .nav-submenu-item+ .nav-submenu-item{
  margin-top:2px
}
.nav-submenu .nav-submenu-item[aria-current=page]{
  color:#fff;
  background:linear-gradient(180deg,#0b7b88,#075f6b)
}
main{
  width:min(1500px,calc(100% - 28px));
  margin:0 auto;
  padding:16px 0 24px
}
h2{
  margin:0 0 8px;
  font-size:21px;
  letter-spacing:-.02em
}
h3{
  margin:10px 0 8px;
  font-size:15px
}
p{
  margin:6px 0 10px
}
.card{
  margin-bottom:11px;
  padding:14px 16px;
  border:1px solid rgba(185,205,213,.92);
  border-radius:var(--radius);
  background:var(--surface);
  box-shadow:var(--shadow-soft)
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:9px 10px
}
.field{
  display:flex;
  flex-direction:column;
  gap:2px;
  min-width:0;
  font-size:11.5px;
  font-weight:560
}
.field>span{
  line-height:1.15
}
.field small{
  margin:1px 0 0;
  line-height:1.15;
  font-size:9.8px;
  font-weight:400
}
input,select,textarea{
  width:100%;
  min-height:32px;
  border:1px solid var(--line-strong);
  border-radius:7px;
  padding:6px 8px;
  color:var(--navy);
  background:rgba(255,255,255,.98);
  font:400 13px/1.25 inherit;
  transition:border-color .14s ease,box-shadow .14s ease,background .14s ease
}
input:hover,select:hover,textarea:hover{
  border-color:#84a9b5
}
input:focus,select:focus,textarea:focus{
  border-color:var(--teal);
  box-shadow:0 0 0 3px rgba(8,121,135,.09);
  background:#fff
}
textarea{
  min-height:68px;
  resize:vertical
}
input[type=checkbox]{
  width:17px;
  min-height:17px;
  height:17px;
  align-self:flex-start;
  accent-color:var(--teal)
}
input[type=file]{
  min-height:35px;
  padding:5px 7px;
  font-size:12px
}
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin:11px 0 4px
}
.status{
  width:min(1500px,calc(100% - 28px));
  margin:8px auto 0;
  padding:9px 12px;
  border-radius:8px;
  white-space:pre-wrap;
  font-size:12.5px
}
.status:empty{display:none}
.status.error{
  color:#7d2820;
  background:#fff0ed;
  border:1px solid #efc3bd
}
.status.ok{
  color:#174f42;
  background:#e3f4ef;
  border:1px solid #b6ded2
}
body.processing-active{
  overflow:hidden
}
.processing-overlay{
  position:fixed;
  inset:0;
  z-index:9999;
  display:grid;
  place-items:center;
  padding:22px;
  background:
    radial-gradient(circle at 12% 14%,rgba(65,190,195,.18),transparent 28%),
    radial-gradient(circle at 88% 82%,rgba(35,112,132,.20),transparent 30%),
    rgba(5,28,41,.72);
  backdrop-filter:blur(9px)
}
.processing-panel{
  display:grid;
  grid-template-columns:minmax(300px,390px) minmax(360px,1fr);
  gap:28px;
  align-items:stretch;
  width:min(920px,calc(100vw - 34px));
  min-height:430px;
  padding:20px;
  border:1px solid rgba(189,222,225,.78);
  border-radius:24px;
  color:var(--navy);
  background:
    radial-gradient(circle at 0 0,rgba(8,121,135,.08),transparent 34%),
    linear-gradient(160deg,rgba(255,255,255,.99),rgba(244,250,250,.98));
  box-shadow:0 30px 90px rgba(2,24,36,.34)
}
.processing-scene{
  position:relative;
  display:grid;
  place-items:center;
  min-width:0;
  overflow:hidden;
  border:1px solid rgba(161,204,210,.58);
  border-radius:19px;
  background:linear-gradient(180deg,#e9f8f7,#d9eff0);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.82)
}
.processing-fisher-svg{
  display:block;
  width:100%;
  height:100%;
  min-height:360px
}
.processing-scene-caption{
  position:absolute;
  left:18px;
  bottom:16px;
  padding:5px 9px;
  border:1px solid rgba(255,255,255,.42);
  border-radius:999px;
  color:#efffff;
  background:rgba(8,68,80,.38);
  backdrop-filter:blur(5px);
  font-size:8px;
  font-weight:800;
  letter-spacing:.13em;
  text-transform:uppercase
}
.processing-sun{
  fill:#f1cf75;
  opacity:.78;
  animation:pda-sun-pulse 4.2s ease-in-out infinite
}
.processing-cloud{
  fill:rgba(255,255,255,.72)
}
.processing-cloud-a{
  animation:pda-cloud-drift 8s ease-in-out infinite alternate
}
.processing-cloud-b{
  opacity:.58;
  animation:pda-cloud-drift 10s ease-in-out -2s infinite alternate-reverse
}
.processing-water-back{
  fill:#4fa7af;
  opacity:.72;
  animation:pda-water-sway 4.8s ease-in-out infinite alternate
}
.processing-water-front{
  fill:url(#pdaWater);
  opacity:.94;
  animation:pda-water-sway 3.8s ease-in-out -1s infinite alternate-reverse
}
.processing-boat{
  transform-origin:178px 213px;
  animation:pda-boat-float 2.8s ease-in-out infinite
}
.processing-boat-top{
  fill:#f1d2a0
}
.processing-boat-body{
  fill:#b76c49
}
.processing-boat-line{
  fill:none;
  stroke:#704932;
  stroke-width:4;
  stroke-linecap:round
}
.processing-fisher-head{
  fill:#d9a16f
}
.processing-fisher-body,
.processing-fisher-leg,
.processing-fisher-hat{
  fill:none;
  stroke:#123d4d;
  stroke-width:7;
  stroke-linecap:round;
  stroke-linejoin:round
}
.processing-fisher-hat{
  stroke-width:5
}
.processing-fisher{
  transform-origin:180px 185px;
  animation:pda-fisher-lean 3.4s ease-in-out infinite
}
.processing-cast{
  transform-origin:205px 175px;
  animation:pda-net-cast 3.4s cubic-bezier(.42,0,.28,1) infinite
}
.processing-rope,
.processing-net-outline,
.processing-net-grid{
  fill:none;
  stroke:#2c6a72;
  stroke-linecap:round;
  stroke-linejoin:round
}
.processing-rope{
  stroke-width:4
}
.processing-net-outline{
  stroke-width:3;
  fill:rgba(221,247,245,.20)
}
.processing-net-grid{
  stroke-width:1.5;
  opacity:.74
}
.processing-ripples path{
  fill:none;
  stroke:rgba(222,251,250,.56);
  stroke-width:4;
  stroke-linecap:round;
  animation:pda-ripple 2.6s ease-in-out infinite
}
.processing-ripples path+path{
  animation-delay:-1.1s
}
.processing-copy{
  display:flex;
  min-width:0;
  flex-direction:column;
  justify-content:center;
  padding:18px 12px 18px 0
}
.processing-eyebrow{
  width:max-content;
  margin-bottom:11px;
  padding:5px 9px;
  border:1px solid #badbdd;
  border-radius:999px;
  color:#0a6b76;
  background:#e8f5f5;
  font-size:8px;
  font-weight:850;
  letter-spacing:.14em
}
.processing-title{
  margin:0 0 8px;
  color:#123e52;
  font-size:26px;
  line-height:1.08;
  letter-spacing:-.035em
}
.processing-message{
  min-height:23px;
  margin:0 0 5px;
  color:#284f61;
  font-size:14px;
  font-weight:720
}
.processing-remaining{
  margin:0 0 17px;
  color:#607985;
  font-size:11.5px
}
.processing-progress-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:12px;
  margin-bottom:6px
}
.processing-progress-label{
  color:#617985;
  font-size:9.5px;
  font-weight:700;
  letter-spacing:.025em
}
.processing-percent{
  color:#087987;
  font-size:21px;
  line-height:1;
  letter-spacing:-.04em
}
.processing-progress{
  position:relative;
  width:100%;
  height:11px;
  overflow:hidden;
  border-radius:999px;
  background:#dbe9eb;
  box-shadow:inset 0 1px 2px rgba(15,48,70,.09)
}
.processing-progress-bar{
  position:relative;
  width:0;
  height:100%;
  overflow:hidden;
  border-radius:inherit;
  background:linear-gradient(90deg,#0b7180,#18a1a6);
  transition:width .32s ease
}
.processing-progress-bar::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(100deg,transparent 0 35%,rgba(255,255,255,.44) 50%,transparent 65% 100%);
  transform:translateX(-100%);
  animation:pda-progress-shine 1.8s linear infinite
}
.processing-phrase-box{
  min-height:110px;
  margin-top:18px;
  padding:14px 15px;
  border:1px solid #d2e6e8;
  border-radius:14px;
  background:
    linear-gradient(135deg,rgba(234,247,247,.96),rgba(248,252,250,.98));
  box-shadow:inset 3px 0 0 #77b8be
}
.processing-phrase-label{
  display:block;
  margin-bottom:7px;
  color:#0a7580;
  font-size:8px;
  font-weight:850;
  letter-spacing:.13em
}
.processing-phrase{
  margin:0;
  color:#284858;
  font-family:Georgia,"Times New Roman",serif;
  font-size:15px;
  font-style:italic;
  line-height:1.48;
  opacity:1;
  transform:translateY(0);
  transition:opacity .18s ease,transform .18s ease
}
.processing-phrase.is-changing{
  opacity:0;
  transform:translateY(4px)
}
.processing-note{
  display:block;
  margin-top:10px;
  color:#81939b;
  font-size:8.5px;
  line-height:1.35
}
@keyframes pda-boat-float{
  0%,100%{transform:translateY(0) rotate(-.4deg)}
  50%{transform:translateY(-5px) rotate(.6deg)}
}
@keyframes pda-fisher-lean{
  0%,100%{transform:rotate(-2deg)}
  44%{transform:rotate(5deg)}
  70%{transform:rotate(-1deg)}
}
@keyframes pda-net-cast{
  0%,12%{transform:rotate(-19deg) scale(.72);opacity:.46}
  36%{transform:rotate(5deg) scale(.92);opacity:.88}
  58%,72%{transform:rotate(17deg) scale(1.03);opacity:1}
  100%{transform:rotate(-19deg) scale(.72);opacity:.46}
}
@keyframes pda-water-sway{
  from{transform:translateX(-5px)}
  to{transform:translateX(6px)}
}
@keyframes pda-cloud-drift{
  from{transform:translateX(-7px)}
  to{transform:translateX(10px)}
}
@keyframes pda-ripple{
  0%,100%{opacity:.35;transform:scaleX(.92)}
  50%{opacity:.86;transform:scaleX(1.08)}
}
@keyframes pda-sun-pulse{
  0%,100%{opacity:.68}
  50%{opacity:.88}
}
@keyframes pda-progress-shine{
  to{transform:translateX(100%)}
}
@media(max-width:760px){
  .processing-overlay{
    padding:12px
  }
  .processing-panel{
    grid-template-columns:1fr;
    gap:13px;
    width:min(560px,calc(100vw - 20px));
    max-height:calc(100vh - 20px);
    overflow:auto;
    padding:14px;
    border-radius:18px
  }
  .processing-scene{
    min-height:210px
  }
  .processing-fisher-svg{
    min-height:210px;
    max-height:240px
  }
  .processing-copy{
    padding:5px 4px 6px
  }
  .processing-title{
    font-size:22px
  }
  .processing-phrase-box{
    min-height:92px;
    margin-top:14px
  }
}
@media(prefers-reduced-motion:reduce){
  .processing-sun,
  .processing-cloud-a,
  .processing-cloud-b,
  .processing-water-back,
  .processing-water-front,
  .processing-boat,
  .processing-fisher,
  .processing-cast,
  .processing-ripples path,
  .processing-progress-bar::after{
    animation:none!important
  }
  .processing-phrase{
    transition:none
  }
}

.hint{
  color:var(--muted);
  font-size:11.5px;
  font-weight:400
}
.warn{
  padding:8px 10px;
  border:1px solid #eadba0;
  border-radius:7px;
  color:#684f00;
  background:#fff7d9;
  white-space:pre-wrap;
  font-size:12px
}
.scroll{
  overflow:auto;
  border:1px solid #d7e2e7;
  border-radius:8px
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:12.5px;
  background:rgba(255,255,255,.94)
}
th,td{
  padding:8px 9px;
  border-bottom:1px solid #dce6ea;
  text-align:left;
  vertical-align:middle
}
th{
  position:sticky;
  top:0;
  z-index:1;
  color:#27485a;
  background:#eef5f7;
  font-size:11.5px;
  text-transform:uppercase;
  letter-spacing:.035em
}
tbody tr:hover{
  background:#f4f9fa
}
td button{
  margin:1px;
  padding:5px 8px;
  font-size:11.5px
}
a{
  color:#066b91;
  overflow-wrap:anywhere
}
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:8px;
  margin-bottom:12px
}
.stat{
  padding:12px;
  border:1px solid var(--line);
  border-radius:8px;
  color:var(--navy);
  background:rgba(255,255,255,.9)
}
.stat strong{
  display:block;
  margin-bottom:2px;
  font-size:22px
}
details{
  margin:6px 0;
  padding:7px 9px;
  border:1px solid var(--line);
  border-radius:8px;
  background:rgba(255,255,255,.91);
  box-shadow:0 2px 7px rgba(15,48,70,.035)
}
summary{
  cursor:pointer;
  font-size:12.5px;
  font-weight:650
}
details[open]>summary{
  margin-bottom:5px
}
pre{
  overflow-wrap:anywhere;
  white-space:pre-wrap;
  font-size:11.5px
}
.badge{
  display:inline-block;
  padding:3px 8px;
  border:1px solid #c5dfe2;
  border-radius:999px;
  color:#20525a;
  background:#eaf5f5;
  font-size:11px
}
.check{
  display:flex;
  gap:7px;
  align-items:flex-start;
  margin:7px 0
}
.check input{width:17px}
footer{
  width:min(1500px,calc(100% - 28px));
  margin:0 auto;
  padding:12px 0 18px;
  color:var(--muted);
  font-size:10.5px
}
@media(min-width:1200px){
  main{padding-top:14px}
  .grid{grid-template-columns:repeat(5,minmax(0,1fr))}
}
@media(max-width:800px){
  header{padding:11px 16px}
  nav{
    justify-content:flex-start;
    overflow:visible;
    flex-wrap:wrap
  }
  nav button{white-space:nowrap}
  .nav-submenu{
    min-width:180px
  }
  main,.status,footer{width:min(100% - 20px,1500px)}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:540px){
  .processing-panel{
    grid-template-columns:1fr;
    gap:10px;
    padding:18px;
    text-align:center
  }
  .processing-visual{
    width:74px;
    height:74px;
    margin:0 auto
  }
  .processing-percent{
    font-size:17px
  }
  .processing-message{
