<style>
:root{
  --navy:#0f3046;
  --navy-2:#17445d;
  --teal:#087987;
  --teal-dark:#05636f;
  --aqua:#dceff0;
  --water:#edf6f7;
  --sand:#f7f4ec;
  --bg:#eef4f6;
  --surface:rgba(255,255,255,.94);
  --surface-soft:rgba(255,255,255,.78);
  --line:#c8d8df;
  --line-strong:#a9c0ca;
  --muted:#5b707b;
  --danger:#a63a32;
  --success:#20705c;
  --shadow:0 8px 28px rgba(15,48,70,.08);
  --shadow-soft:0 3px 12px rgba(15,48,70,.06);
  --radius:10px
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  color:var(--navy);
  font:14px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 9% 14%,rgba(8,121,135,.07),transparent 20%),
    radial-gradient(circle at 88% 18%,rgba(15,48,70,.055),transparent 23%),
    linear-gradient(180deg,#f7fafb 0%,var(--bg) 52%,#edf4f5 100%);
}
body::before{
  content:"";
  position:fixed;
  inset:94px 0 0;
  pointer-events:none;
  z-index:-1;
  opacity:.48;
  background:
    radial-gradient(ellipse at 16% 92%,transparent 0 48%,rgba(8,121,135,.055) 49% 50%,transparent 51% 100%),
    radial-gradient(ellipse at 62% 96%,transparent 0 51%,rgba(15,48,70,.04) 52% 53%,transparent 54% 100%);
  background-size:520px 170px,680px 210px;
}
header{
  display:flex;
  gap:14px;
  align-items:center;
  min-height:82px;
  padding:11px max(24px,calc((100vw - 1480px)/2));
  color:#fff;
  background:
    radial-gradient(circle at 18% -80%,rgba(125,212,218,.28),transparent 42%),
    linear-gradient(118deg,var(--navy) 0%,#10374e 55%,#0b5361 100%);
  box-shadow:0 4px 16px rgba(15,48,70,.16);
}
header img{
  width:54px;
  height:54px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.7);
  box-shadow:0 2px 10px rgba(0,0,0,.14)
}
header h1{
  margin:0 0 1px;
  font-size:22px;
  line-height:1.15;
  letter-spacing:-.02em
}
header p{
  margin:1px 0;
  font-size:11px;
  opacity:.88
}
nav{
  position:sticky;
  top:0;
  z-index:40;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:4px;
  padding:7px 18px;
  border-bottom:1px solid rgba(169,192,202,.75);
  background:rgba(255,255,255,.93);
  backdrop-filter:blur(12px);
  box-shadow:0 3px 12px rgba(15,48,70,.045)
}
button,.button{
  border:1px solid transparent;
  border-radius:8px;
  padding:8px 13px;
  color:#fff;
  background:linear-gradient(180deg,#0a8492,var(--teal-dark));
  box-shadow:0 2px 7px rgba(8,121,135,.16);
  font:600 13px/1.2 inherit;
  cursor:pointer;
  transition:transform .14s ease,box-shadow .14s ease,background .14s ease,border-color .14s ease
}
button:hover,.button:hover{
  transform:translateY(-1px);
  box-shadow:0 5px 13px rgba(8,121,135,.22)
}
button.secondary{
  color:var(--navy);
  background:#edf4f6;
  border-color:var(--line);
  box-shadow:none
}
button.danger{
  color:#fff;
  background:linear-gradient(180deg,#b64a42,#96342d)
}
button:disabled{
  opacity:.48;
  cursor:not-allowed;
  transform:none;
  box-shadow:none
}
button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
summary:focus-visible{
  outline:3px solid #ddb13d;
  outline-offset:2px
}
nav button{
  min-width:auto;
  padding:7px 12px;
  color:var(--navy);
  background:transparent;
  border-color:transparent;
  border-radius:7px;
  box-shadow:none;
  font-size:12.5px
}
nav button:hover{
  color:var(--teal-dark);
  background:#e9f3f4;
  box-shadow:none;
  transform:none
}
nav button[aria-current=page]{
  color:#fff;
  background:linear-gradient(180deg,#0b7b88,#075f6b);
  box-shadow:0 2px 8px rgba(8,121,135,.18)
}
main{
  width:min(1500px,calc(100% - 28px));
  margin:0 auto;
  padding:16px 0 24px
}
h2{
  margin:0 0 8px;
  font-size:21px;
  letter-spacing:-.02em
}
h3{
  margin:10px 0 8px;
  font-size:15px
}
p{
  margin:6px 0 10px
}
.card{
  margin-bottom:11px;
  padding:14px 16px;
  border:1px solid rgba(185,205,213,.92);
  border-radius:var(--radius);
  background:var(--surface);
  box-shadow:var(--shadow-soft)
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:9px 10px
}
.field{
  display:flex;
  flex-direction:column;
  gap:3px;
  min-width:0;
  font-size:12px;
  font-weight:520
}
.field small{
  font-weight:400
}
input,select,textarea{
  width:100%;
  min-height:35px;
  border:1px solid var(--line-strong);
  border-radius:7px;
  padding:7px 9px;
  color:var(--navy);
  background:rgba(255,255,255,.98);
  font:400 13px/1.25 inherit;
  transition:border-color .14s ease,box-shadow .14s ease,background .14s ease
}
input:hover,select:hover,textarea:hover{
  border-color:#84a9b5
}
input:focus,select:focus,textarea:focus{
  border-color:var(--teal);
  box-shadow:0 0 0 3px rgba(8,121,135,.09);
  background:#fff
}
textarea{
  min-height:68px;
  resize:vertical
}
input[type=checkbox]{
  width:17px;
  min-height:17px;
  height:17px;
  align-self:flex-start;
  accent-color:var(--teal)
}
input[type=file]{
  min-height:35px;
  padding:5px 7px;
  font-size:12px
}
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin:11px 0 4px
}
.status{
  width:min(1500px,calc(100% - 28px));
  margin:8px auto 0;
  padding:9px 12px;
  border-radius:8px;
  white-space:pre-wrap;
  font-size:12.5px
}
.status:empty{display:none}
.status.error{
  color:#7d2820;
  background:#fff0ed;
  border:1px solid #efc3bd
}
.status.ok{
  color:#174f42;
  background:#e3f4ef;
  border:1px solid #b6ded2
}
.hint{
  color:var(--muted);
  font-size:11.5px;
  font-weight:400
}
.warn{
  padding:8px 10px;
  border:1px solid #eadba0;
  border-radius:7px;
  color:#684f00;
  background:#fff7d9;
  white-space:pre-wrap;
  font-size:12px
}
.scroll{
  overflow:auto;
  border:1px solid #d7e2e7;
  border-radius:8px
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:12.5px;
  background:rgba(255,255,255,.94)
}
th,td{
  padding:8px 9px;
  border-bottom:1px solid #dce6ea;
  text-align:left;
  vertical-align:middle
}
th{
  position:sticky;
  top:0;
  z-index:1;
  color:#27485a;
  background:#eef5f7;
  font-size:11.5px;
  text-transform:uppercase;
  letter-spacing:.035em
}
tbody tr:hover{
  background:#f4f9fa
}
td button{
  margin:1px;
  padding:5px 8px;
  font-size:11.5px
}
a{
  color:#066b91;
  overflow-wrap:anywhere
}
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:8px;
  margin-bottom:12px
}
.stat{
  padding:12px;
  border:1px solid var(--line);
  border-radius:8px;
  color:var(--navy);
  background:rgba(255,255,255,.9)
}
.stat strong{
  display:block;
  margin-bottom:2px;
  font-size:22px
}
details{
  margin:8px 0;
  padding:9px 10px;
  border:1px solid var(--line);
  border-radius:8px;
  background:rgba(255,255,255,.91);
  box-shadow:0 2px 7px rgba(15,48,70,.035)
}
summary{
  cursor:pointer;
  font-size:12.5px;
  font-weight:650
}
details[open]>summary{
  margin-bottom:8px
}
pre{
  overflow-wrap:anywhere;
  white-space:pre-wrap;
  font-size:11.5px
}
.badge{
  display:inline-block;
  padding:3px 8px;
  border:1px solid #c5dfe2;
  border-radius:999px;
  color:#20525a;
  background:#eaf5f5;
  font-size:11px
}
.check{
  display:flex;
  gap:7px;
  align-items:flex-start;
  margin:7px 0
}
.check input{width:17px}
footer{
  width:min(1500px,calc(100% - 28px));
  margin:0 auto;
  padding:12px 0 18px;
  color:var(--muted);
  font-size:10.5px
}
@media(min-width:1200px){
  main{padding-top:14px}
  .grid{grid-template-columns:repeat(5,minmax(0,1fr))}
}
@media(max-width:800px){
  header{padding:11px 16px}
  nav{justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}
  nav button{white-space:nowrap}
  main,.status,footer{width:min(100% - 20px,1500px)}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:540px){
  .grid{grid-template-columns:1fr}
  .card{padding:12px}
  header img{width:46px;height:46px}
  header h1{font-size:19px}
  table{min-width:620px}
}
</style>
