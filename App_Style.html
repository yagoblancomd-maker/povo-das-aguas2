<style>
:root{--navy:#102e43;--teal:#096674;--bg:#f2f6f8;--line:#ccdae1;--muted:#536875}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font:16px/1.5 system-ui,sans-serif}header{display:flex;gap:16px;align-items:center;background:var(--navy);color:#fff;padding:20px 5vw}header img{width:68px;height:68px;border-radius:50%}header h1{font-size:25px;margin:0}header p{margin:0;font-size:13px}nav{display:flex;flex-wrap:wrap;gap:6px;padding:12px 5vw;background:white;border-bottom:1px solid var(--line)}button,.button{border:0;border-radius:7px;background:var(--teal);color:white;padding:10px 15px;font:inherit;cursor:pointer}button.secondary{color:var(--navy);background:#e7eff3}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #d59512;outline-offset:2px}nav button{background:transparent;color:var(--navy);font-size:14px}nav button[aria-current=page]{background:var(--teal);color:white}main{max-width:1300px;margin:auto;padding:24px}h2{margin:0 0 12px}h3{margin:18px 0 10px}p{margin:8px 0 16px}.card{background:white;padding:22px;border:1px solid var(--line);border-radius:12px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:5px;font-size:14px}input,select,textarea{width:100%;border:1px solid #a9bec9;border-radius:6px;padding:10px;color:var(--navy);background:white;font:inherit}textarea{min-height:90px}input[type=checkbox]{width:auto;align-self:start}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}.status{margin:12px 5vw;padding:12px;border-radius:7px;white-space:pre-wrap}.status:empty{display:none}.status.error{background:#ffe8e4;color:#8f251b}.status.ok{background:#daf1eb;color:#145542}.hint{color:var(--muted);font-size:14px}.warn{background:#fff3cd;color:#654800;padding:12px;border-radius:7px;white-space:pre-wrap}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#edf3f6}td button{font-size:13px;padding:6px 10px;margin:2px}a{color:#075e8c;overflow-wrap:anywhere}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}.stat{background:white;color:var(--navy);border:1px solid var(--line);text-align:left;padding:18px}.stat strong{display:block;font-size:30px}details{background:white;border:1px solid var(--line);border-radius:8px;padding:15px;margin:12px 0}summary{cursor:pointer;font-weight:600}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.badge{display:inline-block;background:#e8f2f3;border-radius:12px;padding:3px 10px;font-size:12px}.check{display:flex;gap:8px;align-items:start;margin:10px 0}.check input{width:20px}footer{max-width:1300px;margin:0 auto;padding:20px;color:var(--muted);font-size:12px}@media(max-width:600px){main{padding:14px}.card{padding:15px}header{padding:16px}header h1{font-size:21px}nav{padding:8px}.grid{grid-template-columns:1fr}table{min-width:550px}}
</style>
