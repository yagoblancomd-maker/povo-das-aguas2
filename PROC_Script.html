<script>
window.PDA_MODULES.PROC = (()=>{
  const {
    el,button,call,go,alive
  }=App;

  function cpf_(value){
    const d=String(value||'').replace(/\D/g,'');
    return d.length===11
      ?d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4')
      :String(value||'');
  }

  function date_(value){
    const d=new Date(value);
    if(Number.isNaN(d.getTime()))return '—';
    return d.toLocaleString('pt-BR',{
      day:'2-digit',
      month:'2-digit',
      year:'numeric',
      hour:'2-digit',
      minute:'2-digit'
    });
  }

  function text_(value){
    return String(value||'').trim()||'—';
  }

  function processItem_(row,active,onOpen){
    const item=el('button',undefined,'proc-case-item'+(active?' active':''));
    item.type='button';

    const icon=el('span',undefined,'proc-case-icon');
    icon.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10l4 4v12H5z"></path><path d="M15 4v5h4"></path><path d="M8 13h8"></path><path d="M8 16h6"></path></svg>';

    const copy=el('span',undefined,'proc-case-copy');
    copy.append(
      el('strong',text_(row.numero)),
      el('span',text_(row.pessoa)),
      el('small',text_(row.jurisdicao))
    );

    const meta=el('span',undefined,'proc-case-meta');
    meta.append(
      el('span',date_(row.distribuidoEm)),
      el('span','›','proc-case-arrow')
    );

    item.append(icon,copy,meta);
    item.onclick=()=>onOpen(row);
    return item;
  }

  function detail_(root,row){
    root.replaceChildren();

    const head=el('div',undefined,'proc-detail-head');
    const title=el('div');
    title.append(
      el('span','PROCESSO','proc-detail-kicker'),
      el('h3',text_(row.numero)),
      el('p',text_(row.pessoa),'hint')
    );

    const actions=el('div',undefined,'proc-detail-actions');

    const preview=button(
      'Visualizar cadastro',
      ()=>App.openPersonDrawer(row.pessoaId)
    );

    const open=button(
      'Abrir ficha completa',
      ()=>{
        App.state.selection=row.pessoaId;
        return go('ACOMP',row.pessoaId);
      },
      true
    );

    actions.append(preview,open);
    head.append(title,actions);
    root.append(head);

    const facts=el('div',undefined,'proc-facts');
    [
      ['Pessoa',row.pessoa],
      ['CPF',cpf_(row.cpf)],
      ['Jurisdição',row.jurisdicao],
      ['Distribuído em',date_(row.distribuidoEm)],
      ['Responsável',row.responsavel]
    ].forEach(([label,value])=>{
      const box=el('div',undefined,'proc-fact');
      box.append(el('span',label),el('strong',text_(value)));
      facts.append(box);
    });
    root.append(facts);

    const note=el('section',undefined,'proc-detail-note');
    note.append(
      el('h4','Registro processual'),
      el(
        'p',
        'Os dados exibidos nesta tela são os registros existentes no sistema. Abra a ficha da pessoa para consultar documentos, atendimentos e demais informações vinculadas.',
        'hint'
      )
    );
    root.append(note);
  }

  return async function(ctx){
    const root=ctx.root;

    const toolbar=el('div',undefined,'proc-toolbar');
    const search=el('input');
    search.type='search';
    search.placeholder='Buscar por número, pessoa, CPF ou jurisdição';
    search.autocomplete='off';

    const count=el(
      'span',
      '',
      'proc-count'
    );

    toolbar.append(search,count);
    root.append(toolbar);

    const layout=el('div',undefined,'proc-layout');
    const list=el('section',undefined,'proc-list');
    const detail=el('section',undefined,'proc-detail');

    const more=
      button(
        'Carregar mais processos',
        ()=>load_(rows.length,true),
        true
      );

    more.classList.add('proc-more');

    layout.append(list,detail);
    root.append(layout,more);

    let rows=[];
    let total=0;
    let hasMore=false;
    let selected=null;
    let requestSeq=0;
    let searchTimer=null;

    const render=()=>{
      count.textContent=
        rows.length+
        ' de '+
        total+
        ' processo'+
        (total===1?'':'s');

      list.replaceChildren();

      if(!rows.length){
        list.append(
          el(
            'p',
            'Nenhum processo encontrado.',
            'proc-empty'
          )
        );

        detail.replaceChildren(
          el(
            'p',
            'Ajuste a busca para localizar um processo.',
            'hint'
          )
        );

        more.hidden=true;
        return;
      }

      if(
        !selected||
        !rows.some(row=>
          row.id===selected.id
        )
      ){
        selected=rows[0];
      }

      rows.forEach(row=>{
        list.append(
          processItem_(
            row,
            selected&&
            row.id===selected.id,
            chosen=>{
              selected=chosen;
              render();
            }
          )
        );
      });

      detail_(detail,selected);
      more.hidden=!hasMore;
      more.disabled=false;
      more.textContent='Carregar mais processos';
    };

    const load_=async(offset,append=false)=>{
      const request=++requestSeq;
      const term=String(search.value||'').trim();

      if(!term){
        rows=[];
        total=0;
        hasMore=false;
        selected=null;
        count.textContent='';
        list.replaceChildren(
          el(
            'p',
            'Digite número do processo, nome, CPF ou jurisdição para pesquisar.',
            'proc-empty'
          )
        );
        detail.replaceChildren(
          el(
            'p',
            'Os processos somente serão carregados após informar um filtro.',
            'hint'
          )
        );
        more.hidden=true;
        return;
      }

      if(!append){
        rows=[];
        selected=null;
        list.replaceChildren(
          el(
            'p',
            'Carregando processos…',
            'hint'
          )
        );
      }else{
        more.disabled=true;
        more.textContent='Carregando…';
      }

      const data=
        await call(
          'processos',
          {
            busca:term,
            offset,
            limit:50
          },
          false,
          {noLoader:true}
        );

      if(
        request!==requestSeq||
        !alive(ctx)
      ){
        return;
      }

      if(append){
        rows.push(
          ...(data.processos||[])
        );
      }else{
        rows=[
          ...(data.processos||[])
        ];
      }

      total=Number(data.total||0);
      hasMore=!!data.hasMore;
      render();
    };

    search.addEventListener(
      'input',
      ()=>{
        if(searchTimer){
          clearTimeout(searchTimer);
        }

        searchTimer=
          setTimeout(
            ()=>load_(0,false)
              .catch(()=>{}),
            260
          );
      }
    );

    await load_(0,false);
  };
})();
</script>
