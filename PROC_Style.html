<style>
#proc-root{
  min-height:420px
}
.proc-toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:0 0 10px;
  padding:10px 12px;
  border:1px solid #ddd9d0;
  border-radius:12px;
  background:rgba(255,253,249,.96);
  box-shadow:0 5px 16px rgba(17,49,60,.04)
}
.proc-toolbar input{
  width:min(620px,100%);
  min-height:38px!important
}
.proc-count{
  flex:0 0 auto;
  color:#60726f;
  font-size:9px;
  font-weight:750
}
.proc-layout{
  display:grid;
  grid-template-columns:minmax(300px,.75fr) minmax(0,1.25fr);
  gap:12px
}
.proc-list,
.proc-detail{
  min-width:0;
  overflow:hidden;
  border:1px solid #ddd9d0;
  border-radius:14px;
  background:rgba(255,253,249,.97);
  box-shadow:0 7px 20px rgba(17,49,60,.05)
}
.proc-list{
  display:grid;
  align-content:start
}
.proc-case-item{
  display:grid!important;
  grid-template-columns:38px minmax(0,1fr) auto!important;
  align-items:center!important;
  gap:10px!important;
  width:100%!important;
  min-height:76px!important;
  padding:11px 13px!important;
  border:0!important;
  border-bottom:1px solid #e9e4db!important;
  border-radius:0!important;
  color:#27444f!important;
  text-align:left!important;
  background:transparent!important;
  box-shadow:none!important
}
.proc-case-item:last-child{border-bottom:0!important}
.proc-case-item:hover,
.proc-case-item.active{
  transform:none!important;
  background:#edf5f3!important
}
.proc-case-item.active{
  box-shadow:inset 3px 0 0 var(--pda-sea)!important
}
.proc-case-icon{
  display:grid;
  place-items:center;
  width:36px;
  height:36px;
  border-radius:10px;
  color:var(--pda-sea);
  background:#e5f0ee
}
.proc-case-icon svg{
  width:19px;
  height:19px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round
}
.proc-case-copy{
  display:grid;
  min-width:0;
  gap:2px
}
.proc-case-copy strong{
  overflow:hidden;
  color:#173f51;
  font-size:10px;
  font-weight:800;
  text-overflow:ellipsis;
  white-space:nowrap
}
.proc-case-copy span{
  overflow:hidden;
  color:#3f5c66;
  font-size:9px;
  text-overflow:ellipsis;
  white-space:nowrap
}
.proc-case-copy small{
  overflow:hidden;
  color:#7b8883;
  font-size:8px;
  text-overflow:ellipsis;
  white-space:nowrap
}
.proc-case-meta{
  display:grid;
  justify-items:end;
  gap:3px;
  color:#7a8883;
  font-size:7.6px
}
.proc-case-arrow{
  color:var(--pda-sea);
  font-size:18px
}
.proc-detail{
  padding:18px
}
.proc-detail-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:14px;
  padding-bottom:14px;
  border-bottom:1px solid #e4dfd6
}
.proc-detail-kicker{
  display:block;
  margin-bottom:3px;
  color:var(--pda-sea);
  font-size:7.5px;
  font-weight:850;
  letter-spacing:.14em
}
.proc-detail h3{
  margin:0!important;
  color:var(--pda-ink)!important;
  font-family:var(--pda-display)!important;
  font-size:24px!important;
  font-weight:650!important;
  letter-spacing:-.02em
}
.proc-detail-head p{
  margin:4px 0 0!important
}
.proc-facts{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:0;
  margin:14px 0 0;
  border-top:1px solid #e4dfd6;
  border-left:1px solid #e4dfd6
}
.proc-fact{
  min-width:0;
  padding:11px 12px;
  border-right:1px solid #e4dfd6;
  border-bottom:1px solid #e4dfd6
}
.proc-fact span{
  display:block;
  color:#7a8883;
  font-size:8px
}
.proc-fact strong{
  display:block;
  margin-top:2px;
  overflow-wrap:anywhere;
  color:#314f5a;
  font-size:10px
}
.proc-detail-note{
  margin-top:15px;
  padding:15px;
  border-radius:11px;
  background:
    linear-gradient(90deg,rgba(232,242,239,.92),rgba(248,246,240,.92));
  border:1px solid #d9e3df
}
.proc-detail-note h4{
  margin:0 0 4px;
  color:#274650;
  font-family:var(--pda-display);
  font-size:15px
}
.proc-detail-note p{
  margin:0!important
}
.proc-empty{
  margin:0;
  padding:24px;
  color:#778580;
  font-size:9px;
  text-align:center
}
@media(max-width:900px){
  .proc-layout{
    grid-template-columns:1fr
  }
  .proc-list{
    max-height:340px;
    overflow:auto
  }
}
@media(max-width:620px){
  .proc-toolbar,
  .proc-detail-head{
    align-items:stretch;
    flex-direction:column
  }
  .proc-facts{
    grid-template-columns:1fr
  }
}

.proc-detail-actions{
  display:flex;
  flex-wrap:wrap;
  justify-content:flex-end;
  gap:6px
}
.proc-detail-actions button{
  min-height:32px!important;
  padding:6px 9px!important;
  font-size:7.8px!important
}
@media(max-width:620px){
  .proc-detail-actions{
    justify-content:flex-start
  }
}


.proc-datajud-mini{
  display:inline-flex;
  align-items:center;
  min-height:17px;
  padding:2px 6px;
  border-radius:999px;
  font-size:6.8px;
  font-weight:850;
  letter-spacing:.02em;
  color:#52645f;
  background:#eef0ec
}
.proc-datajud-mini.status-atualizado{
  color:#17684f;
  background:#e4f3ec
}
.proc-datajud-mini.status-falha,
.proc-datajud-mini.status-nao_localizado{
  color:#8a4938;
  background:#f9e9e2
}
.proc-datajud-sync{
  color:#fff!important;
  background:#0d7885!important;
  border-color:#0d7885!important
}
.proc-datajud-sync:hover{
  background:#086773!important
}
.proc-datajud-status{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-top:14px;
  padding:13px 14px;
  border:1px solid #d8e3df;
  border-radius:11px;
  background:#f2f7f5
}
.proc-datajud-status h4,
.proc-datajud-section h4{
  margin:1px 0 3px!important;
  color:#244a55!important;
  font-family:var(--pda-display)!important;
  font-size:16px!important
}
.proc-datajud-status.status-atualizado{
  border-color:#bfddd1;
  background:#edf7f2
}
.proc-datajud-status.status-falha,
.proc-datajud-status.status-nao_localizado{
  border-color:#ebcabc;
  background:#fff3ee
}
.proc-datajud-error{
  margin:6px 0 0!important;
  color:#914b38;
  font-size:8px;
  font-weight:700
}
.proc-datajud-facts{
  margin-top:10px
}
.proc-datajud-section{
  margin-top:16px;
  overflow:hidden;
  border:1px solid #ddd9d0;
  border-radius:12px;
  background:#fffdf9
}
.proc-section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:12px 14px;
  border-bottom:1px solid #e7e2d9;
  background:#f8f6f1
}
.proc-section-title{
  min-width:0
}
.proc-timeline{
  display:grid;
  max-height:430px;
  overflow:auto
}
.proc-movement{
  position:relative;
  display:grid;
  grid-template-columns:18px minmax(0,1fr) auto;
  gap:9px;
  align-items:start;
  padding:11px 13px;
  border-bottom:1px solid #ece7de
}
.proc-movement:last-child{
  border-bottom:0
}
.proc-movement-marker{
  position:relative;
  width:9px;
  height:9px;
  margin-top:3px;
  border:2px solid #7d9894;
  border-radius:50%;
  background:#fff
}
.proc-movement:not(:last-child) .proc-movement-marker::after{
  content:"";
  position:absolute;
  top:9px;
  left:2px;
  width:1px;
  height:42px;
  background:#d8e0dc
}
.proc-movement.latest .proc-movement-marker{
  border-color:#0d7885;
  background:#0d7885
}
.proc-movement-copy{
  display:grid;
  gap:2px;
  min-width:0
}
.proc-movement-copy strong{
  color:#2d4c56;
  font-size:9.3px;
  line-height:1.3
}
.proc-movement time{
  color:#74837e;
  font-size:7.2px;
  white-space:nowrap
}
@media(max-width:620px){
  .proc-movement{
    grid-template-columns:14px minmax(0,1fr)
  }
  .proc-movement time{
    grid-column:2;
  }
}


.proc-structured-filters{
  display:grid;
  grid-template-columns:
    repeat(3,minmax(150px,1fr))
    repeat(2,minmax(130px,.8fr));
  gap:8px;
  margin:-2px 0 12px;
  padding:10px 12px;
  border:1px solid #ddd9d0;
  border-radius:12px;
  background:rgba(255,253,249,.96)
}
.proc-structured-filters select,
.proc-structured-filters input{
  width:100%;
  min-height:34px!important;
  font-size:8.4px!important
}
.proc-clear-filters{
  justify-self:start
}
.proc-case-tags,
.proc-tags-chips{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  margin-top:4px
}
.proc-process-tag{
  display:inline-flex;
  align-items:center;
  min-height:18px;
  padding:2px 7px;
  border:1px solid #d4ddd9;
  border-radius:999px;
  background:#f2f6f4;
  color:#38574f;
  font-size:6.8px;
  font-weight:850;
  line-height:1.1;
  letter-spacing:.015em
}
.proc-process-tag.current{
  border-color:#0d7885;
  background:#e5f3f4;
  color:#075c66
}
.proc-process-tag.tag-baixa-definitiva,
.proc-process-tag.tag-transito-em-julgado{
  border-color:#bbd5c6;
  background:#e9f5ee;
  color:#235d43
}
.proc-process-tag.tag-sentenca-julgamento,
.proc-process-tag.tag-procedencia,
.proc-process-tag.tag-procedencia-parcial{
  border-color:#c8d5e1;
  background:#edf3f8;
  color:#315873
}
.proc-process-tag.tag-improcedencia{
  border-color:#e3c8be;
  background:#f9ece7;
  color:#854934
}
.proc-process-tag.tag-tutela,
.proc-process-tag.tag-decisao{
  border-color:#dccfa8;
  background:#f8f3df;
  color:#765d17
}
.proc-process-tag.tag-recurso{
  border-color:#d2c5e3;
  background:#f2edf8;
  color:#654a82
}
.proc-process-tag.tag-rpv-pagamento{
  border-color:#b9d8d2;
  background:#e7f5f2;
  color:#22645a
}
.proc-tags-summary{
  margin-top:10px;
  padding:10px 12px;
  border:1px solid #e0ddd5;
  border-radius:10px;
  background:#fbfaf6
}
@media(max-width:1050px){
  .proc-structured-filters{
    grid-template-columns:repeat(3,minmax(140px,1fr))
  }
}
@media(max-width:720px){
  .proc-structured-filters{
    grid-template-columns:1fr 1fr
  }
}
@media(max-width:480px){
  .proc-structured-filters{
    grid-template-columns:1fr
  }
}
</style>
