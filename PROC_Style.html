<style>
#proc-root{
  min-height:420px
}
.proc-toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:0 0 10px;
  padding:10px 12px;
  border:1px solid #ddd9d0;
  border-radius:12px;
  background:rgba(255,253,249,.96);
  box-shadow:0 5px 16px rgba(17,49,60,.04)
}
.proc-toolbar input{
  width:min(620px,100%);
  min-height:38px!important
}
.proc-count{
  flex:0 0 auto;
  color:#60726f;
  font-size:9px;
  font-weight:750
}
.proc-layout{
  display:grid;
  grid-template-columns:minmax(300px,.75fr) minmax(0,1.25fr);
  gap:12px
}
.proc-list,
.proc-detail{
  min-width:0;
  overflow:hidden;
  border:1px solid #ddd9d0;
  border-radius:14px;
  background:rgba(255,253,249,.97);
  box-shadow:0 7px 20px rgba(17,49,60,.05)
}
.proc-list{
  display:grid;
  align-content:start
}
.proc-case-item{
  display:grid!important;
  grid-template-columns:38px minmax(0,1fr) auto!important;
  align-items:center!important;
  gap:10px!important;
  width:100%!important;
  min-height:76px!important;
  padding:11px 13px!important;
  border:0!important;
  border-bottom:1px solid #e9e4db!important;
  border-radius:0!important;
  color:#27444f!important;
  text-align:left!important;
  background:transparent!important;
  box-shadow:none!important
}
.proc-case-item:last-child{border-bottom:0!important}
.proc-case-item:hover,
.proc-case-item.active{
  transform:none!important;
  background:#edf5f3!important
}
.proc-case-item.active{
  box-shadow:inset 3px 0 0 var(--pda-sea)!important
}
.proc-case-icon{
  display:grid;
  place-items:center;
  width:36px;
  height:36px;
  border-radius:10px;
  color:var(--pda-sea);
  background:#e5f0ee
}
.proc-case-icon svg{
  width:19px;
  height:19px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round
}
.proc-case-copy{
  display:grid;
  min-width:0;
  gap:2px
}
.proc-case-copy strong{
  overflow:hidden;
  color:#173f51;
  font-size:10px;
  font-weight:800;
  text-overflow:ellipsis;
  white-space:nowrap
}
.proc-case-copy span{
  overflow:hidden;
  color:#3f5c66;
  font-size:9px;
  text-overflow:ellipsis;
  white-space:nowrap
}
.proc-case-copy small{
  overflow:hidden;
  color:#7b8883;
  font-size:8px;
  text-overflow:ellipsis;
  white-space:nowrap
}
.proc-case-meta{
  display:grid;
  justify-items:end;
  gap:3px;
  color:#7a8883;
  font-size:7.6px
}
.proc-case-arrow{
  color:var(--pda-sea);
  font-size:18px
}
.proc-detail{
  padding:18px
}
.proc-detail-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:14px;
  padding-bottom:14px;
  border-bottom:1px solid #e4dfd6
}
.proc-detail-kicker{
  display:block;
  margin-bottom:3px;
  color:var(--pda-sea);
  font-size:7.5px;
  font-weight:850;
  letter-spacing:.14em
}
.proc-detail h3{
  margin:0!important;
  color:var(--pda-ink)!important;
  font-family:var(--pda-display)!important;
  font-size:24px!important;
  font-weight:650!important;
  letter-spacing:-.02em
}
.proc-detail-head p{
  margin:4px 0 0!important
}
.proc-facts{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:0;
  margin:14px 0 0;
  border-top:1px solid #e4dfd6;
  border-left:1px solid #e4dfd6
}
.proc-fact{
  min-width:0;
  padding:11px 12px;
  border-right:1px solid #e4dfd6;
  border-bottom:1px solid #e4dfd6
}
.proc-fact span{
  display:block;
  color:#7a8883;
  font-size:8px
}
.proc-fact strong{
  display:block;
  margin-top:2px;
  overflow-wrap:anywhere;
  color:#314f5a;
  font-size:10px
}
.proc-detail-note{
  margin-top:15px;
  padding:15px;
  border-radius:11px;
  background:
    linear-gradient(90deg,rgba(232,242,239,.92),rgba(248,246,240,.92));
  border:1px solid #d9e3df
}
.proc-detail-note h4{
  margin:0 0 4px;
  color:#274650;
  font-family:var(--pda-display);
  font-size:15px
}
.proc-detail-note p{
  margin:0!important
}
.proc-empty{
  margin:0;
  padding:24px;
  color:#778580;
  font-size:9px;
  text-align:center
}
@media(max-width:900px){
  .proc-layout{
    grid-template-columns:1fr
  }
  .proc-list{
    max-height:340px;
    overflow:auto
  }
}
@media(max-width:620px){
  .proc-toolbar,
  .proc-detail-head{
    align-items:stretch;
    flex-direction:column
  }
  .proc-facts{
    grid-template-columns:1fr
  }
}

.proc-detail-actions{
  display:flex;
  flex-wrap:wrap;
  justify-content:flex-end;
  gap:6px
}
.proc-detail-actions button{
  min-height:32px!important;
  padding:6px 9px!important;
  font-size:7.8px!important
}
@media(max-width:620px){
  .proc-detail-actions{
    justify-content:flex-start
  }
}
</style>
