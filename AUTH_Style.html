<style>
.pda-auth-overlay{
  position:fixed;
  inset:0;
  z-index:99999;
  overflow:auto;
  color:#f7ffff;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 13% 12%,rgba(30,205,203,.18),transparent 23%),
    radial-gradient(circle at 84% 8%,rgba(111,88,255,.14),transparent 21%),
    radial-gradient(circle at 75% 83%,rgba(233,160,84,.08),transparent 23%),
    linear-gradient(128deg,#03111b 0%,#072736 39%,#075568 72%,#071827 100%);
  isolation:isolate
}
.pda-auth-overlay[hidden]{display:none!important}
.pda-auth-overlay::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  opacity:.55;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.013) 0 1px,transparent 1px 110px),
    repeating-linear-gradient(0deg,rgba(255,255,255,.008) 0 1px,transparent 1px 90px)
}
.pda-auth-atmosphere{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
  pointer-events:none
}
.pda-auth-aurora{
  position:absolute;
  border-radius:50%;
  filter:blur(55px);
  mix-blend-mode:screen;
  opacity:.48
}
.pda-auth-aurora-a{
  width:620px;
  height:330px;
  left:-170px;
  top:-155px;
  background:radial-gradient(circle,rgba(39,226,218,.34),rgba(17,111,140,.10) 50%,transparent 73%);
  animation:pdaAuthAuroraA 12s ease-in-out infinite alternate
}
.pda-auth-aurora-b{
  width:520px;
  height:300px;
  right:-70px;
  top:-90px;
  background:radial-gradient(circle,rgba(122,94,255,.24),rgba(32,157,174,.10) 52%,transparent 74%);
  animation:pdaAuthAuroraB 15s ease-in-out infinite alternate
}
.pda-auth-aurora-c{
  width:600px;
  height:290px;
  right:18%;
  bottom:-210px;
  background:radial-gradient(circle,rgba(255,184,91,.13),rgba(17,175,180,.10) 50%,transparent 73%);
  animation:pdaAuthAuroraC 18s ease-in-out infinite alternate
}
.pda-auth-light-beam{
  position:absolute;
  width:680px;
  height:250px;
  left:20%;
  top:-135px;
  transform:rotate(-12deg);
  background:linear-gradient(90deg,transparent,rgba(183,253,250,.18),transparent);
  filter:blur(20px);
  opacity:0;
  animation:pdaAuthBeam 10s ease-in-out infinite
}
.pda-auth-dots{
  position:absolute;
  width:620px;
  height:360px;
  right:-90px;
  top:28px;
  opacity:.32;
  background-image:
    radial-gradient(circle,rgba(98,238,230,.70) 1px,transparent 1.5px),
    radial-gradient(circle,rgba(151,117,255,.46) 1px,transparent 1.5px);
  background-position:0 0,12px 12px;
  background-size:24px 24px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 36%,#000);
  mask-image:linear-gradient(90deg,transparent,#000 36%,#000);
  animation:pdaAuthDots 20s linear infinite
}
.pda-auth-net-bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:.085
}
.pda-auth-net-bg path{
  fill:none;
  stroke:#b6f3f0;
  stroke-width:1.2
}
.pda-auth-bottom-waves{
  position:absolute;
  right:-3%;
  bottom:-8px;
  left:-3%;
  width:106%;
  height:150px;
  opacity:.60
}
.pda-auth-bottom-waves path{
  fill:none;
  stroke-linecap:round
}
.pda-auth-bottom-waves .wave-a{
  stroke:rgba(74,223,220,.19);
  stroke-width:1.3;
  animation:pdaAuthWaveA 12s ease-in-out infinite alternate
}
.pda-auth-bottom-waves .wave-b{
  stroke:rgba(166,136,255,.12);
  stroke-width:1;
  animation:pdaAuthWaveB 16s ease-in-out infinite alternate-reverse
}
.pda-auth-bubbles,
.pda-auth-faces{
  position:absolute;
  inset:0
}
.pda-auth-bubble{
  position:absolute;
  bottom:-80px;
  display:block;
  border:1px solid rgba(210,250,248,.18);
  border-radius:50%;
  background:
    radial-gradient(circle at 32% 26%,rgba(255,255,255,.30),rgba(255,255,255,.055) 32%,rgba(95,221,220,.025) 62%,transparent 72%);
  box-shadow:
    inset 0 0 14px rgba(255,255,255,.035),
    0 0 18px rgba(75,221,219,.04);
  animation:pdaAuthBubbleUp linear infinite
}
.pda-auth-face{
  position:absolute;
  overflow:hidden;
  border:1px solid rgba(191,244,242,.13);
  border-radius:50%;
  background:rgba(255,255,255,.035);
  opacity:.16;
  filter:saturate(.72) grayscale(.22);
  box-shadow:
    0 0 0 7px rgba(118,224,222,.015),
    0 0 36px rgba(68,221,219,.055);
  animation:pdaAuthFaceFloat ease-in-out infinite alternate
}
.pda-auth-face::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:
    linear-gradient(145deg,rgba(255,255,255,.14),transparent 42%),
    radial-gradient(circle at 50% 100%,rgba(13,106,125,.22),transparent 62%)
}
.pda-auth-face img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover
}
.pda-auth-fisher-scene{
  position:absolute;
  right:3%;
  bottom:20px;
  width:min(37vw,530px);
  height:auto;
  opacity:.30;
  filter:drop-shadow(0 20px 35px rgba(0,0,0,.16))
}
.pda-auth-fisher-hull{fill:rgba(3,26,38,.62)}
.pda-auth-fisher-rim,
.pda-auth-fisher-person path,
.pda-auth-cast-line,
.pda-auth-cast-net,
.pda-auth-cast-grid{
  fill:none;
  stroke:rgba(210,252,250,.62);
  stroke-linecap:round;
  stroke-linejoin:round
}
.pda-auth-fisher-rim{stroke-width:5}
.pda-auth-fisher-person circle{fill:rgba(221,254,251,.48)}
.pda-auth-fisher-person path{stroke-width:8}
.pda-auth-cast-line{stroke-width:4}
.pda-auth-cast-net{stroke-width:2.5;fill:rgba(78,217,216,.035)}
.pda-auth-cast-grid{stroke-width:1.3;opacity:.68}
.pda-auth-fisher-water{
  fill:none;
  stroke:rgba(109,230,228,.25);
  stroke-width:4;
  stroke-linecap:round
}
.pda-auth-fisher-water-a{animation:pdaAuthWater 4.2s ease-in-out infinite alternate}
.pda-auth-fisher-water-b{animation:pdaAuthWater 5.2s ease-in-out -1.3s infinite alternate-reverse}
.pda-auth-fisher-boat{transform-origin:260px 330px;animation:pdaAuthBoat 3.2s ease-in-out infinite}
.pda-auth-fisher-person{transform-origin:230px 292px;animation:pdaAuthFisher 3.6s ease-in-out infinite}
.pda-auth-fisher-cast{transform-origin:274px 268px;animation:pdaAuthCast 3.6s cubic-bezier(.42,0,.25,1) infinite}

.pda-auth-shell{
  position:relative;
  z-index:3;
  width:min(1460px,calc(100% - 54px));
  min-height:100vh;
  margin:0 auto;
  padding:26px 0 22px
}
.pda-auth-brand{
  display:flex;
  align-items:center;
  gap:18px;
  width:max-content;
  max-width:100%;
  color:#fff;
  animation:pdaAuthEnter .55s ease both
}
.pda-auth-logo{
  position:relative;
  display:grid;
  place-items:center;
  flex:0 0 88px;
  width:88px;
  height:88px;
  border:1px solid rgba(203,249,248,.30);
  border-radius:50%;
  background:
    radial-gradient(circle at 34% 26%,rgba(255,255,255,.16),transparent 34%),
    rgba(6,39,53,.58);
  box-shadow:
    0 14px 34px rgba(0,8,16,.30),
    0 0 28px rgba(68,217,217,.08),
    inset 0 1px 0 rgba(255,255,255,.08)
}
.pda-auth-logo::before{
  content:"";
  position:absolute;
  inset:-8px;
  border:1px solid rgba(106,231,228,.18);
  border-radius:50%
}
.pda-auth-logo-orbit{
  position:absolute;
  border-radius:50%;
  pointer-events:none
}
.pda-auth-logo-orbit.orbit-a{
  inset:-12px;
  border-top:1px solid rgba(91,231,226,.65);
  border-right:1px solid transparent;
  border-bottom:1px solid rgba(146,113,255,.35);
  border-left:1px solid transparent;
  animation:pdaAuthOrbit 9s linear infinite
}
.pda-auth-logo-orbit.orbit-b{
  inset:-21px;
  border-top:1px dashed rgba(201,248,246,.10);
  border-right:1px solid rgba(103,233,228,.20);
  border-bottom:1px dashed rgba(201,248,246,.08);
  border-left:1px solid rgba(155,124,255,.18);
  animation:pdaAuthOrbitReverse 17s linear infinite
}
.pda-auth-logo img,
.pda-auth-logo .app-brand-logo-image{
  position:relative;
  z-index:2;
  display:block;
  width:72px!important;
  height:72px!important;
  border:2px solid rgba(249,255,255,.94)!important;
  border-radius:50%!important;
  background:#fff!important;
  object-fit:contain!important;
  box-shadow:0 4px 16px rgba(0,0,0,.24)!important
}
.pda-auth-logo-fallback{
  position:relative;
  z-index:1;
  color:#eaffff;
  font-size:20px;
  font-weight:850;
  letter-spacing:.06em
}
.pda-auth-logo.has-logo .pda-auth-logo-fallback{display:none}
.pda-auth-brand-copy{min-width:0}
.pda-auth-institution{
  display:flex;
  align-items:center;
  gap:7px;
  margin-bottom:4px;
  color:rgba(195,240,243,.69);
  font-size:8px;
  font-weight:850;
  letter-spacing:.17em
}
.pda-auth-institution i{
  display:block;
  width:20px;
  height:1px;
  background:linear-gradient(90deg,#62dbda,#967bff);
  box-shadow:0 0 8px rgba(98,219,218,.48)
}
.pda-auth-brand h1{
  margin:0;
  color:#fff;
  font-size:31px;
  line-height:.98;
  letter-spacing:-.045em
}
.pda-auth-brand h1 span{
  background:linear-gradient(90deg,#fff,#bef8f4 50%,#91dadd 77%,#baa9ff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  background-size:180% auto;
  animation:pdaAuthTitle 7s ease-in-out infinite alternate
}
.pda-auth-brand p{
  margin:6px 0 0;
  color:rgba(227,247,248,.70);
  font-size:10px;
  line-height:1.3
}

.pda-auth-layout{
  display:grid;
  grid-template-columns:minmax(0,1.25fr) minmax(390px,.72fr);
  gap:42px;
  align-items:center;
  min-height:calc(100vh - 151px);
  padding:24px 0 12px
}
.pda-auth-story{
  position:relative;
  align-self:center;
  min-width:0;
  padding:16px 0 28px;
  color:#fff;
  animation:pdaAuthEnter .62s .08s ease both
}
.pda-auth-story-copy{
  max-width:820px
}
.pda-auth-eyebrow{
  display:inline-flex;
  align-items:center;
  width:max-content;
  margin-bottom:12px;
  padding:6px 10px;
  border:1px solid rgba(141,232,231,.17);
  border-radius:999px;
  color:#c7f7f4;
  background:rgba(95,218,217,.055);
  backdrop-filter:blur(8px);
  font-size:8px;
  font-weight:850;
  letter-spacing:.15em
}
.pda-auth-story h2{
  max-width:780px;
  margin:0;
  color:#fff;
  font-size:48px;
  line-height:1.02;
  font-weight:800;
  letter-spacing:-.048em;
  text-shadow:0 5px 28px rgba(0,0,0,.18)
}
.pda-auth-lead{
  max-width:750px;
  margin:16px 0 20px;
  color:rgba(227,246,247,.78);
  font-size:14px;
  line-height:1.55
}
.pda-auth-journey{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  max-width:800px
}
.pda-auth-journey-step{
  position:relative;
  display:grid;
  grid-template-columns:44px minmax(0,1fr);
  gap:11px;
  align-items:start;
  min-height:105px;
  padding:14px 14px 14px 15px;
  overflow:hidden;
  border:1px solid rgba(191,239,241,.12);
  border-radius:15px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.060),rgba(255,255,255,.025));
  backdrop-filter:blur(10px);
  box-shadow:0 8px 30px rgba(0,11,18,.075);
  transition:transform .22s ease,border-color .22s ease,background .22s ease
}
.pda-auth-journey-step::after{
  content:"";
  position:absolute;
  top:-45px;
  right:-40px;
  width:100px;
  height:100px;
  border-radius:50%;
  opacity:.11
}
.pda-auth-journey-step.step-one::after{background:#31d8cf}
.pda-auth-journey-step.step-two::after{background:#f5bf59}
.pda-auth-journey-step.step-three::after{background:#9278ff}
.pda-auth-journey-step.step-four::after{background:#ef806c}
.pda-auth-journey-step:hover{
  transform:translateY(-2px);
  border-color:rgba(179,240,239,.22);
  background:linear-gradient(145deg,rgba(255,255,255,.082),rgba(255,255,255,.034))
}
.pda-auth-step-number{
  position:absolute;
  top:8px;
  right:10px;
  color:rgba(226,249,249,.18);
  font-size:11px;
  font-weight:800;
  letter-spacing:.08em
}
.pda-auth-step-icon{
  display:grid;
  place-items:center;
  width:40px;
  height:40px;
  border-radius:12px;
  color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.17),0 6px 14px rgba(0,0,0,.12)
}
.step-one .pda-auth-step-icon{background:linear-gradient(145deg,#13aeb0,#0a777f)}
.step-two .pda-auth-step-icon{background:linear-gradient(145deg,#e4aa41,#a97027)}
.step-three .pda-auth-step-icon{background:linear-gradient(145deg,#7863de,#4e438f)}
.step-four .pda-auth-step-icon{background:linear-gradient(145deg,#d86d5e,#98463f)}
.pda-auth-step-icon svg{
  width:20px;
  height:20px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round
}
.pda-auth-journey-step strong{
  display:block;
  margin:1px 0 4px;
  color:#fff;
  font-size:11.5px
}
.pda-auth-journey-step p{
  margin:0;
  color:rgba(224,246,246,.67);
  font-size:9.2px;
  line-height:1.42
}
.pda-auth-themes{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:13px
}
.pda-auth-themes span{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:26px;
  padding:4px 9px;
  border:1px solid rgba(199,242,242,.10);
  border-radius:999px;
  color:rgba(224,247,247,.66);
  background:rgba(255,255,255,.028);
  backdrop-filter:blur(6px);
  font-size:7.8px;
  font-weight:650
}
.theme-dot{
  display:block;
  width:6px;
  height:6px;
  border-radius:50%;
  box-shadow:0 0 7px currentColor
}
.theme-dot.aqua{color:#4be0d8;background:#4be0d8}
.theme-dot.gold{color:#f3bd5b;background:#f3bd5b}
.theme-dot.violet{color:#9a82ff;background:#9a82ff}
.theme-dot.coral{color:#ee806f;background:#ee806f}

.pda-auth-card{
  position:relative;
  align-self:center;
  min-width:0;
  padding:23px;
  overflow:hidden;
  border:1px solid rgba(198,244,244,.17);
  border-radius:22px;
  color:#173f51;
  background:
    linear-gradient(155deg,rgba(255,255,255,.975),rgba(243,250,250,.955));
  box-shadow:
    0 28px 75px rgba(0,14,23,.30),
    0 0 50px rgba(50,202,204,.035);
  backdrop-filter:blur(16px);
  animation:pdaAuthEnter .65s .16s ease both
}
.pda-auth-card::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.80;
  background:
    radial-gradient(circle at 0 0,rgba(23,183,187,.10),transparent 31%),
    radial-gradient(circle at 100% 100%,rgba(130,104,242,.065),transparent 31%)
}
.pda-auth-card-glow{
  position:absolute;
  width:180px;
  height:180px;
  right:-80px;
  top:-95px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(24,189,190,.13),transparent 70%);
  pointer-events:none
}
.pda-auth-card>*:not(.pda-auth-card-glow){
  position:relative;
  z-index:2
}
.pda-auth-card-head{
  display:flex;
  align-items:center;
  gap:11px;
  margin-bottom:14px
}
.pda-auth-person-icon{
  display:grid;
  place-items:center;
  flex:0 0 44px;
  width:44px;
  height:44px;
  border-radius:13px;
  color:#fff;
  background:
    linear-gradient(145deg,#0b8893,#4b5fc1);
  box-shadow:0 9px 22px rgba(25,117,145,.23)
}
.pda-auth-person-icon svg{
  width:22px;
  height:22px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round
}
.pda-auth-card-kicker{
  display:block;
  margin-bottom:2px;
  color:#0b7380;
  font-size:7px;
  font-weight:850;
  letter-spacing:.14em
}
.pda-auth-card h3{
  margin:0;
  color:#143e51;
  font-size:19px;
  line-height:1.1;
  letter-spacing:-.025em
}
.pda-auth-card-head p{
  margin:3px 0 0;
  color:#69808a;
  font-size:9.5px
}
.pda-auth-card-divider{
  position:relative;
  height:1px;
  margin:0 0 15px;
  background:linear-gradient(90deg,#d4e4e6,transparent)
}
.pda-auth-card-divider span{
  position:absolute;
  left:0;
  top:-1px;
  width:72px;
  height:2px;
  border-radius:10px;
  background:linear-gradient(90deg,#10a2aa,#7463df)
}
.pda-auth-form{
  display:grid;
  gap:12px
}
.pda-auth-form[hidden],
[hidden]{display:none!important}
.pda-auth-form>label{
  display:grid;
  gap:5px;
  color:#315563;
  font-size:10px;
  font-weight:680
}
.pda-auth-form>label>span:first-child{
  line-height:1.2
}
.pda-auth-form input,
.pda-auth-form select{
  width:100%;
  min-height:42px;
  box-sizing:border-box;
  padding:10px 11px;
  border:1px solid #bed2d8;
  border-radius:10px;
  color:#173f51;
  background:#fff;
  font:400 12px/1.2 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  transition:border-color .16s ease,box-shadow .16s ease,background .16s ease
}
.pda-auth-form input::placeholder{color:#9aabb1}
.pda-auth-form input:hover,
.pda-auth-form select:hover{border-color:#8db2bb}
.pda-auth-form input:focus,
.pda-auth-form select:focus{
  outline:0;
  border-color:#0c8994;
  background:#fff;
  box-shadow:0 0 0 3px rgba(12,137,148,.09)
}
.pda-auth-input-wrap{
  position:relative;
  display:flex;
  align-items:center
}
.pda-auth-input-wrap input{
  padding-left:38px
}
.pda-auth-input-icon{
  position:absolute;
  z-index:3;
  left:12px;
  display:grid;
  place-items:center;
  width:15px;
  height:15px;
  color:#71909a;
  pointer-events:none
}
.pda-auth-input-icon svg{
  width:15px;
  height:15px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round
}
.pda-password-field{
  position:relative;
  display:flex;
  align-items:center;
  gap:6px
}
.pda-password-field input{
  min-width:0;
  flex:1;
  padding-right:61px
}
.pda-password-field.pda-auth-input-wrap input{
  padding-left:38px
}
.pda-password-toggle{
  position:absolute;
  z-index:4;
  right:7px;
  border:0;
  padding:5px 6px;
  color:#0a7280;
  background:transparent;
  box-shadow:none;
  font:650 8px/1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  cursor:pointer
}
.pda-password-toggle:hover{
  color:#084d58;
  background:#edf6f6;
  transform:none;
  box-shadow:none
}
.pda-auth-create{
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  gap:8px!important;
  min-height:43px!important;
  margin-top:2px!important;
  padding:10px 14px!important;
  border:0!important;
  border-radius:11px!important;
  color:#fff!important;
  background:linear-gradient(105deg,#0b8792 0%,#0a9ca2 48%,#565bc4 100%)!important;
  background-size:170% auto!important;
  box-shadow:0 8px 20px rgba(18,123,147,.20)!important;
  font:750 11px/1.1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;
  cursor:pointer!important;
  transition:transform .17s ease,box-shadow .17s ease,background-position .25s ease!important
}
.pda-auth-create svg{
  width:15px;
  height:15px;
  fill:none;
  stroke:currentColor;
