<style>
.pda-auth-overlay{
  position:fixed;
  inset:0;
  z-index:99999;
  overflow:auto;
  color:#173f51;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 8% 7%,rgba(108,211,219,.20),transparent 25%),
    radial-gradient(circle at 92% 14%,rgba(7,86,105,.20),transparent 25%),
    linear-gradient(145deg,#072d41 0%,#0b5163 54%,#0b7881 100%)
}
.pda-auth-overlay[hidden]{display:none!important}
.pda-auth-sea{
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.95
}
.pda-auth-sea svg{width:100%;height:100%;display:block}
.pda-auth-wave{
  fill:none;
  stroke:rgba(225,252,253,.16);
  stroke-width:3
}
.pda-auth-wave2{opacity:.7}
.pda-auth-wave3{opacity:.5}
.pda-auth-sun{fill:rgba(207,250,250,.11)}
.pda-auth-boat{fill:rgba(2,34,47,.37)}
.pda-auth-line,.pda-auth-net{
  fill:none;
  stroke:rgba(238,255,255,.34);
  stroke-linecap:round;
  stroke-linejoin:round
}
.pda-auth-line{stroke-width:4}
.pda-auth-net{stroke-width:2}
.pda-auth-content{
  position:relative;
  z-index:2;
  width:min(1220px,calc(100% - 34px));
  margin:0 auto;
  padding:26px 0 28px
}
.pda-auth-brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:24px;
  color:#fff
}
.pda-auth-logo{
  display:grid;
  place-items:center;
  width:72px;
  height:72px;
  border:1px solid rgba(255,255,255,.40);
  border-radius:50%;
  background:rgba(255,255,255,.10);
  box-shadow:0 12px 30px rgba(0,0,0,.20),0 0 0 5px rgba(255,255,255,.05)
}
.pda-auth-logo img{
  width:60px!important;
  height:60px!important;
  border:2px solid rgba(255,255,255,.85)!important;
  border-radius:50%;
  background:#fff;
  object-fit:contain
}
.pda-auth-brand h1{margin:0;font-size:23px;line-height:1.05;letter-spacing:-.03em}
.pda-auth-brand p{margin:4px 0 0;color:rgba(238,255,255,.78);font-size:11px}
.pda-auth-grid{
  display:grid;
  grid-template-columns:minmax(0,1.2fr) minmax(360px,.8fr);
  gap:22px;
  align-items:stretch
}
.pda-auth-story{
  display:flex;
  min-height:510px;
  flex-direction:column;
  justify-content:center;
  padding:36px 38px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:24px;
  color:#fff;
  background:
    radial-gradient(circle at 0 0,rgba(255,255,255,.10),transparent 34%),
    linear-gradient(145deg,rgba(7,45,61,.72),rgba(8,93,104,.46));
  box-shadow:0 30px 80px rgba(0,22,32,.24);
  backdrop-filter:blur(10px)
}
.pda-auth-eyebrow{
  width:max-content;
  margin-bottom:12px;
  padding:6px 9px;
  border:1px solid rgba(255,255,255,.22);
  border-radius:999px;
  color:#dff9fa;
  background:rgba(255,255,255,.07);
  font-size:9px;
  font-weight:800;
  letter-spacing:.14em
}
.pda-auth-story h2{
  max-width:760px;
  margin:0;
  color:#fff;
  font-size:46px;
  line-height:1;
  letter-spacing:-.045em
}
.pda-auth-story>p{
  max-width:690px;
  margin:18px 0 22px;
  color:rgba(239,254,254,.84);
  font-size:15px;
  line-height:1.55
}
.pda-auth-features{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px
}
.pda-auth-features>div{
  min-height:92px;
  padding:12px 13px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:13px;
  background:rgba(255,255,255,.065)
}
.pda-auth-features strong{display:block;margin-bottom:3px;color:#fff;font-size:11px}
.pda-auth-features span{color:rgba(236,253,253,.70);font-size:9.5px;line-height:1.4}
.pda-auth-card{
  align-self:center;
  padding:22px;
  border:1px solid rgba(255,255,255,.36);
  border-radius:22px;
  background:rgba(255,255,255,.97);
  box-shadow:0 28px 75px rgba(0,25,36,.27)
}
.pda-auth-card-head{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:15px
}
.pda-auth-person-icon{
  display:grid;
  place-items:center;
  width:42px;
  height:42px;
  border-radius:12px;
  color:#fff;
  background:linear-gradient(145deg,#0a7c88,#1595a0);
  box-shadow:0 9px 20px rgba(10,124,136,.23)
}
.pda-auth-person-icon svg{
  width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round
}
.pda-auth-card h3{margin:0;font-size:19px;letter-spacing:-.025em}
.pda-auth-card-head p{margin:3px 0 0;color:#607984;font-size:10.5px}
.pda-auth-google-account,.pda-auth-verified{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0 0 12px;
  padding:10px 11px;
  border:1px solid #d4e4e7;
  border-radius:11px;
  background:#f5fafb
}
.pda-auth-g{
  display:grid;
  place-items:center;
  width:31px;height:31px;flex:0 0 auto;
  border-radius:50%;
  color:#1a73e8;background:#fff;font-weight:800;
  box-shadow:0 2px 6px rgba(0,0,0,.15)
}
.pda-auth-google-account small,.pda-auth-verified small{
  display:block;color:#748892;font-size:8px;font-weight:800;letter-spacing:.08em
}
.pda-auth-google-account strong,.pda-auth-verified strong{
  display:block;margin-top:2px;color:#214c5d;font-size:10.5px
}
.pda-auth-google-button,.pda-auth-create{
  width:100%;
  min-height:44px;
  border-radius:11px;
  cursor:pointer;
  font:750 12px/1 inherit
}
.pda-auth-google-button{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  border:1px solid #c8d9de;
  color:#244c5b;
  background:#fff;
  box-shadow:0 5px 14px rgba(15,48,70,.08)
}
.pda-auth-google-button:hover{border-color:#8ab9c2;box-shadow:0 9px 20px rgba(15,48,70,.12)}
.pda-auth-create{
  border:0;
  color:#fff;
  background:linear-gradient(145deg,#0a7d89,#08616e);
  box-shadow:0 10px 22px rgba(8,97,110,.24)
}
.pda-auth-register-form label{
  display:flex;
  flex-direction:column;
  gap:4px;
  margin-bottom:10px
}
.pda-auth-register-form label>span{
  color:#315667;
  font-size:9.5px;
  font-weight:700
}
.pda-auth-register-form input,.pda-auth-register-form select{
  width:100%;
  min-height:42px;
  padding:9px 10px;
  border:1px solid #b9d1d8;
  border-radius:10px;
  color:#173f51;
  background:#fff;
  font:500 12px/1.2 inherit
}
.pda-auth-register-form input:focus,.pda-auth-register-form select:focus{
  outline:none;border-color:#0b7e8a;box-shadow:0 0 0 3px rgba(11,126,138,.10)
}
.pda-auth-permissions{
  margin:12px 0;
  padding:10px 11px;
  border:1px solid #cfe1e4;
  border-radius:11px;
  background:#eef7f8
}
.pda-auth-permissions strong{display:block;color:#0c6874;font-size:9.8px}
.pda-auth-permissions p{margin:4px 0 0;color:#5f7883;font-size:9px;line-height:1.4}
.pda-auth-message{
  margin:12px 0 0;
  padding:10px 11px;
  border:1px solid #e2c985;
  border-radius:10px;
  color:#76580d;
  background:#fff9e7;
  font-size:9px;
  line-height:1.4
}
.pda-auth-message.error{border-color:#e1b7b1;color:#833a31;background:#fff3f1}
.pda-auth-security{
  display:flex;
  gap:7px;
  align-items:flex-start;
  margin-top:12px;
  color:#72858e;
  font-size:8.5px;
  line-height:1.35
}
.pda-auth-security svg{flex:0 0 auto;width:14px;height:14px;fill:none;stroke:#0c7b87;stroke-width:2}
.pda-auth-footer{
  margin-top:22px;
  color:rgba(237,253,253,.64);
  text-align:center;
  font-size:8.5px
}
@media(max-width:940px){
  .pda-auth-grid{grid-template-columns:1fr}
  .pda-auth-story{min-height:0}
  .pda-auth-card{width:min(620px,100%);justify-self:center}
}
@media(max-width:650px){
  .pda-auth-content{width:calc(100% - 20px);padding-top:16px}
  .pda-auth-story{padding:24px 21px;border-radius:18px}
  .pda-auth-story h2{font-size:34px}
  .pda-auth-story>p{font-size:13px}
  .pda-auth-features{grid-template-columns:1fr}
  .pda-auth-card{padding:18px;border-radius:18px}
}
</style>
