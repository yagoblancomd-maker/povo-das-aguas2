<script>
window.PDA_MODULES.PESS = (()=>{
  const {
    el,card,details,form,call,go,personFields,searchUI,status
  }=App;

  const DOCUMENT_LABELS={
    RG_CPF:'Documento de identidade e CPF',
    RESIDENCIA:'Comprovante de residência',
    IDENTIDADE_TITULAR_RESIDENCIA:'Carteira de identidade do titular da residência',
    PROCESSO_ADMINISTRATIVO:'Processo administrativo',
    PESCA:'Documentos de pesca',
    PROCURACAO:'Procuração',
    HIPOSSUFICIENCIA:'Declaração de hipossuficiência'
  };

  const SALARIO_MINIMO_2025=1518.00;

  function moneyBR_(value){
    return Number(value||0).toLocaleString(
      'pt-BR',
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );
  }

  function dateBR_(value){
    const s=String(value||'').slice(0,10);

    if(!/^\d{4}-\d{2}-\d{2}$/.test(s)){
      return String(value||'');
    }

    return s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4);
  }

  function maskCpfInput_(input){
    const sync=()=>{
      const d=String(input.value||'')
        .replace(/\D/g,'')
        .slice(0,11);

      input.value=
        d
          .replace(/^(\d{3})(\d)/,'$1.$2')
          .replace(/^(\d{3})\.(\d{3})(\d)/,'$1.$2.$3')
          .replace(
            /^(\d{3})\.(\d{3})\.(\d{3})(\d{1,2}).*$/,
            '$1.$2.$3-$4'
          );
    };

    input.addEventListener('input',sync);
    input.addEventListener('blur',sync);
  }

  function maskDateInput_(input){
    const sync=()=>{
      const d=String(input.value||'')
        .replace(/\D/g,'')
        .slice(0,8);

      if(d.length<=2){
        input.value=d;
      }else if(d.length<=4){
        input.value=
          d.slice(0,2)+
          '/'+
          d.slice(2);
      }else{
        input.value=
          d.slice(0,2)+
          '/'+
          d.slice(2,4)+
          '/'+
          d.slice(4);
      }
    };

    input.addEventListener('input',sync);
    input.addEventListener('blur',sync);
  }

  function readFile_(file){
    return new Promise((resolve,reject)=>{
      const reader=new FileReader();

      reader.onload=()=>{
        const result=String(reader.result||'');
        const parts=result.split(',');

        if(parts.length<2){
          reject(new Error('Não foi possível ler o arquivo.'));
          return;
        }

        resolve(parts[1]);
      };

      reader.onerror=()=>reject(
        reader.error||
        new Error('Erro ao ler o arquivo.')
      );

      reader.readAsDataURL(file);
    });
  }

  function mime_(file){
    if(file.type)return file.type;

    const ext=
      (file.name.split('.').pop()||'')
        .toLowerCase();

    if(ext==='pdf')return 'application/pdf';
    if(ext==='jpg'||ext==='jpeg')return 'image/jpeg';
    if(ext==='png')return 'image/png';

    return '';
  }

  function documentBox_(categoria){
    const title=
      DOCUMENT_LABELS[categoria]||
      categoria;

    const box=el('details');
    box.open=true;

    const summary=el(
      'summary',
      title+' — Pendente'
    );

    box.append(summary);

    const label=el(
      'label',
      undefined,
      'field'
    );

    label.append(
      el(
        'span',
        'Selecionar arquivo(s) *'
      )
    );

    const input=el('input');
    input.type='file';
    input.multiple=true;
    input.required=true;
    input.accept=
      '.pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png';

    label.append(input);
    box.append(label);

    let extraReady=()=>true;

    const sync=()=>{
      const count=
        input.files
          ?input.files.length
          :0;

      const ready=
        count>0&&
        extraReady();

      if(!count){
        summary.textContent=
          title+
          ' — Pendente';
        return;
      }

      if(ready){
        summary.textContent=
          title+
          ' — '+
          (
            count===1
              ?'Documento inserido'
              :count+' documentos inseridos'
          );

        box.open=false;
      }else{
        summary.textContent=
          title+
          ' — Documento inserido; complete os dados';
        box.open=true;
      }
    };

    input.addEventListener(
      'change',
      sync
    );

    return {
      box,
      input,
      sync,
      setExtraReady(fn){
        extraReady=fn;
        sync();
      }
    };
  }

  function normalizeApiText_(value){
    return String(value||'')
      .trim()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g,'')
      .toLowerCase();
  }

  function uniqueApiValues_(registros,key){
    const values=[];

    (registros||[]).forEach(r=>{
      const value=String(r&&r[key]||'').trim();

      if(
        value&&
        !values.some(existing=>
          normalizeApiText_(existing)===
          normalizeApiText_(value)
        )
      ){
        values.push(value);
      }
    });

    return values;
  }

  function selectMatchingOption_(select,value){
    if(!select||!value)return false;

    const target=
      normalizeApiText_(value);

    const option=
      Array.from(select.options||[])
        .find(o=>
          normalizeApiText_(o.value)===target||
          normalizeApiText_(o.textContent)===target
        );

    if(!option)return false;

    select.value=option.value;

    select.dispatchEvent(
      new Event(
        'change',
        {bubbles:true}
      )
    );

    return true;
  }

  function fillPersonFromApi_(personForm,consulta){
    const registros=
      consulta&&
      Array.isArray(consulta.registros)
        ?consulta.registros
        :[];

    const nomes=
      uniqueApiValues_(
        registros,
        'nome'
      );

    const municipios=
      uniqueApiValues_(
        registros,
        'nomeIBGE'
      );

    const ufs=
      uniqueApiValues_(
        registros,
        'ufSigla'
      );

    const messages=[];

    const nomeInput=
      personForm.elements.namedItem(
        'nome'
      );

    if(nomes.length===1&&nomeInput){
      const apiNome=
        nomes[0];

      if(!String(nomeInput.value||'').trim()){
        nomeInput.value=
          apiNome;

        nomeInput.dispatchEvent(
          new Event(
            'input',
            {bubbles:true}
          )
        );

        messages.push(
          'nome completo preenchido pela API'
        );

      }else if(
        normalizeApiText_(nomeInput.value)!==
        normalizeApiText_(apiNome)
      ){
        messages.push(
          'o nome retornado pela API difere do nome já digitado e não foi sobrescrito'
        );
      }
    }else if(nomes.length>1){
      messages.push(
        'a API retornou mais de um nome e o campo Nome completo não foi preenchido automaticamente'
      );
    }

    const municipioSelect=
      personForm.elements.namedItem(
        'cidade'
      );

    if(
      municipios.length===1&&
      municipioSelect
    ){
      const apiMunicipio=
        municipios[0];

      if(!String(municipioSelect.value||'').trim()){
        if(
          selectMatchingOption_(
            municipioSelect,
            apiMunicipio
          )
        ){
          messages.push(
            'município preenchido pela API'
          );
        }else{
          messages.push(
            'o município retornado pela API não consta na lista de municípios cadastrados'
          );
        }

      }else if(
        normalizeApiText_(municipioSelect.value)!==
        normalizeApiText_(apiMunicipio)
      ){
        messages.push(
          'o município retornado pela API difere do município já selecionado e não foi sobrescrito'
        );
      }
    }else if(municipios.length>1){
      messages.push(
        'a API retornou mais de um município e o campo Município não foi preenchido automaticamente'
      );
    }

    const ufSelect=
      personForm.elements.namedItem(
        'uf'
      );

    if(
      ufs.length===1&&
      ufSelect&&
      !String(ufSelect.value||'').trim()
    ){
      selectMatchingOption_(
        ufSelect,
        ufs[0]
      );
    }

    return {
      nomes,
      municipios,
      ufs,
      messages
    };
  }

  function splitLogradouro_(logradouro){
    const original=String(logradouro||'').trim();

    if(!original){
      return {
        tipoVia:'',
        via:''
      };
    }

    const tipos=[
      'Loteamento',
      'Servidão',
      'Travessa',
      'Avenida',
      'Estrada',
      'Rodovia',
      'Alameda',
      'Praça',
      'Beco',
      'Vila',
      'Linha',
      'Acesso',
      'Rua'
    ];

    const normalized=
      normalizeApiText_(
        original
      );

    const tipo=
      tipos.find(item=>
        normalized===
          normalizeApiText_(item)||
        normalized.startsWith(
          normalizeApiText_(item)+' '
        )
      );

    if(!tipo){
      return {
        tipoVia:'',
        via:original
      };
    }

    return {
      tipoVia:tipo,
      via:original
        .slice(tipo.length)
        .trim()
    };
  }

  function setInputIfEmpty_(input,value,messages,label){
    const next=String(value||'').trim();

    if(!input||!next)return false;

    const current=
      String(input.value||'')
        .trim();

    if(!current){
      input.value=next;

      input.dispatchEvent(
        new Event(
          'input',
          {bubbles:true}
        )
      );

      input.dispatchEvent(
        new Event(
          'change',
          {bubbles:true}
        )
      );

      messages.push(
        label+
        ' preenchido pelo CEP'
      );

      return true;
    }

    if(
      normalizeApiText_(current)!==
      normalizeApiText_(next)
    ){
      messages.push(
        label+
        ' retornado pelo CEP difere do valor já preenchido e não foi sobrescrito'
      );
    }

    return false;
  }

  function fillAddressFromCep_(personForm,result){
    const messages=[];
    const parts=
      splitLogradouro_(
        result.logradouro
      );

    const tipoVia=
      personForm.elements.namedItem(
        'tipoVia'
      );

    const via=
      personForm.elements.namedItem(
        'via'
      );

    const bairro=
      personForm.elements.namedItem(
        'bairro'
      );

    const cidade=
      personForm.elements.namedItem(
        'cidade'
      );

    const uf=
      personForm.elements.namedItem(
        'uf'
      );

    /*
     * Ao clicar em "Consultar CEP", o endereço retornado pelo serviço passa a
     * ser a referência para logradouro, bairro, município e UF.
     * Número e complemento continuam sempre manuais.
     */
    if(
      tipoVia&&
      parts.tipoVia
    ){
      tipoVia.value=
        parts.tipoVia;

      tipoVia.dispatchEvent(
        new Event(
          'input',
          {bubbles:true}
        )
      );
    }

    if(
      via&&
      (
        parts.via||
        result.logradouro
      )
    ){
      via.value=
        parts.via||
        result.logradouro;

      via.dispatchEvent(
        new Event(
          'input',
          {bubbles:true}
        )
      );
    }

    if(
      bairro&&
      result.bairro
    ){
      bairro.value=
        result.bairro;

      bairro.dispatchEvent(
        new Event(
          'input',
          {bubbles:true}
        )
      );
    }

    if(
      cidade&&
      result.cidade
    ){
      if(
        !selectMatchingOption_(
          cidade,
          result.cidade
        )
      ){
        messages.push(
          'o município retornado pelo CEP não consta na lista de municípios cadastrados'
        );
      }
    }

    if(
      uf&&
      result.uf
    ){
      selectMatchingOption_(
        uf,
        result.uf
      );
    }

    return messages;
  }

  function apiRecordText_(r){
    return [
      'ID: '+(r.id||'—'),
      'CPF: '+(r.cpfFormatado||'—'),
      'NIS: '+(r.nis||'—'),
      'Nome: '+(r.nome||'—'),
      'Código IBGE: '+(r.codigoIBGE||'—'),
      'Município: '+(r.nomeIBGE||'—'),
      'Código da região: '+(r.codigoRegiao||'—'),
      'Região: '+(r.nomeRegiao||'—'),
      'País: '+(r.pais||'—'),
      'UF: '+(r.ufSigla||'—'),
      'Nome da UF: '+(r.ufNome||'—'),
      'Portaria: '+(r.portaria||'—'),
      'Mês de referência: '+(dateBR_(r.dataMesReferencia)||'—'),
      'Data do saque: '+(dateBR_(r.dataSaque)||'—'),
      'Data de emissão da parcela: '+(dateBR_(r.dataEmissaoParcela)||'—'),
      'Situação: '+(r.situacao||'—'),
      'RGP: '+(r.rgp||'—'),
      'Parcela: '+(r.parcela||'—'),
      'Valor: R$ '+moneyBR_(r.valor)
    ].join('\n');
  }

  function showSeguroDefesoDialog_(consulta){
    const dialog=el(
      'dialog',
      undefined,
      'pess-api-dialog'
    );

    dialog.append(
      el(
        'h2',
        'Consulta Seguro-Defeso — Portal da Transparência'
      )
    );

    dialog.append(
      el(
        'p',
        'Fonte: '+
        consulta.fonte+
        '. Consulta realizada por API oficial. Os dados abaixo correspondem somente aos registros cujo mês de referência está entre 01/01/2025 e 31/12/2025.',
        'hint'
      )
    );

    const stats=el(
      'div',
      undefined,
      'stats'
    );

    const totalRegistros=el(
      'div',
      undefined,
      'stat'
    );

    totalRegistros.append(
      el(
        'strong',
        String(consulta.quantidade||0)
      ),
      el(
        'span',
        'registros de 2025'
      )
    );

    const totalValor=el(
      'div',
      undefined,
      'stat'
    );

    totalValor.append(
      el(
        'strong',
        'R$ '+moneyBR_(consulta.valorTotal)
      ),
      el(
        'span',
        'valor total localizado'
      )
    );

    const totalFora=el(
      'div',
      undefined,
      'stat'
    );

    totalFora.append(
      el(
        'strong',
        String(consulta.registrosForaPeriodo||0)
      ),
      el(
        'span',
        'registros fora de 2025 desconsiderados'
      )
    );

    stats.append(
      totalRegistros,
      totalValor,
      totalFora
    );

    dialog.append(stats);

    if(!consulta.registros.length){
      dialog.append(
        el(
          'p',
          'Nenhum registro com mês de referência em 2025 foi localizado para o CPF/NIS consultado.',
          'warn'
        )
      );
    }else{
      consulta.registros.forEach(
        (r,index)=>{
          const d=el('details');

          d.append(
            el(
              'summary',
              (
                r.parcela
                  ?'Parcela '+r.parcela
                  :'Registro '+(index+1)
              )+
              ' — '+
              (
                dateBR_(r.dataMesReferencia)||
                'sem mês de referência'
              )+
              ' — R$ '+
              moneyBR_(r.valor)
            )
          );

          d.append(
            el(
              'pre',
              apiRecordText_(r)
            )
          );

          dialog.append(d);
        }
      );
    }

    dialog.append(
      el(
        'p',
        'Ao salvar o cadastro, uma nova consulta oficial será realizada e o relatório completo será gravado na pasta da pessoa em Google Docs e PDF.',
        'hint'
      )
    );

    const actions=el(
      'div',
      undefined,
      'actions'
    );

    actions.append(
      (()=> {
        const b=el(
          'button',
          'Fechar'
        );

        b.type='button';
        b.onclick=()=>dialog.close();

        return b;
      })()
    );

    dialog.append(actions);
    document.body.append(dialog);

    dialog.addEventListener(
      'close',
      ()=>dialog.remove()
    );

    dialog.showModal();
  }

  function buildPersonStepper_(personForm,defeso,documents){
    const sourceGrid=
      Array.from(personForm.children)
        .find(node=>
          node.classList&&
          node.classList.contains('grid')
        );

    const submitActions=
      personForm.querySelector(
        ':scope > .actions'
      );

    if(!sourceGrid||!submitActions){
      return null;
    }

    const fieldNode=key=>
      sourceGrid.querySelector(
        '[data-field="'+key+'"]'
      );

    const stepper=
      el(
        'div',
        undefined,
        'pess-stepper'
      );

    const progress=
      el(
        'div',
        undefined,
        'pess-step-progress'
      );

    const definitions=[
      {
        title:'CPF',
        subtitle:'Identificação e consulta oficial',
        fields:['cpf']
      },
      {
        title:'Dados pessoais',
        subtitle:'Nome e contato',
        fields:['nome','nascimento','telefone','email']
      },
      {
        title:'Endereço',
        subtitle:'CEP e residência',
        fields:['cep','tipoVia','via','numero','complemento','bairro','cidade','uf']
      },
      {
        title:'Vínculo e benefício',
        subtitle:'Entidade e parcelas',
        fields:['entidade','outraEntidade','analfabeto','parcelasNaoRecebidas'],
        extra:defeso
      },
      {
        title:'Documentos',
        subtitle:'Arquivos obrigatórios',
        fields:[],
        extra:documents,
        final:true
      }
    ];

    const progressItems=[];
    const steps=[];

    definitions.forEach((definition,index)=>{
      const indicator=
        el(
          'div',
          undefined,
          'pess-step-progress-item'
        );

      indicator.append(
        el(
          'span',
          String(index+1),
          'pess-step-number'
        ),
        el(
          'strong',
          definition.title
        )
      );

      progress.append(
        indicator
      );

      progressItems.push(
        indicator
      );

      const step=
        el(
          'section',
          undefined,
          'pess-step'
        );

      step.dataset.step=
        String(index);

      if(index!==0){
        step.hidden=true;
      }

      const head=
        el(
          'div',
          undefined,
          'pess-step-head'
        );

      head.append(
        el(
          'h3',
          (index+1)+'. '+definition.title
        ),
        el(
          'p',
          definition.subtitle,
          'hint'
        )
      );

      step.append(
        head
      );

      if(definition.fields.length){
        const grid=
          el(
            'div',
            undefined,
            'pess-step-grid pess-step-grid-'+(index+1)
          );

        definition.fields.forEach(key=>{
          const node=
            fieldNode(
              key
            );

          if(node){
            grid.append(
              node
            );
          }
        });

        step.append(
          grid
        );
      }

      if(definition.extra){
        step.append(
          definition.extra
        );
      }

      const controls=
        el(
          'div',
          undefined,
          'pess-step-controls'
        );

      if(index>0){
        const previous=
          el(
            'button',
            'Anterior',
            'secondary'
          );

        previous.type='button';
        previous.dataset.previous=
          String(index-1);

        controls.append(
          previous
        );
      }

      if(!definition.final){
        const next=
          el(
            'button',
            index===0
              ?'Continuar para dados pessoais'
              :index===1
                ?'Continuar para endereço'
                :index===2
                  ?'Continuar para vínculo e parcelas'
                  :'Continuar para documentos'
          );

        next.type='button';
        next.dataset.next=
          String(index+1);

        controls.append(
          next
        );
      }

      step.append(
        controls
      );

      steps.push(
        step
      );

      stepper.append(
        step
      );
    });

    stepper.prepend(
      progress
    );

    const finalStep=
      steps[
        steps.length-1
      ];

    finalStep.append(
      submitActions
    );

    sourceGrid.remove();

    personForm.insertBefore(
      stepper,
      personForm.firstChild
    );

    let current=0;

    const isVisibleControl=control=>{
      if(control.disabled)return false;

      const hiddenAncestor=
        control.closest(
          '[hidden]'
        );

      if(hiddenAncestor){
        return false;
      }

      const style=
        window.getComputedStyle(
          control
        );

      return (
        style.display!=='none'&&
        style.visibility!=='hidden'
      );
    };

    const validateStep=index=>{
      const controls=
        Array.from(
          steps[index].querySelectorAll(
            'input,select,textarea'
          )
        ).filter(
          isVisibleControl
        );

      for(const control of controls){
        if(!control.reportValidity()){
          control.focus();
          return false;
        }
      }

      return true;
    };

    const showStep=index=>{
      current=index;

      steps.forEach((step,i)=>{
        step.hidden=
          i!==index;
      });

      progressItems.forEach((item,i)=>{
        item.classList.toggle(
          'active',
          i===index
        );

        item.classList.toggle(
          'done',
          i<index
        );
      });

      const first=
        steps[index].querySelector(
          'input:not([type="hidden"]),select,textarea'
        );

      requestAnimationFrame(()=>{
        steps[index].scrollIntoView({
          behavior:'smooth',
          block:'nearest'
        });

        if(first){
          first.focus({
            preventScroll:true
          });
        }
      });
    };

    stepper.addEventListener(
      'click',
      event=>{
        const next=
          event.target.closest(
            '[data-next]'
          );

        if(next){
          const target=
            Number(
              next.dataset.next
            );

          if(
            validateStep(
              current
            )
          ){
            showStep(
              target
            );
          }

          return;
        }

        const previous=
          event.target.closest(
            '[data-previous]'
          );

        if(previous){
          showStep(
            Number(
              previous.dataset.previous
            )
          );
        }
      }
    );

    showStep(
      0
    );

    return {
      root:stepper,
      showStep,
      validateStep,
      setVisible(visible){
        stepper.hidden=!visible;
      }
    };
  }

  function setImportedFormValue_(personForm,key,value){
    const next=String(value||'').trim();

    if(!next)return;

    const control=
      personForm.elements.namedItem(
        key
      );

    if(!control)return;

    control.value=next;

    control.dispatchEvent(
      new Event(
        'input',
        {bubbles:true}
      )
    );

    control.dispatchEvent(
      new Event(
        'change',
        {bubbles:true}
      )
    );
  }

  function setImportedFiles_(input,files){
    const selected=
      Array.from(files||[]);

    if(!input||!selected.length){
      return false;
    }

    try{
      const transfer=
        new DataTransfer();

      selected.forEach(
        file=>transfer.items.add(file)
      );

      input.files=
        transfer.files;

      input.dispatchEvent(
        new Event(
          'change',
          {bubbles:true}
        )
      );

      return true;
    }catch(e){
      return false;
    }
  }

          );

          importedFiles.RG_CPF=
            identityFiles.slice();

          importedFiles.RESIDENCIA=

          setImportedFiles_(
            uploads.RG_CPF,
            identityFiles
          );

          setImportedFiles_(

            residenceDate.dispatchEvent(
              new Event(
                'input',
                {bubbles:true}
              )
            );
          }

          if(
            residenceThird&&
            residence.terceiroSugerido

            residenceThird.dispatchEvent(
              new Event(
                'change',
                {bubbles:true}
              )
            );

            result.alertas&&
            result.alertas.length
          ){

              '',

     */

    edit.classList.add(

      'pess-register-panel'
    );

    edit.open=true;
    edit.hidden=true;

    edit.append(
      el(
        'p',
        'Preencha os dados da pessoa e anexe todos os documentos obrigatórios. O sistema não inicia o salvamento enquanto faltar qualquer grupo documental ou o vencimento do comprovante de residência; depois dos documentos gravados, gera automaticamente a minuta da petição inicial.',
        'hint'
      )
    );

    const uploads={};
    let residenceDate=null;
    let residenceThird=null;
    let residenceDeclaration=null;
    let residenceHolderIdentity=null;
    let seguroDefesoConsulta=null;
    let apiInfoText=null;

    const personForm=form(
      edit,
      personFields(),
      {uf:'RS'},
      async p=>{
        const qtd=
          Number(
            p.parcelasNaoRecebidas
          );

        if(
          !Number.isInteger(qtd)||
          qtd<1||
          qtd>4
        ){
          throw new Error(
            'Informe quantas parcelas do seguro-defeso não foram recebidas.'
          );
        }

        if(
          !App.state.boot.modelo||
          !App.state.boot.modelo.configurado
        ){
          throw new Error(
            'O modelo da petição inicial não está configurado. Envie e ative o DOCX em Administração antes de cadastrar a pessoa.'
          );
        }

        const faltantes=
          Object.entries(uploads)
            .filter(([,input])=>
              !input.files||
              !input.files.length
            )
            .map(([categoria])=>
              DOCUMENT_LABELS[categoria]||
              categoria
            );

        if(faltantes.length){
          throw new Error(
            'Anexe todos os documentos obrigatórios antes de salvar: '+
            faltantes.join(', ')+
            '.'
          );
        }

        const residenceDateValue=
          String(
            residenceDate&&
            residenceDate.value||
            ''
          ).trim();

        if(!residenceDateValue){
          throw new Error(
            'Informe o vencimento do comprovante de residência.'
          );
        }

        if(!App.isValidDateBR(residenceDateValue)){
          throw new Error(
            'Informe uma data de vencimento válida no formato DD/MM/AAAA.'
          );
        }

        if(
          residenceThird&&
          residenceThird.checked
        ){
          if(
            !residenceDeclaration||
            !residenceDeclaration.checked
          ){
            throw new Error(
              'Quando o comprovante estiver em nome de terceiro, confirme que há declaração de residência no documento.'
            );
          }

          if(
            !residenceHolderIdentity||
            !residenceHolderIdentity.files||
            !residenceHolderIdentity.files.length
          ){
            throw new Error(
              'Quando o comprovante estiver em nome de terceiro, anexe a carteira de identidade do titular da residência.'
            );
          }
        }

        const saved=
          await call(
            'pessoaSalvar',
            p,
            true
          );

        const enviados=[];
        const erros=[];

        for(
          const [categoria,input]
          of Object.entries(uploads)
        ){
          const files=
            Array.from(
              input.files||
              []
            );

          for(const file of files){
            try{
              if(
                file.size>
                5*1024*1024
              ){
                throw new Error(
                  'Arquivo maior que 5 MB.'
                );
              }

              const mime=
                mime_(file);

              if(
                ![
                  'application/pdf',
                  'image/jpeg',
                  'image/png'
                ].includes(mime)
              ){
                throw new Error(
                  'Formato não permitido. Use PDF, JPEG ou PNG.'
                );
              }

              const base64=
                await readFile_(file);

              await call(
                'pessoaUpload',
                {
                  pessoaId:saved.id,
                  categoria,
                  base64,
                  mime,
                  vencimento:
                    categoria==='RESIDENCIA'
                      ?String(
                          residenceDate.value||
                          ''
                        ).trim()
                      :'',
                  terceiro:
                    categoria==='RESIDENCIA'
                      ?!!residenceThird.checked
                      :false,
                  declaracaoTerceiro:
                    categoria==='RESIDENCIA'
                      ?!!residenceDeclaration.checked
                      :false
                },
                true
              );

              enviados.push(
                (
                  DOCUMENT_LABELS[categoria]||
                  categoria
                )+
                ' — '+
                file.name
              );

            }catch(e){
              erros.push(
                (
                  DOCUMENT_LABELS[categoria]||
                  categoria
                )+
                ' — '+
                file.name+
                ': '+
                (
                  e.message||
                  String(e)
                )
              );
            }
          }
        }

        if(
          residenceThird&&
          residenceThird.checked&&
          residenceHolderIdentity&&
          residenceHolderIdentity.files&&
          residenceHolderIdentity.files.length
        ){
          const holderFiles=
            Array.from(
              residenceHolderIdentity.files
            );

          for(const file of holderFiles){
            try{
              if(file.size>5*1024*1024){
                throw new Error(
                  'Arquivo maior que 5 MB.'
                );
              }

              const mime=
                mime_(file);

              if(
                ![
                  'application/pdf',
                  'image/jpeg',
                  'image/png'
                ].includes(mime)
              ){
                throw new Error(
                  'Formato não permitido. Use PDF, JPEG ou PNG.'
                );
              }

              const base64=
                await readFile_(file);

              await call(
                'pessoaUpload',
                {
                  pessoaId:saved.id,
                  categoria:'IDENTIDADE_TITULAR_RESIDENCIA',
                  base64,
                  mime,
                  vencimento:'',
                  terceiro:false,
                  declaracaoTerceiro:false
                },
                true
              );

              enviados.push(
                'Carteira de identidade do titular da residência — '+
                file.name
              );

            }catch(e){
              erros.push(
                'Carteira de identidade do titular da residência — '+
                file.name+
                ': '+
                (
                  e.message||
                  String(e)
                )
              );
            }
          }
        }

        if(erros.length){
          App.state.selection=
            saved.id;

          await go(
            'ACOMP',
            saved.id
          );

          status(
            'Cadastro salvo, mas existem documentos pendentes.\n\n'+
            'Arquivos enviados com sucesso: '+
            (
              enviados.length
                ?enviados.join(', ')
                :'nenhum'
            )+
            '\n\nFalhas:\n'+
            erros.join('\n')+
            '\n\nA minuta não foi gerada.',
            true
          );

          return;
        }

        try{
          await call(
            'pessoaFinalizarCadastro',
            {
              pessoaId:saved.id
            },
            true
          );

        }catch(e){
          App.state.selection=
            saved.id;

          await go(
            'ACOMP',
            saved.id
          );

          status(
            'Cadastro e documentos foram salvos corretamente.\n\n'+
            'A minuta não foi gerada:\n'+
            (
              e.message||
              String(e)
            ),
            true
          );

          return;
        }

        let relatorio=null;
        let relatorioErro='';

        const cpfAtual=
          String(p.cpf||'')
            .replace(/\D/g,'');

        if(
          seguroDefesoConsulta&&
          seguroDefesoConsulta.codigoConsultado===
            cpfAtual
        ){
          try{
            relatorio=
              await call(
                'seguroDefesoRelatorioGerar',
                {
                  pessoaId:saved.id,
                  generation:
                    crypto.randomUUID()
                },
                true
              );
          }catch(e){
            relatorioErro=
              e.message||
              String(e);
          }
        }

        App.state.selection=
          saved.id;

        await go(
          'ACOMP',
          saved.id
        );

        if(relatorioErro){
          status(
            'Cadastro, documentos e minuta concluídos.\n'+
            'O relatório do Seguro-Defeso não pôde ser gravado: '+
            relatorioErro,
            true
          );

        }else if(relatorio){
          status(
            'Cadastro, documentos, minuta e relatório oficial do Seguro-Defeso concluídos com sucesso.'
          );

        }else{
          status(
            'Cadastro, documentos e minuta concluídos com sucesso.'
          );
        }
      },
      'Salvar cadastro, documentos e gerar minuta'
    );

    personForm.classList.add(
      'pess-person-form'
    );

    /*
     * Outra entidade só existe visualmente quando a opção Outro estiver ativa.
     */
    const entidade=
      personForm
        .elements
        .namedItem(
          'entidade'
        );

    const outraEntidade=
      personForm
        .elements
        .namedItem(
          'outraEntidade'
        );

    if(
      entidade&&
      outraEntidade
    ){
      const outraWrap=
        outraEntidade
          .closest(
            'label'
          );

      const syncOutra=()=>{
        const show=
          entidade.value===
          'Outro';

        if(outraWrap){
          outraWrap.hidden=
            !show;

          outraWrap.style.display=
            show
              ?''
              :'none';
        }

        outraEntidade.required=
          show;

        if(!show){
          outraEntidade.value=
            '';
        }
      };

      entidade.addEventListener(
        'change',
        syncOutra
      );

      syncOutra();
    }

    /*
     * Consulta oficial do Seguro-Defeso junto ao campo CPF.
     */
    const cpfInput=
      personForm
        .elements
        .namedItem(
          'cpf'
        );

    if(cpfInput){
      const cpfField=
        cpfInput.closest(
          'label'
        );

      const apiInline=
        el(
          'div',
          undefined,
          'pess-cpf-api'
        );

      const apiButton=
        el(
          'button',
          'Consultar Seguro-Defeso'
        );

      apiButton.type=
        'button';

      apiButton.disabled=
        !(
          App.state.boot.portalTransparencia&&
          App.state.boot.portalTransparencia.configurada
        );

      apiInfoText=
        el(
          'small',
          App.state.boot.portalTransparencia&&
          App.state.boot.portalTransparencia.configurada
            ?'Consulta disponível.'
            :'API não configurada. Cadastre a chave em Administração.',
          App.state.boot.portalTransparencia&&
          App.state.boot.portalTransparencia.configurada
            ?'hint'
            :'warn'
        );

      apiButton.onclick=
        async()=>{
          try{
            const codigo=
              String(
                cpfInput.value||
                ''
              ).replace(/\D/g,'');

            if(!/^\d{11}$/.test(codigo)){
              throw new Error(
                'Informe um CPF completo no formato 000.000.000-00 antes de consultar.'
              );
            }

            apiInfoText.textContent=
              'Consultando a API oficial...';

            apiInfoText.className=
              'hint';

            const result=
              await call(
                'seguroDefesoConsultar',
                {
                  codigo
                }
              );

            seguroDefesoConsulta=
              result;

            const preenchimento=
              fillPersonFromApi_(
                personForm,
                result
              );

            apiInfoText.textContent=
              'Consulta concluída: '+
              result.quantidade+
              ' registro(s) de 2025 localizado(s).'+
              (
                preenchimento.messages.length
                  ?' '+preenchimento.messages.join('; ')+'.'
                  :''
              );

            showSeguroDefesoDialog_(
              result
            );

          }catch(e){
            apiInfoText.textContent=
              e.message||
              String(e);

            apiInfoText.className=
              'warn';

            status(
              e.message||
              String(e),
              true
            );
          }
        };

      apiInline.append(
        apiButton,
        apiInfoText
      );

      if(cpfField){
        cpfField.append(
          apiInline
        );
      }

      cpfInput.addEventListener(
        'input',
        ()=>{
          if(
            seguroDefesoConsulta&&
            seguroDefesoConsulta.codigoConsultado!==
              String(
                cpfInput.value||
                ''
              ).replace(/\D/g,'')
          ){
            seguroDefesoConsulta=null;

            apiInfoText.textContent=
              'CPF alterado. Consulte novamente para atualizar os dados.';

            apiInfoText.className=
              'warn';
          }
        }
      );
    }

    /*
     * Consulta de endereço por CEP.
     */
    const cepInput=
      personForm
        .elements
        .namedItem(
          'cep'
        );

    if(cepInput){
      const cepField=
        cepInput.closest(
          'label'
        );

      const cepInline=
        el(
          'div',
          undefined,
          'pess-cpf-api'
        );

      const cepButton=
        el(
          'button',
          'Consultar CEP'
        );

      cepButton.type=
        'button';

      const cepInfo=
        el(
          'small',
          'Consulta de logradouro disponível.',
          'hint'
        );

      cepButton.onclick=
        async()=>{
          try{
            const cep=
              String(
                cepInput.value||
                ''
              ).replace(/\D/g,'');

            if(!/^\d{8}$/.test(cep)){
              throw new Error(
                'Informe um CEP completo no formato 00000-000 antes de consultar.'
              );
            }

            cepInfo.textContent=
              'Consultando CEP...';

            cepInfo.className=
              'hint';

            const result=
              await call(
                'cepConsultar',
                {
                  cep
                }
              );

            if(
              result.cep
            ){
              cepInput.value=
                result.cep;

              cepInput.dispatchEvent(
                new Event(
                  'input',
                  {bubbles:true}
                )
              );
            }

            const messages=
              fillAddressFromCep_(
                personForm,
                result
              );

            cepInfo.textContent=
              'CEP localizado'+
              (
                result.logradouro
                  ?': '+result.logradouro
                  :''
              )+
              (
                messages.length
                  ?'. '+messages.join('; ')+'.'
                  :'. Endereço preenchido automaticamente.'
              );

          }catch(e){
            cepInfo.textContent=
              e.message||
              String(e);

            cepInfo.className=
              'warn';

            status(
              e.message||
              String(e),
              true
            );
          }
        };

      cepInline.append(
        cepButton,
        cepInfo
      );

      if(cepField){
        cepField.append(
          cepInline
        );
      }
    }

    /*
     * Cálculo do Seguro-Defeso.
     */
    const defeso=card(
      'Cálculo do Seguro-Defeso 2025'
    );

    defeso.classList.add(
      'pess-defeso-card'
    );

    defeso.append(
      el(
        'p',
        'Cada parcela corresponde a um salário mínimo de R$ 1.518,00. O valor da causa é calculado automaticamente pela quantidade informada no cadastro.',
        'hint'
      )
    );

    const resumo=el(
      'div',
      undefined,
      'grid'
    );

    const parcelaBox=card(
      'Valor de cada parcela'
    );

    parcelaBox.append(
      el(
        'strong',
        'R$ 1.518,00'
      )
    );

    const causaBox=card(
      'Valor da causa'
    );

    const causaText=el(
      'strong',
      'Selecione a quantidade de parcelas'
    );

    causaBox.append(
      causaText
    );

    resumo.append(
      parcelaBox,
      causaBox
    );

    defeso.append(
      resumo
    );

    const parcelasSelect=
      personForm
        .elements
        .namedItem(
          'parcelasNaoRecebidas'
        );

    const atualizarCalculo=()=>{
      const qtd=
        Number(
          parcelasSelect&&
          parcelasSelect.value||
          0
        );

      causaText.textContent=
        qtd
          ?'R$ '+
            moneyBR_(
              qtd*
              SALARIO_MINIMO_2025
            )
          :'Selecione a quantidade de parcelas';
    };

    if(parcelasSelect){
      parcelasSelect.addEventListener(
        'change',
        atualizarCalculo
      );

      atualizarCalculo();
    }

    /*
     * Documentos obrigatórios.
     */
    const documents=el(
      'section',
      undefined,
      'card pess-documents'
    );

    documents.append(
      el(
        'h3',
        'Documentos da pessoa'
      )
    );

    documents.append(
      el(
        'p',
        'Os documentos são armazenados diretamente na pasta individual da pessoa e podem ser reutilizados nos atendimentos vinculados ao cadastro.',
        'hint'
      )
    );

    documents.append(
      el(
        'p',
        'Todos os seis grupos documentais abaixo são obrigatórios para o cadastro inicial. Ao inserir o arquivo, o bloco é recolhido e passa a indicar “Documento inserido”. Formatos permitidos: PDF, JPEG e PNG. Limite de 5 MB por arquivo.',
        'hint'
      )
    );

    App.state.boot.config.categorias
      .forEach(categoria=>{
        const item=
          documentBox_(
            categoria
          );

        item.box.classList.add(
          'pess-doc-card'
        );

        if(categoria==='RESIDENCIA'){
          item.box.classList.add(
            'pess-doc-residence'
          );
        }

        uploads[categoria]=
          item.input;

        if(
          categoria===
          'RESIDENCIA'
        ){
          const residenceGrid=el(
            'div',
            undefined,
            'grid'
          );

          const dateLabel=el(
            'label',
            undefined,
            'field'
          );

          dateLabel.append(
            el(
              'span',
              'Vencimento do comprovante *'
            )
          );

          residenceDate=
            el('input');

          residenceDate.type=
            'text';

          residenceDate.placeholder=
            'DD/MM/AAAA';

          residenceDate.required=
            true;

          residenceDate.maxLength=
            10;

          residenceDate.inputMode=
            'numeric';

          maskDateInput_(
            residenceDate
          );

          dateLabel.append(
            residenceDate
          );

          const thirdLabel=el(
            'label',
            undefined,
            'field'
          );

          thirdLabel.append(
            el(
              'span',
              'Comprovante em nome de terceiro?'
            )
          );

          residenceThird=
            el('input');

          residenceThird.type=
            'checkbox';

          thirdLabel.append(
            residenceThird
          );

          const thirdPartyArea=
            el(
              'div',
              undefined,
              'card'
            );

          thirdPartyArea.hidden=
            true;

          thirdPartyArea.append(
            el(
              'p',
              'Quando o comprovante estiver em nome de terceiro, é obrigatória a identidade do titular da residência e a confirmação de que há declaração de residência no documento.',
              'hint'
            )
          );

          const identityLabel=
            el(
              'label',
              undefined,
              'field'
            );

          identityLabel.append(
            el(
              'span',
              'Carteira de identidade do titular da residência *'
            )
          );

          residenceHolderIdentity=
            el('input');

          residenceHolderIdentity.type=
            'file';

          residenceHolderIdentity.multiple=
            false;

          residenceHolderIdentity.accept=
            '.pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png';

          identityLabel.append(
            residenceHolderIdentity
          );

          const declarationLabel=
            el(
              'label',
              undefined,
              'field'
            );

          declarationLabel.append(
            el(
              'span',
              'Há declaração de residência no documento? *'
            )
          );

          residenceDeclaration=
            el('input');

          residenceDeclaration.type=
            'checkbox';

          declarationLabel.append(
            residenceDeclaration
          );

          thirdPartyArea.append(
            identityLabel,
            declarationLabel
          );

          residenceGrid.append(
            dateLabel,
            thirdLabel
          );

          item.box.append(
            residenceGrid,
            thirdPartyArea
          );

          const syncThirdParty=()=>{
            const active=
              !!residenceThird.checked;

            thirdPartyArea.hidden=
              !active;

            residenceHolderIdentity.required=
              active;

            residenceDeclaration.required=
              active;

            if(!active){
              residenceHolderIdentity.value='';
              residenceDeclaration.checked=false;
            }

            item.sync();
          };

          residenceThird.addEventListener(
            'change',
            syncThirdParty
          );

          residenceHolderIdentity.addEventListener(
            'change',
            item.sync
          );

          residenceDeclaration.addEventListener(
            'change',
            item.sync
          );

          item.setExtraReady(
            ()=>{
              const dateOk=
                App.isValidDateBR(
                  String(
                    residenceDate.value||
                    ''
                  )
                );

              const thirdOk=
                !residenceThird.checked||
                (
                  residenceHolderIdentity.files&&
                  residenceHolderIdentity.files.length>0&&
                  residenceDeclaration.checked
                );

              return (
                dateOk&&
                thirdOk
              );
            }
          );

          residenceDate.addEventListener(
            'input',
            ()=>{
              const value=
                String(
                  residenceDate.value||
                  ''
                );

              residenceDate.setCustomValidity(
                !value||
                App.isValidDateBR(value)
                  ?''
                  :'Informe uma data válida no formato DD/MM/AAAA.'
              );

              item.sync();
            }
          );

          residenceDate.addEventListener(
            'blur',
            item.sync
          );

          syncThirdParty();
        }

        documents.append(
          item.box
        );
      });

    documents.append(
      el(
        'p',
        'O botão Salvar somente prossegue quando todos os documentos obrigatórios e uma data válida de vencimento do comprovante de residência estiverem informados. Se o comprovante estiver em nome de terceiro, também são obrigatórias a identidade do titular da residência e a confirmação de que há declaração de residência no documento. Depois de salvar o cadastro e os documentos, o sistema gera automaticamente a minuta da petição inicial.',
        'hint'
      )
    );

    const actions=
      personForm.querySelector(
        '.actions'
      );

    if(actions){
      personForm.insertBefore(
        defeso,
        actions
      );

      personForm.insertBefore(
        documents,
        actions
      );

    }else{
      personForm.append(
        defeso,
        documents
      );
    }

    /*
     * Cadastro orientado por etapas:
     * 1 CPF/Seguro-Defeso
     * 2 dados pessoais
     * 3 endereço/CEP
     * 4 vínculo/parcelas
     * 5 documentos
     */
    const personStepper=
      buildPersonStepper_(
        personForm,
        defeso,
        documents
      );

    /*
     * Consulta de cadastros fica disponível como ação principal.
     */
    search=card(
      'Consultar cadastro'
    );

    search.classList.add(
      'pess-work-panel',
      'pess-search-panel'
    );

    search.hidden=true;

    root.append(
      search
    );

    await searchUI(
      search,
      p=>go(
        'ACOMP',
        p.id
      )
    );

    openSearch.onclick=()=>{
      showPanel_(
        search
      );

      const input=
        search.querySelector(
          'input'
        );

      if(input){
        input.focus();
      }
    };

    openDefeso.onclick=()=>{
      showPanel_(
        quickDefeso
      );

      quickCpf.focus();
    };

    openNew.onclick=()=>{
      showPanel_(
        edit
      );

      if(personStepper){
        personStepper.showStep(
          0
        );
      }

      const first=
        personForm.elements.namedItem(
          'cpf'
        );

      if(first){
        first.focus();
      }
    };
  };
})();
</script>
