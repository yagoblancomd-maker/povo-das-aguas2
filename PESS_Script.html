<script>
window.PDA_MODULES.PESS = (()=>{const {el,card,details,form,table,link,button,call,go,alive,personFields,atendFields,searchUI,guidance,uploadForm,status}=App;

root.append(el('h2','Pessoas'));
const search=card('Consultar cadastro');
root.append(search);
await searchUI(search,p=>go('ACOMP',p.id));
const edit=details(root,'Cadastrar pessoa');

form(edit,personFields(),{uf:'RS'},async p=>{const result=await call('pessoaSalvar',p,true);
await go('ACOMP',result.id);
},'Cadastrar pessoa');
};
})();
</script>
