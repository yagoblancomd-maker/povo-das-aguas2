<script>
window.PDA_MODULES.PESS = (()=>{
  const {
    el,card,details,form,call,go,personFields,searchUI,status
  }=App;

  const DOCUMENT_LABELS={
    RG_CPF:'Documento de identidade e CPF',
    RESIDENCIA:'Comprovante de residência',
    IDENTIDADE_TITULAR_RESIDENCIA:'Carteira de identidade do titular da residência',
    PROCESSO_ADMINISTRATIVO:'Processo administrativo',
    PESCA:'Documentos de pesca',
    PROCURACAO:'Procuração',
    HIPOSSUFICIENCIA:'Declaração de hipossuficiência'
  };

  const SALARIO_MINIMO_2025=1518.00;

  function moneyBR_(value){
    return Number(value||0).toLocaleString(
      'pt-BR',
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );
  }

  function dateBR_(value){
    const s=String(value||'').slice(0,10);

    if(!/^\d{4}-\d{2}-\d{2}$/.test(s)){
      return String(value||'');
    }

    return s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4);
  }

  function isResidenceDateRecent_(value){
    const text=String(value||'').trim();
    const match=text.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);

    if(!match||!App.isValidDateBR(text)){
      return false;
    }

    const date=new Date(
      Number(match[3]),
      Number(match[2])-1,
      Number(match[1]),
      12,0,0,0
    );

    const now=new Date();
    const today=new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate(),
      12,0,0,0
    );

    const min=new Date(today);
    min.setDate(min.getDate()-60);

    return date>=min&&date<=today;
  }

  function maskCpfInput_(input){
    const sync=()=>{
      const d=String(input.value||'')
        .replace(/\D/g,'')
        .slice(0,11);

      input.value=
        d
          .replace(/^(\d{3})(\d)/,'$1.$2')
          .replace(/^(\d{3})\.(\d{3})(\d)/,'$1.$2.$3')
          .replace(
            /^(\d{3})\.(\d{3})\.(\d{3})(\d{1,2}).*$/,
            '$1.$2.$3-$4'
          );
    };

    input.addEventListener('input',sync);
    input.addEventListener('blur',sync);
  }

  function maskDateInput_(input){
    const sync=()=>{
      const d=String(input.value||'')
        .replace(/\D/g,'')
        .slice(0,8);

      if(d.length<=2){
        input.value=d;
      }else if(d.length<=4){
        input.value=
          d.slice(0,2)+
          '/'+
          d.slice(2);
      }else{
        input.value=
          d.slice(0,2)+
          '/'+
          d.slice(2,4)+
          '/'+
          d.slice(4);
      }
    };

    input.addEventListener('input',sync);
    input.addEventListener('blur',sync);
  }

  function readFile_(file){
    return new Promise((resolve,reject)=>{
      const reader=new FileReader();

      reader.onload=()=>{
        const result=String(reader.result||'');
        const parts=result.split(',');

        if(parts.length<2){
          reject(new Error('Não foi possível ler o arquivo.'));
          return;
        }

        resolve(parts[1]);
      };

      reader.onerror=()=>reject(
        reader.error||
        new Error('Erro ao ler o arquivo.')
      );

      reader.readAsDataURL(file);
    });
  }

  async function prepareUploadFile_(file){
    if(!file){
      throw new Error('Arquivo inválido.');
    }

    if(file.size>5*1024*1024){
      throw new Error(
        file.name+': arquivo maior que 5 MB.'
      );
    }

    const originalMime=mime_(file);

    if(
      ![
        'application/pdf',
        'image/jpeg',
        'image/png'
      ].includes(originalMime)
    ){
      throw new Error(
        file.name+': formato não permitido. Use PDF, JPEG ou PNG.'
      );
    }

    if(
      originalMime==='application/pdf'||
      file.size<=900*1024
    ){
      return {
        nome:file.name,
        mime:originalMime,
        base64:await readFile_(file)
      };
    }

    const url=URL.createObjectURL(file);

    try{
      const image=new Image();
      image.src=url;
      await image.decode();

      const maxSide=1800;
      const scale=Math.min(
        1,
        maxSide/image.width,
        maxSide/image.height
      );

      const canvas=document.createElement('canvas');
      canvas.width=Math.max(
        1,
        Math.round(image.width*scale)
      );
      canvas.height=Math.max(
        1,
        Math.round(image.height*scale)
      );

      const context=canvas.getContext('2d');
      context.drawImage(
        image,
        0,
        0,
        canvas.width,
        canvas.height
      );

      const blob=await new Promise(resolve=>
        canvas.toBlob(
          resolve,
          'image/jpeg',
          .82
        )
      );

      if(!blob){
        throw new Error(
          'Não foi possível otimizar '+file.name+'.'
        );
      }

      return {
        nome:
          String(file.name||'imagem')
            .replace(/\.[^.]+$/,'')+
          '.jpg',
        mime:'image/jpeg',
        base64:await readFile_(blob)
      };

    }finally{
      URL.revokeObjectURL(url);
    }
  }

  function mime_(file){
    if(file.type)return file.type;

    const ext=
      (file.name.split('.').pop()||'')
        .toLowerCase();

    if(ext==='pdf')return 'application/pdf';
    if(ext==='jpg'||ext==='jpeg')return 'image/jpeg';
    if(ext==='png')return 'image/png';

    return '';
  }

  function documentSummary_(summary,title,state,count){
    const ok=state==='ok';
    const text=
      ok
        ?(
            count>1
              ?count+' documentos inseridos'
              :'Documento inserido'
          )
        :state==='incomplete'
          ?'Documento inserido · complete os dados'
          :'Pendente';

    summary.innerHTML=
      '<span class="pess-doc-summary-content">'+
        '<span class="pess-doc-status-icon '+(ok?'ok':'pending')+'" aria-hidden="true">'+
          (ok?'✓':'!')+
        '</span>'+
        '<span class="pess-doc-summary-label"></span>'+
        '<span class="pess-doc-summary-separator">—</span>'+
        '<span class="pess-doc-summary-state '+(ok?'ok':'pending')+'"></span>'+
      '</span>';

    summary.querySelector('.pess-doc-summary-label').textContent=title;
    summary.querySelector('.pess-doc-summary-state').textContent=text;
    summary.setAttribute('aria-label',title+' — '+text);
  }

  function documentBox_(categoria){
    const title=
      DOCUMENT_LABELS[categoria]||
      categoria;

    const box=el('details');
    box.open=true;

    const summary=el(
      'summary'
    );

    documentSummary_(
      summary,
      title,
      'pending',
      0
    );

    box.append(summary);

    const label=el(
      'label',
      undefined,
      'field'
    );

    label.append(
      el(
        'span',
        'Selecionar arquivo(s) *'
      )
    );

    const input=el('input');
    input.type='file';
    input.multiple=true;
    input.required=true;
    input.accept=
      '.pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png';

    label.append(input);
    box.append(label);

    let extraReady=()=>true;

    const sync=()=>{
      const count=
        (
          input.files&&
          input.files.length
        )||
        Number(
          input.dataset.importedCount||
          (
            input.dataset.imported==='true'
              ?1
              :0
          )
        );

      const ready=
        count>0&&
        extraReady();

      input.required=
        count===0;

      if(!count){
        documentSummary_(
          summary,
          title,
          'pending',
          0
        );

        box.open=true;
        return;
      }

      if(ready){
        documentSummary_(
          summary,
          title,
          'ok',
          count
        );

        box.open=false;
      }else{
        documentSummary_(
          summary,
          title,
          'incomplete',
          count
        );

        box.open=true;
      }
    };

    input.addEventListener(
      'change',
      ()=>{
        if(
          input.files&&
          input.files.length
        ){
          delete input.dataset.imported;
          delete input.dataset.importedCount;
        }

        sync();
      }
    );

    return {
      box,
      input,
      sync,
      setExtraReady(fn){
        extraReady=fn;
        sync();
      }
    };
  }

  function normalizeApiText_(value){
    return String(value||'')
      .trim()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g,'')
      .toLowerCase();
  }

  function uniqueApiValues_(registros,key){
    const values=[];

    (registros||[]).forEach(r=>{
      const value=String(r&&r[key]||'').trim();

      if(
        value&&
        !values.some(existing=>
          normalizeApiText_(existing)===
          normalizeApiText_(value)
        )
      ){
        values.push(value);
      }
    });

    return values;
  }

  function selectMatchingOption_(select,value){
    if(!select||!value)return false;

    const target=
      normalizeApiText_(value);

    const option=
      Array.from(select.options||[])
        .find(o=>
          normalizeApiText_(o.value)===target||
          normalizeApiText_(o.textContent)===target
        );

    if(!option)return false;

    select.value=option.value;

    select.dispatchEvent(
      new Event(
        'change',
        {bubbles:true}
      )
    );

    return true;
  }

  function fillPersonFromApi_(personForm,consulta){
    const registros=
      consulta&&
      Array.isArray(consulta.registros)
        ?consulta.registros
        :[];

    const nomes=
      uniqueApiValues_(
        registros,
        'nome'
      );

    const municipios=
      uniqueApiValues_(
        registros,
        'nomeIBGE'
      );

    const ufs=
      uniqueApiValues_(
        registros,
        'ufSigla'
      );

    const messages=[];

    const nomeInput=
      personForm.elements.namedItem(
        'nome'
      );

    if(nomes.length===1&&nomeInput){
      const apiNome=
        nomes[0];

      if(!String(nomeInput.value||'').trim()){
        nomeInput.value=
          apiNome;

        nomeInput.dispatchEvent(
          new Event(
            'input',
            {bubbles:true}
          )
        );

        messages.push(
          'nome completo preenchido pela API'
        );

      }else if(
        normalizeApiText_(nomeInput.value)!==
        normalizeApiText_(apiNome)
      ){
        messages.push(
          'o nome retornado pela API difere do nome já digitado e não foi sobrescrito'
        );
      }
    }else if(nomes.length>1){
      messages.push(
        'a API retornou mais de um nome e o campo Nome completo não foi preenchido automaticamente'
      );
    }

    const municipioSelect=
      personForm.elements.namedItem(
        'cidade'
      );

    if(
      municipios.length===1&&
      municipioSelect
    ){
      const apiMunicipio=
        municipios[0];

      if(!String(municipioSelect.value||'').trim()){
        if(
          selectMatchingOption_(
            municipioSelect,
            apiMunicipio
          )
        ){
          messages.push(
            'município preenchido pela API'
          );
        }else{
          messages.push(
            'o município retornado pela API não consta na lista de municípios cadastrados'
          );
        }

      }else if(
        normalizeApiText_(municipioSelect.value)!==
        normalizeApiText_(apiMunicipio)
      ){
        messages.push(
          'o município retornado pela API difere do município já selecionado e não foi sobrescrito'
        );
      }
    }else if(municipios.length>1){
      messages.push(
        'a API retornou mais de um município e o campo Município não foi preenchido automaticamente'
      );
    }

    const ufSelect=
      personForm.elements.namedItem(
        'uf'
      );

    if(
      ufs.length===1&&
      ufSelect&&
      !String(ufSelect.value||'').trim()
    ){
      selectMatchingOption_(
        ufSelect,
        ufs[0]
      );
    }

    return {
      nomes,
      municipios,
      ufs,
      messages
    };
  }

  function splitLogradouro_(logradouro){
    const original=String(logradouro||'').trim();

    if(!original){
      return {
        tipoVia:'',
        via:''
      };
    }

    const tipos=[
      'Loteamento',
      'Servidão',
      'Travessa',
      'Avenida',
      'Estrada',
      'Rodovia',
      'Alameda',
      'Praça',
      'Beco',
      'Vila',
      'Linha',
      'Acesso',
      'Rua'
    ];

    const normalized=
      normalizeApiText_(
        original
      );

    const tipo=
      tipos.find(item=>
        normalized===
          normalizeApiText_(item)||
        normalized.startsWith(
          normalizeApiText_(item)+' '
        )
      );

    if(!tipo){
      return {
        tipoVia:'',
        via:original
      };
    }

    return {
      tipoVia:tipo,
      via:original
        .slice(tipo.length)
        .trim()
    };
  }

  function setInputIfEmpty_(input,value,messages,label){
    const next=String(value||'').trim();

    if(!input||!next)return false;

    const current=
      String(input.value||'')
        .trim();

    if(!current){
      input.value=next;

      input.dispatchEvent(
        new Event(
          'input',
          {bubbles:true}
        )
      );

      input.dispatchEvent(
        new Event(
          'change',
          {bubbles:true}
        )
      );

      messages.push(
        label+
        ' preenchido pelo CEP'
      );

      return true;
    }

    if(
      normalizeApiText_(current)!==
      normalizeApiText_(next)
    ){
      messages.push(
        label+
        ' retornado pelo CEP difere do valor já preenchido e não foi sobrescrito'
      );
    }

    return false;
  }

  function fillAddressFromCep_(personForm,result){
    const messages=[];
    const parts=
      splitLogradouro_(
        result.logradouro
      );

    const tipoVia=
      personForm.elements.namedItem(
        'tipoVia'
      );

    const via=
      personForm.elements.namedItem(
        'via'
      );

    const bairro=
      personForm.elements.namedItem(
        'bairro'
      );

    const cidade=
      personForm.elements.namedItem(
        'cidade'
      );

    const uf=
      personForm.elements.namedItem(
        'uf'
      );

    /*
     * Ao clicar em "Consultar CEP", o endereço retornado pelo serviço passa a
     * ser a referência para logradouro, bairro, município e UF.
     * Número e complemento continuam sempre manuais.
     */
    if(
      tipoVia&&
      parts.tipoVia
    ){
      tipoVia.value=
        parts.tipoVia;

      tipoVia.dispatchEvent(
        new Event(
          'input',
          {bubbles:true}
        )
      );
    }

    if(
      via&&
      (
        parts.via||
        result.logradouro
      )
    ){
      via.value=
        parts.via||
        result.logradouro;

      via.dispatchEvent(
        new Event(
          'input',
          {bubbles:true}
        )
      );
    }

    if(
      bairro&&
      result.bairro
    ){
      bairro.value=
        result.bairro;

      bairro.dispatchEvent(
        new Event(
          'input',
          {bubbles:true}
        )
      );
    }

    if(
      cidade&&
      result.cidade
    ){
      if(
        !selectMatchingOption_(
          cidade,
          result.cidade
        )
      ){
        messages.push(
          'o município retornado pelo CEP não consta na lista de municípios cadastrados'
        );
      }
    }

    if(
      uf&&
      result.uf
    ){
      selectMatchingOption_(
        uf,
        result.uf
      );
    }

    return messages;
  }

  function apiRecordText_(r){
    return [
      'ID: '+(r.id||'—'),
      'CPF: '+(r.cpfFormatado||'—'),
      'NIS: '+(r.nis||'—'),
      'Nome: '+(r.nome||'—'),
      'Código IBGE: '+(r.codigoIBGE||'—'),
      'Município: '+(r.nomeIBGE||'—'),
      'Código da região: '+(r.codigoRegiao||'—'),
      'Região: '+(r.nomeRegiao||'—'),
      'País: '+(r.pais||'—'),
      'UF: '+(r.ufSigla||'—'),
      'Nome da UF: '+(r.ufNome||'—'),
      'Portaria: '+(r.portaria||'—'),
      'Mês de referência: '+(dateBR_(r.dataMesReferencia)||'—'),
      'Data do saque: '+(dateBR_(r.dataSaque)||'—'),
      'Data de emissão da parcela: '+(dateBR_(r.dataEmissaoParcela)||'—'),
      'Situação: '+(r.situacao||'—'),
      'RGP: '+(r.rgp||'—'),
      'Parcela: '+(r.parcela||'—'),
      'Valor: R$ '+moneyBR_(r.valor)
    ].join('\n');
  }

    );

    dialog.append(
      el(
        'h2',
        'Consulta Seguro-Defeso — Portal da Transparência'
      )
    );

    dialog.append(
      el(
        'p',
        'Fonte: '+
        consulta.fonte+

      'div',

      'stats'
    );

      'div',
      undefined,
      'stat'
    );

    totalRegistros.append(
      el(
        'strong',
        String(consulta.quantidade||0)
      ),
      el(
        'span',
        'registros de 2025'
      )
    );

    const totalValor=el(
      'div',
      undefined,
      'stat'
    );

    totalValor.append(
      el(
        'strong',
        'R$ '+moneyBR_(consulta.valorTotal)
      ),
      el(
        'span',
        'valor total localizado'
      )
    );

    const totalFora=el(
      'div',
      undefined,
      'stat'
    );

    totalFora.append(

        'strong',

      dialog.append(
        el(
          'p',
          'Nenhum registro com mês de referência em 2025 foi localizado para o CPF/NIS consultado.',

        )
      );
    }else{
      consulta.registros.forEach(
        (r,index)=>{
          const d=el('details');

          d.append(
            el(
              'summary',
              (
                r.parcela
                  ?'Parcela '+r.parcela
                  :'Registro '+(index+1)
              )+
              ' — '+
              (
                dateBR_(r.dataMesReferencia)||
                'sem mês de referência'
              )+
              ' — R$ '+
              moneyBR_(r.valor)
            )
          );

          d.append(
            el(
              'pre',
              apiRecordText_(r)
            )
          );

          dialog.append(d);

    dialog.append(
      el(
        'p',

        'hint'
      )

    const actions=el(
      'div',
      undefined,
      'actions'
    );

    actions.append(
      (()=> {

          'button',
          'Fechar'
        );

        b.onclick=()=>dialog.close();

        return b;
      })()
    );

    dialog.append(actions);
    document.body.append(dialog);

    dialog.addEventListener(
      'close',
      ()=>dialog.remove()
    );

    dialog.showModal();
  }

  function buildPersonStepper_(personForm,defeso,documents){
    const sourceGrid=
      Array.from(personForm.children)
        .find(node=>
          node.classList&&
          node.classList.contains('grid')
        );

    const submitActions=
      personForm.querySelector(
        ':scope > .actions'
      );

    if(!sourceGrid||!submitActions){
      return null;
    }

    const fieldNode=key=>
      sourceGrid.querySelector(
        '[data-field="'+key+'"]'
      );

    const stepper=
      el(
        'div',
        undefined,
        'pess-stepper'
      );

    const progress=
      el(
        'div',
        undefined,
        'pess-step-progress'
      );

    const definitions=[
      {
        title:'CPF',
        subtitle:'Identificação e consulta oficial',
        fields:['cpf']
      },
      {
        title:'Dados pessoais',
        subtitle:'Nome e contato',
        fields:['nome','nascimento','telefone','email']
      },
      {
        title:'Endereço',
        subtitle:'CEP e residência',
        fields:['cep','tipoVia','via','numero','complemento','bairro','cidade','uf']
      },
      {
        title:'Vínculo e benefício',
        subtitle:'Entidade e parcelas',
        fields:['entidade','outraEntidade','analfabeto','parcelasNaoRecebidas'],
        extra:defeso
      },
      {
        title:'Documentos',
        subtitle:'Arquivos obrigatórios',
        fields:[],
        extra:documents,
        final:true
      }
    ];

    const progressItems=[];
    const steps=[];

    definitions.forEach((definition,index)=>{
      const indicator=
        el(
          'div',
          undefined,
          'pess-step-progress-item'
        );

      indicator.append(
        el(
          'span',
          String(index+1),
          'pess-step-number'
        ),
        el(
          'strong',
          definition.title
        )
      );

      progress.append(
        indicator
      );

      progressItems.push(
        indicator
      );

      const step=
        el(
          'section',
          undefined,
          'pess-step'
        );

      step.dataset.step=
        String(index);

      if(index!==0){
        step.hidden=true;
      }

      const head=
        el(
          'div',
          undefined,
          'pess-step-head'
        );

      head.append(
        el(
          'h3',
          (index+1)+'. '+definition.title
        ),
        el(
          'p',
          definition.subtitle,
          'hint'
        )
      );

      step.append(
        head
      );

      if(definition.fields.length){
        const grid=
          el(
            'div',
            undefined,
            'pess-step-grid pess-step-grid-'+(index+1)
          );

        definition.fields.forEach(key=>{
          const node=
            fieldNode(
              key
            );

          if(node){
            grid.append(
              node
            );
          }
        });

        step.append(
          grid
        );
      }

      if(definition.extra){
        step.append(
          definition.extra
        );
      }

      const controls=
        el(
          'div',
          undefined,
          'pess-step-controls'
        );

      if(index>0){
        const previous=
          el(
            'button',
            'Anterior',
            'secondary'
          );

        previous.type='button';
        previous.dataset.previous=
          String(index-1);

        controls.append(
          previous
        );
      }

      if(!definition.final){
        const next=
          el(
            'button',
            index===0
              ?'Continuar para dados pessoais'
              :index===1
                ?'Continuar para endereço'
                :index===2
                  ?'Continuar para vínculo e parcelas'
                  :'Continuar para documentos'
          );

        next.type='button';
        next.dataset.next=
          String(index+1);

        controls.append(
          next
        );
      }

      step.append(
        controls
      );

      steps.push(
        step
      );

      stepper.append(
        step
      );
    });

    stepper.prepend(
      progress
    );

    const finalStep=
      steps[
        steps.length-1
      ];

    finalStep.append(
      submitActions
    );

    sourceGrid.remove();

    personForm.insertBefore(
      stepper,
      personForm.firstChild
    );

    let current=0;

    const isVisibleControl=control=>{
      if(control.disabled)return false;

      const hiddenAncestor=
        control.closest(
          '[hidden]'
        );

      if(hiddenAncestor){
        return false;
      }

      const style=
        window.getComputedStyle(
          control
        );

      return (
        style.display!=='none'&&
        style.visibility!=='hidden'
      );
    };

    const validateStep=index=>{
      const controls=
        Array.from(
          steps[index].querySelectorAll(
            'input,select,textarea'
          )
        ).filter(
          isVisibleControl
        );

      for(const control of controls){
        if(!control.reportValidity()){
          control.focus();
          return false;
        }
      }

      return true;
    };

    const showStep=index=>{
      current=index;

      steps.forEach((step,i)=>{
        step.hidden=
          i!==index;
      });

      progressItems.forEach((item,i)=>{
        item.classList.toggle(
          'active',
          i===index
        );

        item.classList.toggle(
          'done',
          i<index
        );
      });

      const first=
        steps[index].querySelector(
          'input:not([type="hidden"]),select,textarea'
        );

      requestAnimationFrame(()=>{
        steps[index].scrollIntoView({
          behavior:'smooth',
          block:'nearest'
        });

        if(first){
          first.focus({
            preventScroll:true
          });
        }
      });
    };

    stepper.addEventListener(
      'click',
      event=>{
        const next=
          event.target.closest(
            '[data-next]'
          );

        if(next){
          const target=
            Number(
              next.dataset.next
            );

          if(
            validateStep(
              current
            )
          ){
            showStep(
              target
            );
          }

          return;
        }

        const previous=
          event.target.closest(
            '[data-previous]'
          );

        if(previous){
          showStep(
            Number(
              previous.dataset.previous
            )
          );
        }
      }
    );

    showStep(
      0
    );

    return {
      root:stepper,
      showStep,
      validateStep,
      setVisible(visible){
        stepper.hidden=!visible;
      }
    };
  }

  function setImportedFormValue_(personForm,key,value){
    const next=String(value||'').trim();

    if(!next)return;

    const control=
      personForm.elements.namedItem(
        key
      );

    if(!control)return;

    control.value=next;

    control.dispatchEvent(
      new Event(
        'input',
        {bubbles:true}
      )
    );

    control.dispatchEvent(
      new Event(
        'change',
        {bubbles:true}
      )
    );
  }

  function setImportedFiles_(input,files){
    const selected=
      Array.from(files||[]);

    if(!input||!selected.length){
      return false;
    }

    try{
      const transfer=
        new DataTransfer();

      selected.forEach(
        file=>transfer.items.add(file)
      );

      input.files=
        transfer.files;

      input.dispatchEvent(
        new Event(
          'change',
          {bubbles:true}
        )
      );

      return true;
    }catch(e){
      input.required=false;
      input.dataset.imported='true';
      input.dataset.importedCount=
        String(selected.length);

      input.dispatchEvent(
        new Event(
          'change',
          {bubbles:true}
        )
      );

      return false;
    }
  }

          if(residenceFile){

            );

          if(

                ?'CPF identificado e validado.'
                :'CPF não identificado ou inválido.'

          }else{

          if(residenceFile){

                ?'Endereço conferido por '+residence.fonteCep+'.'
                :'Endereço deverá ser conferido manualmente.'
            );
          }else{
            lines.push(
              'Comprovante de residência não enviado nesta leitura.'
            );
          }

          if(
            result.alertas&&
            result.alertas.length
          ){
            lines.push(
              '',
              'Conferências necessárias:',
              ...result.alertas.map(
                item=>'• '+item

            );

          resultBox.textContent=
            lines.join('\n');

                  item=>'• '+item
                ).join('\n')
              :'';

          status(
            'Dados importados. Confira cada etapa antes de salvar.'+
            warningText
          );

        }catch(e){
          resultBox.textContent=
            e.message||
            String(e);

          resultBox.className=
            'pess-import-result error';

          status(
            e.message||
            String(e),
            true
          );

        }finally{
          analyze.disabled=false;
          manual.disabled=false;
          analyze.textContent=
            'Ler documentos e preencher cadastro';
        }
      };

    personForm.insertBefore(
      panel,
      personForm.firstChild
    );

    if(personStepper){

    }

    return {
      root:panel,
      showStart(){
        panel.hidden=false;

        if(personStepper){
          personStepper.setVisible(false);
        }

        requestAnimationFrame(
          ()=>{
            identityInput.focus();
          }
        );
      },
      showForm
    };
  }

  return async function(ctx){
    const root=ctx.root;

    const pageHead=
      el(
        'div',
        undefined,
        'pess-page-head'
      );

    const pageTitle=
      el(
        'div'
      );

    pageTitle.append(
      el(
        'h2',
        'Novo Cadastro'
      ),
      el(
        'p',
        'Cadastre uma nova pessoa, importe dados dos documentos e conclua a documentação inicial.',
        'pess-page-subtitle'
      )
    );

    pageHead.append(
      pageTitle
    );

    root.append(
      pageHead
    );

    let edit=null;

    /*
     * Cadastro completo. Mantém as consultas de CPF/Seguro-Defeso e CEP
     * dentro do próprio formulário.
     */
    edit=details(
      root,
      'Incluir nova pessoa'
    );

    edit.classList.add(
      'pess-work-panel',
      'pess-register-panel'
    );

    edit.open=true;
    edit.hidden=false;

    edit.append(
      el(
        'p',
        'Preencha os dados da pessoa e anexe todos os documentos obrigatórios. O sistema não inicia o salvamento enquanto faltar qualquer grupo documental ou o vencimento do comprovante de residência; depois dos documentos gravados, gera automaticamente a minuta da petição inicial.',
        'hint'
      )
    );

    const uploads={};
    const importedFiles={
      RG_CPF:[],
      RESIDENCIA:[]
    };

    const selectedFiles_=(categoria,input)=>{
      const direct=
        Array.from(
          input&&input.files||
          []
        );

      if(direct.length){
        return direct;
      }

      return Array.from(
        importedFiles[categoria]||
        []
      );
    };

    let residenceDate=null;
    let residenceThird=null;
    let residenceDeclaration=null;
    let residenceHolderIdentity=null;
    let seguroDefesoConsulta=null;
    let apiInfoText=null;

    const personForm=form(
      edit,
      personFields(),
      {uf:'RS'},
      async p=>{
        const qtd=
          Number(
            p.parcelasNaoRecebidas
          );

        if(
          !Number.isInteger(qtd)||
          qtd<1||
          qtd>4
        ){
          throw new Error(
            'Informe quantas parcelas do seguro-defeso não foram recebidas.'
          );
        }

        if(
          !App.state.boot.modelo||
          !App.state.boot.modelo.configurado
        ){
          throw new Error(
            'O modelo da petição inicial não está configurado. Envie e ative o DOCX em Administração antes de cadastrar a pessoa.'
          );
        }

        const faltantes=
          Object.entries(uploads)
            .filter(([categoria,input])=>
              !selectedFiles_(
                categoria,
                input
              ).length
            )
            .map(([categoria])=>
              DOCUMENT_LABELS[categoria]||
              categoria
            );

        if(faltantes.length){
          throw new Error(
            'Anexe todos os documentos obrigatórios antes de salvar: '+
            faltantes.join(', ')+
            '.'
          );
        }

        const residenceDateValue=
          String(
            residenceDate&&
            residenceDate.value||
            ''
          ).trim();

        if(!residenceDateValue){
          throw new Error(
            'Informe a data do comprovante de residência.'
          );
        }

        if(!App.isValidDateBR(residenceDateValue)){
          throw new Error(
            'Informe uma data válida no formato DD/MM/AAAA para o comprovante de residência.'
          );
        }

        if(!isResidenceDateRecent_(residenceDateValue)){
          throw new Error(
            'O comprovante de residência deve ter data dos últimos 60 dias e não pode ter data futura.'
          );
        }

        if(
          residenceThird&&
          residenceThird.checked
        ){
          if(
            !residenceDeclaration||
            !residenceDeclaration.checked
          ){
            throw new Error(
              'Quando o comprovante estiver em nome de terceiro, confirme que há declaração de residência no documento.'
            );
          }

          if(
            !residenceHolderIdentity||
            !residenceHolderIdentity.files||
            !residenceHolderIdentity.files.length
          ){
            throw new Error(
              'Quando o comprovante estiver em nome de terceiro, anexe a carteira de identidade do titular da residência.'
            );
          }
        }

        const cpfAtual=
          String(p.cpf||'')
            .replace(/\D/g,'');

        const checkpointKey=
          'PDA_CADASTRO_CHECKPOINT_V1_'+
          cpfAtual;

        let checkpoint={};

        try{
          checkpoint=
            JSON.parse(
              sessionStorage.getItem(
                checkpointKey
              )||
              '{}'
            );
        }catch(e){
          checkpoint={};
        }

        const saveCheckpoint_=
          patch=>{
            checkpoint=
              Object.assign(
                {},
                checkpoint,
                patch,
                {
                  cpf:cpfAtual,
                  atualizadoEm:
                    new Date().toISOString()
                }
              );

            try{
              sessionStorage.setItem(
                checkpointKey,
                JSON.stringify(
                  checkpoint
                )
              );
            }catch(e){}
          };

        let workflowId=
          App.beginWorkflowProcessing(
            'Salvando novo cadastro',
            48
          );

        const progress_=
          (
            percent,
            message,
            remaining,
            patch
          )=>{
            if(patch){
              saveCheckpoint_(patch);
            }

            App.updateWorkflowProcessing(
              workflowId,
              percent,
              message,
              remaining
            );
          };

        let saved=null;

        try{
          progress_(
            4,
            'Validando e registrando os dados da pessoa…',
            45
          );

          if(
            checkpoint.pessoaId
          ){
            saved={
              id:
                checkpoint.pessoaId,
              folderId:
                checkpoint.folderId||
                ''
            };

            progress_(
              12,
              'Retomando cadastro já salvo anteriormente…',
              39
            );

          }else{
            saved=
              await call(
                'pessoaSalvar',
                p,
                true,
                {silent:true}
              );

            saveCheckpoint_({
              pessoaId:saved.id,
              folderId:
                saved.folderId||
                '',
              etapa:'PESSOA_SALVA'
            });

            progress_(
              16,
              'Cadastro salvo. Preparando os documentos…',
              36
            );
          }

          const specs=[];

          Object.entries(uploads)
            .forEach(
              ([categoria,input])=>{
                selectedFiles_(
                  categoria,
                  input
                )
                  .forEach(file=>
                    specs.push({
                      categoria,
                      file,
                      vencimento:
                        categoria==='RESIDENCIA'
                          ?residenceDateValue
                          :'',
                      terceiro:
                        categoria==='RESIDENCIA'
                          ?!!residenceThird.checked
                          :false,
                      declaracaoTerceiro:
                        categoria==='RESIDENCIA'
                          ?!!residenceDeclaration.checked
                          :false
                    })
                  );
              }
            );

          if(
            residenceThird&&
            residenceThird.checked&&
            residenceHolderIdentity&&
            residenceHolderIdentity.files
          ){
            Array.from(
              residenceHolderIdentity.files
            )
              .forEach(file=>
                specs.push({
                  categoria:
                    'IDENTIDADE_TITULAR_RESIDENCIA',
                  file,
                  vencimento:'',
                  terceiro:false,
                  declaracaoTerceiro:false
                })
              );
          }

          const prepared=[];

          for(
            let index=0;
            index<specs.length;
            index++
          ){
            const spec=specs[index];

            progress_(
              18+
              Math.round(
                (
                  index/
                  Math.max(
                    1,
                    specs.length
                  )
                )*
                16
              ),
              'Preparando documento '+
              (index+1)+
              ' de '+
              specs.length+
              ': '+
              spec.file.name,
              Math.max(
                24,
                36-index*2
              )
            );

            const file=
              await prepareUploadFile_(
                spec.file
              );

            prepared.push(
              Object.assign(
                {},
                file,
                {
                  categoria:
                    spec.categoria,
                  vencimento:
                    spec.vencimento,
                  terceiro:
                    spec.terceiro,
                  declaracaoTerceiro:
                    spec.declaracaoTerceiro
                }
              )
            );
          }

          /*
           * Agrupa os documentos em lotes de aproximadamente 12 MB de
           * base64. Normalmente todo o cadastro segue em uma chamada, mas
           * arquivos maiores são fracionados para evitar limites do Apps Script.
           */
          const batches=[];
          let current=[];
          let currentSize=0;
          const maxBatchChars=
            12*1024*1024;

          prepared.forEach(item=>{
            const size=
              String(
                item.base64||
                ''
              ).length;

            if(
              current.length&&
              currentSize+size>
                maxBatchChars
            ){
              batches.push(current);
              current=[];
              currentSize=0;
            }

            current.push(item);
            currentSize+=size;
          });

          if(current.length){
            batches.push(current);
          }

          const uploadErrors=[];
          let uploadedCount=0;

          for(
            let index=0;
            index<batches.length;
            index++
          ){
            progress_(
              38+
              Math.round(
                (
                  index/
                  Math.max(
                    1,
                    batches.length
                  )
                )*
                30
              ),
              'Enviando documentos ao Drive — lote '+
              (index+1)+
              ' de '+
              batches.length+
              '…',
              Math.max(
                12,
                26-index*7
              ),
              {
                etapa:
                  'ENVIANDO_DOCUMENTOS'
              }
            );

            const batchResult=
              await call(
                'pessoaUploadLote',
                {
                  pessoaId:saved.id,
                  folderId:
                    saved.folderId||
                    checkpoint.folderId||
                    '',
                  arquivos:batches[index]
                },
                true,
                {silent:true}
              );

            uploadedCount+=
              Number(
                batchResult.quantidade||
                0
              );

            (
              batchResult.erros||
              []
            )
              .forEach(error=>
                uploadErrors.push(
                  (
                    error.nome||
                    'arquivo'
                  )+
                  ': '+
                  (
                    error.erro||
                    'falha no envio'
                  )
                )
              );
          }

          if(uploadErrors.length){
            progress_(
              68,
              'Alguns documentos não foram concluídos.',
              0,
              {
                etapa:
                  'DOCUMENTOS_PENDENTES',
                erros:
                  uploadErrors
              }
            );

            throw new Error(
              'O cadastro foi preservado, mas '+uploadErrors.length+
              ' documento(s) ficaram pendentes:\n'+
              uploadErrors.join('\n')
            );
          }

          progress_(
            72,
            'Documentos salvos. Gerando a petição inicial e o PDF…',
            15,
            {
              etapa:
                'DOCUMENTOS_SALVOS',
              documentos:
                uploadedCount
            }
          );

          await call(
            'pessoaFinalizarCadastro',
            {
              pessoaId:saved.id,
              folderId:
                saved.folderId||
                checkpoint.folderId||
                ''
            },
            true,
            {silent:true}
          );

          progress_(
            88,
            'Petição inicial concluída. Finalizando registros…',
            7,
            {
              etapa:
                'MINUTA_GERADA'
            }
          );

          let relatorio=null;
          let relatorioErro='';

          if(
            seguroDefesoConsulta&&
            seguroDefesoConsulta.codigoConsultado===
              cpfAtual
          ){
            progress_(
              90,
              'Gerando o relatório oficial do Seguro-Defeso…',
              6
            );

            try{
              relatorio=
                await call(
                  'seguroDefesoRelatorioGerar',
                  {
                    pessoaId:saved.id,
                    generation:
                      crypto.randomUUID()
                  },
                  true,
                  {silent:true}
                );
            }catch(e){
              relatorioErro=
                e.message||
                String(e);
            }
          }

          progress_(
            99,
            'Cadastro concluído. Abrindo a ficha…',
            1,
            {
              etapa:
                'CONCLUIDO'
            }
          );

          try{
            sessionStorage.removeItem(
              checkpointKey
            );
          }catch(e){}

          App.endWorkflowProcessing(
            workflowId,
            true
          );

          workflowId=null;

          App.state.selection=
            saved.id;

          await go(
            'ACOMP',
            saved.id
          );

          if(relatorioErro){
            status(
              'Cadastro, documentos e minuta concluídos. O relatório do Seguro-Defeso não pôde ser gravado: '+
              relatorioErro,
              true
            );

          }else if(relatorio){
            status(
              'Cadastro, documentos, minuta e relatório oficial do Seguro-Defeso concluídos com sucesso.'
            );

          }else{
            status(
              'Cadastro, documentos e minuta concluídos com sucesso.'
            );
          }

        }catch(e){
          saveCheckpoint_({
            pessoaId:
              saved&&saved.id||
              checkpoint.pessoaId||
              '',
            etapa:
              checkpoint.etapa||
              'INTERROMPIDO',
            ultimoErro:
              e.message||
              String(e)
          });

          if(workflowId){
            App.endWorkflowProcessing(
              workflowId,
              false
            );
            workflowId=null;
          }

          status(
            (
              saved&&saved.id
                ?'O cadastro já salvo foi preservado. '
                :'O processamento foi interrompido antes da conclusão. '
            )+
            (
              e.message||
              String(e)
            )+
            '\n\nMantenha os mesmos dados e clique novamente em “Salvar cadastro, documentos e gerar minuta” para retomar a partir do cadastro preservado.',
            true
          );
        }
      },
      'Salvar cadastro, documentos e gerar minuta'
    );

    personForm.classList.add(
      'pess-person-form'
    );

    /*
     * Outra entidade só existe visualmente quando a opção Outro estiver ativa.
     */
    const entidade=
      personForm
        .elements
        .namedItem(
          'entidade'
        );

    const outraEntidade=
      personForm
        .elements
        .namedItem(
          'outraEntidade'
        );

    if(
      entidade&&
      outraEntidade
    ){
      const outraWrap=
        outraEntidade
          .closest(
            'label'
          );

      const syncOutra=()=>{
        const show=
          entidade.value===
          'Outro';

        if(outraWrap){
          outraWrap.hidden=
            !show;

          outraWrap.style.display=
            show
              ?''
              :'none';
        }

        outraEntidade.required=
          show;

        if(!show){
          outraEntidade.value=
            '';
        }
      };

      entidade.addEventListener(
        'change',
        syncOutra
      );

      syncOutra();
    }

    /*
     * Consulta oficial do Seguro-Defeso junto ao campo CPF.
     */
    const cpfInput=
      personForm
        .elements
        .namedItem(
          'cpf'
        );

    if(cpfInput){
      const cpfField=
        cpfInput.closest(
          'label'
        );

      const apiInline=
        el(
          'div',
          undefined,
          'pess-cpf-api'
        );

      const apiButton=
        el(
          'button',
          'Consultar Seguro-Defeso'
        );

      apiButton.type=
        'button';

      apiButton.disabled=
        !(
          App.state.boot.portalTransparencia&&
          App.state.boot.portalTransparencia.configurada
        );

      apiInfoText=
        el(
          'small',
          App.state.boot.portalTransparencia&&
          App.state.boot.portalTransparencia.configurada
            ?'Consulta disponível.'
            :'API não configurada. Cadastre a chave em Administração.',
          App.state.boot.portalTransparencia&&
          App.state.boot.portalTransparencia.configurada
            ?'hint'
            :'warn'
        );

      apiButton.onclick=
        async()=>{
          try{
            const codigo=
              String(
                cpfInput.value||
                ''
              ).replace(/\D/g,'');

            if(!/^\d{11}$/.test(codigo)){
              throw new Error(
                'Informe um CPF completo no formato 000.000.000-00 antes de consultar.'
              );
            }

            apiInfoText.textContent=
              'Consultando a API oficial...';

            apiInfoText.className=
              'hint';

            const result=
              await call(
                'seguroDefesoConsultar',
                {
                  codigo
                }
              );

            seguroDefesoConsulta=
              result;

            const preenchimento=
              fillPersonFromApi_(
                personForm,
                result
              );

            apiInfoText.textContent=
              'Consulta concluída: '+
              result.quantidade+
              ' registro(s) de 2025 localizado(s).'+
              (
                preenchimento.messages.length
                  ?' '+preenchimento.messages.join('; ')+'.'
                  :''
              );

            showSeguroDefesoDialog_(
              result
            );

          }catch(e){
            apiInfoText.textContent=
              e.message||
              String(e);

            apiInfoText.className=
              'warn';

            status(
              e.message||
              String(e),
              true
            );
          }
        };

      apiInline.append(
        apiButton,
        apiInfoText
      );

      if(cpfField){
        cpfField.append(
          apiInline
        );
      }

      cpfInput.addEventListener(
        'input',
        ()=>{
          if(
            seguroDefesoConsulta&&
            seguroDefesoConsulta.codigoConsultado!==
              String(
                cpfInput.value||
                ''
              ).replace(/\D/g,'')
          ){
            seguroDefesoConsulta=null;

            apiInfoText.textContent=
              'CPF alterado. Consulte novamente para atualizar os dados.';

            apiInfoText.className=
              'warn';
          }
        }
      );
    }

    /*
     * Consulta de endereço por CEP.
     */
    const cepInput=
      personForm
        .elements
        .namedItem(
          'cep'
        );

    if(cepInput){
      const cepField=
        cepInput.closest(
          'label'
        );

      const cepInline=
        el(
          'div',
          undefined,
          'pess-cpf-api'
        );

      const cepButton=
        el(
          'button',
          'Consultar CEP'
        );

      cepButton.type=
        'button';

      const cepInfo=
        el(
          'small',
          'Consulta de logradouro disponível.',
          'hint'
        );

      cepButton.onclick=
        async()=>{
          try{
            const cep=
              String(
                cepInput.value||
                ''
              ).replace(/\D/g,'');

            if(!/^\d{8}$/.test(cep)){
              throw new Error(
                'Informe um CEP completo no formato 00000-000 antes de consultar.'
              );
            }

            cepInfo.textContent=
              'Consultando CEP...';

            cepInfo.className=
              'hint';

            const result=
              await call(
                'cepConsultar',
                {
                  cep
                }
              );

            if(
              result.cep
            ){
              cepInput.value=
                result.cep;

              cepInput.dispatchEvent(
                new Event(
                  'input',
                  {bubbles:true}
                )
              );
            }

            const messages=
              fillAddressFromCep_(
                personForm,
                result
              );

            cepInfo.textContent=
              'CEP localizado'+
              (
                result.logradouro
                  ?': '+result.logradouro
                  :''
              )+
              (
                messages.length
                  ?'. '+messages.join('; ')+'.'
                  :'. Endereço preenchido automaticamente.'
              );

          }catch(e){
            cepInfo.textContent=
              e.message||
              String(e);

            cepInfo.className=
              'warn';

            status(
              e.message||
              String(e),
              true
            );
          }
        };

      cepInline.append(
        cepButton,
        cepInfo
      );

      if(cepField){
        cepField.append(
          cepInline
        );
      }
    }

    /*
     * Cálculo do Seguro-Defeso.
     */
    const defeso=card(
      'Cálculo do Seguro-Defeso 2025'
    );

    defeso.classList.add(
      'pess-defeso-card'
    );

    defeso.append(
      el(
        'p',
        'Cada parcela corresponde a um salário mínimo de R$ 1.518,00. O valor da causa é calculado automaticamente pela quantidade informada no cadastro.',
        'hint'
      )
    );

    const resumo=el(
      'div',
      undefined,
      'grid'
    );

    const parcelaBox=card(
      'Valor de cada parcela'
    );

    parcelaBox.append(
      el(
        'strong',
        'R$ 1.518,00'
      )
    );

    const causaBox=card(
      'Valor da causa'
    );

    const causaText=el(
      'strong',
      'Selecione a quantidade de parcelas'
    );

    causaBox.append(
      causaText
    );

    resumo.append(
      parcelaBox,
      causaBox
    );

    defeso.append(
      resumo
    );

    const parcelasSelect=
      personForm
        .elements
        .namedItem(
          'parcelasNaoRecebidas'
        );

    const atualizarCalculo=()=>{
      const qtd=
        Number(
          parcelasSelect&&
          parcelasSelect.value||
          0
        );

      causaText.textContent=
        qtd
          ?'R$ '+
            moneyBR_(
              qtd*
              SALARIO_MINIMO_2025
            )
          :'Selecione a quantidade de parcelas';
    };

    if(parcelasSelect){
      parcelasSelect.addEventListener(
        'change',
        atualizarCalculo
      );

      atualizarCalculo();
    }

    /*
     * Documentos obrigatórios.
     */
    const documents=el(
      'section',
      undefined,
      'card pess-documents'
    );

    documents.append(
      el(
        'h3',
        'Documentos da pessoa'
      )
    );

    documents.append(
      el(
        'p',
        'Os documentos são armazenados diretamente na pasta individual da pessoa e podem ser reutilizados nos atendimentos vinculados ao cadastro.',
        'hint'
      )
    );

    documents.append(
      el(
        'p',
        'Todos os seis grupos documentais abaixo são obrigatórios para o cadastro inicial. Ao inserir o arquivo, o bloco é recolhido e passa a indicar “Documento inserido”. Formatos permitidos: PDF, JPEG e PNG. Limite de 5 MB por arquivo.',
        'hint'
      )
    );

    App.state.boot.config.categorias
      .forEach(categoria=>{
        const item=
          documentBox_(
            categoria
          );

        item.box.classList.add(
          'pess-doc-card'
        );

        if(categoria==='RESIDENCIA'){
          item.box.classList.add(
            'pess-doc-residence'
          );
        }

        uploads[categoria]=
          item.input;

        if(
          categoria===
          'RESIDENCIA'
        ){
          const residenceGrid=el(
            'div',
            undefined,
            'grid'
          );

          const dateLabel=el(
            'label',
            undefined,
            'field'
          );

          dateLabel.append(
            el(
              'span',
              'Vencimento do comprovante *'
            )
          );

          residenceDate=
            el('input');

          residenceDate.type=
            'text';

          residenceDate.placeholder=
            'DD/MM/AAAA';

          residenceDate.required=
            true;

          residenceDate.maxLength=
            10;

          residenceDate.inputMode=
            'numeric';

          maskDateInput_(
            residenceDate
          );

          dateLabel.append(
            residenceDate
          );

          const thirdLabel=el(
            'label',
            undefined,
            'field'
          );

          thirdLabel.append(
            el(
              'span',
              'Comprovante em nome de terceiro?'
            )
          );

          residenceThird=
            el('input');

          residenceThird.type=
            'checkbox';

          thirdLabel.append(
            residenceThird
          );

          const thirdPartyArea=
            el(
              'div',
              undefined,
              'card'
            );

          thirdPartyArea.hidden=
            true;

          thirdPartyArea.append(
            el(
              'p',
              'Quando o comprovante estiver em nome de terceiro, é obrigatória a identidade do titular da residência e a confirmação de que há declaração de residência no documento.',
              'hint'
            )
          );

          const identityLabel=
            el(
              'label',
              undefined,
              'field'
            );

          identityLabel.append(
            el(
              'span',
              'Carteira de identidade do titular da residência *'
            )
          );

          residenceHolderIdentity=
            el('input');

          residenceHolderIdentity.type=
            'file';

          residenceHolderIdentity.multiple=
            false;

          residenceHolderIdentity.accept=
            '.pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png';

          identityLabel.append(
            residenceHolderIdentity
          );

          const declarationLabel=
            el(
              'label',
              undefined,
              'field'
            );

          declarationLabel.append(
            el(
              'span',
              'Há declaração de residência no documento? *'
            )
          );

          residenceDeclaration=
            el('input');

          residenceDeclaration.type=
            'checkbox';

          declarationLabel.append(
            residenceDeclaration
          );

          thirdPartyArea.append(
            identityLabel,
            declarationLabel
          );

          residenceGrid.append(
            dateLabel,
            thirdLabel
          );

          item.box.append(
            residenceGrid,
            thirdPartyArea
          );

          const syncThirdParty=()=>{
            const active=
              !!residenceThird.checked;

            thirdPartyArea.hidden=
              !active;

            residenceHolderIdentity.required=
              active;

            residenceDeclaration.required=
              active;

            if(!active){
              residenceHolderIdentity.value='';
              residenceDeclaration.checked=false;
            }

            item.sync();
          };

          residenceThird.addEventListener(
            'change',
            syncThirdParty
          );

          residenceHolderIdentity.addEventListener(
            'change',
            item.sync
          );

          residenceDeclaration.addEventListener(
            'change',
            item.sync
          );

          item.setExtraReady(
            ()=>{
              const dateOk=
                isResidenceDateRecent_(
                  String(
                    residenceDate.value||
                    ''
                  )
                );

              const thirdOk=
                !residenceThird.checked||
                (
                  residenceHolderIdentity.files&&
                  residenceHolderIdentity.files.length>0&&
                  residenceDeclaration.checked
                );

              return (
                dateOk&&
                thirdOk
              );
            }
          );

          residenceDate.addEventListener(
            'input',
            ()=>{
              const value=
                String(
                  residenceDate.value||
                  ''
                );

              residenceDate.setCustomValidity(
                !value
                  ?''
                  :!App.isValidDateBR(value)
                    ?'Informe uma data válida no formato DD/MM/AAAA.'
                    :!isResidenceDateRecent_(value)
                      ?'O comprovante deve ter data dos últimos 60 dias e não pode ser futuro.'
                      :''
              );

              item.sync();
            }
          );

          residenceDate.addEventListener(
            'blur',
            item.sync
          );

          syncThirdParty();
        }

        documents.append(
          item.box
        );
      });

    documents.append(
      el(
        'p',
        'O botão Salvar somente prossegue quando todos os documentos obrigatórios e uma data do comprovante de residência dentro dos últimos 60 dias estiver informada. Se o comprovante estiver em nome de terceiro, também são obrigatórias a identidade do titular da residência e a confirmação de que há declaração de residência no documento. Depois de salvar o cadastro e os documentos, o sistema gera automaticamente a minuta da petição inicial.',
        'hint'
      )
    );

    const actions=
      personForm.querySelector(
        '.actions'
      );

    if(actions){
      personForm.insertBefore(
        defeso,
        actions
      );

      personForm.insertBefore(
        documents,
        actions
      );

    }else{
      personForm.append(
        defeso,
        documents
      );
    }

    /*
     * Cadastro orientado por etapas:
     * 1 CPF/Seguro-Defeso
     * 2 dados pessoais
     * 3 endereço/CEP
     * 4 vínculo/parcelas
     * 5 documentos
     */
    const personStepper=
      buildPersonStepper_(
        personForm,
        defeso,
        documents
      );

    const importFlow=
      buildDocumentImportPanel_(
        personForm,
        personStepper,
        uploads,
        importedFiles,
        residenceDate,
        residenceThird
      );

    if(importFlow){
      importFlow.showStart();
    }else if(personStepper){
      personStepper.setVisible(true);
      personStepper.showStep(0);
    }
  };
})();
</script>
