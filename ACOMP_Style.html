<style>
#acomp-root{
  min-height:300px
}
.acomp-generate-menu{
  position:relative;
  display:inline-block;
  margin:0;
  padding:0;
  border:0;
  background:transparent;
  box-shadow:none
}
.acomp-generate-menu>summary{
  display:inline-flex;
  min-height:35px;
  align-items:center;
  gap:6px;
  margin:0!important;
  padding:8px 13px;
  border:1px solid #0b7280;
  border-radius:8px;
  color:#fff;
  background:linear-gradient(145deg,#0c8491,#087481);
  box-shadow:0 3px 8px rgba(8,116,129,.18);
  cursor:pointer;
  font-weight:650;
  list-style:none;
  user-select:none
}
.acomp-generate-menu>summary::-webkit-details-marker{
  display:none
}
.acomp-generate-menu>summary::after{
  content:"▾";
  margin-left:2px;
  font-size:10px;
  opacity:.9
}
.acomp-generate-menu[open]>summary::after{
  content:"▴"
}
.acomp-generate-menu>summary:hover{
  background:linear-gradient(145deg,#0d919e,#096f7a)
}
.acomp-generate-menu-panel{
  position:absolute;
  z-index:80;
  top:calc(100% + 6px);
  right:0;
  width:300px;
  padding:8px;
  border:1px solid #bfd4da;
  border-radius:9px;
  background:rgba(255,255,255,.98);
  box-shadow:0 12px 28px rgba(15,48,70,.18);
  backdrop-filter:blur(10px)
}
.acomp-generate-menu-title{
  margin:0 0 6px;
  padding:0 2px 5px;
  border-bottom:1px solid #e0eaed;
  color:#47636e;
  font-size:10px;
  font-weight:650
}
.acomp-generate-option{
  display:block;
  width:100%;
  margin:0 0 5px;
  padding:8px 9px;
  text-align:left
}
.acomp-generate-menu-panel>.hint{
  display:block;
  margin:4px 2px 0;
  line-height:1.25;
  font-size:9px
}
.acomp-person-view{
  padding:3px 1px 1px
}
.acomp-person-view-grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:6px 8px
}
.acomp-person-view-item{
  min-width:0;
  padding:7px 8px;
  border:1px solid #d5e2e6;
  border-radius:7px;
  background:#f8fbfc
}
.acomp-person-view-label{
  display:block;
  margin-bottom:2px;
  color:#667c86;
  font-size:9.5px;
  line-height:1.15
}
.acomp-person-view-value{
  display:block;
  overflow-wrap:anywhere;
  color:#173d50;
  font-size:12px;
  line-height:1.25;
  font-weight:650
}
.acomp-person-view-actions{
  justify-content:flex-end;
  margin-top:7px
}
.acomp-person-edit-button{
  min-width:110px
}
.acomp-person-editor{
  padding-top:3px
}
.acomp-person-editor>.actions{
  justify-content:flex-end
}
@media(max-width:1100px){
  .acomp-person-view-grid{
    grid-template-columns:repeat(3,minmax(0,1fr))
  }
}
@media(max-width:680px){
  .acomp-person-view-grid{
    grid-template-columns:1fr
  }
  .acomp-person-view-actions,
  .acomp-person-editor>.actions{
    justify-content:stretch
  }
  .acomp-person-view-actions button,
  .acomp-person-editor>.actions button{
    width:100%
  }
  .acomp-generate-menu{
    width:100%
  }
  .acomp-generate-menu>summary{
    width:100%;
    justify-content:center
  }
  .acomp-generate-menu-panel{
    right:auto;
    left:0;
    width:min(300px,88vw)
  }
}


/* Tarefas vinculadas e exclusão administrativa */
.acomp-delete-person{
  color:#8d382f!important;
  border-color:#e1b9b4!important;
  background:#fff4f2!important;
  box-shadow:none!important
}
.acomp-delete-person:hover{
  color:#fff!important;
  background:#b94e43!important
}
.acomp-task-summary{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:8px 0
}
.acomp-task-summary span{
  padding:4px 7px;
  border-radius:999px;
  color:#46636c;
  background:#edf4f2;
  font-size:8px;
  font-weight:750
}
.acomp-task-list{
  display:grid;
  gap:6px;
  margin:8px 0
}
.acomp-task-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:10px;
  align-items:center;
  padding:9px 10px;
  border:1px solid #dedbd3;
  border-radius:9px;
  background:#fffdfa
}
.acomp-task-row.done{
  opacity:.78;
  background:#f5f3ee
}
.acomp-task-row strong{
  display:block;
  color:#244955;
  font-size:9.5px
}
.acomp-task-row small{
  display:block;
  margin-top:2px;
  color:#75837e;
  font-size:7.8px
}
.acomp-task-tags{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  justify-content:flex-end
}
.acomp-task-tag{
  padding:3px 6px;
  border-radius:999px;
  color:var(--task-tag-color,#176e7d);
  background:color-mix(in srgb,var(--task-tag-color,#176e7d) 10%,white);
  border:1px solid color-mix(in srgb,var(--task-tag-color,#176e7d) 38%,white);
  font-size:7px;
  font-weight:800
}
@media(max-width:620px){
  .acomp-task-row{
    grid-template-columns:1fr
  }
  .acomp-task-tags{
    justify-content:flex-start
  }
}


/* Consulta de cadastros V2 — lista leve */
.acomp-list-v2{padding:0!important;overflow:hidden}
.acomp-list-toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px 13px;
  border-bottom:1px solid #e3ded5;
  background:#fffdfa
}
.acomp-list-toolbar input{
  width:min(680px,100%);
  min-height:38px!important
}
.acomp-list-meta{
  flex:0 0 auto;
  color:#6e7d79;
  font-size:8px;
  font-weight:700
}
.acomp-list-results{
  min-height:120px;
  transition:opacity .12s ease
}
.acomp-list-results.loading{opacity:.58}
.acomp-list-results .scroll{margin:0!important}
.acomp-list-results table{
  min-width:1050px
}
.acomp-list-results th{
  position:sticky;
  top:0;
  z-index:1
}
.acomp-list-results td:last-child{
  min-width:290px
}
.acomp-list-results td:last-child button{
  min-height:30px!important;
  margin:2px 4px 2px 0!important;
  padding:5px 8px!important;
  font-size:7.5px!important
}
.acomp-action-primary{
  color:#fff!important;
  border-color:var(--pda-sea)!important;
  background:var(--pda-sea)!important
}
.acomp-action-task{
  color:#785e18!important;
  border-color:#dfc781!important;
  background:#fff8dc!important
}
.acomp-action-delete{
  color:#91382f!important;
  border-color:#e0b3ad!important;
  background:#fff5f3!important
}
.acomp-list-pager{
  display:flex;
  justify-content:flex-end;
  gap:7px;
  padding:10px 13px;
  border-top:1px solid #e3ded5;
  background:#fbf9f4
}
.acomp-list-pager button{min-height:31px!important;font-size:8px!important}

@media(max-width:780px){
  .acomp-list-toolbar{
    align-items:stretch;
    flex-direction:column
  }
  .acomp-list-meta{align-self:flex-end}
}
</style>
