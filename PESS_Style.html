<style>
#pess-root{
  position:relative;
  width:min(1080px,100%);
  min-height:360px;
  margin:0 auto
}
#pess-root::before{
  content:"";
  position:absolute;
  z-index:-1;
  inset:58px -2vw auto;
  height:190px;
  opacity:.4;
  pointer-events:none;
  background:
    radial-gradient(ellipse at 12% 90%,transparent 0 53%,rgba(8,121,135,.065) 54% 55%,transparent 56%),
    radial-gradient(ellipse at 54% 96%,transparent 0 57%,rgba(15,48,70,.04) 58% 59%,transparent 60%),
    radial-gradient(ellipse at 90% 92%,transparent 0 50%,rgba(8,121,135,.04) 51% 52%,transparent 53%);
  background-size:320px 95px,440px 120px,350px 105px
}
.pess-page-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:10px;
  margin-bottom:5px;
  padding:0 2px
}
.pess-page-head h2{margin-bottom:0}
.pess-page-subtitle{
  margin:1px 0 0;
  color:var(--muted);
  font-size:10px
}
.pess-home-actions{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin:6px 0 10px
}
.pess-action-card{
  display:grid;
  grid-template-columns:58px minmax(0,1fr);
  min-height:88px;
  align-items:center;
  gap:12px;
  padding:13px 16px;
  border:1px solid transparent;
  border-radius:13px;
  text-align:left;
  overflow:hidden
}
.pess-action-card:hover{
  transform:translateY(-2px)
}
.pess-action-icon{
  display:grid;
  place-items:center;
  width:54px;
  height:54px;
  border:1px solid rgba(255,255,255,.28);
  border-radius:50%;
  background:rgba(255,255,255,.13);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16)
}
.pess-action-icon svg{
  width:29px;
  height:29px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round
}
.pess-action-copy{
  display:flex;
  min-width:0;
  flex-direction:column;
  gap:3px
}
.pess-action-copy strong{
  font-size:14px;
  line-height:1.12
}
.pess-action-copy>span{
  opacity:.88;
  font-size:10.5px;
  font-weight:450;
  line-height:1.25
}
.pess-action-defeso{
  background:
    radial-gradient(circle at 8% 20%,rgba(255,255,255,.11),transparent 28%),
    linear-gradient(145deg,#0d6d79,#088594)
}
.pess-action-new{
  background:
    radial-gradient(circle at 8% 20%,rgba(255,255,255,.10),transparent 28%),
    linear-gradient(145deg,#123c52,#0c6170)
}
.pess-work-panel{
  scroll-margin-top:54px;
  animation:pessReveal .16s ease
}
.pess-work-panel[hidden]{display:none!important}
@keyframes pessReveal{
  from{opacity:0;transform:translateY(-4px)}
  to{opacity:1;transform:none}
}
.pess-register-panel{
  margin:0 auto;
  padding:7px 8px 8px;
  border-color:#b7cdd5;
  background:rgba(255,255,255,.94);
  box-shadow:0 5px 18px rgba(15,48,70,.07)
}
.pess-register-panel>summary{
  font-size:12.5px;
  color:#123e52
}
.pess-register-panel>p.hint{
  margin:1px 0 5px;
  font-size:9.5px
}
.pess-stepper{
  margin-top:4px
}
.pess-step-progress{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:4px;
  margin:0 0 6px
}
.pess-step-progress-item{
  display:flex;
  min-width:0;
  align-items:center;
  gap:5px;
  padding:5px 6px;
  border:1px solid #d4e1e5;
  border-radius:7px;
  color:#667b85;
  background:#f5f9fa;
  font-size:9.6px;
  white-space:nowrap;
  overflow:hidden
}
.pess-step-progress-item strong{
  overflow:hidden;
  text-overflow:ellipsis
}
.pess-step-number{
  display:grid;
  place-items:center;
  flex:0 0 20px;
  width:20px;
  height:20px;
  border-radius:50%;
  color:#496775;
  background:#dfecef;
  font-size:9px;
  font-weight:750
}
.pess-step-progress-item.active{
  color:#123e52;
  border-color:#77aeb7;
  background:#e8f4f5
}
.pess-step-progress-item.active .pess-step-number{
  color:#fff;
  background:var(--teal)
}
.pess-step-progress-item.done{
  color:#24574e;
  border-color:#b7d8cf;
  background:#edf7f4
}
.pess-step-progress-item.done .pess-step-number{
  color:#fff;
  background:#28725f
}
.pess-step{
  min-height:145px;
  padding:8px;
  border:1px solid #c9dbe1;
  border-radius:9px;
  background:rgba(252,254,254,.95)
}
.pess-step[hidden]{display:none!important}
.pess-step-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
  margin-bottom:6px;
  padding-bottom:5px;
  border-bottom:1px solid #e2ebee
}
.pess-step-head h3{
  margin:0;
  color:#143f53;
  font-size:13px
}
.pess-step-head p{
  margin:0;
  font-size:9.5px
}
.pess-step-grid{
  display:grid;
  gap:6px 7px;
  align-items:start
}
.pess-step-grid-1{
  grid-template-columns:minmax(260px,420px)
}
.pess-step-grid-2{
  grid-template-columns:1.5fr .8fr 1fr 1.25fr
}
.pess-step-grid-3{
  grid-template-columns:.75fr 1.4fr .55fr .9fr .8fr 1fr
}
.pess-step-grid-3>.field[data-field="cep"]{
  grid-column:span 2
}
.pess-step-grid-3>.field[data-field="bairro"]{
  grid-column:span 2
}
.pess-step-grid-3>.field[data-field="cidade"]{
  grid-column:span 2
}
.pess-step-grid-4{
  grid-template-columns:1.4fr 1.2fr 1fr 1fr
}
.pess-step-grid-4>.field[data-field="outraEntidade"]{
  grid-column:span 2
}
.pess-step-grid-4>.field[data-field="analfabeto"]{
  grid-column:span 2
}
.pess-step-controls{
  display:flex;
  justify-content:space-between;
  gap:6px;
  margin-top:7px;
  padding-top:6px;
  border-top:1px solid #e3ebee
}
.pess-step-controls button{
  min-width:120px;
  padding:7px 11px
}
.pess-person-form>.actions{
  justify-content:flex-end;
  margin:7px 0 0;
  padding:6px 0 0;
  border-top:1px solid #dfe8eb
}
.pess-person-form>.actions button{
  min-width:220px;
  padding:8px 13px
}
.pess-cpf-api{
  display:flex;
  flex-wrap:wrap;
  gap:4px 5px;
  align-items:center;
  margin-top:2px
}
.pess-cpf-api button{
  padding:5px 7px;
  font-size:9.6px
}
.pess-cpf-api small{
  flex:1 1 125px;
  margin:0;
  font-size:8.8px;
  line-height:1.1
}
.pess-inline-query{
  display:grid;
  grid-template-columns:minmax(190px,300px) auto;
  gap:6px;
  align-items:end;
  max-width:500px
}
.pess-inline-query button{min-height:32px}
.pess-quick-panel{
  padding:10px 12px
}
.pess-defeso-card{
  margin:6px 0 0;
  padding:7px 8px;
  border-color:#c9dee0;
  background:linear-gradient(135deg,rgba(239,249,249,.96),rgba(255,255,255,.93))
}
.pess-defeso-card h3{
  margin:0 0 3px;
  font-size:11.5px
}
.pess-defeso-card>p{
  margin:1px 0 4px
}
.pess-defeso-card .grid{
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:5px
}
.pess-defeso-card .card{
  margin:0;
  padding:6px 8px;
  box-shadow:none
}
.pess-defeso-card .card h3{
  font-size:10px;
  margin-bottom:1px
}
.pess-documents{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:5px;
  margin:0;
  padding:7px;
  border:0;
  background:transparent;
  box-shadow:none
}
.pess-documents>h3,
.pess-documents>p{
  grid-column:1/-1;
  margin:0
}
.pess-documents>h3{font-size:11.5px}
.pess-documents>p{
  font-size:9.2px;
  line-height:1.15
}
.pess-documents>p+details{margin-top:1px}
.pess-doc-card{
  min-width:0;
  margin:0;
  padding:5px 6px;
  background:rgba(255,255,255,.95);
  box-shadow:none
}
.pess-doc-card summary{
  color:#153e52;
  font-size:10px;
  line-height:1.15
}
.pess-doc-summary-content{
  display:inline-flex;
  align-items:center;
  gap:5px;
  flex-wrap:wrap
}
.pess-doc-status-icon{
  display:inline-grid;
  place-items:center;
  flex:0 0 17px;
  width:17px;
  height:17px;
  border-radius:50%;
  font-size:10px;
  font-weight:800;
  line-height:1
}
.pess-doc-status-icon.ok{
  color:#fff;
  border:1px solid #238153;
  background:#2f9a65;
  box-shadow:0 1px 3px rgba(35,129,83,.16)
}
.pess-doc-status-icon.pending{
  color:#fff;
  border:1px solid #b83b31;
  background:#d24d42;
  box-shadow:0 1px 3px rgba(184,59,49,.14)
}
.pess-doc-summary-label{
  color:#153e52;
  font-weight:650
}
.pess-doc-summary-separator{
  color:#81949c
}
.pess-doc-summary-state{
  font-weight:700
}
.pess-doc-summary-state.ok{
  color:#23734d
}
.pess-doc-summary-state.pending{
  color:#b23b32
}
.pess-doc-card .field{font-size:9.5px}
.pess-doc-card input[type=file]{
  min-height:29px;
  font-size:9px
}
.pess-doc-residence{
  grid-column:span 2
}
.pess-doc-residence .grid{
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:5px
}
.pess-doc-residence .card{
  margin:3px 0 0;
  padding:5px
}
.pess-api-dialog{
  width:min(900px,94vw);
  max-height:88vh;
  overflow:auto;
  border:1px solid #aac3cc;
  border-radius:11px;
  padding:14px;
  color:var(--navy);
  background:rgba(255,255,255,.98);
  box-shadow:0 20px 60px rgba(15,48,70,.28)
}
.pess-api-dialog::backdrop{
  background:rgba(11,39,55,.58);
  backdrop-filter:blur(2px)
}
.pess-api-dialog details{margin:5px 0}
.pess-api-dialog pre{
  font-size:10.8px;
  line-height:1.4
}

.pess-import-start{
  margin:4px 0 2px;
  padding:11px;
  border:1px solid #b9d2d8;
  border-radius:10px;
  background:
    linear-gradient(145deg,rgba(242,249,250,.98),rgba(255,255,255,.97));
  box-shadow:0 4px 14px rgba(15,48,70,.06)
}
.pess-import-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
  margin-bottom:7px;
  padding-bottom:5px;
  border-bottom:1px solid #dce8eb
}
.pess-import-head h3{
  margin:0;
  color:#123e52;
  font-size:13px
}
.pess-import-head p{
  max-width:650px;
  margin:0;
  text-align:right;
  font-size:9.5px
}
.pess-import-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}
.pess-import-grid input[type=file]{
  min-height:32px;
  font-size:10px
}
.pess-import-notice{
  margin:6px 0 0;
  padding:6px 8px;
  border-left:3px solid #6da8b1;
  color:#536f7a;
  background:rgba(231,243,245,.7);
  font-size:9px;
  line-height:1.25
}
.pess-import-actions{
  display:flex;
  justify-content:flex-end;
  gap:6px;
  margin-top:7px
}
.pess-import-actions button{
  padding:7px 11px
}
.pess-import-result{
  margin-top:7px;
  padding:7px 9px;
  border:1px solid #c7dbe0;
  border-radius:7px;
  white-space:pre-wrap;
  font-size:10px;
  line-height:1.3;
  background:#f8fbfc
}
.pess-import-result.ok{
  color:#205649;
  border-color:#badbd1;
  background:#edf8f4
}
.pess-import-result.error{
  color:#7d2820;
  border-color:#efc6bf;
  background:#fff1ee
}

@media(max-width:960px){
  #pess-root{width:100%}
  .pess-step-progress{
    grid-template-columns:repeat(5,minmax(110px,1fr));
    overflow-x:auto
  }
  .pess-step-grid-2,
  .pess-step-grid-3,
  .pess-step-grid-4{
    grid-template-columns:repeat(2,minmax(0,1fr))
  }
  .pess-step-grid-3>.field[data-field="cep"],
  .pess-step-grid-3>.field[data-field="bairro"],
  .pess-step-grid-3>.field[data-field="cidade"],
  .pess-step-grid-4>.field[data-field="outraEntidade"],
  .pess-step-grid-4>.field[data-field="analfabeto"]{
    grid-column:auto
  }
  .pess-documents{
    grid-template-columns:repeat(2,minmax(0,1fr))
  }
  .pess-doc-residence{
    grid-column:1/-1
  }
}
@media(max-width:680px){
  .pess-home-actions{grid-template-columns:1fr}
  .pess-import-head{
    display:block
  }
  .pess-import-head p{
    margin-top:3px;
    text-align:left
  }
  .pess-import-grid{
    grid-template-columns:1fr
  }
  .pess-import-actions{
    flex-direction:column
  }
  .pess-import-actions button{
    width:100%
  }
  .pess-action-card{
    grid-template-columns:48px minmax(0,1fr);
    min-height:72px;
    padding:10px 12px
  }
  .pess-action-icon{
    width:44px;
    height:44px
  }
  .pess-action-icon svg{
    width:25px;
    height:25px
  }
  .pess-step-progress{display:flex}
  .pess-step-progress-item{min-width:120px}
  .pess-step-grid-1,
  .pess-step-grid-2,
  .pess-step-grid-3,
  .pess-step-grid-4,
  .pess-inline-query{
    grid-template-columns:1fr
  }
  .pess-documents{grid-template-columns:1fr}
  .pess-doc-residence{grid-column:auto}
  .pess-person-form>.actions button{width:100%;min-width:0}
}
</style>
