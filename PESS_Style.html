<style>
#pess-root{
  position:relative;
  min-height:380px
}
#pess-root::before{
  content:"";
  position:absolute;
  z-index:-1;
  inset:72px -5vw auto;
  height:260px;
  opacity:.55;
  pointer-events:none;
  background:
    radial-gradient(ellipse at 12% 90%,transparent 0 53%,rgba(8,121,135,.075) 54% 55%,transparent 56%),
    radial-gradient(ellipse at 54% 96%,transparent 0 57%,rgba(15,48,70,.05) 58% 59%,transparent 60%),
    radial-gradient(ellipse at 90% 92%,transparent 0 50%,rgba(8,121,135,.05) 51% 52%,transparent 53%);
  background-size:380px 120px,520px 150px,420px 130px
}
.pess-page-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
  margin-bottom:8px;
  padding:0 2px
}
.pess-page-head h2{margin-bottom:0}
.pess-page-subtitle{
  margin:2px 0 0;
  color:var(--muted);
  font-size:11.5px
}
.pess-home-actions{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
  margin:0 0 11px
}
.pess-action-card{
  display:flex;
  min-height:68px;
  flex-direction:column;
  align-items:flex-start;
  justify-content:center;
  gap:2px;
  padding:11px 14px;
  border:1px solid transparent;
  border-radius:10px;
  text-align:left
}
.pess-action-card strong{
  font-size:13.5px;
  line-height:1.15
}
.pess-action-card span{
  opacity:.87;
  font-size:10.5px;
  font-weight:450
}
.pess-action-search{
  color:#123d50;
  border-color:#c7dade;
  background:linear-gradient(145deg,#f8fcfc,#e8f3f4);
  box-shadow:0 3px 10px rgba(15,48,70,.055)
}
.pess-action-search:hover{
  color:#0b3446;
  background:linear-gradient(145deg,#fff,#e1f0f2)
}
.pess-action-defeso{
  background:linear-gradient(145deg,#0d6270,#087d89)
}
.pess-action-new{
  background:linear-gradient(145deg,#12364d,#0e5664)
}
.pess-work-panel{
  scroll-margin-top:62px;
  animation:pessReveal .18s ease
}
.pess-work-panel[hidden]{
  display:none!important
}
@keyframes pessReveal{
  from{opacity:0;transform:translateY(-5px)}
  to{opacity:1;transform:none}
}
.pess-register-panel{
  margin-top:0;
  padding:10px 12px 12px;
  border-color:#b7cdd5;
  background:rgba(255,255,255,.92);
  box-shadow:var(--shadow)
}
.pess-register-panel>summary{
  font-size:14px;
  color:#123e52
}
.pess-register-panel>p.hint{
  margin:2px 0 8px
}
.pess-person-form>.grid{
  gap:8px 9px
}
.pess-person-form>.actions{
  position:sticky;
  bottom:8px;
  z-index:15;
  justify-content:flex-end;
  margin-top:10px;
  padding:8px;
  border:1px solid rgba(184,204,212,.9);
  border-radius:9px;
  background:rgba(249,252,252,.94);
  backdrop-filter:blur(10px);
  box-shadow:0 7px 22px rgba(15,48,70,.12)
}
.pess-person-form>.actions button{
  min-width:230px;
  padding:10px 15px
}
.pess-cpf-api{
  display:flex;
  flex-wrap:wrap;
  gap:5px 7px;
  align-items:center;
  margin-top:4px
}
.pess-cpf-api button{
  padding:6px 9px;
  font-size:10.5px
}
.pess-cpf-api small{
  flex:1 1 150px;
  margin:0;
  font-size:10px
}
.pess-inline-query{
  display:grid;
  grid-template-columns:minmax(220px,360px) auto;
  gap:8px;
  align-items:end;
  max-width:600px
}
.pess-inline-query button{
  min-height:35px
}
.pess-quick-panel,
.pess-search-panel{
  padding:13px 15px
}
.pess-search-panel form{
  display:grid;
  grid-template-columns:minmax(240px,1fr) auto;
  gap:7px;
  margin-bottom:8px
}
.pess-search-panel form button{
  min-height:35px
}
.pess-defeso-card{
  margin:9px 0;
  padding:10px 12px;
  border-color:#c9dee0;
  background:linear-gradient(135deg,rgba(239,249,249,.96),rgba(255,255,255,.93))
}
.pess-defeso-card h3{
  margin-top:0
}
.pess-defeso-card .stats,
.pess-defeso-card .grid{
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:7px
}
.pess-defeso-card .card{
  margin:0;
  padding:9px 11px;
  box-shadow:none
}
.pess-documents{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:7px;
  margin:9px 0 8px;
  padding:11px;
  background:rgba(250,252,252,.93)
}
.pess-documents>h3,
.pess-documents>p{
  grid-column:1/-1;
  margin:0
}
.pess-documents>p+details{
  margin-top:3px
}
.pess-doc-card{
  min-width:0;
  margin:0;
  padding:8px 9px;
  background:rgba(255,255,255,.92);
  box-shadow:none
}
.pess-doc-card summary{
  color:#153e52;
  font-size:11.5px;
  line-height:1.25
}
.pess-doc-card .field{
  font-size:10.5px
}
.pess-doc-card input[type=file]{
  font-size:10.5px
}
.pess-doc-residence{
  grid-column:span 2
}
.pess-doc-residence .grid{
  grid-template-columns:repeat(2,minmax(0,1fr))
}
.pess-api-dialog{
  width:min(980px,94vw);
  max-height:88vh;
  overflow:auto;
  border:1px solid #aac3cc;
  border-radius:12px;
  padding:18px;
  color:var(--navy);
  background:rgba(255,255,255,.98);
  box-shadow:0 24px 70px rgba(15,48,70,.3)
}
.pess-api-dialog::backdrop{
  background:rgba(11,39,55,.58);
  backdrop-filter:blur(2px)
}
.pess-api-dialog details{
  margin:7px 0
}
.pess-api-dialog pre{
  font-size:11.5px;
  line-height:1.45
}
@media(min-width:1250px){
  .pess-person-form>.grid{
    grid-template-columns:repeat(5,minmax(0,1fr))
  }
}
@media(max-width:950px){
  .pess-documents{
    grid-template-columns:repeat(2,minmax(0,1fr))
  }
  .pess-doc-residence{
    grid-column:1/-1
  }
}
@media(max-width:720px){
  .pess-home-actions{
    grid-template-columns:1fr
  }
  .pess-action-card{
    min-height:58px
  }
  .pess-inline-query,
  .pess-search-panel form{
    grid-template-columns:1fr
  }
  .pess-documents{
    grid-template-columns:1fr
  }
  .pess-doc-residence{
    grid-column:auto
  }
  .pess-person-form>.actions{
    position:static
  }
  .pess-person-form>.actions button{
    width:100%;
    min-width:0
  }
}
</style>
