<script>
window.PDA_MODULES.DIST = (()=>{
  const {
    el,button,call,alive,status
  }=App;

  const MAX_FILE_BYTES=5*1024*1024;

  function money_(value){
    return Number(value||0).toLocaleString(
      'pt-BR',
      {style:'currency',currency:'BRL'}
    );
  }

  function cpf_(value){
    const d=String(value||'').replace(/\D/g,'');
    return d.length===11
      ?d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4')
      :String(value||'');
  }

  function date_(value){
    const text=String(value||'').trim();
    if(!text)return '—';
    const m=text.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return m
      ?m[3]+'/'+m[2]+'/'+m[1]
      :text;
  }

  function dateTime_(value){
    const text=String(value||'').trim();
    if(!text)return '';
    const d=new Date(text);
    if(Number.isNaN(d.getTime()))return text;
    return d.toLocaleString('pt-BR');
  }

  function priority_(value){
    return ({
      BAIXA:'Baixa',
      NORMAL:'Normal',
      ALTA:'Alta',
      URGENTE:'Urgente'
    })[String(value||'NORMAL').toUpperCase()]||'Normal';
  }

  function bytes_(value){
    const n=Number(value||0);
    if(!n)return '';
    if(n<1024)return n+' B';
    if(n<1024*1024)return (n/1024).toFixed(1)+' KB';
    return (n/(1024*1024)).toFixed(1)+' MB';
  }

  function field_(label,control){
    const field=el('label',undefined,'field');
    field.append(el('span',label),control);
    return field;
  }

  function validatePdfFiles_(files){
    const list=Array.from(files||[]);

    list.forEach(file=>{
      const name=String(file&&file.name||'');
      const mime=String(file&&file.type||'').toLowerCase();

      if(
        !file||
        !/\.pdf$/i.test(name)||
        (
          mime&&
          mime!=='application/pdf'
        )
      ){
        throw new Error(
          'Somente arquivos PDF podem ser anexados.'
        );
      }

      if(file.size>MAX_FILE_BYTES){
        throw new Error(
          'Cada PDF deve ter no máximo 5 MB: '+name
        );
      }
    });

    return list;
  }

  function fileBase64_(file){
    return new Promise((resolve,reject)=>{
      try{
        validatePdfFiles_([file]);
      }catch(e){
        reject(e);
        return;
      }

      const reader=new FileReader();

      reader.onerror=()=>reject(
        new Error('Não foi possível ler o PDF '+file.name+'.')
      );

      reader.onload=()=>{
        const value=String(reader.result||'');
        const comma=value.indexOf(',');
        resolve(comma>=0?value.slice(comma+1):value);
      };

      reader.readAsDataURL(file);
    });
  }

  async function uploadFiles_(taskId,files){
    const list=Array.from(files||[]);

    for(let i=0;i<list.length;i++){
      const file=list[i];
      status(
        'Anexando PDF '+(i+1)+' de '+list.length+'…'
      );

      await call(
        'tarefaGeralAnexoAdicionar',
        {
          id:taskId,
          nome:file.name,
          mime:'application/pdf',
          base64:await fileBase64_(file)
        },
        true
      );
    }
  }

  async function openPdf_(taskId,attachment){
    return App.openFileViewer(
      ()=>call(
        'tarefaGeralAnexoConteudo',
        {
          id:taskId,
          anexoId:attachment.id
        },
        false,
        {noLoader:true}
      ),
      {
        nome:attachment.nome||'Anexo da tarefa'
      }
    );
  }


  function makeDistRowInteractive_(card,task,onOpen){
    if(typeof onOpen!=='function'){
      return;
    }

    card.tabIndex=0;
    card.setAttribute(
      'role',
      'button'
    );

    card.setAttribute(
      'aria-label',
      'Abrir: '+
      (
        task.titulo||
        task.pessoa||
        'tarefa'
      )
    );

    card.addEventListener(
      'click',
      event=>{
        const target=event.target;

        if(
          target&&
          target.closest&&
          target.closest(
            'button,a,input,select,textarea,label,summary'
          )
        ){
          return;
        }

        onOpen(task);
      }
    );

    card.addEventListener(
      'keydown',
      event=>{
        if(
          event.key==='Enter'||
          event.key===' '
        ){
          event.preventDefault();
          onOpen(task);
        }
      }
    );
  }

  function distMovementBadge_(task){
    return task.novaManifestacao
      ?el(
          'span',
          'NOVA MANIFESTAÇÃO',
          'dist-new-movement'
        )
      :null;
  }

  function assignmentCard_(task,users,refresh,onOpen){
    const card=el(
      'article',
      undefined,
      'dist-task-card '+(
        task.situacao==='PENDENTE_ATRIBUICAO'
          ?'unassigned'
          :'assigned'
      )+
      (task.vencimentoEstado==='VENCIDA'?' overdue':'')+
      (task.vencimentoEstado==='ATE_24H'?' due-24':'')+
      (task.vencimentoEstado==='ATE_96H'?' due-96':'')+
      (task.novaManifestacao?' has-new-movement':'')
    );

    if(task.tags&&task.tags[0]&&task.tags[0].cor){
      card.style.setProperty('--task-accent',task.tags[0].cor);
    }

    const top=el('div',undefined,'dist-task-top');
    const copy=el('div');

    copy.append(
      el('strong',task.pessoa),
      el(
        'small',
        cpf_(task.cpf)+(task.cidade?' · '+task.cidade:'')
      )
    );

    const stateGroup=
      el(
        'span',
        undefined,
        'dist-state-group'
      );

    const movement=
      distMovementBadge_(task);

    if(movement){
      stateGroup.append(movement);
    }

    stateGroup.append(
      el(
        'span',
        task.situacao==='PENDENTE_ATRIBUICAO'
          ?'SEM RESPONSÁVEL'
          :'ATRIBUÍDA',
        'dist-task-status'
      )
    );

    top.append(
      copy,
      stateGroup
    );

    const info=el('div',undefined,'dist-task-info');

    [
      ['Jurisdição',task.jurisdicao||'—'],
      ['Valor da causa',money_(task.valorCausa)],
      [
        'Responsável atual',
        task.responsavelNome||task.responsavel||'Não atribuído'
      ],
      [
        'Distribuída em',
        task.dataDistribuicao
          ?dateTime_(task.dataDistribuicao)
          :'—'
      ],
      [
        'Prazo',
        date_(task.prazo)
      ]
    ].forEach(([label,value])=>{
      const item=el('div');
      item.append(el('span',label),el('strong',value));
      info.append(item);
    });

    const assign=el('div',undefined,'dist-assign-row');
    const select=el('select');

    select.append(
      new Option('Selecione o responsável','')
    );

    users.forEach(user=>{
      const option=new Option(
        [user.nome,user.funcao,user.email].filter(Boolean).join(' · '),
        user.email
      );

      if(
        String(task.responsavel||'').toLowerCase()===
        String(user.email||'').toLowerCase()
      ){
        option.selected=true;
      }

      select.append(option);
    });

    const save=button(
      task.responsavel?'Reatribuir tarefa':'Atribuir tarefa',
      async()=>{
        if(!select.value){
          throw new Error(
            'Selecione um usuário responsável pela distribuição.'
          );
        }

        const result=await call(
          'tarefaDistribuicaoAtribuir',
          {id:task.id,responsavel:select.value},
          true
        );

        const selectedUser=users.find(user=>
          String(user.email||'').toLowerCase()===
          String(result.responsavel||'').toLowerCase()
        );

        task.versao=result.versao||task.versao;
        task.responsavel=result.responsavel||select.value;
        task.responsavelNome=
          selectedUser
            ?selectedUser.nome||selectedUser.email
            :task.responsavel;
        task.situacao=result.situacao||'ATRIBUIDA';
        task.dataDistribuicao=result.atribuidaEm||new Date().toISOString();
        task.modoDistribuicao=result.modoDistribuicao||'MANUAL';

        status('Tarefa atribuída a '+task.responsavelNome+'.');

        /*
         * Atualiza somente o estado já carregado no navegador. Não há nova
         * consulta de toda a fila ao servidor.
         */
        if(typeof refresh==='function'){
          await Promise.resolve(refresh(task));
        }
      }
    );

    assign.append(
      field_('Atribuir distribuição para',select),
      save
    );

    const tags=el('div',undefined,'dist-task-tags');

    (task.tags||[]).forEach(tag=>{
      const chip=el('span',tag.nome||tag,'dist-task-tag');
      if(tag.cor)chip.style.setProperty('--task-tag-color',tag.cor);
      tags.append(chip);
    });

    const quickActions=el('div',undefined,'actions dist-card-quick-actions');

    if(task.pessoaId){
      quickActions.append(
        button(
          'Ver cadastro',
          ()=>App.openPersonDrawer(task.pessoaId),
          true
        )
      );
    }

    card.append(top,info,tags,assign,quickActions);
    makeDistRowInteractive_(
      card,
      task,
      onOpen
    );
    return card;
  }

  function generalCard_(task,onOpen){
    const done=task.situacao==='CONCLUIDA';
    const card=el(
      'article',
      undefined,
      'dist-general-card'+
      (done?' done':'')+
      (task.novaManifestacao?' has-new-movement':'')
    );

    if(task.tags&&task.tags[0]&&task.tags[0].cor){
      card.style.setProperty('--task-accent',task.tags[0].cor);
    }

    const top=el('div',undefined,'dist-general-top');
    const copy=el('div');

    copy.append(
      el('strong',task.titulo),
      el(
        'small',
        'Criada por '+(task.criadoPorNome||task.criadoPor||'—')
      )
    );

    const stateGroup=
      el(
        'span',
        undefined,
        'dist-state-group'
      );

    const movement=
      distMovementBadge_(task);

    if(movement){
      stateGroup.append(movement);
    }

    stateGroup.append(
      el(
        'span',
        done?'CONCLUÍDA':priority_(task.prioridade).toUpperCase(),
        'dist-general-status '+String(task.prioridade||'NORMAL').toLowerCase()
      )
    );

    top.append(
      copy,
      stateGroup
    );

    const description=el(
      'p',
      task.descricao||'Sem informações adicionais.',
      'dist-general-description'
    );

    const meta=el('div',undefined,'dist-general-meta');

    [
      [
        'Cadastro',
        task.pessoa||
        'Sem vínculo'
      ],
      ['Responsável',task.responsavelNome||task.responsavel||'—'],
      ['Prazo',date_(task.prazo)],
      [
        'Movimentações',
        String(task.mensagens||0)+
        ' msg · '+
        String(task.anexos||0)+
        ' anexo(s)'
      ]
    ].forEach(([label,value])=>{
      const item=el('div');
      item.append(el('span',label),el('strong',value));
      meta.append(item);
    });

    const tags=el('div',undefined,'dist-task-tags');
    (task.tags||[]).forEach(tag=>{
      const chip=el('span',tag.nome||tag,'dist-task-tag');
      if(tag.cor)chip.style.setProperty('--task-tag-color',tag.cor);
      tags.append(chip);
    });

    const actions=el('div',undefined,'actions');
    if(task.pessoaId){
      actions.append(
        button(
          'Ver cadastro',
          ()=>App.openPersonDrawer(task.pessoaId),
          true
        )
      );
    }

    actions.append(
      button(
        done?'Abrir histórico':'Abrir / conversar',
        ()=>onOpen(task)
      )
    );

    card.append(top,description,meta,tags,actions);
    return card;
  }


  function openInstantGeneralDialog_(root,task){
    const prior=
      root.querySelector(
        '.dist-instant-dialog'
      );

    if(prior){
      prior.remove();
    }

    const dialog=
      el(
        'dialog',
        undefined,
        'dist-instant-dialog'
      );

    const shell=
      el(
        'div',
        undefined,
        'dist-general-dialog-shell'
      );

    const head=
      el(
        'div',
        undefined,
        'dist-general-dialog-head'
      );

    const copy=el('div');

    copy.append(
      el(
        'h3',
        task.titulo||
        'Tarefa'
      ),
      el(
        'p',
        [
          task.pessoa
            ?'Cadastro: '+task.pessoa
            :'',
          task.criadoPorNome
            ?'Criada por '+task.criadoPorNome
            :''
        ]
          .filter(Boolean)
          .join(' · ')
      )
    );

    head.append(
      copy,
      button(
        'Fechar',
        ()=>dialog.close(),
        true
      )
    );

    const body=
      el(
        'div',
        undefined,
        'dist-general-dialog-body'
      );

    const overview=
      el(
        'div',
        undefined,
        'dist-general-overview'
      );

    [
      [
        'Responsável',
        task.responsavelNome||
        task.responsavel||
        '—'
      ],
      [
        'Prazo',
        date_(task.prazo)
      ],
      [
        'Mensagens',
        String(task.mensagens||0)
      ],
      [
        'PDFs',
        String(task.anexos||0)
      ]
    ].forEach(([label,value])=>{
      const item=el('div');
      item.append(
        el('span',label),
        el('strong',value)
      );
      overview.append(item);
    });

    body.append(overview);
    shell.append(head,body);
    dialog.append(shell);
    root.append(dialog);

    dialog.addEventListener(
      'close',
      ()=>dialog.remove(),
      {once:true}
    );

    dialog.showModal();
    return dialog;
  }

  function renderMessages_(container,detail){
    container.replaceChildren();

    if(!detail.mensagens||!detail.mensagens.length){
      container.append(
        el(
          'div',
          'Nenhuma mensagem nesta tarefa.',
          'dist-chat-empty'
        )
      );
      return;
    }

    detail.mensagens.forEach(message=>{
      const item=el('div',undefined,'dist-chat-message');
      const head=el('div',undefined,'dist-chat-message-head');

      head.append(
        el('strong',message.autorNome||message.autor||'Usuário'),
        el('span',dateTime_(message.criadoEm))
      );

      item.append(
        head,
        el('p',message.mensagem)
      );

      container.append(item);
    });

    container.scrollTop=container.scrollHeight;
  }

  function renderAttachments_(container,detail){
    container.replaceChildren();

    if(!detail.anexos||!detail.anexos.length){
      container.append(
        el('div','Nenhum PDF anexado.','dist-chat-empty')
      );
      return;
    }

    detail.anexos.forEach(attachment=>{
      const row=el('div',undefined,'dist-general-file');
      const copy=el('div');

      copy.append(
        el('strong',attachment.nome),
        el(
          'small',
          [
            bytes_(attachment.bytes),
            attachment.enviadoPorNome||attachment.enviadoPor,
            dateTime_(attachment.criadoEm)
          ].filter(Boolean).join(' · ')
        )
      );

      row.append(
        copy,
        button(
          'Abrir PDF',
          ()=>openPdf_(detail.tarefa.id,attachment),
          true
        )
      );

      container.append(row);
    });
  }

  async function openGeneralDialog_(root,task,refresh){
    const instant=
      openInstantGeneralDialog_(
        root,
        task
      );

    let detail;

    try{
      detail=await call(
        'tarefaGeralDetalhe',
        {id:task.id},
        false,
        {noLoader:true}
      );
    }catch(error){
      if(instant&&instant.open){
        instant.close();
      }
      throw error;
    }

    if(instant){
      instant.remove();
    }

    const prior=root.querySelector('.dist-general-dialog');
    if(prior)prior.remove();

    const dialog=el('dialog',undefined,'dist-general-dialog');
    const shell=el('div',undefined,'dist-general-dialog-shell');
    const head=el('div',undefined,'dist-general-dialog-head');
    const headCopy=el('div');

    headCopy.append(
      el('h3',detail.tarefa.titulo),
      el(
        'p',
        'Criada por '+(
          detail.tarefa.criadoPorNome||
          detail.tarefa.criadoPor||
          '—'
        )
      )
    );

    head.append(
      headCopy,
      button('Fechar',()=>dialog.close(),true)
    );

    const body=el('div',undefined,'dist-general-dialog-body');

    if(detail.tarefa.pessoaId){
      const personBar=
        el(
          'button',
          undefined,
          'dist-linked-person'
        );

      personBar.type='button';

      personBar.append(
        el(
          'span',
          'CADASTRO VINCULADO'
        ),
        el(
          'strong',
          detail.tarefa.pessoa||
          'Pessoa vinculada'
        ),
        el(
          'small',
          [
            cpf_(
              detail.tarefa.pessoaCpf
            ),
            detail.tarefa.pessoaCidade,
            detail.tarefa.pessoaJurisdicao
          ]
            .filter(Boolean)
            .join(' · ')
        )
      );

      personBar.onclick=
        ()=>App.openPersonDrawer(
          detail.tarefa.pessoaId
        );

      body.append(personBar);
    }

    const overview=el('div',undefined,'dist-general-overview');

    const renderOverview=()=>{
      overview.replaceChildren();

      [
        ['Responsável',detail.tarefa.responsavelNome||detail.tarefa.responsavel],
        ['Prioridade',priority_(detail.tarefa.prioridade)],
        ['Prazo',date_(detail.tarefa.prazo)],
        ['Situação',detail.tarefa.situacao==='CONCLUIDA'?'Concluída':'Em andamento']
      ].forEach(([label,value])=>{
        const item=el('div');
        item.append(el('span',label),el('strong',value||'—'));
        overview.append(item);
      });
    };

    renderOverview();

    body.append(
      overview,
      el(
        'div',
        detail.tarefa.descricao||'Sem informações adicionais.',
        'dist-general-text'
      )
    );

    if(detail.tarefa.pessoaId){
      const linked=
        el(
          'section',
          undefined,
          'dist-linked-person'
        );

      const linkedCopy=el('div');

      linkedCopy.append(
        el(
          'span',
          'CADASTRO VINCULADO'
        ),
        el(
          'strong',
          detail.tarefa.pessoa||
          'Pessoa vinculada'
        ),
        el(
          'small',
          [
            detail.tarefa.pessoaCpf
              ?cpf_(detail.tarefa.pessoaCpf)
              :'',
            detail.tarefa.pessoaCidade||'',
            detail.tarefa.pessoaJurisdicao||''
          ]
            .filter(Boolean)
            .join(' · ')
        )
      );

      linked.append(
        linkedCopy,
        button(
          'Ver cadastro',
          ()=>App.openPersonDrawer(
            detail.tarefa.pessoaId,
            {
              summary:{
                id:detail.tarefa.pessoaId,
                nome:detail.tarefa.pessoa,
                cpf:detail.tarefa.pessoaCpf,
                cpfFormatado:cpf_(detail.tarefa.pessoaCpf),
                cidade:detail.tarefa.pessoaCidade,
                jurisdicao:detail.tarefa.pessoaJurisdicao
              }
            }
          ),
          true
        )
      );

      body.append(linked);
    }

    if(
      detail.permissoes&&
      detail.permissoes.gerenciar&&
      detail.tarefa.situacao!=='CONCLUIDA'
    ){
      const manage=el('section',undefined,'dist-general-panel');
      manage.append(el('h4','Responsável pela tarefa'));

      const select=el('select');

      (detail.usuarios||[]).forEach(user=>{
        const option=new Option(
          [user.nome,user.funcao,user.email].filter(Boolean).join(' · '),
          user.email
        );

        if(
          String(user.email||'').toLowerCase()===
          String(detail.tarefa.responsavel||'').toLowerCase()
        ){
          option.selected=true;
        }

        select.append(option);
      });

      manage.append(
        el(
          'p',
          'A reatribuição preserva o histórico de mensagens e PDFs.',
          'hint'
        ),
        field_('Responsável',select),
        button(
          'Salvar responsável',
          async()=>{
            await call(
              'tarefaGeralReatribuir',
              {
                id:detail.tarefa.id,
                responsavel:select.value
              },
              true
            );

            detail=await call(
              'tarefaGeralDetalhe',
              {id:detail.tarefa.id},
              false,
              {noLoader:true}
            );

            renderOverview();
            status('Responsável atualizado.');

            await Promise.resolve(
              refresh({
                kind:'update',
                id:detail.tarefa.id,
                patch:{
                  versao:detail.tarefa.versao,
                  responsavel:detail.tarefa.responsavel,
                  responsavelNome:detail.tarefa.responsavelNome
                }
              })
            );
          }
        )
      );

      body.append(manage);
    }

    const files=el('section',undefined,'dist-general-panel');
    const filesHead=el('div',undefined,'dist-general-panel-head');
    const fileGrid=el('div',undefined,'dist-general-files');

    filesHead.append(el('h4','PDFs da tarefa'));

    const addFile=el('input');
    addFile.type='file';
    addFile.accept='application/pdf,.pdf';
    addFile.multiple=true;

    const upload=button(
      'Adicionar PDF',
      ()=>addFile.click(),
      true
    );

    addFile.addEventListener('change',async()=>{
      if(!addFile.files||!addFile.files.length)return;

      await uploadFiles_(
        detail.tarefa.id,
        addFile.files
      );

      detail=await call(
        'tarefaGeralDetalhe',
        {id:detail.tarefa.id},
        false,
        {noLoader:true}
      );

      renderAttachments_(fileGrid,detail);
      addFile.value='';
      status('PDF(s) anexado(s).');

      await Promise.resolve(
        refresh({
          kind:'update',
          id:detail.tarefa.id,
          patch:{
            anexos:(detail.anexos||[]).length
          }
        })
      );
    });

    filesHead.append(upload,addFile);
    files.append(filesHead,fileGrid);
    renderAttachments_(fileGrid,detail);
    body.append(files);

    const chat=el('section',undefined,'dist-general-panel');
    chat.append(el('h4','Diálogo da tarefa'));

    const messages=el('div',undefined,'dist-chat');
    renderMessages_(messages,detail);

    const composer=el('div',undefined,'dist-chat-compose');
    const textarea=el('textarea');
    textarea.rows=3;
    textarea.maxLength=3000;
    textarea.placeholder='Escreva uma mensagem para o responsável…';

    composer.append(
      textarea,
      button(
        'Enviar mensagem',
        async()=>{
          const message=String(textarea.value||'').trim();

          if(!message){
            throw new Error('Digite uma mensagem.');
          }

          await call(
            'tarefaGeralMensagemEnviar',
            {
              id:detail.tarefa.id,
              mensagem:message
            },
            true
          );

          detail=await call(
            'tarefaGeralDetalhe',
            {id:detail.tarefa.id}
          );

          renderMessages_(messages,detail);
          textarea.value='';
          status('Mensagem enviada.');

          await Promise.resolve(
            refresh({
              kind:'update',
              id:detail.tarefa.id,
              patch:{
                mensagens:(detail.mensagens||[]).length
              }
            })
          );
        }
      )
    );

    chat.append(messages,composer);
    body.append(chat);

    const actions=el('div',undefined,'dist-general-dialog-actions');

    if(
      detail.tarefa.situacao==='CONCLUIDA'&&
      detail.permissoes&&
      detail.permissoes.gerenciar
    ){
      actions.append(
        button(
          'Reabrir tarefa',
          async()=>{
            await call(
              'tarefaGeralReabrir',
              {id:detail.tarefa.id},
              true
            );

            status('Tarefa reaberta.');
            dialog.close();
            await Promise.resolve(
              refresh({
                kind:'reopen',
                id:detail.tarefa.id
              })
            );
          },
          true
        )
      );
    }

    if(
      detail.tarefa.situacao!=='CONCLUIDA'&&
      detail.permissoes&&
      detail.permissoes.concluir
    ){
      actions.append(
        button(
          'Marcar como concluída',
          async()=>{
            await call(
              'tarefaGeralConcluir',
              {id:detail.tarefa.id},
              true
            );

            status('Tarefa concluída.');
            dialog.close();
            await Promise.resolve(
              refresh({
                kind:'complete',
                id:detail.tarefa.id
              })
            );
          }
        )
      );
    }

    if(actions.childNodes.length){
      body.append(actions);
    }

    shell.append(head,body);
    dialog.append(shell);
    root.append(dialog);

    dialog.addEventListener(
      'close',
      ()=>dialog.remove(),
      {once:true}
    );

    dialog.showModal();
  }

  function openCreateDialog_(root,data,refresh){
    const prior=root.querySelector('.dist-create-dialog');
    if(prior)prior.remove();

    const dialog=el('dialog',undefined,'dist-create-dialog');
    const shell=el('div',undefined,'dist-create-shell');
    const head=el('div',undefined,'dist-create-head');
    const headCopy=el('div');

    headCopy.append(
      el('h3','Nova tarefa'),
      el(
        'p',
        'Crie uma tarefa interna, atribua a uma pessoa e anexe PDFs.'
      )
    );

    head.append(
      headCopy,
      button('Fechar',()=>dialog.close(),true)
    );

    const body=el('div',undefined,'dist-create-body');

    const title=el('input');
    title.type='text';
    title.maxLength=160;
    title.placeholder='Ex.: Conferir documentos pendentes';

    const description=el('textarea');
    description.rows=6;
    description.maxLength=6000;
    description.placeholder=
      'Inclua aqui todas as informações necessárias para executar a tarefa.';

    const responsible=el('select');
    responsible.append(
      new Option('Selecione o responsável','')
    );

    (data.usuariosTarefas||[]).forEach(user=>{
      responsible.append(
        new Option(
          [user.nome,user.funcao,user.email].filter(Boolean).join(' · '),
          user.email
        )
      );
    });

    const priority=el('select');
    [
      ['NORMAL','Normal'],
      ['BAIXA','Baixa'],
      ['ALTA','Alta'],
      ['URGENTE','Urgente']
    ].forEach(([value,label])=>
      priority.append(new Option(label,value))
    );

    const deadline=el('input');
    deadline.type='date';

    const personSearch=el('input');
    personSearch.type='search';
    personSearch.placeholder='Buscar cadastro por nome, CPF ou município';

    const person=el('select');
    person.append(new Option('Sem vínculo com cadastro',''));

    let personTimer=null;
    personSearch.addEventListener('input',()=>{
      if(personTimer)clearTimeout(personTimer);
      personTimer=setTimeout(async()=>{
        const term=String(personSearch.value||'').trim();
        person.replaceChildren(new Option('Sem vínculo com cadastro',''));

        if(term.length<2)return;

        try{
          const result=await call('pessoasLeve',{
            busca:term,
            limit:30,
            offset:0
          });
          (result.pessoas||[]).forEach(item=>{
            person.append(
              new Option(
                [item.nome,item.cpf,item.cidade].filter(Boolean).join(' · '),
                item.id
              )
            );
          });
        }catch(e){}
      },220);
    });

    const tags=el('select');
    tags.multiple=true;
    tags.size=Math.min(5,Math.max(3,(data.tags||[]).length||3));
    (data.tags||[]).forEach(tag=>{
      tags.append(new Option(tag.nome,tag.nome));
    });

    const files=el('input');
    files.type='file';
    files.accept='application/pdf,.pdf';
    files.multiple=true;

    const grid=el('div',undefined,'dist-create-grid');

    grid.append(
      field_('Título',title),
      field_('Responsável',responsible),
      field_('Prioridade',priority),
      field_('Prazo',deadline)
    );

    body.append(
      grid,
      field_('Vincular a um cadastro (opcional)',personSearch),
      field_('Cadastro selecionado',person),
      field_('Tags',tags),
      field_('Informações da tarefa',description),
      field_('PDFs (opcional, até 5 MB por arquivo)',files)
    );

    const actions=el('div',undefined,'dist-create-actions');

    actions.append(
      button('Cancelar',()=>dialog.close(),true),
      button(
        'Criar e atribuir tarefa',
        async()=>{
          const taskTitle=String(title.value||'').trim();

          if(!taskTitle){
            throw new Error('Informe o título da tarefa.');
          }

          if(!responsible.value){
            throw new Error('Selecione o responsável.');
          }

          const selectedFiles=
            validatePdfFiles_(
              files.files
            );

          const result=await call(
            'tarefaGeralCriar',
            {
              titulo:taskTitle,
              descricao:String(description.value||'').trim(),
              responsavel:responsible.value,
              prioridade:priority.value,
              prazo:deadline.value,
              pessoaId:person.value,
              tags:Array.from(tags.selectedOptions).map(option=>option.value)
            },
            true
          );

          let uploadError=null;

          if(selectedFiles.length){
            try{
              await uploadFiles_(
                result.tarefa.id,
                selectedFiles
              );
            }catch(e){
              uploadError=e;
            }
          }

          dialog.close();

          if(uploadError){
            status(
              'A tarefa foi criada, mas um PDF não pôde ser anexado: '+
              (uploadError.message||String(uploadError))+
              '. Abra a tarefa para tentar o anexo novamente.',
              true
            );
          }else{
            status(
              result.mensagem||
              'Tarefa criada.'
            );
          }

          /*
           * O salvamento já terminou. A lista é atualizada em segundo
           * plano para que uma leitura lenta não faça a tela parecer
           * travada nem converta um salvamento concluído em falso erro.
           */
          refresh()
            .catch(e=>
              status(
                'A tarefa foi criada, mas a lista não pôde ser atualizada agora: '+
                (e.message||String(e))+
                '. Reabra a aba para atualizar.',
                true
              )
            );

          if(App.refreshTaskNotifications){
            App.refreshTaskNotifications();
          }
        }
      )
    );

    body.append(actions);
    shell.append(head,body);
    dialog.append(shell);
    root.append(dialog);

    dialog.addEventListener(
      'close',
      ()=>dialog.remove(),
      {once:true}
    );

    dialog.showModal();
    requestAnimationFrame(()=>title.focus());
  }

  return async function(ctx){
    const root=ctx.root;
    const content=el('div',undefined,'dist-live-content');
    root.append(content);

    let mode='open';
    let openData=null;
    let historyData=null;
    let rankingData=null;

    const FILTER_KEY='PDA_DIST_FILTERS_V2';
    const filters={
      busca:'',
      responsavel:'',
      tipo:'',
      atribuidaDe:'',
      atribuidaAte:'',
      prazoDe:'',
      prazoAte:''
    };

    try{
      Object.assign(
        filters,
        JSON.parse(
          sessionStorage.getItem(FILTER_KEY)||
          '{}'
        )
      );
    }catch(e){}

    const saveFilters_=()=>{
      try{
        sessionStorage.setItem(
          FILTER_KEY,
          JSON.stringify(filters)
        );
      }catch(e){}
    };

    const canSeeRanking_=()=>{
      const user=App.state.boot&&App.state.boot.usuario||{};
      const funcao=String(user.funcao||'').toLowerCase();
      return user.perfil==='ADMIN'||funcao==='professor'||funcao==='residente';
    };

    const matches_=task=>{
      if(filters.tipo&&task.tipo!==filters.tipo)return false;
      if(filters.responsavel&&String(task.responsavel||'').toLowerCase()!==filters.responsavel)return false;

      const assigned=String(task.dataDistribuicao||task.atribuidaEm||task.criadoEm||'').slice(0,10);
      if(filters.atribuidaDe&&assigned<filters.atribuidaDe)return false;
      if(filters.atribuidaAte&&assigned>filters.atribuidaAte)return false;

      const due=String(task.prazo||'');
      if(filters.prazoDe&&due<filters.prazoDe)return false;
      if(filters.prazoAte&&due>filters.prazoAte)return false;

      const q=filters.busca.trim().toLowerCase();
      if(q){
        const hay=[
          task.titulo,task.descricao,task.pessoa,task.cpf,
          task.responsavelNome,task.criadoPorNome,task.jurisdicao,
          ...(task.tags||[]).map(tag=>tag.nome||tag)
        ].join(' ').toLowerCase();
        if(!hay.includes(q))return false;
      }
      return true;
    };

    const applyOpenTaskChange_=async change=>{
      if(!change)return;

      if(change.kind==='reopen'){
        historyData=null;
        await renderOpen_();
        return;
      }

      const target=
        mode==='history'
          ?historyData
          :openData;

      if(!target||!Array.isArray(target.tarefas))return;

      if(change.kind==='complete'){
        target.tarefas=
          target.tarefas.filter(task=>task.id!==change.id);
        target.total=Math.max(0,Number(target.total||0)-1);
        historyData=null;
      }else if(change.kind==='update'){
        const task=target.tarefas.find(item=>item.id===change.id);
        if(task)Object.assign(task,change.patch||{});
      }

      if(mode==='history'){
        paintHistory_(target);
      }else{
        openData=target;
        paintOpen_(target);
      }
    };

    const markViewed_=task=>{
      if(!task||!task.id)return;

      if(task.novaManifestacao){
        task.novaManifestacao=false;

        applyOpenTaskChange_({
          kind:'update',
          id:task.id,
          patch:{
            novaManifestacao:false,
            ultimoVistoEm:
              new Date().toISOString()
          }
        });
      }

      call(
        'tarefaMarcarVista',
        {id:task.id},
        true,
        {silent:true}
      )
        .then(()=>
          App.refreshTaskNotifications()
        )
        .catch(()=>{});
    };

    const openGeneral_=task=>{
      markViewed_(task);

      return openGeneralDialog_(
        root,
        task,
        applyOpenTaskChange_
      );
    };

    const openDistribution_=async task=>{
      markViewed_(task);

      const instant=
        openInstantGeneralDialog_(
          root,
          task
        );

      let detail;

      try{
        detail=await call(
          'tarefaDistribuicaoDetalhe',
          {id:task.id},
          false,
          {noLoader:true}
        );
      }catch(error){
        if(instant&&instant.open){
          instant.close();
        }
        throw error;
      }

      if(!alive(ctx)){
        if(instant)instant.remove();
        return;
      }

      if(instant)instant.remove();

      const dialog=el('dialog',undefined,'dist-task-detail-dialog');
      const shell=el('div',undefined,'dist-general-dialog-shell');
      const head=el('div',undefined,'dist-general-dialog-head');
      const copy=el('div');
      copy.append(
        el('h3',detail.pessoa.nome),
        el('p','Distribuição processual')
      );
      head.append(copy,button('Fechar',()=>dialog.close(),true));
      const body=el('div',undefined,'dist-general-dialog-body');
      const info=el('div',undefined,'dist-general-overview');
      [
        ['CPF',cpf_(detail.pessoa.cpf)],
        ['Jurisdição',detail.pessoa.jurisdicao],
        ['Valor da causa',money_(detail.pessoa.valorCausa)],
        ['Responsável',detail.tarefa.responsavel||'Sem responsável']
      ].forEach(([label,value])=>{
        const item=el('div');
        item.append(el('span',label),el('strong',value||'—'));
        info.append(item);
      });
      body.append(info);
      if(detail.processo){
        body.append(
          el('p','Processo: '+(detail.processo.numero||'—'),'hint')
        );
      }
      shell.append(head,body);
      dialog.append(shell);
      root.append(dialog);
      dialog.addEventListener('close',()=>dialog.remove(),{once:true});
      dialog.showModal();
    };

    const filterBar_=(data,painter)=>{
      const bar=el('div',undefined,'dist-filterbar');

      const search=el('input');
      search.type='search';
      search.placeholder='Buscar tarefa, cadastro, CPF ou tag';
      search.value=filters.busca;

      const responsible=el('select');
      responsible.append(new Option('Todos os responsáveis',''));
      (data.usuariosTarefas||[]).forEach(user=>{
        responsible.append(new Option(user.nome||user.email,String(user.email||'').toLowerCase()));
      });
      responsible.value=filters.responsavel;

      const type=el('select');
      [
        ['','Todos os tipos'],
        ['DISTRIBUICAO_PROCESSO','Distribuição processual'],
        ['TAREFA_GERAL','Tarefa interna']
      ].forEach(([value,label])=>type.append(new Option(label,value)));
      type.value=filters.tipo;

      const assignedFrom=el('input'); assignedFrom.type='date'; assignedFrom.value=filters.atribuidaDe;
      const assignedTo=el('input'); assignedTo.type='date'; assignedTo.value=filters.atribuidaAte;
      const dueFrom=el('input'); dueFrom.type='date'; dueFrom.value=filters.prazoDe;
      const dueTo=el('input'); dueTo.type='date'; dueTo.value=filters.prazoAte;

      const controls=[
        ['Busca',search],
        ['Responsável',responsible],
        ['Tipo',type],
        ['Distribuída a partir de',assignedFrom],
        ['Distribuída até',assignedTo],
        ['Prazo a partir de',dueFrom],
        ['Prazo até',dueTo]
      ];

      const apply=()=>{
        filters.busca=search.value;
        filters.responsavel=responsible.value;
        filters.tipo=type.value;
        filters.atribuidaDe=assignedFrom.value;
        filters.atribuidaAte=assignedTo.value;
        filters.prazoDe=dueFrom.value;
        filters.prazoAte=dueTo.value;
        saveFilters_();
        (painter||paintOpen_)(data);
      };

      [search,responsible,type,assignedFrom,assignedTo,dueFrom,dueTo].forEach(control=>{
        control.addEventListener(control===search?'input':'change',apply);
      });

      controls.forEach(([label,control])=>bar.append(field_(label,control)));
      return bar;
    };

    const tabBar_=()=>{
      const tabs=el('div',undefined,'dist-tabs');
      const open=button('Abertas',()=>{mode='open'; paintOpen_(openData);},mode!=='open');
      const history=button('Histórico',async()=>{
        mode='history';
        content.setAttribute('aria-busy','true');
        if(!historyData){
          historyData=await call('tarefasHistorico',{limit:100,offset:0});
        }
        paintHistory_(historyData);
      },mode!=='history');

      tabs.append(open,history);

      if(canSeeRanking_()){
        const ranking=button('Ranking',async()=>{
          mode='ranking';
          content.setAttribute('aria-busy','true');
          if(!rankingData){
            rankingData=await call('distribuicaoRanking',{});
          }
          paintRanking_(rankingData);
        },mode!=='ranking');
        tabs.append(ranking);
      }

      return tabs;
    };

    const baseHead_=title=>{
      const head=el('div',undefined,'dist-head');
      const copy=el('div');
      copy.append(
        el('h2',title),
        el('p','Gestão de tarefas, distribuição processual e carga da equipe.','hint')
      );
      head.append(copy,tabBar_());
      return head;
    };

    const paintOpen_=data=>{
      content.replaceChildren();
      content.append(baseHead_('Distribuição e tarefas'));

      const actionBar=el('div',undefined,'dist-actionbar');

      const autoLabel=el('span',undefined,'dist-auto-state '+(data.distribuicaoAutomatica?'is-on':'is-off'));
      autoLabel.textContent=data.distribuicaoAutomatica?'Distribuição automática ativa':'Distribuição automática desativada';

      const toggle=button(
        data.distribuicaoAutomatica?'Desativar automática':'Ativar automática',
        async()=>{
          const result=await call(
            'distribuicaoAutomaticaSalvar',
            {ativo:!data.distribuicaoAutomatica},
            true
          );

          data.distribuicaoAutomatica=!!result.ativo;
          openData=data;
          paintOpen_(data);
          status(result.mensagem||'Configuração atualizada.');
        },
        true
      );

      const run=button(
        'Distribuir pendentes agora',
        async()=>{
          const result=await call('distribuicaoAutomaticaExecutar',{},true);

          const changed=new Map(
            (result.alteradas||[]).map(item=>[item.id,item])
          );

          (data.tarefas||[]).forEach(task=>{
            const update=changed.get(task.id);
            if(!update)return;
            Object.assign(task,update);
          });

          openData=data;
          paintOpen_(data);
          status(result.mensagem||'Distribuição automática concluída.');
        }
      );

      const create=button(
        'Nova tarefa',
        ()=>openCreateDialog_(root,data,renderOpen_)
      );

      const reconcile=button(
        'Criar tarefas faltantes',
        async()=>{
          const result=await call('tarefasDistribuicaoReconciliar',{},true);
          status(result.mensagem||'Tarefas reconciliadas.');
          await renderOpen_();
        },
        true
      );

      actionBar.append(autoLabel,toggle,run,create,reconcile);
      content.append(actionBar,filterBar_(data,paintOpen_));

      const tasks=(data.tarefas||[]).filter(matches_);
      const internal=tasks.filter(task=>task.tipo==='TAREFA_GERAL');
      const distribution=tasks.filter(task=>task.tipo==='DISTRIBUICAO_PROCESSO');

      const stats=el('div',undefined,'dist-stats');
      [
        [distribution.filter(task=>!task.responsavel).length,'Distribuições sem responsável'],
        [distribution.filter(task=>!!task.responsavel).length,'Distribuições atribuídas'],
        [internal.length,'Tarefas internas abertas'],
        [(data.usuariosDistribuicao||[]).length,'Usuários na distribuição']
      ].forEach(([value,label])=>{
        const box=el('div',undefined,'dist-stat');
        box.append(el('strong',String(value)),el('span',label));
        stats.append(box);
      });
      content.append(stats);

      const internalSection=el('section',undefined,'dist-section');
      const internalHead=el('div',undefined,'dist-section-head');
      internalHead.append(el('h3','Tarefas internas abertas'),el('span',internal.length+' tarefa(s)','hint'));
      const internalGrid=el('div',undefined,'dist-general-grid');
      if(!internal.length){
        internalGrid.append(el('div','Nenhuma tarefa interna aberta com esses filtros.','dist-empty'));
      }else{
        internal.forEach(task=>internalGrid.append(generalCard_(task,openGeneral_)));
      }
      internalSection.append(internalHead,internalGrid);
      content.append(internalSection);

      const distributionSection=el('section',undefined,'dist-section');
      const distributionHead=el('div',undefined,'dist-section-head');
      distributionHead.append(el('h3','Distribuições processuais abertas'),el('span',distribution.length+' tarefa(s)','hint'));
      const grid=el('div',undefined,'dist-grid');
      if(!distribution.length){
        grid.append(el('div','Nenhuma distribuição processual aberta com esses filtros.','dist-empty'));
      }else{
        distribution.forEach(task=>
          grid.append(
            assignmentCard_(
              task,
              data.usuariosDistribuicao||[],
              ()=>{
                openData=data;
                paintOpen_(data);
              },
              openDistribution_
            )
          )
        );
      }
      distributionSection.append(distributionHead,grid);
      content.append(distributionSection);
      content.removeAttribute('aria-busy');
    };

    const paintHistory_=data=>{
      content.replaceChildren();
      content.append(baseHead_('Histórico de tarefas'));

      const info=el(
        'p',
        'O histórico é carregado somente quando esta guia é aberta. Use os filtros para localizar tarefas concluídas.',
        'hint'
      );
      content.append(info);

      const fake={
        tarefas:data.tarefas||[],
        usuariosTarefas:openData?openData.usuariosTarefas:[],
        tags:data.tags||[]
      };
      fake.hasMore=data.hasMore;
      fake.offset=data.offset;
      fake.limit=data.limit;
      fake.total=data.total;
      content.append(filterBar_(fake,paintHistory_));

      const tasks=(data.tarefas||[]).filter(matches_);
      const section=el('section',undefined,'dist-section');
      const head=el('div',undefined,'dist-section-head');
      head.append(el('h3','Tarefas concluídas'),el('span',tasks.length+' resultado(s)','hint'));
      const grid=el('div',undefined,'dist-general-grid dist-history-grid');

      if(!tasks.length){
        grid.append(el('div','Nenhuma tarefa concluída encontrada.','dist-empty'));
      }else{
        tasks.forEach(task=>{
          const card=el('article',undefined,'dist-history-card');
          const top=el('div',undefined,'dist-general-top');
          top.append(
            el('strong',task.titulo),
            el('span',task.tipoLabel,'dist-general-status normal')
          );
          const meta=el('div',undefined,'dist-general-meta');
          [
            ['Responsável',task.responsavelNome||task.responsavel||'—'],
            ['Cadastro',task.pessoa||'—'],
            ['Concluída em',dateTime_(task.concluidaEm)],
            ['Prazo',date_(task.prazo)]
          ].forEach(([label,value])=>{
            const item=el('div');
            item.append(el('span',label),el('strong',value));
            meta.append(item);
          });
          card.append(top,meta,button('Abrir',()=>task.tipo==='TAREFA_GERAL'?openGeneral_(task):openDistribution_(task),true));
          grid.append(card);
        });
      }
      section.append(head,grid);
      content.append(section);

      if(data.hasMore){
        const more=button(
          'Carregar mais concluídas',
          async()=>{
            more.disabled=true;
            more.textContent='Carregando…';

            try{
              const next=await call(
                'tarefasHistorico',
                {
                  limit:100,
                  offset:(data.tarefas||[]).length
                }
              );

              historyData=Object.assign({},data,{
                tarefas:[
                  ...(data.tarefas||[]),
                  ...(next.tarefas||[])
                ],
                hasMore:next.hasMore,
                total:next.total,
                offset:0,
                limit:(data.tarefas||[]).length+(next.tarefas||[]).length
              });

              paintHistory_(historyData);
            }catch(e){
              more.disabled=false;
              more.textContent='Carregar mais concluídas';
              throw e;
            }
          },
          true
        );

        more.classList.add('dist-history-more');
        content.append(more);
      }

      content.removeAttribute('aria-busy');
    };

    const paintRanking_=data=>{
      content.replaceChildren();
      content.append(baseHead_('Ranking operacional'));

      const periodKey='PDA_DIST_RANK_PERIOD_V2';
      let savedPeriod={};
      try{
        savedPeriod=JSON.parse(sessionStorage.getItem(periodKey)||'{}');
      }catch(e){}

      const filters=el('div',undefined,'dist-ranking-filters');
      const start=el('input');
      start.type='date';
      start.value=data.inicio||savedPeriod.inicio||'';

      const end=el('input');
      end.type='date';
      end.value=data.fim||savedPeriod.fim||'';

      const apply=button('Aplicar período',async()=>{
        try{
          sessionStorage.setItem(
            periodKey,
            JSON.stringify({
              inicio:start.value,
              fim:end.value
            })
          );
        }catch(e){}

        content.setAttribute('aria-busy','true');
        rankingData=await call('distribuicaoRanking',{
          inicio:start.value,
          fim:end.value
        });
        paintRanking_(rankingData);
      });

      filters.append(
        field_('Início',start),
        field_('Fim',end),
        apply
      );
      content.append(filters);

      const rows=data.linhas||[];

      const leaderboards=el('div',undefined,'dist-ranking-panels');

      const board_=(title,key,rankKey,format=value=>String(value||0))=>{
        const board=el('section',undefined,'dist-rank-board');
        board.append(el('h3',title));

        rows
          .slice()
          .sort((a,b)=>
            Number(a[rankKey]||999)-
            Number(b[rankKey]||999)
          )
          .slice(0,5)
          .forEach(row=>{
            const line=el('div',undefined,'dist-rank-line');
            const pos=el('strong',String(row[rankKey]||'—'),'dist-rank-position');
            const person=el('div');
            person.append(
              el('b',row.nome),
              el('small',row.funcao||'')
            );
            line.append(
              pos,
              person,
              el('span',format(row[key]))
            );
            board.append(line);
          });

        return board;
      };

      leaderboards.append(
        board_('Cadastros realizados','cadastros','rankCadastros'),
        board_('Tarefas concluídas','tarefasConcluidas','rankTarefas'),
        board_('Processos distribuídos','processosDistribuidos','rankProcessos'),
        board_(
          'Média processos / login',
          'mediaProcessosPorLogin',
          'rankMedia',
          value=>Number(value||0).toLocaleString('pt-BR',{
            minimumFractionDigits:2,
            maximumFractionDigits:2
          })
        )
      );

      content.append(leaderboards);

      const tableWrap=el('div',undefined,'scroll dist-ranking-table');
      const table=el('table');
      const thead=el('thead');
      const tr=el('tr');

      [
        'Pessoa','Função',
        'Cadastros','Pos. cad.',
        'Tarefas','Pos. tar.',
        'Processos','Pos. proc.',
        'Logins','Proc./login','Pos. média'
      ].forEach(label=>tr.append(el('th',label)));

      thead.append(tr);
      const tbody=el('tbody');

      rows.forEach(row=>{
        const line=el('tr');
        [
          row.nome,
          row.funcao||'—',
          String(row.cadastros),
          String(row.rankCadastros),
          String(row.tarefasConcluidas),
          String(row.rankTarefas),
          String(row.processosDistribuidos),
          String(row.rankProcessos),
          String(row.logins),
          Number(row.mediaProcessosPorLogin||0).toLocaleString('pt-BR',{
            minimumFractionDigits:2,
            maximumFractionDigits:2
          }),
          String(row.rankMedia)
        ].forEach(value=>line.append(el('td',value)));
        tbody.append(line);
      });

      table.append(thead,tbody);
      tableWrap.append(table);
      content.append(tableWrap);
      content.removeAttribute('aria-busy');
    };

    const renderOpen_=async()=>{
      mode='open';
      content.setAttribute('aria-busy','true');
      openData=await call('tarefasAbertasGestao',{});
      if(!alive(ctx))return;
      paintOpen_(openData);
    };

    content.replaceChildren(
      baseHead_('Distribuição e tarefas'),
      el(
        'div',
        undefined,
        'dist-instant-list'
      )
    );

    await renderOpen_();
  };
})();
</script>
