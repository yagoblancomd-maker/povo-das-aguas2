 function resetClientCaches_(){
  MODULE_CACHE.clear();
  MODULE_REQUESTS.clear();
  READ_CACHE.clear();
  READ_REQUESTS.clear();
  bulkModulePromise=null;
  bulkModuleCodes=new Set();
  dataWarmupPromise=null;
  warmupScheduled=false;
 }

 function ensureSessionCaches_(){
  if(cacheSessionToken!==authSessionToken){
    resetClientCaches_();
    cacheSessionToken=authSessionToken;
  }
 }

 function readKey_(action,data){
  return action+'|'+JSON.stringify(data||{});
 }

 function clearReadCaches_(){
  READ_CACHE.clear();
  READ_REQUESTS.clear();
 }

 function refreshReadInBackground_(action,data,key){
  if(
    !CACHEABLE_READS.has(action)||
    READ_REQUESTS.has(key)
  ){
    return;
  }

  const request=
    raw(
      'api',
      action,
      data,
      authSessionToken
    )
      .then(result=>{
        READ_CACHE.set(
          key,
          {
            value:result,
            at:performance.now()
          }
        );
        return result;
      })
      .catch(()=>null)
      .finally(()=>{
        if(READ_REQUESTS.get(key)===request){
          READ_REQUESTS.delete(key);
        }
      });

  READ_REQUESTS.set(key,request);
 }

 function cachedRead_(action,data){
  if(!CACHEABLE_READS.has(action))return null;

  const key=readKey_(action,data);
  const item=READ_CACHE.get(key);

  if(!item)return null;

  const age=
    performance.now()-
    item.at;

  if(age>READ_CACHE_TTL_MS){
    READ_CACHE.delete(key);
    return null;
  }

  if(age>READ_CACHE_REFRESH_MS){
    refreshReadInBackground_(
      action,
      data,
      key
    );
  }

  return item.value;
 }

 function readRequest_(action,data){
  if(!CACHEABLE_READS.has(action)){
    return raw('api',action,data,authSessionToken);
  }

  const key=readKey_(action,data);
  const cached=cachedRead_(action,data);

  if(cached!==null){
    return Promise.resolve(cached);
  }

  if(READ_REQUESTS.has(key)){
    return READ_REQUESTS.get(key);
  }

  const request=
    raw(
      'api',
      action,
      data,
      authSessionToken
    )
      .then(result=>{
        READ_CACHE.set(
          key,
          {
            value:result,
            at:performance.now()
          }
        );
        return result;
      })
      .finally(()=>{
        if(READ_REQUESTS.get(key)===request){
          READ_REQUESTS.delete(key);
        }
      });

  READ_REQUESTS.set(key,request);
  return request;
 }

 function installModuleScript_(code,module){
  if(window.PDA_MODULES[code])return;
  const s=document.createElement('script');
  s.textContent=
    module.script
      .replace(/^\s*<script>/,'')
      .replace(/<\/script>\s*$/,'');
  document.head.append(s);
  s.remove();
 }

 async function getModule_(code){
  ensureSessionCaches_();

  if(MODULE_CACHE.has(code)){
    return MODULE_CACHE.get(code);
  }

  if(
    bulkModulePromise&&
    bulkModuleCodes.has(code)
  ){
    /*
     * Dá uma pequena vantagem ao preload já em andamento, mas nunca faz
     * um clique esperar indefinidamente pelo pacote completo.
     */
    try{
      await Promise.race([
        bulkModulePromise,
        new Promise(resolve=>
          setTimeout(resolve,360)
        )
      ]);
    }catch(e){}

    if(MODULE_CACHE.has(code)){
      return MODULE_CACHE.get(code);
    }
  }

  if(MODULE_REQUESTS.has(code)){
    return MODULE_REQUESTS.get(code);
  }

  const request=
    raw(
      'carregarModulo',
      code,
      authSessionToken
    )
      .then(module=>{
        MODULE_CACHE.set(code,module);
        return module;
      })
      .finally(()=>{
        if(MODULE_REQUESTS.get(code)===request){
          MODULE_REQUESTS.delete(code);
        }
      });

  MODULE_REQUESTS.set(code,request);
  return request;
 }

 function prefetchRead_(action,data={}){
  if(!CACHEABLE_READS.has(action)){
    return Promise.resolve();
  }

  return readRequest_(action,data).catch(()=>{});
 }

 function prefetchModule_(code,withData=true){
  if(
    !boot||
    !boot.modulos||
    !Object.prototype.hasOwnProperty.call(
      boot.modulos,
      code
    )
  ){
    return Promise.resolve();
  }

  const initial=
    MODULE_INITIAL_READ[code];

  if(MODULE_CACHE.has(code)){
    if(
      withData&&
      initial
    ){
      prefetchRead_(
        initial[0],
        initial[1]
      );
    }

    return Promise.resolve(
      MODULE_CACHE.get(code)
    );
  }

  return getModule_(code)
    .then(module=>{
      if(
        withData&&
        initial
      ){
        prefetchRead_(
          initial[0],
          initial[1]
        );
      }

      return module;
    })
    .catch(()=>null);
 }

 function bindModulePrefetch_(node,code){
  if(!node)return;

  let timer=null;

  const warm=delay=>{
    if(timer){
      clearTimeout(timer);
    }

    timer=
      setTimeout(
        ()=>{
          timer=null;
          prefetchModule_(
            code,
            true
          );
        },
        delay
      );
  };

  const cancel=()=>{
    if(timer){
      clearTimeout(timer);
      timer=null;
    }
  };

  node.addEventListener(
    'mouseenter',
    ()=>warm(90),
    {passive:true}
  );

  node.addEventListener(
    'focus',
    ()=>warm(0)
  );

  node.addEventListener(
    'pointerdown',
    ()=>warm(0),
    {passive:true}
  );

  node.addEventListener(
    'mouseleave',
    cancel,
    {passive:true}
  );
 }

 function consumeWarmup_(payload){
  if(!payload)return;

  Object.entries(
    payload.modules||{}
  ).forEach(([code,module])=>{
    if(module){
      MODULE_CACHE.set(
        code,
        module
      );
    }
  });

  Object.values(
    payload.data||{}
  ).forEach(item=>{
    if(
      !item||
      !item.action||
      !CACHEABLE_READS.has(
        item.action
      )
    ){
      return;
    }

    READ_CACHE.set(
      readKey_(
        item.action,
        item.query||{}
      ),
      {
        value:item.result,
        at:performance.now()
      }
    );
  });
 }

 function warmInitialData_(codes){
  if(
    dataWarmupPromise||
    !codes||
    !codes.length
  ){
    return dataWarmupPromise||
      Promise.resolve();
  }

  dataWarmupPromise=
    raw(
      'aquecerDadosModulos',
      codes,
      authSessionToken
    )
      .then(payload=>{
        consumeWarmup_(payload);
        return payload;
      })
      .catch(()=>null)
      .finally(()=>{
        dataWarmupPromise=null;
      });

  return dataWarmupPromise;
 }

 function runModuleWarmup_(){
  if(
    !boot||
    !boot.modulos||
    !authSessionToken
  ){
    return Promise.resolve();
  }

  const allCodes=
    Object.keys(
      boot.modulos
    )
      .filter(code=>
        code!==current
      );

  const codes=
    allCodes
      .filter(code=>
        !MODULE_CACHE.has(code)
      );

  if(!codes.length){
    warmInitialData_(
      allCodes
    );
    return Promise.resolve();
  }

  bulkModuleCodes=
    new Set(codes);

  bulkModulePromise=
    raw(
      'carregarModulos',
      codes,
      authSessionToken
    )
      .then(modules=>{
        consumeWarmup_({
          modules
        });

        /*
         * Primeiro liberamos os bundles. Os dados são aquecidos somente
         * depois, para uma consulta pesada ao Sheets nunca segurar HTML/CSS/JS.
         */
        setTimeout(
          ()=>warmInitialData_(
            allCodes
          ),
          40
        );

        return modules;
      })
      .catch(()=>null)
      .finally(()=>{
        bulkModulePromise=null;
        bulkModuleCodes=
          new Set();
      });

  return bulkModulePromise;
 }

 function scheduleModuleWarmup_(){
  if(
    warmupScheduled||
    !boot||
    !authSessionToken
  ){
    return;
  }

  warmupScheduled=true;

  const launch=()=>{
    runModuleWarmup_();
  };

  if(
    typeof requestIdleCallback==='function'
  ){
    requestIdleCallback(
      launch,
      {timeout:900}
    );
  }else{
    setTimeout(
      launch,
      260
    );
  }
 }

 function processingProfile_(action,write){
  if(PROCESSING_PROFILES[action]){
    return PROCESSING_PROFILES[action];
  }

  if(!write){
    return null;
  }

  return {
    seconds:6,
    title:'Salvando alterações',
    phases:[
      [0,'Preparando os dados'],
      [.35,'Gravando as alterações'],
      [.75,'Atualizando o sistema'],
      [.92,'Concluindo']
    ]
  };
 }

 function processingPercent_(elapsed,seconds){
  const expected=Math.max(2,Number(seconds)||6);
  const ratio=elapsed/expected;

  if(ratio<=.12){
    return Math.max(3,Math.round(ratio/.12*14));
  }

  if(ratio<=.72){
    return Math.round(
      14+
      ((ratio-.12)/.60)*62
    );
  }

  if(ratio<=1){
    return Math.round(
      76+
      ((ratio-.72)/.28)*15
    );
  }

  return Math.min(
    96,
    91+Math.floor((ratio-1)*2)
  );
 }

 function phaseForProgress_(profile,progress){
  const normalized=progress/100;
  let message=profile.phases[0][1];

  profile.phases.forEach(item=>{
    if(normalized>=item[0]){
      message=item[1];
    }
  });

  return message;
 }

 function setProcessingPhrase_(immediate=false){
  const phrase=document.getElementById('pda-processing-phrase');
  if(!phrase||!LOADING_PHRASES.length)return;
  const apply=()=>{
    phrase.textContent=LOADING_PHRASES[processingPhraseIndex%LOADING_PHRASES.length];
    processingPhraseIndex=(processingPhraseIndex+1)%LOADING_PHRASES.length;
    phrase.classList.remove('is-changing');
  };
  if(immediate){apply();return;}
  phrase.classList.add('is-changing');
  setTimeout(apply,180);
 }

 function startProcessingPhrases_(){
  if(processingPhraseTimer)clearInterval(processingPhraseTimer);
  processingPhraseIndex=Math.floor(Math.random()*LOADING_PHRASES.length);
  setProcessingPhrase_(true);
  processingPhraseTimer=setInterval(()=>setProcessingPhrase_(false),4800);
 }

 function stopProcessingPhrases_(){
  if(processingPhraseTimer){
    clearInterval(processingPhraseTimer);
    processingPhraseTimer=null;
  }
 }

 function renderProcessing_(){
  if(!processingState)return;

  const overlay=ensureProcessingOverlay_();
  const now=performance.now();
  const elapsed=(now-processingState.started)/1000;
  const profile=processingState.profile;
  const progress=
    processingState.complete
      ?100
      :processingPercent_(
        elapsed,
        profile.seconds
      );

  const message=
    processingState.complete
      ?'Operação concluída'
      :phaseForProgress_(
        profile,
        progress
      );

  const estimatedLeft=
    Math.max(
      0,
      Math.ceil(
        profile.seconds-elapsed
      )
    );

  overlay.querySelector('#pda-processing-title').textContent=
    processingState.complete
      ?'Concluído'
      :profile.title;

  overlay.querySelector('#pda-processing-message').textContent=
    message;

  overlay.querySelector('#pda-processing-percent').textContent=
    progress+'%';

  overlay.querySelector('#pda-processing-bar').style.width=
    progress+'%';

  const progressNode=
    overlay.querySelector(
      '.processing-progress'
    );

  progressNode.setAttribute(
    'aria-valuenow',
    String(progress)
  );

  let remainingText='';

  if(processingState.complete){
    remainingText='Finalizado.';
  }else if(elapsed<1){
    remainingText=
      'Tempo estimado: cerca de '+
      Math.ceil(profile.seconds)+
      ' segundos';
  }else if(estimatedLeft>1){
    remainingText=
      'Tempo estimado: cerca de '+
      estimatedLeft+
      ' segundos';
  }else{
    remainingText=
      'Tempo estimado: menos de alguns segundos';
  }

  overlay.querySelector('#pda-processing-remaining').textContent=
    remainingText;
 }

 function beginProcessing_(action,write){
  const profile=
    processingProfile_(
      action,
      write
    );

  if(!profile)return null;

  if(processingHideTimer){
    clearTimeout(processingHideTimer);
    processingHideTimer=null;
  }

  const id=
    crypto.randomUUID();

  processingState={
    id,
    action,
    profile,
    started:performance.now(),
    complete:false
  };

  const overlay=
    ensureProcessingOverlay_();

  overlay.hidden=false;
  document.body.classList.add(
    'processing-active'
  );

  startProcessingPhrases_();
  renderProcessing_();

  if(processingTimer){
    clearInterval(processingTimer);
  }

  processingTimer=
    setInterval(
      renderProcessing_,
      350
    );

  return id;
 }

 function safeBeginProcessing_(action,write){
  try{
    return beginProcessing_(action,write);
  }catch(e){
    console.warn(
      'Falha ao iniciar indicador de processamento:',
      e
    );
    return null;
  }
 }

 function endProcessing_(id,success=true){
  if(
    !id||
    !processingState||
    processingState.id!==id
  ){
    return;
  }

  if(processingTimer){
    clearInterval(processingTimer);
    processingTimer=null;
  }

  stopProcessingPhrases_();

  if(success){
    processingState.complete=true;
    renderProcessing_();
  }

  if(!success){
    const overlay=ensureProcessingOverlay_();
    overlay.querySelector('#pda-processing-title').textContent='Não foi possível concluir';
    overlay.querySelector('#pda-processing-message').textContent='A operação foi interrompida. Verifique a mensagem exibida no sistema.';
    overlay.querySelector('#pda-processing-remaining').textContent='Carregamento interrompido.';
  }

  const delay=
    success
      ?520
      :900;

  processingHideTimer=
    setTimeout(
      ()=>{
        const overlay=
          document.getElementById(
            'pda-processing-overlay'
          );

        if(overlay){
          overlay.hidden=true;
        }

        document.body.classList.remove(
          'processing-active'
        );

        processingState=null;
        processingHideTimer=null;
      },
      delay
    );
 }

 async function call(action,data={},write=false,options={}){
  const token=epoch;
  const silent=!!(options&&options.silent);
  let payload={...data};
  let processingId=null;
  let processingDelay=null;

  if(write){
    const digest=
      Array.from(
        new Uint8Array(
          await crypto.subtle.digest(
            'SHA-256',
            new TextEncoder().encode(
              JSON.stringify({action,data})
            )
          )
        )
      )
        .map(x=>
          x.toString(16).padStart(2,'0')
        )
        .join('');

    const key='pda.operation.'+digest;
    payload.op=
      sessionStorage.getItem(key)||
      crypto.randomUUID();
    sessionStorage.setItem(
      key,
      payload.op
    );

    /*
     * Qualquer mutação invalida imediatamente resultados de leitura
     * guardados no navegador.
     */
    clearReadCaches_();

    if(!silent){
      busy++;
      document
        .querySelectorAll('button')
        .forEach(b=>b.disabled=true);

      processingId=
        safeBeginProcessing_(
          action,
          true
        );
    }

  }else if(!navigationLoading){
    /*
     * Operações rápidas não piscam o loader. Ele só aparece se a leitura
     * realmente ultrapassar a janela de resposta imediata.
     */
    processingDelay=
      setTimeout(
        ()=>{
          processingId=
            safeBeginProcessing_(
              action,
              false
            );
        },
        380
      );
  }

  try{
    const result=
      write
        ?await raw(
            'api',
            action,
            payload,
            authSessionToken
          )
        :await readRequest_(
            action,
            payload
          );

    if(token!==epoch){
      throw new Error(
        'Resposta de tela anterior descartada.'
      );
    }

    if(write){
      clearReadCaches_();
      if(!silent){
        status('Operação concluída.');
      }
    }

    if(processingDelay){
      clearTimeout(processingDelay);
      processingDelay=null;
    }

    endProcessing_(
      processingId,
      true
    );

    return result;

  }catch(e){
    if(processingDelay){
      clearTimeout(processingDelay);
      processingDelay=null;
    }

    endProcessing_(
      processingId,
      false
    );

    const message=
      e.message||
      String(e);

    if(
      /AUTH:/.test(message)&&
      window.PDA_AUTH
    ){
      window.PDA_AUTH.sessionExpired(
        message.replace(
          /^Exception:\s*/,
          ''
        )
      );
    }

    if(token===epoch){
      status(
        message+
        (
          write
            ?'\nA operação pode ter sido parcialmente executada. Mantenha os mesmos dados e tente novamente; consulte a ficha antes de alterar o envio.'
            :''
        ),
        true
      );
    }

    throw e;

  }finally{
    if(write&&!silent){
      busy--;
      document
        .querySelectorAll('button')
        .forEach(b=>b.disabled=false);
    }
  }
 }

    if(!match){

      return;
    }

    const day=Number(match[1]);
    const month=Number(match[2]);
    const year=Number(match[3]);
    const parsed=new Date(year,month-1,day);
    parsed.setHours(0,0,0,0);

      parsed.getFullYear()!==year||
      parsed.getMonth()!==month-1||
      parsed.getDate()!==day

 async function refreshCurrentModule_(options={}){
  const code=options.code||current;
  const pessoaId=
    Object.prototype.hasOwnProperty.call(
      options,
      'pessoaId'
    )
      ?options.pessoaId
      :selection;

  if(!code)return;

  if(pessoaId){
    selection=pessoaId;
  }

  const root=
    document.getElementById('app');

  if(!root)return;

  const token=++epoch;
  const scrollX=window.scrollX;
  const scrollY=window.scrollY;
  const active=document.activeElement;
  const activeId=
    active&&active.id
      ?active.id
      :'';
  const activeName=
    active&&active.getAttribute
      ?active.getAttribute('name')||''
      :'';

  root.setAttribute(
    'data-syncing',
    'true'
  );

  let stage=null;

  try{
    const module=
      await getModule_(code);

    if(token!==epoch)return;

    installModuleScript_(
      code,
      module
    );

    stage=
      el(
        'div',
        undefined,
        'app-module-stage'
      );

    stage.innerHTML=
      module.style+
      module.view;

    const section=
      stage.querySelector(
        'section'
      );

    if(!section){
      throw new Error(
        'Estrutura inválida do módulo '+code+'.'
      );
    }

    await window.PDA_MODULES[code]({
      root:section,
      token
    });

    decorateModule_(
      code,
      section
    );

    if(token!==epoch){
      stage.remove();
      return;
    }

    root.replaceChildren(
      ...Array.from(
        stage.childNodes||
        stage.children||
        []
      )
    );

    current=code;
    renderNavigation_();

    requestAnimationFrame(()=>{
      window.scrollTo(
        scrollX,
        scrollY
      );

      let target=null;

      if(activeId){
        target=
          document.getElementById(
            activeId
          );
      }

      if(
        !target&&
        activeName
      ){
        target=
          root.querySelector(
            '[name="'+
            CSS.escape(activeName)+
            '"]'
          );
      }

      if(
        target&&
        typeof target.focus==='function'
      ){
        try{
          target.focus({
            preventScroll:true
          });
        }catch(e){
          target.focus();
        }
      }
    });

  }catch(e){
    if(
      /AUTH:/.test(e.message)&&
      window.PDA_AUTH
    ){
      window.PDA_AUTH.sessionExpired(
        e.message
      );
      return;
    }

    status(
      e.message||
      String(e),
      true
    );

  }finally{
    if(token===epoch){
      root.removeAttribute(
        'data-syncing'
      );
    }
  }

 async function go(code,pessoaId){

  let perfContent=0;

  if(
    boot&&
    boot.modulos&&
    !Object.prototype.hasOwnProperty.call(
      boot.modulos,
      code
    )
  ){

      'Este módulo não está disponível para suas permissões atuais.',
      true

  }

   * Mantém a tela anterior visível. O loader grande só entra se a troca

    setTimeout(
      ()=>{

          moduleProcessingId=
            safeBeginProcessing_(
              'carregarModulo',
              false
            );
        }
      },
      720
    );

    const bundleStarted=
      performance.now();

    const module=
      await getModule_(code);

      performance.now()-
      bundleStarted;

      return;
    }

      code,
      module
    );

        'div',

        'app-module-stage'
      );

      module.style+

      );

      throw new Error(
        'Estrutura inválida do módulo '+code+'.'

    }

     * Depois da primeira tela pronta, aquece silenciosamente os demais

    scheduleModuleWarmup_();

      clearTimeout(

 function renderTaskNotifications_(data){
  const badge=
    document.getElementById(
      'taskNotificationBadge'
    );

  const list=
    document.getElementById(
      'taskNotificationList'
    );

  const count=
    Number(
      data&&data.naoLidas||
      0
    );

  if(badge){
    badge.textContent=
      count>99
        ?'99+'
        :String(count);
    badge.hidden=!count;
  }

  if(!list)return;

  list.replaceChildren();

  const items=
    data&&Array.isArray(data.itens)
      ?data.itens
      :[];

  if(!items.length){
    list.append(
      el(
        'div',

      el(
        'button',
        undefined,
        'app-notification-item'+
        (item.nova?' is-new':'')
      );

    row.type='button';

    const top=
      el(
        'div',
        undefined,
        'app-notification-item-top'
      );

    top.append(
      el(
        'strong',
        item.titulo||'Tarefa'

        'span',
        item.nova?'NOVA':'',
        'app-notification-new'
      )

          :'',
        item.prazo
          ?'Prazo '+String(item.prazo).split('-').reverse().join('/')
          :'',
        notificationDate_(
          item.atribuidaEm
        )
      ]
        .filter(Boolean)
        .join(' · ');

    row.append(
      top,
      el(
        'small',
        meta
      )

    row.onclick=()=>{
      const panel=
        document.getElementById(
          'taskNotificationPanel'
        );

      const trigger=
        document.getElementById(
          'taskNotificationButton'

      if(panel){
        panel.hidden=true;

      if(trigger){

 async function refreshTaskNotifications_(){
  if(
    !authSessionToken||
    taskNotificationLoading
  ){
    return null;
  }

  taskNotificationLoading=true;

  try{
    const data=
      await call(
        'notificacoesTarefas'
      );

    renderTaskNotifications_(data);
    return data;
  }catch(e){
    const list=
      document.getElementById(
        'taskNotificationList'
      );

    if(list){
      list.replaceChildren();

      const message=
        el(
          'div',
          'Não foi possível carregar as notificações.',
          'app-notification-empty app-notification-error'
        );

      const retry=
        el(
          'button',
          'Tentar novamente',
          'app-notification-retry'
        );

      retry.type='button';
      retry.onclick=()=>refreshTaskNotifications_();

      list.append(
        message,
        retry
      );
    }

    return null;
  }finally{
    taskNotificationLoading=false;
  }
 }

 async function openTaskNotifications_(){
  const panel=
    document.getElementById(
      'taskNotificationPanel'
    );

  const trigger=
    document.getElementById(
      'taskNotificationButton'
    );

  if(!panel||!trigger){
    return;
  }

  const opening=
    panel.hidden;

  panel.hidden=!opening;
  trigger.setAttribute(
    'aria-expanded',
    String(opening)
  );

  if(!opening){
    return;
  }

  const data=
    await refreshTaskNotifications_();

  if(
    data&&
    Number(
      data.naoLidas||
      0
    )>0
  ){
    try{
      await call(
        'notificacoesTarefasMarcarLidas',
        {
          nonce:
            crypto.randomUUID()
        },
        true,
        {silent:true}
      );

      renderTaskNotifications_(
        Object.assign(
          {},
          data,
          {
            naoLidas:0,
            itens:
              (data.itens||[])
                .map(item=>
                  Object.assign(
                    {},
                    item,
                    {nova:false}
                  )
                )
          }
        )
      );
    }catch(e){}
  }
 }

 function bindTaskNotifications_(){
  const trigger=
    document.getElementById(
      'taskNotificationButton'
    );

  const close=
    document.getElementById(
      'taskNotificationClose'
    );

  const panel=
    document.getElementById(
      'taskNotificationPanel'
    );

  if(trigger){
    trigger.onclick=
      ()=>openTaskNotifications_();
  }

  if(close){
    close.onclick=()=>{
      if(panel){
        panel.hidden=true;
      }

      if(trigger){
        trigger.setAttribute(
          'aria-expanded',
          'false'
        );
      }
    };
  }

  if(taskNotificationTimer){
    clearInterval(
      taskNotificationTimer
    );
  }

  refreshTaskNotifications_();

  taskNotificationTimer=
    setInterval(
      ()=>{
        if(!document.hidden){
          refreshTaskNotifications_();
        }
      },
      90000
    );
 }


 function base64Blob_(base64,mime){
  const raw=atob(String(base64||''));
  const bytes=new Uint8Array(raw.length);

  for(let i=0;i<raw.length;i++){
    bytes[i]=raw.charCodeAt(i);
  }

  return new Blob(
    [bytes],
    {
      type:mime||'application/octet-stream'
    }
  );
 }

 async function openFileViewer_(source,meta={}){

    );

  head.append(

  );

  const body=
    el(
      'div',
      undefined,
      'pda-file-viewer-body'
    );

  body.append(
    el(
      'div',
      'Carregando documento…',
      'pda-file-viewer-loading'
    )
  );

  const foot=
    el(
      'div',
      undefined,
      'pda-file-viewer-foot'
    );

  modal.append(
    head,
    body,
    foot
  );

  overlay.append(modal);
  document.body.append(overlay);

  let objectUrl='';

  const dismiss=()=>{
    if(objectUrl){
      URL.revokeObjectURL(
        objectUrl
      );
      objectUrl='';
    }

    overlay.remove();
  };

  close.onclick=dismiss;

  overlay.addEventListener(
    'click',
    event=>{
      if(event.target===overlay){
        dismiss();
      }
    }
  );

  try{
    const result=
      typeof source==='function'
        ?await source()
        :await Promise.resolve(source);

    const mime=
      String(
        result.mime||
        'application/octet-stream'
      ).toLowerCase();

    const name=
      result.nome||
      meta.nome||
      'documento';

    title.textContent=name;

    const blob=
      base64Blob_(
        result.base64,
        mime
      );

    objectUrl=
      URL.createObjectURL(
        blob
      );

    body.replaceChildren();

    if(mime.startsWith('image/')){
      const image=el('img');
      image.src=objectUrl;
      image.alt=name;
      image.className=
        'pda-file-viewer-image';
      body.append(image);

    }else if(
      mime==='application/pdf'||
      mime.includes('pdf')
    ){
      const frame=el('iframe');
      frame.src=objectUrl;
      frame.title=name;
      frame.className=
        'pda-file-viewer-frame';
      body.append(frame);

    }else if(
      mime.startsWith('text/')

      const frame=el('iframe');

      frame.title=name;
      frame.className=

          'strong',

    }

    const download=
      button(
        'Baixar pela plataforma',
        ()=>{
          const anchor=
            document.createElement('a');

          anchor.href=objectUrl;
          anchor.download=name;
          anchor.rel='noopener';
          document.body.append(anchor);
          anchor.click();
          anchor.remove();
        },
        true
      );

    foot.replaceChildren(
      el(
        'span',
        [
          result.categoria,
          mime
        ]
          .filter(Boolean)
          .join(' · '),
        'pda-file-viewer-meta'
      ),
      download

 let activePersonDrawer=null;

 function cpfDrawer_(value){
  const digits=String(value||'').replace(/\D/g,'');
  return digits.length===11
    ?digits.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4')
    :String(value||'');
 }

 function closePersonDrawer_(){
  if(!activePersonDrawer)return;
  activePersonDrawer.remove();
  activePersonDrawer=null;
  document.body.classList.remove('pda-drawer-open');
 }

 async function createTaskForPerson_(person,onSaved){
  if(!can('gestao_distribuicao')){
    throw new Error('Você não possui permissão para criar e distribuir tarefas.');
  }

  const options=await call('tarefaCriarOpcoes');
  const overlay=el('div',undefined,'pda-modal-overlay');
  const modal=el('section',undefined,'pda-task-create-modal');
  const head=el('div',undefined,'pda-modal-head');
  const titleWrap=el('div');
  titleWrap.append(
    el('strong','Nova tarefa'),
    el('small','Vinculada a '+(person.nome||'este cadastro'))
  );
  const close=el('button','×','pda-modal-close');
  close.type='button';
  head.append(titleWrap,close);

  const formNode=el('form',undefined,'pda-task-create-form');
  const title=el('input');
  title.name='titulo';
  title.required=true;
  title.maxLength=160;
  title.placeholder='Título da tarefa';

  const description=el('textarea');
  description.name='descricao';
  description.maxLength=6000;
  description.placeholder='Informações e orientações para o responsável';

  const assignee=el('select');
  assignee.name='responsavel';
  assignee.required=true;
  assignee.append(new Option('Selecione o responsável',''));
  (options.usuarios||[]).forEach(user=>{
    assignee.append(
      new Option(
        [user.nome||user.email,user.funcao].filter(Boolean).join(' · '),
        user.email
      )
    );
  });

  const priority=el('select');
  priority.name='prioridade';
  ['NORMAL','ALTA','URGENTE'].forEach(value=>
    priority.append(new Option(value,value))
  );

  const due=el('input');
  due.type='date';
  due.name='prazo';

  const tags=el('div',undefined,'pda-task-tag-picker');
  const selectedTags=new Set();
  (options.tags||[]).forEach(tag=>{
    const label=el('label',undefined,'pda-task-tag-option');
    label.style.setProperty('--task-tag-color',tag.cor||'#176e7d');
    const input=el('input');
    input.type='checkbox';
    input.value=tag.nome;
    input.onchange=()=>{
      if(input.checked)selectedTags.add(tag.nome);
      else selectedTags.delete(tag.nome);
    };
    label.append(input,el('span',tag.nome));
    tags.append(label);
  });

  const grid=el('div',undefined,'pda-task-create-grid');
  const field_=(label,node)=>{
    const wrap=el('label',undefined,'field');
    wrap.append(el('span',label),node);
    return wrap;
  };

  grid.append(
    field_('Título',title),
    field_('Responsável',assignee),
    field_('Prioridade',priority),
    field_('Prazo',due)
  );

  const descriptionField=field_('Descrição',description);
  descriptionField.classList.add('wide');

  const actions=el('div',undefined,'actions');
  const cancel=button('Cancelar',()=>overlay.remove(),true);
  const save=el('button','Criar tarefa');
  save.type='submit';
  actions.append(cancel,save);

  formNode.append(
    grid,
    descriptionField,
    el('span','Tags','pda-task-tag-label'),
    tags,
    actions
  );

  modal.append(head,formNode);
  overlay.append(modal);
  document.body.append(overlay);

  const dismiss=()=>{
    overlay.remove();
  };
  close.onclick=dismiss;
  overlay.addEventListener('click',event=>{
    if(event.target===overlay)dismiss();
  });

  formNode.onsubmit=async event=>{
    event.preventDefault();
    if(!formNode.reportValidity())return;
    save.disabled=true;
    save.textContent='Criando…';

    try{
      const result=await call(
        'tarefaGeralCriar',
        {
          titulo:title.value,
          descricao:description.value,
          responsavel:assignee.value,
          prioridade:priority.value,
          prazo:due.value,
          pessoaId:person.id,
          tags:Array.from(selectedTags)
        },
        true
      );

      dismiss();
      status(result.mensagem||'Tarefa criada.');
      if(typeof onSaved==='function'){
        await onSaved(result);
      }
    }catch(e){
      save.disabled=false;
      save.textContent='Criar tarefa';
      throw e;
    }
  };
 }

 async function deletePersonFromUi_(person,onDeleted){
  if(!can('administracao')){
    throw new Error('Somente a Administração pode excluir cadastros.');
  }

  const preview=await call(
    'pessoaExcluirPreview',
    {id:person.id}
  );

  const summary=[
    preview.tarefas+' tarefa(s)',
    preview.processos+' processo(s)',
    preview.atendimentos+' atendimento(s)',
    preview.documentos+' documento(s)'
  ].join(' · ');

  if(!window.confirm(
    'Excluir definitivamente o cadastro de '+person.nome+'?\n\n'+
    summary+
    '\n\nA pasta da pessoa e todos os vínculos relacionados também serão apagados.'
  ))return;

  let confirmarVinculos=false;

  if(preview.exigeConfirmacaoReforcada){
    confirmarVinculos=window.confirm(
      'Este cadastro possui processos ou tarefas vinculadas.\n\n'+
      'Confirmar também a exclusão desses vínculos?'
    );
    if(!confirmarVinculos)return;
  }

  const typed=window.prompt(
    'Para concluir, digite o CPF do cadastro:\n'+
    (person.cpfFormatado||person.cpf||'')
  );

  if(
    String(typed||'').replace(/\D/g,'')!==
    String(person.cpf||'').replace(/\D/g,'')
  ){
    status('Exclusão cancelada: o CPF não confere.',true);
    return;
  }

  const result=await call(
    'pessoaExcluirDefinitivo',
    {
      id:person.id,
      versao:person.versao,
      confirmar:true,
      confirmarVinculos
    },
    true
  );

  status(result.mensagem||'Cadastro excluído definitivamente.');
  closePersonDrawer_();

  if(typeof onDeleted==='function'){
    await onDeleted(result);
  }
 }

 function drawerTable_(columns,rows){
  const wrap=el('div',undefined,'scroll pda-drawer-table');
  const t=el('table');
  const head=el('tr');
  columns.forEach(column=>head.append(el('th',column.label)));
  const thead=el('thead');
  thead.append(head);
  const body=el('tbody');
  rows.forEach(row=>{
    const tr=el('tr');
    columns.forEach(column=>{
      const value=typeof column.value==='function'
        ?column.value(row)
        :(row[column.key]||'—');
      tr.append(el('td',String(value===undefined?'—':value)));
    });
    body.append(tr);
  });
  t.append(thead,body);
  wrap.append(t);
  return wrap;
 }

 function drawerPagedSection_(config){
  const box=el('div',undefined,'pda-drawer-paged');
  const list=el('div',undefined,'pda-drawer-paged-content');
  const more=button('Carregar mais',async()=>{
    more.disabled=true;
    more.textContent='Carregando…';
    try{
      const next=await config.fetch(config.rows.length);
      config.rows.push(...(next[config.key]||[]));
      config.hasMore=!!next.hasMore;
      render();
    }finally{
      more.disabled=false;
      more.textContent='Carregar mais';
    }
  },true);

  const render=()=>{
    list.replaceChildren();
    if(!config.rows.length){
      list.append(el('p',config.empty||'Nenhum registro.','hint'));
    }else{
      list.append(config.render(config.rows));
    }
    more.hidden=!config.hasMore;
  };

  box.append(list,more);
  render();
  return box;
 }

    );

  drawer.append(

    body
  );

  body.append(
    summaryBox,
    fullArea
  );

  overlay.addEventListener(
    'click',
    event=>{
      if(event.target===overlay){
        closePersonDrawer_();
      }
    }
  );

  let person=
    options.summary||
    {id};

  const tabCache=new Map();
  let initialBundle=null;
  let initialBundlePromise=null;
  let generateMenu=null;
  let deleteButton=null;

  const renderSummary=()=>{
    headCopy
      .querySelector('h2')
      .textContent=
        person.nome||
        'Cadastro';

    summaryBox.replaceChildren(
      drawerCounters_(person),
      drawerInfoGrid_(person)
    );

    if(generateMenu){
      generateMenu.hidden=
        !can('cadastro')||
        person.podeGerenciarConteudo!==true;
    }

    if(deleteButton){
      deleteButton.disabled=
        !person.versao;
    }
  };

  const loadBundle_=()=>{
    if(initialBundlePromise){
      return initialBundlePromise;
    }

    initialBundlePromise=
      call(
        'pessoaFichaCargaInicial',
        {
          pessoaId:id
        }
      )
        .then(bundle=>{
          initialBundle=bundle;

          if(
            bundle&&
            bundle.resumo
          ){
            person=Object.assign(
              {},
              person,
              bundle.resumo
            );
          }

          renderSummary();
          return bundle;
        })
        .catch(error=>{
          initialBundlePromise=null;
          throw error;
        });

    return initialBundlePromise;
  };

  renderSummary();

  const openFull=
    button(
      'Abrir ficha em tela cheia',
      ()=>{
        closePersonDrawer_();
        return go(
          'ACOMP',
          id
        );
      },
      true
    );

  const createTask=
    button(
      '+ Nova tarefa',
      ()=>createTaskForPerson_(
        person,
        async()=>{
          tabCache.delete('tarefas');
          initialBundle=null;
          initialBundlePromise=null;
          loadBundle_().catch(()=>{});
        }
      )
    );

  createTask.hidden=
    !can('gestao_distribuicao');

  deleteButton=
    button(
      'Excluir',
      ()=>deletePersonFromUi_(
        person,
        {
          onOptimistic:
            options.onOptimisticDelete,
          onDeleted:
            options.onDeleted,
          onRollback:
            options.onDeleteRollback
        }
      ),
      true
    );

  deleteButton
    .classList
    .add('danger');

  deleteButton.hidden=
    !can('administracao');

  deleteButton.disabled=
    !person.versao;

  generateMenu=
    el(
      'details',
      undefined,
      'pda-drawer-generate'
    );

  const generateSummary=
    el(
      'summary',
      'Gerar documentos'
    );

  const generatePanel=
    el(
      'div',
      undefined,
      'pda-drawer-generate-panel'
    );

  const refreshBundle_=async()=>{
    tabCache.clear();
    initialBundle=null;
    initialBundlePromise=null;

    try{
      await loadBundle_();
    }catch(e){}
  };

  const report=
    button(
      'Relatório Seguro-Defeso 2025',
      async()=>{
        report.disabled=true;
        report.textContent='Gerando…';

        try{
          const result=
            await call(
              'seguroDefesoRelatorioGerar',
              {
                pessoaId:id
              },
              true
            );

          await refreshBundle_();

          status(
            'Relatório gerado e vinculado ao cadastro. '+
            (
              result.quantidade!==undefined
                ?'Registros: '+result.quantidade+'.'
                :''
            )
          );

          generateMenu.open=false;

        }finally{
          report.disabled=false;
          report.textContent=
            'Relatório Seguro-Defeso 2025';
        }
      },
      true
    );

  const initial=
    button(
      'Petição inicial — Seguro-Defeso 2025',

        initial.disabled=true;
        initial.textContent='Gerando…';

        try{
          await call(
            'pessoaInicialGerar',
            {
              pessoaId:id
            },
            true
          );

          await refreshBundle_();

          status(
            'Petição inicial gerada e vinculada ao cadastro.'
          );

          generateMenu.open=false;

        }finally{
          initial.disabled=false;
          initial.textContent=
            'Petição inicial — Seguro-Defeso 2025';
        }
      },
      true
    );

  generatePanel.append(
    report,

  );

  );

        'div',

      );

          };

          node=
            drawerPagedSection_(
              config
            );

        }else if(key==='tarefas'){
          const open=
            bundle.tarefasAbertas||
            {
              tarefas:[],
              total:0
            };

          const done=
            bundle.tarefasConcluidas||
            {
              tarefas:[],
              total:0,
              hasMore:false
            };

          node=
            el(
              'div',
              undefined,
              'pda-person-task-tab'
            );

          node.append(
            el(
              'h4',
              'Tarefas abertas ('+
              Number(open.total||0)+
              ')'
            ),
            renderTasks_(
              open.tarefas||[]
            ),
            el(
              'h4',
              'Tarefas concluídas ('+
              Number(done.total||0)+
              ')'
            ),
            renderTasks_(
              done.tarefas||[],
              'done'
            )
          );

          if(done.hasMore){
            let rows=[
              ...(done.tarefas||[])
            ];

            const more=
              button(
                'Carregar mais concluídas',
                async()=>{
                  more.disabled=true;
                  more.textContent=
                    'Carregando…';

                  try{
                    const next=
                      await call(
                        'tarefasPessoa',
                        {
                          pessoaId:id,
                          historico:true,
                          limit:100,
                          offset:rows.length
                        }
                      );

                    rows.push(
                      ...(next.tarefas||[])
                    );

                    const sections=
                      node.querySelectorAll(
                        '.pda-person-task-list'
                      );

                    if(sections[1]){
                      sections[1]
                        .replaceWith(
                          renderTasks_(
                            rows,
                            'done'
                          )
                        );
                    }

                    more.hidden=
                      !next.hasMore;

                  }finally{
                    more.disabled=false;
                    more.textContent=
                      'Carregar mais concluídas';
                  }
                },
                true
              );

            node.append(more);
          }

        }else{
          const first=
            bundle.historico||
            {
              historico:[],
              hasMore:false
            };

          const config={
            key:'historico',
            rows:[
              ...(first.historico||[])
            ],
            hasMore:
              !!first.hasMore,
            empty:
              'Nenhuma movimentação localizada.',
            fetch:offset=>
              call(
                'pessoaHistorico',
                {
                  pessoaId:id,
                  limit:30,
                  offset
                }
              ),
            render:rows=>{
              const list=
                el(
                  'div',
                  undefined,
                  'pda-person-history-list'
                );

              rows.forEach(item=>{
                const row=
                  el(
                    'div',
                    undefined,
                    'pda-person-history-row'
                  );

                row.append(
                  el(
                    'strong',
                    [
                      item.entidade,
                      item.usuario
                    ]
                      .filter(Boolean)
                      .join(' · ')
                  ),
                  el(
                    'small',
                    item.alteradoEm||
                    ''
                  )
                );

                list.append(row);
              });

              return list;
            }
          };

          node=
            drawerPagedSection_(
              config
            );
        }
      }

      tabCache.set(
        key,
        node
      );

      panel.replaceChildren(node);
    };

    definitions
      .forEach(([key,label])=>{
        const tab=
          el(
            'button',
            label
          );

        tab.type='button';
        tab.dataset.tab=key;

        tab.onclick=
          ()=>activate(key)
            .catch(error=>
              status(
                error.message||
                String(error),
                true
              )
            );

        tabs.append(tab);
      });

    fullArea.append(
      tabs,
      panel
    );

    activate('resumo')
      .catch(error=>
        status(
          error.message||
          String(error),
          true
        )
      );
  };

  renderTabs();

  /*
   * O drawer abre imediatamente com o resumo disponível e, no mesmo
   * instante, inicia uma única carga de todas as informações vinculadas.
   * As abas passam a estar prontas sem disparar várias execuções concorrentes.
   */
  loadBundle_()
    .catch(error=>{
      if(
        activePersonDrawer===overlay&&
        !options.summary
      ){
        summaryBox.replaceChildren(
          el(
            'p',
            error.message||
            String(error),
            'warn'
          )
        );
      }
    });

  return overlay;
 }

 function prefetchPersonSummary_(id){
  return prefetchRead_(
    'pessoaResumo',
    {id}
  );
 }

 function renderNavigation_(){
  if(!boot)return;

  const contextTitle=document.getElementById('appContextTitle');
  if(contextTitle){
    const visual=MODULE_VISUALS[current];
    contextTitle.textContent=
      current==='PAINEL'
        ?'Sistema de gestão e atendimento'
        :(visual&&visual.title||boot.modulos&&boot.modulos[current]||'Povo das Águas');
  }

  const user=boot.usuario||{};
  const identity=
    document.getElementById('identity');
  const functionNode=
    document.getElementById('headerUserFunction');
  const profileNode=
    document.getElementById('headerUserProfile');
  const photo=
    document.getElementById('headerUserPhoto');
  const fallback=
    document.getElementById('headerUserInitials');
  const profileShortcut=
    document.getElementById('profileShortcut');
  const profileButton=
    document.getElementById('profileButton');

  const displayName=
    user.nomeUsuario||
    user.nome||
    boot.email||
    'Usuário';

  if(identity){
    identity.textContent=displayName;
    identity.title=
      (boot.email||'')+
      (
        boot.permissoes&&boot.permissoes.length
          ?' · permissões: '+boot.permissoes.join(', ')
          :''
      );
  }

  if(functionNode){
    functionNode.textContent=
      user.funcao||'';
  }

  if(profileNode){
    profileNode.textContent=
      boot.perfil||user.perfil||'';
  }

  if(fallback){
    const words=
      String(displayName)
        .trim()
        .split(/\s+/)
        .filter(Boolean);

    fallback.textContent=
      (
        (words[0]&&words[0][0]||'U')+
        (
          words.length>1
            ?words[words.length-1][0]
            :''
        )
      ).toUpperCase();

    fallback.hidden=
      !!headerProfilePhoto;
  }

  if(photo){
    if(headerProfilePhoto){
      photo.src=headerProfilePhoto;
      photo.alt='Foto de '+displayName;
      photo.hidden=false;
    }else{
      photo.removeAttribute('src');
      photo.alt='';
      photo.hidden=true;
    }
  }

  if(profileShortcut){
    profileShortcut.title=
      'Abrir perfil de '+displayName;
    profileShortcut.onclick=
      ()=>go('PERF');
  }

  if(profileButton){
    profileButton.onclick=
      ()=>go('PERF');
  }

  const nav=
    document.getElementById('nav');

  if(!nav)return;

  nav.replaceChildren();

  const available=
    boot.modulos||{};

  const appendDirect=(code,label)=>{
    if(!available[code])return;

    const b=
      button(
        '',
        ()=>go(code)
      );

    b.classList.add(
      'nav-direct'
    );

    b.dataset.code=code;
    bindModulePrefetch_(b,code);
    bindNavHelp_(b,code);

    b.append(
      navIcon_(code),
      navLabel_(
        label||
        available[code]
      )
    );

    if(current===code){
      b.setAttribute(
        'aria-current',
        'page'
      );
    }

    nav.append(b);
  };

  const appendGroup=(label,items,iconCode)=>{
    const visible=
      items.filter(item=>
        !!available[item.code]
      );

    if(!visible.length)return;

    const group=
      el(
        'details',
        undefined,
        'nav-group'
      );

    if(
      visible.some(item=>
        item.code===current
      )
    ){
      group.classList.add(
        'active'
      );
    }

    const summary=
      el(
        'summary',
        undefined,
        'nav-group-summary'
      );

    summary.append(
      navIcon_(
        iconCode||
        visible[0].code
      ),
      navLabel_(label)
    );

    bindNavHelp_(
      summary,
      iconCode||visible[0].code
    );

    const menu=
      el(
        'div',
        undefined,
        'nav-submenu'
      );

    visible.forEach(item=>{
      const b=
        button(
          '',
          ()=>{
            group.open=false;
            return go(item.code);
          }
        );

      b.classList.add(
        'nav-submenu-item'
      );

      b.dataset.code=
        item.code;

      bindModulePrefetch_(
        b,
        item.code
      );

      bindNavHelp_(
        b,
        item.code
      );

      b.append(
        navIcon_(item.code),
        navLabel_(item.label)
      );

      if(current===item.code){
        b.setAttribute(
          'aria-current',
          'page'
        );
      }

      menu.append(b);
    });

    group.append(
      summary,
      menu
    );

    nav.append(group);
  };

  appendDirect(
    'PAINEL',
    'Início'
  );

  appendDirect(
    'PESS',
    'Novo Cadastro'
  );

  appendDirect(
    'TAREFAS',
    'Tarefas'
  );

  appendGroup(
    'Consultas',
    [
      {
        code:'ACOMP',
        label:'Consultar Cadastros'
      },
      {
        code:'DEFESO',
        label:'Consultar Defeso 2025'
      },
      {
        code:'HIST',
        label:'Histórico'
      }
    ],
    'CONSULTAS'
  );

  appendGroup(
    'Distribuição',
    [
      {
        code:'DIST',
        label:'Atribuir tarefas'
      },
      {
        code:'PROC',
        label:'Processos'
      },
      {
        code:'MIN',
        label:'Minutas'
      }
    ],
    'DISTRIBUICAO'
  );

  appendDirect('PERF','Meu perfil');

  appendDirect(
    'ADM',
    'Administração'
  );
 }

 async function start(preferredModule){
  try{
    const auth=
      await window.PDA_AUTH
        .ensureAuthenticated();

    authSessionToken=
      auth&&auth.sessionToken
        ?auth.sessionToken
        :window.PDA_AUTH.getSessionToken();

    if(!authSessionToken){
      throw new Error(
        'AUTH: sessão não iniciada.'
      );
    }

    const logout=
      document.getElementById(
        'logoutButton'
      );

    if(logout){
      logout.onclick=()=>
        window.PDA_AUTH.logout();
    }

    boot=await call('bootstrap');

    ensureSessionCaches_();

    if(
      boot.initialModule&&
      boot.initialModule.code&&
      boot.initialModule.bundle
    ){
      MODULE_CACHE.set(
        boot.initialModule.code,
        boot.initialModule.bundle
      );
    }

    if(
      boot.initialData&&
      boot.initialData.action&&
      CACHEABLE_READS.has(
        boot.initialData.action
      )
    ){
      READ_CACHE.set(
        readKey_(
          boot.initialData.action,
          boot.initialData.query||{}
        ),
        {
          value:boot.initialData.result,
          at:performance.now()
        }
      );
    }

    renderNavigation_();
    bindTaskNotifications_();

    window.PDA_AUTH
      .request(
        'authProfile',
        authSessionToken
      )
      .then(profile=>{
        if(
          profile&&
          profile.usuario
        ){
          boot.usuario=
            Object.assign(
              {},
              boot.usuario||{},
              profile.usuario
            );
        }

        headerProfilePhoto=
          profile&&profile.foto
            ?profile.foto
            :'';

        renderNavigation_();
      })
      .catch(()=>{});

    await go(
      preferredModule||boot.home||
      'PAINEL'
    );

  }catch(e){
    const message=
      e.message||
      String(e);

    if(
      /AUTH:/.test(message)&&
      window.PDA_AUTH
    ){
      window.PDA_AUTH.sessionExpired(
        message.replace(/^Exception:\s*/,'')
      );
      return;
    }

    status(
      message,
      true
    );
  }
 }

 return {start,go,refreshCurrent:refreshCurrentModule_,openPersonDrawer:openPersonDrawer_,closePersonDrawer:closePersonDrawer_,openFileViewer:openFileViewer_,createTaskForPerson:createTaskForPerson_,deletePerson:deletePersonFromUi_,prefetchPersonSummary:prefetchPersonSummary_,el,card,details,form,table,link,button,call,alive,personFields,atendFields,searchUI,guidance,uploadForm,status,can,refreshTaskNotifications:refreshTaskNotifications_,isValidDateBR:isValidDateBR_,state:{get selection(){return selection;
},set selection(v){selection=v;
},get boot(){return boot;
},set boot(v){boot=v;
renderNavigation_();
},get profilePhoto(){return headerProfilePhoto;
},set profilePhoto(v){headerProfilePhoto=String(v||'');
renderNavigation_();
}}};

App.start();
