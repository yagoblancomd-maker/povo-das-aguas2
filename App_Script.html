 const MODULE_CACHE=new Map();
 const MODULE_REQUESTS=new Map();
 const READ_CACHE=new Map();
 const READ_REQUESTS=new Map();
 const READ_CACHE_TTL_MS=8000;
 const CACHEABLE_READS=new Set([
  'painel',
  'tarefasMinhas',
  'distribuicaoFila',
  'processos',
  'admin'
 ]);
 const MODULE_INITIAL_READ=Object.freeze({
  PAINEL:['painel',{}],
  TAREFAS:['tarefasMinhas',{}],
  DIST:['distribuicaoFila',{}],
  PROC:['processos',{}],

 const el=(tag,text,cls)=>{const n=document.createElement(tag);
if(text!==undefined)n.textContent=text;
if(cls)n.className=cls;
return n;
};

 const raw=(name,...args)=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args));

 function resetClientCaches_(){
  MODULE_CACHE.clear();
  MODULE_REQUESTS.clear();
  READ_CACHE.clear();
  READ_REQUESTS.clear();
  bulkModulePromise=null;
  bulkModuleCodes=new Set();
 }

 function ensureSessionCaches_(){
  if(cacheSessionToken!==authSessionToken){
    resetClientCaches_();
    cacheSessionToken=authSessionToken;
  }
 }

 function readKey_(action,data){
  return action+'|'+JSON.stringify(data||{});
 }

 function clearReadCaches_(){
  READ_CACHE.clear();
  READ_REQUESTS.clear();
 }

 function cachedRead_(action,data){
  if(!CACHEABLE_READS.has(action))return null;
  const key=readKey_(action,data);
  const item=READ_CACHE.get(key);
  if(!item)return null;
  if((performance.now()-item.at)>READ_CACHE_TTL_MS){
    READ_CACHE.delete(key);
    return null;
  }
  return item.value;
 }

 function readRequest_(action,data){
  if(!CACHEABLE_READS.has(action)){
    return raw('api',action,data,authSessionToken);
  }

  const key=readKey_(action,data);
  const cached=cachedRead_(action,data);

  if(cached!==null){
    return Promise.resolve(cached);
  }

  if(READ_REQUESTS.has(key)){
    return READ_REQUESTS.get(key);
  }

  const request=
    raw(
      'api',
      action,
      data,
      authSessionToken
    )
      .then(result=>{
        READ_CACHE.set(
          key,
          {
            value:result,
            at:performance.now()
          }
        );
        return result;
      })
      .finally(()=>{
        if(READ_REQUESTS.get(key)===request){
          READ_REQUESTS.delete(key);
        }
      });

  READ_REQUESTS.set(key,request);
  return request;
 }

 function installModuleScript_(code,module){
  if(window.PDA_MODULES[code])return;
  const s=document.createElement('script');
  s.textContent=
    module.script
      .replace(/^\s*<script>/,'')
      .replace(/<\/script>\s*$/,'');
  document.head.append(s);
  s.remove();
 }

 async function getModule_(code){
  ensureSessionCaches_();

  if(MODULE_CACHE.has(code)){
    return MODULE_CACHE.get(code);
  }

  if(
    bulkModulePromise&&
    bulkModuleCodes.has(code)
  ){
    try{
      await bulkModulePromise;
    }catch(e){}

    if(MODULE_CACHE.has(code)){
      return MODULE_CACHE.get(code);
    }
  }

  if(MODULE_REQUESTS.has(code)){
    return MODULE_REQUESTS.get(code);
  }

  const request=
    raw(
      'carregarModulo',
      code,
      authSessionToken
    )
      .then(module=>{
        MODULE_CACHE.set(code,module);
        return module;
      })
      .finally(()=>{
        if(MODULE_REQUESTS.get(code)===request){
          MODULE_REQUESTS.delete(code);
        }
      });

  MODULE_REQUESTS.set(code,request);
  return request;
 }

 function prefetchRead_(action,data={}){
  if(!CACHEABLE_READS.has(action)){
    return Promise.resolve();
  }

  return readRequest_(action,data).catch(()=>{});
 }

 function prefetchModule_(code,withData=true){
  if(
    !boot||
    !boot.modulos||
    !Object.prototype.hasOwnProperty.call(
      boot.modulos,
      code
    )
  ){
    return Promise.resolve();
  }

  const asset=getModule_(code).catch(()=>null);
  const initial=MODULE_INITIAL_READ[code];

  if(
    withData&&
    initial
  ){
    prefetchRead_(
      initial[0],
      initial[1]
    );
  }

  return asset;
 }

 function bindModulePrefetch_(node,code){
  let timer=null;

  const start=()=>{
    if(timer)return;
    timer=setTimeout(
      ()=>{
        timer=null;
        prefetchModule_(code,true);
      },
      90
    );
  };

  const cancel=()=>{
    if(timer){
      clearTimeout(timer);
      timer=null;
    }
  };

  node.addEventListener(
    'pointerenter',
    start,
    {passive:true}
  );
  node.addEventListener(
    'pointerleave',
    cancel,
    {passive:true}
  );
  node.addEventListener(
    'focus',
    ()=>prefetchModule_(code,true)
  );
  node.addEventListener(
    'pointerdown',
    ()=>prefetchModule_(code,true),
    {passive:true}
  );
 }

 function scheduleModuleWarmup_(){
  if(
    !boot||
    !boot.modulos
  ){
    return;
  }

  const run=()=>{
    ensureSessionCaches_();

    if(bulkModulePromise){
      return;
    }

    const codes=
      Object.keys(boot.modulos)
        .filter(code=>
          code!==current&&
          !MODULE_CACHE.has(code)
        );

    if(!codes.length)return;

    const session=authSessionToken;
    bulkModuleCodes=new Set(codes);

    const promise=
      raw(
        'carregarModulos',
        codes,
        session
      )
        .then(bundles=>{
          if(
            session!==authSessionToken||
            !bundles
          ){
            return;
          }

          Object.entries(bundles)
            .forEach(([code,module])=>{
              if(module){
                MODULE_CACHE.set(
                  code,
                  module
                );
              }
            });
        })
        .catch(()=>{})
        .finally(()=>{
          if(bulkModulePromise===promise){
            bulkModulePromise=null;
            bulkModuleCodes=new Set();
          }
        });

    bulkModulePromise=promise;
  };

  if('requestIdleCallback' in window){
    window.requestIdleCallback(
      run,
      {timeout:1300}
    );
  }else{
    setTimeout(
      run,
      700
    );
  }
 }

 function processingProfile_(action,write){

  return {

    ]
  };

 function processingPercent_(elapsed,seconds){
  const expected=Math.max(2,Number(seconds)||6);
  const ratio=elapsed/expected;

  if(ratio<=.12){
    return Math.max(3,Math.round(ratio/.12*14));
  }

  if(ratio<=.72){
    return Math.round(
      14+
      ((ratio-.12)/.60)*62
    );
  }

  if(ratio<=1){
    return Math.round(
      76+
      ((ratio-.72)/.28)*15
    );
  }

  return Math.min(
    96,
    91+Math.floor((ratio-1)*2)
  );
 }

 function phaseForProgress_(profile,progress){
  const normalized=progress/100;
  let message=profile.phases[0][1];

  profile.phases.forEach(item=>{
    if(normalized>=item[0]){
      message=item[1];
    }
  });

  return message;
 }

    crypto.randomUUID();

    action,

    complete:false
  };

  const overlay=
    ensureProcessingOverlay_();

  overlay.hidden=false;
  document.body.classList.add(
    'processing-active'
  );

  startProcessingPhrases_();
  renderProcessing_();

  if(processingTimer){
    clearInterval(processingTimer);
  }

    setInterval(
      renderProcessing_,
      350
    );

  return id;

 function endProcessing_(id,success=true){
  if(
    !id||
    !processingState||
    processingState.id!==id
  ){
    return;
  }

  if(processingTimer){
    clearInterval(processingTimer);
    processingTimer=null;
  }

  stopProcessingPhrases_();

  if(success){
    processingState.complete=true;
    renderProcessing_();
  }

  if(!success){
    const overlay=ensureProcessingOverlay_();
    overlay.querySelector('#pda-processing-title').textContent='Não foi possível concluir';
    overlay.querySelector('#pda-processing-message').textContent='A operação foi interrompida. Verifique a mensagem exibida no sistema.';
    overlay.querySelector('#pda-processing-remaining').textContent='Carregamento interrompido.';
  }

  const delay=
    success
      ?520
      :900;

  processingHideTimer=
    setTimeout(
      ()=>{
        const overlay=
          document.getElementById(
            'pda-processing-overlay'
          );

        if(overlay){
          overlay.hidden=true;
        }

        document.body.classList.remove(
          'processing-active'
        );

        processingState=null;
        processingHideTimer=null;
      },
      delay
    );

 async function call(action,data={},write=false){
  const token=epoch;
  let payload={...data};
  let processingId=null;
  let processingDelay=null;

  if(write){
    const digest=
      Array.from(
        new Uint8Array(
          await crypto.subtle.digest(
            'SHA-256',
            new TextEncoder().encode(
              JSON.stringify({action,data})
            )
          )
        )
      )
        .map(x=>
          x.toString(16).padStart(2,'0')
        )
        .join('');

    const key='pda.operation.'+digest;
    payload.op=
      sessionStorage.getItem(key)||
      crypto.randomUUID();
    sessionStorage.setItem(
      key,
      payload.op
    );

    /*
     * Qualquer mutação invalida imediatamente resultados de leitura
     * guardados no navegador.
     */
    clearReadCaches_();

    busy++;
    document
      .querySelectorAll('button')
      .forEach(b=>b.disabled=true);

    processingId=
      beginProcessing_(
        action,
        true
      );

  }else if(!navigationLoading){
    /*
     * Operações rápidas não piscam o loader. Ele só aparece se a leitura
     * realmente ultrapassar a janela de resposta imediata.
     */
    processingDelay=
      setTimeout(
        ()=>{
          processingId=
            beginProcessing_(
              action,
              false
            );
        },
        380
      );
  }

  try{
    const result=
      write
        ?await raw(
            'api',
            action,
            payload,
            authSessionToken
          )
        :await readRequest_(
            action,
            payload
          );

    if(token!==epoch){
      throw new Error(
        'Resposta de tela anterior descartada.'
      );
    }

    if(write){
      clearReadCaches_();
      status('Operação concluída.');
    }

    if(processingDelay){
      clearTimeout(processingDelay);
      processingDelay=null;
    }

    endProcessing_(
      processingId,
      true
    );

    return result;

  }catch(e){
    if(processingDelay){
      clearTimeout(processingDelay);
      processingDelay=null;
    }

    endProcessing_(
      processingId,
      false
    );

    const message=
      e.message||
      String(e);

    if(
      /AUTH:/.test(message)&&
      window.PDA_AUTH
    ){
      window.PDA_AUTH.sessionExpired(
        message.replace(
          /^Exception:\s*/,
          ''
        )
      );
    }

    if(token===epoch){
      status(
        message+
        (
          write
            ?'\nA operação pode ter sido parcialmente executada. Mantenha os mesmos dados e tente novamente; consulte a ficha antes de alterar o envio.'
            :''
        ),
        true
      );
    }

    throw e;

  }finally{
    if(write){
      busy--;
      document
        .querySelectorAll('button')
        .forEach(b=>b.disabled=false);
    }
  }
 }

     * Depois da primeira tela pronta, aquece silenciosamente os demais
     * módulos permitidos em uma única chamada ao Apps Script.
     */
    scheduleModuleWarmup_();

  }catch(e){
    if(stage&&stage.isConnected){
      stage.remove();
    }

    if(moduleProcessingDelay){
      clearTimeout(
        moduleProcessingDelay
      );
      moduleProcessingDelay=null;
    }

    endProcessing_(
      moduleProcessingId,
      false
    );

    if(
      /AUTH:/.test(e.message)&&
      window.PDA_AUTH
    ){
      window.PDA_AUTH.sessionExpired(
        e.message
      );
    }

    if(token===epoch){
      status(
        e.message||
        String(e),
        true
      );
    }

  }finally{
    navigationLoading=
      Math.max(
        0,
        navigationLoading-1
      );

    if(token===epoch){
      root.setAttribute(
        'aria-busy',
        'false'
      );
    }
  }
 }

 function navIcon_(code){

    el(
      'span',
      undefined,
      'nav-icon'
    );

  span.setAttribute(
    'aria-hidden',
    'true'

 function renderNavigation_(){
  if(!boot)return;

  const user=boot.usuario||{};
  const identity=
    document.getElementById('identity');
  const functionNode=
    document.getElementById('headerUserFunction');
  const profileNode=
    document.getElementById('headerUserProfile');
  const photo=
    document.getElementById('headerUserPhoto');
  const fallback=
    document.getElementById('headerUserInitials');
  const profileShortcut=
    document.getElementById('profileShortcut');
  const profileButton=
    document.getElementById('profileButton');

  const displayName=
    user.nomeUsuario||
    user.nome||
    boot.email||
    'Usuário';

  if(identity){
    identity.textContent=displayName;
    identity.title=
      (boot.email||'')+
      (
        boot.permissoes&&boot.permissoes.length
          ?' · permissões: '+boot.permissoes.join(', ')
          :''
      );
  }

  if(functionNode){
    functionNode.textContent=
      user.funcao||'';
  }

  if(profileNode){
    profileNode.textContent=
      boot.perfil||user.perfil||'';
  }

  if(fallback){
    const words=
      String(displayName)
        .trim()
        .split(/\s+/)
        .filter(Boolean);

    fallback.textContent=
      (
        (words[0]&&words[0][0]||'U')+
        (
          words.length>1
            ?words[words.length-1][0]
            :''
        )
      ).toUpperCase();

    fallback.hidden=
      !!headerProfilePhoto;
  }

  if(photo){
    if(headerProfilePhoto){
      photo.src=headerProfilePhoto;
      photo.alt='Foto de '+displayName;
      photo.hidden=false;
    }else{
      photo.removeAttribute('src');
      photo.alt='';
      photo.hidden=true;
    }
  }

  if(profileShortcut){
    profileShortcut.title=
      'Abrir perfil de '+displayName;
    profileShortcut.onclick=
      ()=>go('PERF');
  }

  if(profileButton){
    profileButton.onclick=
      ()=>go('PERF');
  }

  const nav=
    document.getElementById('nav');

  if(!nav)return;

  nav.replaceChildren();

  const available=
    boot.modulos||{};

  const appendDirect=(code,label)=>{
    if(!available[code])return;

    const b=
      button(
        '',
        ()=>go(code)
      );

    b.classList.add(
      'nav-direct'
    );

    b.dataset.code=code;
    bindModulePrefetch_(b,code);

    b.append(
      navIcon_(code),
      navLabel_(
        label||
        available[code]
      )
    );

    if(current===code){
      b.setAttribute(
        'aria-current',
        'page'
      );
    }

    nav.append(b);
  };

  const appendGroup=(label,items,iconCode)=>{
    const visible=
      items.filter(item=>
        !!available[item.code]
      );

    if(!visible.length)return;

    const group=
      el(
        'details',
        undefined,
        'nav-group'
      );

    if(
      visible.some(item=>
        item.code===current
      )
    ){
      group.classList.add(
        'active'
      );
    }

    const summary=
      el(
        'summary',
        undefined,
        'nav-group-summary'
      );

    summary.append(
      navIcon_(
        iconCode||
        visible[0].code
      ),
      navLabel_(label)
    );

    const menu=
      el(
        'div',
        undefined,
        'nav-submenu'
      );

    visible.forEach(item=>{
      const b=
        button(
          '',
          ()=>{
            group.open=false;
            return go(item.code);
          }
        );

      b.classList.add(
        'nav-submenu-item'
      );

      b.dataset.code=
        item.code;

      bindModulePrefetch_(
        b,
        item.code
      );

      b.append(
        navIcon_(item.code),
        navLabel_(item.label)
      );

      if(current===item.code){
        b.setAttribute(
          'aria-current',
          'page'
        );
      }

      menu.append(b);
    });

    group.append(
      summary,
      menu
    );

    nav.append(group);
  };

  appendDirect(
    'PAINEL',
    'Início'
  );

  appendDirect(
    'PESS',
    'Novo Cadastro'
  );

  appendDirect(
    'TAREFAS',
    'Tarefas'
  );

  appendGroup(
    'Consultas',
    [
      {
        code:'ACOMP',
        label:'Consultar Cadastros'
      },
      {
        code:'DEFESO',
        label:'Consultar Defeso 2025'
      }
    ],
    'CONSULTAS'
  );

  appendGroup(
    'Distribuição',
    [
      {
        code:'DIST',
        label:'Atribuir tarefas'
      },
      {
        code:'PROC',
        label:'Processos'
      },
      {
        code:'MIN',
        label:'Minutas'
      }
    ],
    'DISTRIBUICAO'
  );

  appendDirect('PERF','Meu perfil');

  appendDirect(
    'ADM',
    'Administração'
  );
 }

 async function start(preferredModule){
  try{
    const auth=
      await window.PDA_AUTH
        .ensureAuthenticated();

    authSessionToken=
      auth&&auth.sessionToken
        ?auth.sessionToken
        :window.PDA_AUTH.getSessionToken();

    if(!authSessionToken){
      throw new Error(
        'AUTH: sessão não iniciada.'
      );
    }

    const logout=
      document.getElementById(
        'logoutButton'
      );

    if(logout){
      logout.onclick=()=>
        window.PDA_AUTH.logout();
    }

    boot=await call('bootstrap');

    ensureSessionCaches_();

    if(
      boot.initialModule&&
      boot.initialModule.code&&
      boot.initialModule.bundle
    ){
      MODULE_CACHE.set(
        boot.initialModule.code,
        boot.initialModule.bundle
      );
    }

    if(
      boot.initialData&&
      boot.initialData.action&&
      CACHEABLE_READS.has(
        boot.initialData.action
      )
    ){
      READ_CACHE.set(
        readKey_(
          boot.initialData.action,
          boot.initialData.query||{}
        ),
        {
          value:boot.initialData.result,
          at:performance.now()
        }
      );
    }

    renderNavigation_();

    window.PDA_AUTH
      .request(
        'authProfile',
        authSessionToken
      )
      .then(profile=>{
        if(
          profile&&
          profile.usuario
        ){
          boot.usuario=
            Object.assign(
              {},
              boot.usuario||{},
              profile.usuario
            );
        }

        headerProfilePhoto=
          profile&&profile.foto
            ?profile.foto
            :'';

        renderNavigation_();
      })
      .catch(()=>{});

    await go(
      preferredModule||boot.home||
      'PAINEL'
    );

  }catch(e){
    const message=
      e.message||
      String(e);

    if(
      /AUTH:/.test(message)&&
      window.PDA_AUTH
    ){
      window.PDA_AUTH.sessionExpired(
        message.replace(/^Exception:\s*/,'')
      );
      return;
    }

    status(
      message,
      true
    );
  }
 }

 return {start,go,el,card,details,form,table,link,button,call,alive,personFields,atendFields,searchUI,guidance,uploadForm,status,can,isValidDateBR:isValidDateBR_,state:{get selection(){return selection;
},set selection(v){selection=v;

renderNavigation_();
