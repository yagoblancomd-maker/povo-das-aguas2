const App=(()=>{

if(text!==undefined)n.textContent=text;
if(cls)n.className=cls;
return n;

n.textContent=text||'';
n.className='status '+(error?'error':'ok');

 let processingState=null;
 let processingTimer=null;
 let processingHideTimer=null;

 function ensureProcessingOverlay_(){
  let overlay=document.getElementById('pda-processing-overlay');

  if(overlay)return overlay;

  overlay=el('div',undefined,'processing-overlay');
  overlay.id='pda-processing-overlay';
  overlay.hidden=true;
  overlay.setAttribute('role','dialog');
  overlay.setAttribute('aria-modal','true');
  overlay.setAttribute('aria-labelledby','pda-processing-title');
  overlay.setAttribute('aria-describedby','pda-processing-message');

  const panel=el('div',undefined,'processing-panel');
  const visual=el('div',undefined,'processing-visual');

  const spinner=el('div',undefined,'processing-spinner');
  spinner.setAttribute('aria-hidden','true');

  const percent=el('strong','0%','processing-percent');
  percent.id='pda-processing-percent';

  visual.append(spinner,percent);

  const copy=el('div',undefined,'processing-copy');
  const title=el('h2','Processando','processing-title');
  title.id='pda-processing-title';

  const message=el('p','Aguarde…','processing-message');
  message.id='pda-processing-message';

  const remaining=el('p','Calculando tempo restante…','processing-remaining');
  remaining.id='pda-processing-remaining';

  const progress=el('div',undefined,'processing-progress');
  progress.setAttribute('role','progressbar');
  progress.setAttribute('aria-valuemin','0');
  progress.setAttribute('aria-valuemax','100');
  progress.setAttribute('aria-valuenow','0');

  const bar=el('div',undefined,'processing-progress-bar');
  bar.id='pda-processing-bar';
  progress.append(bar);

  const note=el(
    'small',
    'Progresso e tempo restante são estimativas enquanto o servidor conclui a operação.',
    'processing-note'
  );

  copy.append(title,message,remaining,progress,note);
  panel.append(visual,copy);
  overlay.append(panel);
  document.body.append(overlay);

  return overlay;
 }

 function processingProfile_(action,write){
  if(PROCESSING_PROFILES[action]){
    return PROCESSING_PROFILES[action];
  }

  if(!write){
    return null;
  }

  return {
    seconds:6,
    title:'Salvando alterações',
    phases:[
      [0,'Preparando os dados'],
      [.35,'Gravando as alterações'],
      [.75,'Atualizando o sistema'],
      [.92,'Concluindo']
    ]
  };
 }

 function processingPercent_(elapsed,seconds){
  const expected=Math.max(2,Number(seconds)||6);
  const ratio=elapsed/expected;

  if(ratio<=.12){
    return Math.max(3,Math.round(ratio/.12*14));
  }

  if(ratio<=.72){
    return Math.round(
      14+
      ((ratio-.12)/.60)*62
    );
  }

  if(ratio<=1){
    return Math.round(
      76+
      ((ratio-.72)/.28)*15
    );
  }

  return Math.min(
    96,
    91+Math.floor((ratio-1)*2)
  );
 }

 function phaseForProgress_(profile,progress){
  const normalized=progress/100;
  let message=profile.phases[0][1];

  profile.phases.forEach(item=>{
    if(normalized>=item[0]){
      message=item[1];
    }
  });

  return message;
 }

 function renderProcessing_(){
  if(!processingState)return;

  const overlay=ensureProcessingOverlay_();
  const now=performance.now();
  const elapsed=(now-processingState.started)/1000;
  const profile=processingState.profile;
  const progress=
    processingState.complete
      ?100
      :processingPercent_(
        elapsed,
        profile.seconds
      );

  const message=
    processingState.complete
      ?'Operação concluída'
      :phaseForProgress_(
        profile,
        progress
      );

  const estimatedLeft=
    Math.max(
      0,
      Math.ceil(
        profile.seconds-elapsed
      )
    );

  overlay.querySelector('#pda-processing-title').textContent=
    processingState.complete
      ?'Concluído'
      :profile.title;

  overlay.querySelector('#pda-processing-message').textContent=
    message;

  overlay.querySelector('#pda-processing-percent').textContent=
    progress+'%';

  overlay.querySelector('#pda-processing-bar').style.width=
    progress+'%';

  const progressNode=
    overlay.querySelector(
      '.processing-progress'
    );

  progressNode.setAttribute(
    'aria-valuenow',
    String(progress)
  );

  let remainingText='';

  if(processingState.complete){
    remainingText='Finalizado.';
  }else if(elapsed<1){
    remainingText=
      'Estimando o tempo restante…';
  }else if(estimatedLeft>1){
    remainingText=
      'Aproximadamente '+
      estimatedLeft+
      ' segundos restantes';
  }else{
    remainingText=
      'Concluindo — menos de alguns segundos';
  }

  overlay.querySelector('#pda-processing-remaining').textContent=
    remainingText;
 }

 function beginProcessing_(action,write){
  const profile=
    processingProfile_(
      action,
      write
    );

  if(!profile)return null;

  if(processingHideTimer){
    clearTimeout(processingHideTimer);
    processingHideTimer=null;
  }

  const id=
    crypto.randomUUID();

  processingState={
    id,
    action,
    profile,
    started:performance.now(),
    complete:false
  };

  const overlay=
    ensureProcessingOverlay_();

  overlay.hidden=false;
  document.body.classList.add(
    'processing-active'
  );

  renderProcessing_();

  if(processingTimer){
    clearInterval(processingTimer);
  }

  processingTimer=
    setInterval(
      renderProcessing_,
      350
    );

  return id;
 }

 function endProcessing_(id,success=true){
  if(
    !id||
    !processingState||
    processingState.id!==id
  ){
    return;
  }

  if(processingTimer){
    clearInterval(processingTimer);
    processingTimer=null;
  }

  if(success){
    processingState.complete=true;
    renderProcessing_();
  }

  const delay=
    success
      ?360
      :80;

  processingHideTimer=
    setTimeout(
      ()=>{
        const overlay=
          document.getElementById(
            'pda-processing-overlay'
          );

        if(overlay){
          overlay.hidden=true;
        }

        document.body.classList.remove(
          'processing-active'
        );

        processingState=null;
        processingHideTimer=null;
      },
      delay
    );
 }

 async function call(action,data={},write=false){const token=epoch;
let payload={...data};
let processingId=null;
if(write){const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(JSON.stringify({action,data}))))).map(x=>x.toString(16).padStart(2,'0')).join('');
const key='pda.operation.'+digest;
payload.op=sessionStorage.getItem(key)||crypto.randomUUID();
sessionStorage.setItem(key,payload.op);
busy++;
document.querySelectorAll('button').forEach(b=>b.disabled=true);
}
processingId=beginProcessing_(action,write);
try{const result=await raw('api',action,payload);
if(token!==epoch)throw new Error('Resposta de tela anterior descartada.');
if(write)status('Operação concluída.');
endProcessing_(processingId,true);
return result;
}catch(e){endProcessing_(processingId,false);
if(token===epoch)status((e.message||String(e))+(write?'\nA operação pode ter sido parcialmente executada. Mantenha os mesmos dados e tente novamente; consulte a ficha antes de alterar o envio.':''),true);
throw e;
}finally{if(write){busy--;
document.querySelectorAll('button').forEach(b=>b.disabled=false);
}}}
 const button=(text,fn,secondary=false)=>{const b=el('button',text,secondary?'secondary':'');
b.type='button';
b.onclick=()=>Promise.resolve().then(fn).catch(e=>status(e.message||String(e),true));
return b;
};
 const card=(title)=>{const n=el('section',undefined,'card');
if(title)n.append(el('h3',title));
return n;
};
 function optionData_(value){if(value&&typeof value==='object'){return {value:String(value.value??''),label:String(value.label??value.value??'')};}
return {value:String(value),label:String(value)};
}
 function maskCpf_(value){const d=String(value||'').replace(/\D/g,'').slice(0,11);
return d.replace(/^(\d{3})(\d)/,'$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/^(\d{3})\.(\d{3})\.(\d{3})(\d{1,2}).*$/,'$1.$2.$3-$4');
}
 function maskDate_(value){const d=String(value||'').replace(/\D/g,'').slice(0,8);
if(d.length<=2)return d;
if(d.length<=4)return d.slice(0,2)+'/'+d.slice(2);
return d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4);
}
 function maskCep_(value){const d=String(value||'').replace(/\D/g,'').slice(0,8);
if(d.length<=5)return d;
return d.slice(0,5)+'-'+d.slice(5);
}
 function maskPhone_(value){const d=String(value||'').replace(/\D/g,'').slice(0,11);
if(!d)return '';
if(d.length<=2)return '('+d;
if(d.length<=7)return '('+d.slice(0,2)+') '+d.slice(2);
return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7);
}
 function isValidDateBR_(value){const s=String(value||'').trim();
const m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
if(!m)return false;
const d=Number(m[1]),mo=Number(m[2]),y=Number(m[3]);
const parsed=new Date(y,mo-1,d);
parsed.setHours(0,0,0,0);
return parsed.getFullYear()===y&&parsed.getMonth()===mo-1&&parsed.getDate()===d;
}
 function bindDateBRValidation_(n,message='Informe uma data válida no formato DD/MM/AAAA.'){const validate=()=>{
const value=String(n.value||'').trim();
n.setCustomValidity(!value||isValidDateBR_(value)?'':message);
};
n.addEventListener('input',validate);
n.addEventListener('blur',validate);
n.addEventListener('change',validate);
validate();
}
 function applyMask_(n,mask){if(!mask)return;
const fn=mask==='cpf'?maskCpf_:mask==='date'?maskDate_:mask==='cep'?maskCep_:mask==='phone'?maskPhone_:null;
if(!fn)return;
const sync=()=>{n.value=fn(n.value);};
n.addEventListener('input',sync);
n.addEventListener('blur',sync);
sync();
}
 function field(f,value){const wrap=el('label',undefined,'field');
wrap.dataset.field=f.key;
wrap.append(el('span',f.label));
const n=el(f.options?'select':f.type==='textarea'?'textarea':'input');
n.name=f.key;
if(f.options){n.append(new Option('Selecione',''));
f.options.forEach(v=>{const o=optionData_(v);n.append(new Option(o.label,o.value));});
}else n.type=f.type||'text';
if(f.type==='checkbox')n.checked=value===true||value==='true';
else n.value=value===undefined?'':value;
n.required=!!f.required;
if(f.placeholder)n.placeholder=f.placeholder;
if(f.maxLength)n.maxLength=f.maxLength;
if(f.inputMode)n.inputMode=f.inputMode;
if(f.pattern)n.pattern=f.pattern;
if(f.title)n.title=f.title;
if(f.suggestions&&!f.options){
  const listId=
    'pda-list-'+
    f.key+'-'+
    Math.random().toString(36).slice(2,9);

  const datalist=el('datalist');
  datalist.id=listId;

  f.suggestions.forEach(v=>{
    const option=el('option');
    option.value=String(v);
    datalist.append(option);
  });

  n.setAttribute('list',listId);
  wrap.append(datalist);
}
applyMask_(n,f.mask);
if(f.dateBR)bindDateBRValidation_(n,f.dateMessage||'Informe uma data válida no formato DD/MM/AAAA.');
if(f.birthDate){
  const validateBirth=()=>{
    const value=String(n.value||'').trim();

    if(!value){
      n.setCustomValidity('');
      return;
    }

    const match=value.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);

    if(!match){
      n.setCustomValidity('Informe a data no formato DD/MM/AAAA.');
      return;
    }

    const day=Number(match[1]);
    const month=Number(match[2]);
    const year=Number(match[3]);
    const parsed=new Date(year,month-1,day);
    parsed.setHours(0,0,0,0);

    if(
      parsed.getFullYear()!==year||
      parsed.getMonth()!==month-1||
      parsed.getDate()!==day
    ){
      n.setCustomValidity('Informe uma data de nascimento válida.');
      return;
    }

    const minimum=new Date(1910,0,1);
    minimum.setHours(0,0,0,0);

    const today=new Date();
    today.setHours(0,0,0,0);

    if(parsed<minimum){
      n.setCustomValidity('A data de nascimento não pode ser anterior a 01/01/1910.');
      return;
    }

    if(parsed>today){
      n.setCustomValidity('A data de nascimento não pode estar no futuro.');
      return;
    }

    n.setCustomValidity('');
  };

  n.addEventListener('input',validateBirth);
  n.addEventListener('blur',validateBirth);
  n.addEventListener('change',validateBirth);
  validateBirth();
}
wrap.append(n);
if(f.hint)wrap.append(el('small',f.hint,'hint'));
return wrap;
}
 function form(parent,fields,data,save,label='Salvar'){const f=el('form');
const grid=el('div',undefined,'grid');
fields.forEach(x=>grid.append(field(x,data[x.key])));
f.append(grid);
const actions=el('div',undefined,'actions');
const b=el('button',label);
b.type='submit';
actions.append(b);
f.append(actions);
f.onsubmit=async e=>{e.preventDefault();
if(busy||!f.reportValidity())return;
const values={...data};
fields.forEach(x=>{const n=f.elements.namedItem(x.key);
values[x.key]=x.type==='checkbox'?n.checked:n.value;
});
try{await save(values);
}catch(e){status(e.message||String(e),true);
}};
parent.append(f);
return f;
}
 function table(parent,columns,rows,actions){const wrap=el('div',undefined,'scroll'),t=el('table'),head=el('tr');
columns.forEach(c=>head.append(el('th',c.label)));
if(actions)head.append(el('th','Ações'));
const thead=el('thead');
thead.append(head);
t.append(thead);
const body=el('tbody');
rows.forEach(r=>{const tr=el('tr');
columns.forEach(c=>tr.append(el('td',typeof c.value==='function'?c.value(r):r[c.key]||'—')));
if(actions){const td=el('td');
actions(r).forEach(n=>td.append(n));
tr.append(td);
}body.append(tr);
});
t.append(body);
wrap.append(t);
parent.append(wrap);
if(!rows.length)parent.append(el('p','Nenhum registro encontrado.','hint'));
}
 function link(url,text){const a=el('a',text);
if(/^https:\/\/(drive|docs)\.google\.com\//.test(url||'')){a.href=url;a.target='_blank';a.rel='noopener noreferrer';}return a;}
 function details(parent,title){const d=el('details');
d.append(el('summary',title));
parent.append(d);
return d;
}
 async function go(code,pessoaId){if(busy)return;
if(pessoaId)selection=pessoaId;
else if(code==='ACOMP')selection=null;
current=code;
const token=++epoch;
status('Carregando…');
const root=document.getElementById('app');
root.replaceChildren();
root.setAttribute('aria-busy','true');
try{const m=await raw('carregarModulo',code);
if(token!==epoch)return;
root.innerHTML=m.style+m.view;
if(!window.PDA_MODULES[code]){const s=document.createElement('script');
s.textContent=m.script.replace(/^\s*<script>/,'').replace(/<\/script>\s*$/,'');
document.head.append(s);
s.remove();
}document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.code===code?'page':'false'));
status('');
await window.PDA_MODULES[code]({root:root.querySelector('section'),token});
}catch(e){if(token===epoch)status(e.message||String(e),true);
}finally{if(token===epoch)root.setAttribute('aria-busy','false');
}}
 const alive=ctx=>ctx.token===epoch;
 const personFields=()=>[{key:'nome',label:'Nome completo',required:true},{key:'cpf',label:'CPF',required:true,placeholder:'000.000.000-00',mask:'cpf',maxLength:14,inputMode:'numeric'},{key:'nascimento',label:'Nascimento',required:true,placeholder:'DD/MM/AAAA',mask:'date',maxLength:10,inputMode:'numeric',birthDate:true,hint:'Aceita datas entre 01/01/1910 e hoje.'},{key:'telefone',label:'Telefone',required:true,placeholder:'(53) 99999-9999',mask:'phone',maxLength:15,inputMode:'numeric',pattern:'\\(\\d{2}\\) \\d{5}-\\d{4}',title:'Use o formato (DDD) XXXXX-XXXX'},{key:'email',label:'E-mail (opcional)',type:'email',placeholder:'nome@exemplo.com'},{key:'tipoVia',label:'Tipo de via',required:true,placeholder:'Rua',suggestions:['Rua','Avenida','Travessa','Estrada','Rodovia','Praça','Alameda','Beco','Servidão','Vila','Loteamento','Linha','Acesso']},{key:'via',label:'Nome da via',required:true},{key:'numero',label:'Número',required:true},{key:'complemento',label:'Complemento'},{key:'cep',label:'CEP',required:true,placeholder:'00000-000',mask:'cep',maxLength:9,inputMode:'numeric'},{key:'bairro',label:'Bairro ou localidade',required:true},{key:'cidade',label:'Município',required:true,options:boot.config.municipios},{key:'uf',label:'UF',required:true,options:'AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO'.split(' ')},{key:'entidade',label:'Colônia ou entidade',required:true,options:boot.config.entidades},{key:'outraEntidade',label:'Especificar outra entidade'},{key:'analfabeto',label:'Consta condição de não alfabetizado no documento de identidade?',required:true,options:[{value:'SIM',label:'Sim'},{value:'NAO',label:'Não'}]},{key:'parcelasNaoRecebidas',label:'Quantas parcelas do seguro-defeso de 2025 não recebeu?',required:true,options:[{value:'1',label:'1 parcela'},{value:'2',label:'2 parcelas'},{value:'3',label:'3 parcelas'},{value:'4',label:'4 parcelas'}]}];
 const atendFields=()=>[{key:'demanda',label:'Demanda',options:boot.config.demandas,required:true},{key:'referencia',label:'Referência que identifica a demanda',required:true,hint:'Ex.: Defeso 2025 — requerimento 123. Nova referência somente para demanda distinta.'},{key:'parcelas',label:'Parcelas não recebidas no atendimento',options:['Todas de 2025','Somente a última de 2025','Outros casos'],required:true},{key:'outrosCasos',label:'Descrição de outros casos',type:'textarea'},{key:'responsavel',label:'E-mail do responsável'},{key:'observacoes',label:'Observações',type:'textarea'},{key:'enderecamento',label:'Endereçamento completo',placeholder:'AO JUÍZO DA …'},{key:'secaoJudiciaria',label:'Seção judiciária',placeholder:'SEÇÃO JUDICIÁRIA DO ESTADO …'},{key:'localData',label:'Local e data da petição',placeholder:'Rio Grande, data da distribuição'}];
 async function searchUI(parent,onSelect){const f=el('form'),input=el('input');
input.placeholder='Pesquisar por nome, CPF ou município';
input.setAttribute('aria-label','Nome, CPF ou município');
const b=el('button','Pesquisar');
f.append(input,b);
parent.append(f);
const results=el('div');
parent.append(results);
let request=0;
f.onsubmit=async e=>{e.preventDefault();
const req=++request;
try{const rows=await call('pessoas',{busca:input.value});
if(req!==request)return;
results.replaceChildren();
table(results,[{key:'nome',label:'Nome'},{key:'cpf',label:'CPF'},{key:'cidade',label:'Município'}],rows,r=>[button('Abrir',()=>onSelect(r))]);
}catch(e){}};
}
 function guidance(parent){parent.append(el('p','Comprovante em nome de terceiro: é obrigatória a carteira de identidade do titular da residência e deve ser conferido que há declaração de residência no próprio documento. Se constar analfabetismo no documento de identidade, conferir procuração assinada por uma pessoa a rogo e duas testemunhas, com identificação das condições. O processo administrativo deve estar completo, incluindo os documentos da solicitação e o anexo exigido.','hint'));
}
 async function uploadForm(parent,a,docs){const d=details(parent,'Anexar ou substituir documentos');
guidance(d);
d.append(el('p','PDF, JPEG ou PNG; até 5 MB por arquivo. Podem ser anexados vários arquivos por categoria. Para substituir, selecione um único arquivo e informe o ID da versão vigente.','hint'));
const documentLabels={RG_CPF:'Documento de identidade e CPF',RESIDENCIA:'Comprovante de residência',IDENTIDADE_TITULAR_RESIDENCIA:'Carteira de identidade do titular da residência',PROCESSO_ADMINISTRATIVO:'Processo administrativo',PESCA:'Documentos de pesca',PROCURACAO:'Procuração',HIPOSSUFICIENCIA:'Declaração de hipossuficiência'};
const uploadCategories=boot.config.categorias.concat(['IDENTIDADE_TITULAR_RESIDENCIA']);
const fields=[{key:'categoria',label:'Categoria',options:uploadCategories.map(v=>({value:v,label:documentLabels[v]||v})),required:true},{key:'vencimento',label:'Vencimento do comprovante',placeholder:'DD/MM/AAAA',mask:'date',maxLength:10,inputMode:'numeric',dateBR:true},{key:'terceiro',label:'Comprovante em nome de terceiro',type:'checkbox'},{key:'declaracaoTerceiro',label:'Há declaração de residência no documento?',type:'checkbox'},{key:'substituiId',label:'ID do documento a substituir (opcional)'}];
const f=form(d,fields,{},async values=>{const files=Array.from(file.files);
if(!files.length)throw Error('Selecione os arquivos.');
if(values.substituiId&&files.length!==1)throw Error('Substitua um arquivo por vez.');
let currentAtend=a;
const done=[];
for(const item of files){try{if(item.size>5*1024*1024)throw Error('Arquivo maior que 5 MB: '+item.name);
const base64=await new Promise((res,rej)=>{const reader=new FileReader();
reader.onload=()=>res(reader.result.split(',')[1]);
reader.onerror=rej;
reader.readAsDataURL(item);
});
const result=await call('upload',{...values,atendimentoId:a.id,versao:currentAtend.versao,base64,mime:item.type},true);
currentAtend=result.atendimento;
done.push(item.name);
}catch(e){a=currentAtend;
const remaining=files.slice(done.length).map(x=>x.name);
status('Concluídos: '+(done.join(', ')||'nenhum')+'\nPendentes: '+remaining.join(', ')+'\n'+e.message,true);
return;
}}await go('ACOMP');
status('Arquivos anexados: '+done.join(', ')+'. Conferência humana pendente.');
},'Enviar arquivos');
const file=el('input');
file.type='file';
file.multiple=true;
file.accept='.pdf,.jpg,.jpeg,.png';
file.setAttribute('aria-label','Arquivos para anexar');
const fileState=el('p','Nenhum documento inserido.','hint');
file.addEventListener('change',()=>{
const count=(file.files||[]).length;
fileState.textContent=count
  ?(count===1?'Documento inserido.':count+' documentos inseridos.')
  :'Nenhum documento inserido.';
});
f.insertBefore(fileState,f.firstChild);
f.insertBefore(file,f.firstChild);
}
 async function start(){try{boot=await call('bootstrap');
document.getElementById('identity').textContent=boot.email+' · '+boot.perfil;
const nav=document.getElementById('nav');
Object.entries(boot.modulos).forEach(([code,label])=>{if(code==='ADM'&&boot.perfil!=='ADMIN')return;
const b=button(label,()=>go(code));
b.dataset.code=code;
nav.append(b);
});
await go('PAINEL');
}catch(e){status(e.message||String(e),true);
}}
 return {start,go,el,card,details,form,table,link,button,call,alive,personFields,atendFields,searchUI,guidance,uploadForm,status,isValidDateBR:isValidDateBR_,state:{get selection(){return selection;
},set selection(v){selection=v;
},get boot(){return boot;
},set boot(v){boot=v;
}}};
})();
App.start();
